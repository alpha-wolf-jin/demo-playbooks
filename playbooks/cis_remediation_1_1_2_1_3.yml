---
- name: "Remediate CIS checkpoint 1.1.2.1.3: Ensure nosuid option set on /tmp partition"
  hosts: all
  become: yes
  gather_facts: false
  vars:
    playbook_name: "cis-1.1.2.1.3-tmp-nosuid"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    req_01: "Apply remediation for: Ensure nosuid option set on /tmp partition. Expected result: System is compliant"
    req_02: "VERIFY: Confirm Ensure nosuid option set on /tmp partition is properly configured. Expected result: Compliant"
    req_03: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_04: "Create a task named 'Generate remediation report' using debug msg with EXACTLY the prescribed format."

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Check if /etc/fstab exists"
      ansible.builtin.stat:
        path: /etc/fstab
      register: _fstab_stat
      tags: [snapshot]

    - name: "Snapshot - Backup /etc/fstab if exists"
      ansible.builtin.copy:
        src: /etc/fstab
        dest: "{{ backup_dir }}/fstab.bak"
        remote_src: true
        mode: '0644'
      when: _fstab_stat.stat.exists
      tags: [snapshot]

  tasks:
    - block:
        - name: "Initialize data variables"
          ansible.builtin.set_fact:
            data_01: "Not collected yet"
            status_01: "ERROR"
            details_01: "Not evaluated"
            task_01_name: "Not executed"
            task_01_cmd: "N/A"
            task_01_rc: -1
            data_02: "Not collected yet"
            status_02: "ERROR"
            details_02: "Not evaluated"
            task_02_name: "Not executed"
            task_02_cmd: "N/A"
            task_02_rc: -1
            data_03: "Not collected yet"
            status_03: "ERROR"
            details_03: "Not evaluated"
            task_03_name: "Not executed"
            task_03_cmd: "N/A"
            task_03_rc: -1
          tags: [execute]

        - name: "Req step-01 - Check if /tmp is a separate mounted partition"
          ansible.builtin.shell: |
            awk '$2 == "/tmp" {print $2}' /proc/mounts
          args:
            executable: /bin/bash
          register: tmp_mount_check
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req step-01 - Ensure nosuid option set on /tmp in /etc/fstab"
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: |
              ^(\S+\s+/tmp\s+\S+\s+)(?!.*\bnosuid\b)(\S+)(\s+.*)$
            line: |
              \1\2,nosuid\3
            backrefs: true
          when: tmp_mount_check.stdout | trim == '/tmp'
          register: _step01_output
          failed_when: false
          tags: [execute]

        - name: "Req step-01 - Remount /tmp with updated options"
          ansible.builtin.shell: |
            mount -o remount /tmp
          args:
            executable: /bin/bash
          register: remount_result
          failed_when: false
          when: tmp_mount_check.stdout | trim == '/tmp'
          tags: [execute]

        - name: "Req step-01 - Store remediation result"
          ansible.builtin.set_fact:
            task_01_name: "Ensure nosuid option set on /tmp partition"
            task_01_cmd: "lineinfile /etc/fstab + mount -o remount /tmp"
            task_01_rc: "{{ remount_result.rc | default(-1) }}"
            data_01: "fstab_changed={{ _step01_output.changed | default(false) }}; remount_rc={{ remount_result.rc | default(-1) }}"
            status_01: >-
              {%- if tmp_mount_check.stdout | trim != '/tmp' -%}
              SKIP
              {%- elif (_step01_output.failed | default(false)) or (remount_result.rc | default(-1) != 0) -%}
              FAIL
              {%- else -%}
              PASS
              {%- endif -%}
            details_01: >-
              {%- if tmp_mount_check.stdout | trim != '/tmp' -%}
              /tmp is not a separate partition - skipped
              {%- elif (_step01_output.failed | default(false)) or (remount_result.rc | default(-1) != 0) -%}
              Failed to set nosuid option on /tmp
              {%- else -%}
              nosuid option set successfully on /tmp
              {%- endif -%}
          tags: [execute]

        - name: "Req step-02 - Verify nosuid option is set on /tmp"
          ansible.builtin.shell: |
            findmnt -n -o OPTIONS /tmp
          args:
            executable: /bin/bash
          register: verify_result
          failed_when: false
          changed_when: false
          when: tmp_mount_check.stdout | trim == '/tmp'
          tags: [execute]

        - name: "Req step-02 - Store verification result"
          ansible.builtin.set_fact:
            _cis_status: >-
              {%- if tmp_mount_check.stdout | trim != '/tmp' -%}
              SKIP
              {%- elif (verify_result.stdout | default('')) is search('nosuid') -%}
              PASS
              {%- else -%}
              FAIL
              {%- endif -%}
            task_02_name: "Verify nosuid option set on /tmp partition"
            task_02_cmd: "findmnt -n -o OPTIONS /tmp"
            task_02_rc: "{{ verify_result.rc | default(-1) }}"
            data_02: "{{ verify_result.stdout | default('') | trim }}"
            status_02: >-
              {%- if tmp_mount_check.stdout | trim != '/tmp' -%}
              SKIP
              {%- elif (verify_result.stdout | default('')) is search('nosuid') -%}
              PASS
              {%- else -%}
              FAIL
              {%- endif -%}
            details_02: >-
              {%- if tmp_mount_check.stdout | trim != '/tmp' -%}
              /tmp is not a separate partition - skipped
              {%- elif (verify_result.stdout | default('')) is search('nosuid') -%}
              nosuid option verified on /tmp
              {%- else -%}
              nosuid option NOT found on /tmp
              {%- endif -%}
          tags: [execute]

        - name: "Req step-03 - Store final remediation result in cis_result"
          ansible.builtin.set_fact:
            cis_result: "{{ _cis_status | default(status_02) | default('ERROR') | trim }}"
            task_03_name: "Store final remediation result in cis_result"
            task_03_cmd: "set_fact cis_result=_cis_status"
            task_03_rc: 0
            data_03: "cis_result={{ _cis_status | default(status_02) | default('ERROR') | trim }}"
            status_03: "{{ _cis_status | default(status_02) | default('ERROR') | trim }}"
            details_03: "Final remediation status stored in cis_result"
          tags: [execute]

        - name: "Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 1.1.2.1.3"
              - "Reference: CIS Benchmark checkpoint 1.1.2.1.3"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: Generate remediation report"
              - "  Command: debug msg"
              - "  Exit code: 0"
              - "  Data: Report generated"
              - "  Status: PASS"
              - "  Details: Remediation report generated successfully"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('Not evaluated') | trim }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Check if backup exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/fstab.bak"
          register: _restore_check
          failed_when: false
          tags: [restore]

        - name: "Restore - Overwrite /etc/fstab with original"
          ansible.builtin.copy:
            src: "{{ backup_dir }}/fstab.bak"
            dest: /etc/fstab
            remote_src: true
          when: _restore_check.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Remount /tmp with original options"
          ansible.builtin.shell: |
            mount -o remount /tmp
          args:
            executable: /bin/bash
          when: _restore_check.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]