---
- name: "Remediate CIS checkpoint 2.2.2 - Ensure 'Access this computer from the network' is set to 'Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS' (DC only)"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_2_2_2"
    backup_dir: |
      C:\cis_ai_playbooks_backup\{{ playbook_name | trim }}
    policy_backup: |
      {{ backup_dir | trim }}\user_rights_backup.inf
    policy_inf: |
      {{ backup_dir | trim }}\cis_2_2_2_policy.inf
    expected_sids: "*S-1-5-32-544,*S-1-5-11,*S-1-5-9"
    req_01: |
      Apply the User Rights Assignment 'Access this computer from the network' to 'Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS' on Domain Controllers using command: secpol.msc (navigate to Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Local Policies\\User Rights Assignment\\Access this computer from the network and set to Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS). Expected result: The policy 'Access this computer from the network' is configured to Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS.
    req_02: |
      Verify the 'Access this computer from the network' policy is set to 'Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS' using command: secedit /export /areas USER_RIGHTS /cfg %temp%\\secpol.cfg && findstr /i \"SeNetworkLogonRight\" %temp%\\secpol.cfg. Expected result: Output shows SeNetworkLogonRight = *S-1-5-32-544,*S-1-5-11,*S-1-5-9 (Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS).
    req_03: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir | trim }}"
        state: directory
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Export current user rights policy"
      ansible.windows.win_shell: |
        secedit /export /cfg "{{ policy_backup | trim }}" /areas USER_RIGHTS 2>&1 | Out-String
        Write-Output "snapshot_rc=$LASTEXITCODE"
      register: _snapshot_export
      failed_when: false
      changed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Check if host is a Domain Controller"
          ansible.windows.win_shell: |
            $pt = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\ProductOptions' -ErrorAction SilentlyContinue).ProductType
            Write-Output $pt
          register: _dc_check
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Set DC detection fact"
          set_fact:
            is_dc: "{{ (_dc_check.stdout | default('') | trim) == 'LanmanNT' }}"
          tags: [execute]

        - name: "Req 01 - Create security policy INF with SeNetworkLogonRight setting"
          ansible.windows.win_copy:
            dest: "{{ policy_inf | trim }}"
            content: |
              [Version]
              signature="$CHICAGO$"
              Revision=1
              [Privilege Rights]
              SeNetworkLogonRight = *S-1-5-32-544,*S-1-5-11,*S-1-5-9
          when: is_dc | bool
          register: result_01_create
          failed_when: false
          tags: [execute]

        - name: "Req 01 - Verify policy INF was created"
          ansible.windows.win_stat:
            path: "{{ policy_inf | trim }}"
          when: is_dc | bool
          register: _inf_stat
          failed_when: false
          tags: [execute]

        - name: "Req 01 - Apply SeNetworkLogonRight via secedit configure"
          ansible.windows.win_shell: |
            secedit /configure /db "$env:TEMP\cis_2_2_2.sdb" /cfg "{{ policy_inf | trim }}" /areas USER_RIGHTS /quiet 2>&1 | Out-String
            $rc = $LASTEXITCODE
            if ($rc -ne 0) {
              $log = Join-Path $env:windir 'security\logs\scesrv.log'
              if (Test-Path $log) {
                Write-Output "----scesrv.log tail----"
                Get-Content $log -Tail 30 | Out-String | Write-Output
              }
            }
            Write-Output "secedit_rc=$rc"
          when:
            - is_dc | bool
            - (_inf_stat.stat is defined) and (_inf_stat.stat.exists | default(false))
          register: result_01
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req 01 - Parse secedit exit code from stdout"
          set_fact:
            secedit_rc_01: "{{ (result_01.stdout | default('') | trim).split('=') | last | trim }}"
          when: is_dc | bool
          tags: [execute]

        - name: "Req 01 - Store requirement 01 details"
          set_fact:
            task_01_name: "Apply SeNetworkLogonRight via secedit configure"
            task_01_cmd: |
              secedit /configure /db %TEMP%\\cis_2_2_2.sdb /cfg {{ policy_inf | trim }} /areas USER_RIGHTS /quiet
            task_01_rc: "{{ secedit_rc_01 | default('-1', true) | trim }}"
            data_01: "{{ (result_01.stdout | default('') | trim) if (_inf_stat.stat is defined and _inf_stat.stat.exists | default(false)) else 'INF_FILE_MISSING' }}"
            status_01: >-
              {%- if not (is_dc | bool) -%}
              SKIP
              {%- elif not ((_inf_stat.stat is defined) and (_inf_stat.stat.exists | default(false))) -%}
              FAIL
              {%- elif ((secedit_rc_01 | default('X', true) | trim) == '0') -%}
              PASS
              {%- else -%}
              FAIL
              {%- endif -%}
            details_01: >-
              {%- if not (is_dc | bool) -%}
              Host is not a Domain Controller - skipped
              {%- elif not ((_inf_stat.stat is defined) and (_inf_stat.stat.exists | default(false))) -%}
              Policy INF file was not created at {{ policy_inf | trim }}
              {%- elif ((secedit_rc_01 | default('X', true) | trim) == '0') -%}
              User right applied successfully via secedit
              {%- else -%}
              Failed to apply user right via secedit - see data for scesrv.log diagnostics
              {%- endif -%}
          tags: [execute]

        - name: "Req 02 - Verify SeNetworkLogonRight policy via secedit export"
          ansible.windows.win_shell: |
            {% raw %}
            $cfg = Join-Path $env:TEMP 'secpol.cfg'
            secedit /export /areas USER_RIGHTS /cfg $cfg | Out-Null
            if (Test-Path $cfg) {
              $lines = [System.IO.File]::ReadAllLines($cfg, [System.Text.Encoding]::Unicode)
              $line = $lines | Where-Object { $_ -match 'SeNetworkLogonRight' } | Select-Object -First 1
              if ($line) {
                Write-Output $line.Trim()
              } else {
                Write-Output 'NOT_FOUND'
              }
              Remove-Item -Path $cfg -Force -ErrorAction SilentlyContinue
            } else {
              Write-Output 'EXPORT_FAILED'
            }
            {% endraw %}
          when: is_dc | bool
          register: result_02
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req 02 - Normalize SeNetworkLogonRight SID lists for order-insensitive comparison"
          set_fact:
            actual_sids_02: "{{ (result_02.stdout | default('')).split('=') | last | trim }}"
            actual_sids_02_norm: >-
              {{ ((result_02.stdout | default('')).split('=') | last | trim)
                 .split(',') | map('trim') | reject('equalto','') | sort | join(',') }}
            expected_sids_norm: >-
              {{ (expected_sids | trim)
                 .split(',') | map('trim') | reject('equalto','') | sort | join(',') }}
          when: is_dc | bool
          tags: [execute]

        - name: "Req 02 - Store requirement 02 details"
          set_fact:
            task_02_name: "Verify SeNetworkLogonRight via secedit export"
            task_02_cmd: |
              secedit /export /areas USER_RIGHTS /cfg %temp%\\secpol.cfg && findstr /i \"SeNetworkLogonRight\" %temp%\\secpol.cfg
            task_02_rc: "{{ result_02.rc | default(-1) }}"
            data_02: "{{ result_02.stdout | default('') | trim }}"
            status_02: >-
              {%- if not (is_dc | bool) -%}
              SKIP
              {%- elif ((actual_sids_02_norm | default('', true) | trim) == (expected_sids_norm | default('', true) | trim)) -%}
              PASS
              {%- else -%}
              FAIL
              {%- endif -%}
            details_02: >-
              {%- if not (is_dc | bool) -%}
              Host is not a Domain Controller - skipped
              {%- elif ((actual_sids_02_norm | default('', true) | trim) == (expected_sids_norm | default('', true) | trim)) -%}
              SeNetworkLogonRight correctly set to Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS (order-insensitive match)
              {%- else -%}
              SeNetworkLogonRight not correctly configured - actual: {{ actual_sids_02_norm | default('') | trim }}, expected: {{ expected_sids_norm | default('') | trim }}
              {%- endif -%}
          tags: [execute]

        - name: "Req 03 - Store final remediation result in cis_result"
          set_fact:
            cis_result: "{{ status_02 | default('ERROR') | trim }}"
          tags: [execute]

        - name: "Generate remediation report"
          debug:
            msg:
              - "REMEDIATION REPORT — CIS 2.2.2"
              - "Reference: CIS Benchmark checkpoint 2.2.2"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}"
              - "  Task: Store final remediation result in cis_result"
              - "  Command: set_fact cis_result"
              - "  Exit code: 0"
              - "  Data: {{ cis_result | default('ERROR') | trim }}"
              - "  Status: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: cis_result derived from status_02"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('Not evaluated') | trim }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Check if policy backup exists"
          ansible.windows.win_stat:
            path: "{{ policy_backup | trim }}"
          register: _restore_backup
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore original user rights policy"
          ansible.windows.win_shell: |
            secedit /configure /db "$env:TEMP\cis_2_2_2_restore.sdb" /cfg "{{ policy_backup | trim }}" /areas USER_RIGHTS /quiet 2>&1 | Out-String
            Write-Output "restore_rc=$LASTEXITCODE"
          when: (_restore_backup.stat is defined) and (_restore_backup.stat.exists | default(false))
          failed_when: false
          changed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.windows.win_file:
            path: "{{ backup_dir | trim }}"
            state: absent
          failed_when: false
          tags: [restore]