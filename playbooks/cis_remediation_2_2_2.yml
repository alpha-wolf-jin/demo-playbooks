---
- name: "Remediate CIS checkpoint 2.2.2: Ensure 'Access this computer from the network' is set to 'Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS' (DC only)"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_2_2_2_remediation"
    backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
    req_01: "Set 'Access this computer from the network' to 'Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS'. Recommended module: ansible.windows.win_user_right with action: set and the appropriate users list (empty list [] for No One, or named accounts). Do NOT use secedit — it does not manage User Rights Assignment."
    req_02: "Verify 'Access this computer from the network' is correctly set to 'Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS'. Use read-only PowerShell to query the value; changed_when: false."
    req_03: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable. Also store the raw output from step-02 in 'raw_command_output'."
    req_04: !unsafe >-
      Create a task named 'Generate remediation report' using debug msg with EXACTLY this format:
      REMEDIATION REPORT — CIS 2.2.2 Reference: CIS Benchmark checkpoint 2.2.2 Then for each requirement:
      REQUIREMENT NN - {{ req_NN }}: With fields: Task, Command, Exit code, Data, Status (PASS/FAIL/SKIP/ERROR), Details.
      End with OVERALL REMEDIATION: section containing Result: {{{ cis_result }}}

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir }}"
        state: directory
      tags: [snapshot]

    - name: "Snapshot - Backup current SeNetworkLogonRight assignment"
      ansible.windows.win_shell: |
        $cfg = Join-Path $env:TEMP ("cis_snap_{0}.cfg" -f ([guid]::NewGuid().ToString('N')))
        secedit /export /areas USER_RIGHTS /cfg $cfg | Out-Null
        $line = Select-String -LiteralPath $cfg -Pattern '^\s*SeNetworkLogonRight\s*=' | Select-Object -First 1
        if ($line) {
          $val = (($line.Line -split '=', 2)[1]).Trim()
        } else {
          $val = "NO_USERS"
        }
        Remove-Item -LiteralPath $cfg -Force -ErrorAction SilentlyContinue
        Set-Content -LiteralPath "{{ backup_dir }}/senetworklogonright.txt" -Value $val -Encoding utf8
        Write-Output $val
      register: _snapshot_user_right
      changed_when: false
      failed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req step-01 - Check domain controller role"
          ansible.windows.win_shell: |
            $domainRole = (Get-CimInstance Win32_ComputerSystem).DomainRole
            if ($domainRole -in 4,5) { 'DC' } else { 'NON_DC' }
          register: _dc_check
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-01 - Set 'Access this computer from the network' user right"
          ansible.windows.win_user_right:
            name: SeNetworkLogonRight
            users:
              - "Administrators"
              - "Authenticated Users"
              - "ENTERPRISE DOMAIN CONTROLLERS"
            action: set
          when: "(_dc_check.stdout | default('') | trim) == 'DC'"
          register: _step01_output
          failed_when: false
          tags: [execute]

        - name: "Req step-02 - Verify 'Access this computer from the network' user right is set correctly"
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            try {
              $domainRole = (Get-CimInstance Win32_ComputerSystem).DomainRole
              if ($domainRole -in 4,5) {
                $tempCfg = Join-Path $env:TEMP ("cis_secpol_{0}.cfg" -f ([System.Guid]::NewGuid().ToString('N')))
                try {
                  secedit /export /cfg $tempCfg /areas USER_RIGHTS | Out-Null
                  if (Test-Path -LiteralPath $tempCfg) {
                    $line = Select-String -LiteralPath $tempCfg -Pattern '^\s*SeNetworkLogonRight\s*=' | Select-Object -First 1
                    if ($line) {
                      $actual = (($line.Line -split '=', 2)[1]).Trim()
                      $expected = @('*S-1-5-32-544', '*S-1-5-11', '*S-1-5-9')
                      $actualSids = @($actual -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' })
                      $missing = @($expected | Where-Object { $_ -notin $actualSids })
                      $extra = @($actualSids | Where-Object { $_ -notin $expected })
                      if ($missing.Count -eq 0 -and $extra.Count -eq 0) {
                        Write-Output '** PASS **'
                        Write-Output "SeNetworkLogonRight = $actual"
                      } else {
                        Write-Output '** FAIL **'
                        Write-Output "Expected: $($expected -join ',')"
                        Write-Output "Actual: $actual"
                      }
                    } else {
                      Write-Output '** ERROR **'
                      Write-Output 'SeNetworkLogonRight not found in secedit export'
                    }
                  } else {
                    Write-Output '** ERROR **'
                    Write-Output 'secedit export did not produce a configuration file'
                  }
                } finally {
                  if (Test-Path -LiteralPath $tempCfg) { Remove-Item -LiteralPath $tempCfg -Force }
                }
              } else {
                Write-Output '** SKIP **'
                Write-Output 'Host is not a domain controller'
              }
            } catch {
              Write-Output '** ERROR **'
              Write-Output $_.Exception.Message
            }
          register: _step02_output
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-03 - Store final remediation result, raw output, and requirement details"
          ansible.builtin.set_fact:
            task_01_name: "Check DC role and set user right via win_user_right"
            task_01_cmd: "Get-CimInstance Win32_ComputerSystem | Select DomainRole; ansible.windows.win_user_right name=SeNetworkLogonRight action=set users='Administrators','Authenticated Users','ENTERPRISE DOMAIN CONTROLLERS'"
            task_01_rc: "{{ 0 if not (_step01_output.failed | default(false)) else 1 }}"
            data_01: "{{ _step01_output | default({}) | to_json | trim }}"
            status_01: "{{ ('SKIP' if (_dc_check.stdout | default('') | trim) != 'DC' else ('PASS' if not (_step01_output.failed | default(false)) else 'FAIL')) | trim }}"
            details_01: "{{ ('Host is not a domain controller; user right not modified' if (_dc_check.stdout | default('') | trim) != 'DC' else ('User right set successfully' if not (_step01_output.failed | default(false)) else 'Failed to set user right')) | trim }}"
            task_02_name: "Verify user right via PowerShell secedit export"
            task_02_cmd: "secedit /export /cfg temp.cfg /areas USER_RIGHTS; compare SeNetworkLogonRight expected SIDs"
            task_02_rc: "{{ _step02_output.rc | default(-1) }}"
            data_02: "{{ _step02_output.stdout | default('') | trim }}"
            status_02: "{{ ('PASS' if '** PASS **' in (_step02_output.stdout | default('')) else ('FAIL' if '** FAIL **' in (_step02_output.stdout | default('')) else ('SKIP' if '** SKIP **' in (_step02_output.stdout | default('')) else 'ERROR'))) | trim }}"
            details_02: "{{ _step02_output.stdout | default('') | trim }}"
            cis_result: "{{ ('PASS' if '** PASS **' in (_step02_output.stdout | default('')) else ('FAIL' if '** FAIL **' in (_step02_output.stdout | default('')) else ('SKIP' if '** SKIP **' in (_step02_output.stdout | default('')) else 'ERROR'))) | trim }}"
            raw_command_output: "{{ _step02_output.stdout | default('') | trim }}"
          tags: [execute]

        - name: "Req step-04 - Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 2.2.2"
              - "Reference: CIS Benchmark checkpoint 2.2.2"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: Store final remediation result in cis_result"
              - "  Command: set_fact"
              - "  Exit code: 0"
              - "  Data: {{ raw_command_output | default('') | trim }}"
              - "  Status: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: Final remediation result stored"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: Generate remediation report"
              - "  Command: debug"
              - "  Exit code: 0"
              - "  Data: {{ raw_command_output | default('') | trim }}"
              - "  Status: PASS"
              - "  Details: Remediation report generated"
              - ""
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
          tags: [execute]

      always:
        - name: "Restore - Check if user right snapshot exists"
          ansible.windows.win_stat:
            path: "{{ backup_dir }}/senetworklogonright.txt"
          register: _restore_snapshot_stat
          failed_when: false
          tags: [restore]

        - name: "Restore - Read original user right assignment"
          ansible.windows.win_shell: |
            if (Test-Path -LiteralPath "{{ backup_dir }}/senetworklogonright.txt") {
              $raw = Get-Content -LiteralPath "{{ backup_dir }}/senetworklogonright.txt" -Raw
              Write-Output $raw.Trim()
            } else {
              Write-Output ""
            }
          register: _restore_user_right
          changed_when: false
          failed_when: false
          when: "(_restore_snapshot_stat.stat | default({})).exists | default(false)"
          tags: [restore]

        - name: "Restore - Set user right to original assignment"
          ansible.windows.win_user_right:
            name: SeNetworkLogonRight
            users: >-
              {{ [] if (_restore_user_right.stdout | default('NO_USERS') | trim) in ['', 'NO_USERS'] else
                 (_restore_user_right.stdout | default('') | trim | replace('*', '') | split(',') | map('trim') | list) }}
            action: set
          when: "(_restore_snapshot_stat.stat | default({})).exists | default(false)"
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.windows.win_file:
            path: "{{ backup_dir }}"
            state: absent
          when: "(_restore_snapshot_stat.stat | default({})).exists | default(false)"
          failed_when: false
          tags: [restore]