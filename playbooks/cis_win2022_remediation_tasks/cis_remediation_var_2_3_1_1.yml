playbook_name: "cis_2_3_1_1_remediation"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
req_01: "Set 'Accounts: Guest account status' to 'Disabled'. Recommended module: community.windows.win_security_policy with section=Registry Values and the key name."
req_02: "Verify 'Accounts: Guest account status' is correctly set to 'Disabled'. Use community.windows.win_security_policy to read the value; changed_when: false."
req_03: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_04: "Create a task named 'Generate remediation report' using debug msg with EXACTLY this format: REMEDIATION REPORT — CIS 2.3.1.1; Reference: CIS Benchmark checkpoint 2.3.1.1; then for each requirement: REQUIREMENT NN - corresponding req_NN: with fields Task, Command, Exit code, Data, Status, Details; end with OVERALL REMEDIATION: Result: cis_result."
