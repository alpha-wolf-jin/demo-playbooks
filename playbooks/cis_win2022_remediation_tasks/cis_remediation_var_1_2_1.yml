playbook_name: "cis_1_2_1_account_lockout_duration"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
lockout_duration_minutes: "15"
req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: "If Domain Controller: Set 'Account lockout duration' to '15 or more minute(s)' via Active Directory cmdlets (Set-ADDefaultDomainPasswordPolicy) or Group Policy. Do NOT use community.windows.win_security_policy on DC — use AD/GPO cmdlets."
req_03: "If Member Server: Set 'Account lockout duration' to '15 or more minute(s)'. Recommended module: community.windows.win_security_policy with section=System Access and the key name. Do NOT use raw secedit CLI — community.windows.win_security_policy handles secedit internally and avoids encoding / path issues."
req_04: "If Domain Controller: Verify 'Account lockout duration' is correctly set to '15 or more minute(s)'. Use read-only PowerShell to query the value; changed_when: false."
req_05: "If Member Server: Verify 'Account lockout duration' is correctly set to '15 or more minute(s)'. Use read-only PowerShell to query the value; changed_when: false."
req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
