playbook_name: "cis_2_3_13_1_remediation"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
reg_path: |-
  HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
reg_name: "ShutdownWithoutLogon"
req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: |-
  If Domain Controller: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System', name='ShutdownWithoutLogon', data=0, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
req_03: |-
  If Member Server: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System', name='ShutdownWithoutLogon', data=0, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
req_04: |-
  If Domain Controller: Verify the GP registry key: use ansible.windows.win_reg_stat path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' name='ShutdownWithoutLogon'. The module returns structured data — .exists (bool) and .value (integer for REG_DWORD). PASS if .exists == true AND .value == 0. FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 0. Do NOT check .stdout or .rc — win_reg_stat returns structured data. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
req_05: |-
  If Member Server: Verify the GP registry key: use ansible.windows.win_reg_stat path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' name='ShutdownWithoutLogon'. The module returns structured data — .exists (bool) and .value (integer for REG_DWORD). PASS if .exists == true AND .value == 0. FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 0. Do NOT check .stdout or .rc — win_reg_stat returns structured data. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable. Also store the raw output from the active verification step in audit_raw_output using the content of _step04_output (if is_dc) or _step05_output (if is_member)."
req_07: >-
  {% raw %}
  Create a task named 'Generate remediation report' using debug msg with EXACTLY this format:
  REMEDIATION REPORT — CIS 2.3.13.1
  Reference: CIS Benchmark checkpoint 2.3.13.1
  Then for each requirement: REQUIREMENT NN - {{ req_NN }}:
  With fields: Task, Command, Exit code, Data, Status (PASS/FAIL/SKIP/ERROR), Details.
  End with OVERALL REMEDIATION: section containing Result: {{{ cis_result }}}
  {% endraw %}
