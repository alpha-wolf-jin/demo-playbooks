---
- name: Initialize meta data variables
  include_vars: cis_remediation_var_1_1_2.yml

- name: "Snapshot - Create backup directory"
  ansible.windows.win_file:
    path: "{{ backup_dir }}"
    state: directory
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Check if secpol.cfg exists"
  ansible.windows.win_stat:
    path: "{{ secpol_cfg_path }}"
  register: _snap_secpol_stat
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Backup secpol.cfg if exists"
  ansible.windows.win_copy:
    src: "{{ secpol_cfg_path }}"
    dest: "{{ backup_dir }}/secpol.cfg.present"
    remote_src: true
  when: "_snap_secpol_stat.stat.exists | default(false)"
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Mark secpol.cfg absent if missing"
  ansible.windows.win_copy:
    content: "absent"
    dest: "{{ backup_dir }}/secpol.cfg.absent"
  when: "not (_snap_secpol_stat.stat.exists | default(false))"
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Check if verify.cfg exists"
  ansible.windows.win_stat:
    path: "{{ verify_cfg_path }}"
  register: _snap_verify_stat
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Backup verify.cfg if exists"
  ansible.windows.win_copy:
    src: "{{ verify_cfg_path }}"
    dest: "{{ backup_dir }}/verify.cfg.present"
    remote_src: true
  when: "_snap_verify_stat.stat.exists | default(false)"
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Mark verify.cfg absent if missing"
  ansible.windows.win_copy:
    content: "absent"
    dest: "{{ backup_dir }}/verify.cfg.absent"
  when: "not (_snap_verify_stat.stat.exists | default(false))"
  failed_when: false
  tags: [snapshot]

- block:
  - name: "Execute - Ensure backup directory exists"
    ansible.windows.win_file:
      path: "{{ backup_dir }}"
      state: directory
    failed_when: false
    tags: [execute]

  - name: "Req step-01 - Detect server role"
    ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
    register: _step01_output
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-01 - Set server role flags"
    ansible.builtin.set_fact:
      is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
      is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
    tags: [execute]

  - name: "Req step-02 - Apply maximum password age policy on Domain Controller"
    ansible.windows.win_shell: |
      if (-not (Get-Command Set-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue)) {
        Write-Output 'SKIP: ActiveDirectory module not available'
        exit 0
      }
      $domainDN = (Get-ADDomain).DistinguishedName
      Set-ADDefaultDomainPasswordPolicy -Identity $domainDN -MaxPasswordAge (New-TimeSpan -Days {{ max_password_age_days }})
      Write-Output 'policy updated'
    register: _step02_output
    when: "is_dc | bool"
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-03 - Verify maximum password age on Domain Controller"
    ansible.windows.win_shell: |
      if (-not (Get-Command Get-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue)) {
        Write-Output 'SKIP: ActiveDirectory module not available'
        exit 0
      }
      Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty MaxPasswordAge
    register: _step03_output
    when: "is_dc | bool"
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-04 - Export current security policy on Member Server"
    ansible.windows.win_shell: |
      $cfgPath = [System.IO.Path]::GetFullPath("{{ secpol_cfg_path }}")
      secedit /export /cfg "$cfgPath" /areas SECURITYPOLICY
    register: _step04_output
    when: "is_member | bool"
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-05 - Edit security policy configuration file to set MaximumPasswordAge"
    ansible.windows.win_shell: |
      $ErrorActionPreference = 'Stop'
      $path = "{{ secpol_cfg_path }}"
      $key = 'MaximumPasswordAge'
      $newDays = '{{ max_password_age_days }}'
      $lines = [System.IO.File]::ReadAllLines($path, [System.Text.Encoding]::Unicode)
      $newLines = New-Object System.Collections.Generic.List[string]
      $found = $false
      foreach ($line in $lines) {
        if ($line -match "^\s*$key\s*=") {
          $found = $true
          $newLines.Add("$key = $newDays")
        } else {
          $newLines.Add($line)
        }
      }
      if (-not $found) {
        $newLines.Clear()
        $inserted = $false
        foreach ($line in $lines) {
          $newLines.Add($line)
          if (-not $inserted -and $line -match '^\s*\[System Access\]\s*$') {
            $newLines.Add("$key = $newDays")
            $inserted = $true
          }
        }
        if (-not $inserted) {
          $newLines.Add('[System Access]')
          $newLines.Add("$key = $newDays")
        }
      }
      [System.IO.File]::WriteAllLines($path, $newLines.ToArray(), [System.Text.Encoding]::Unicode)
      Write-Output "MaximumPasswordAge updated to $newDays"
    register: _step05_output
    when: "is_member | bool"
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-06 - Apply modified security policy on Member Server using fresh temp database"
    ansible.windows.win_shell: |
      $ErrorActionPreference = 'Continue'
      $db = [System.IO.Path]::GetFullPath("{{ backup_dir }}/cis_secedit.sdb")
      $cfg = [System.IO.Path]::GetFullPath("{{ secpol_cfg_path }}")
      $out = & secedit /configure /db "$db" /cfg "$cfg" /areas SECURITYPOLICY /quiet 2>&1 | Out-String
      Write-Output $out
      exit $LASTEXITCODE
    register: _step06_output
    when: "is_member | bool"
    failed_when: false
    changed_when: false
    async: 120
    poll: 10
    tags: [execute]

  - name: "Req step-07 - Verify maximum password age on Member Server"
    ansible.windows.win_shell: |
      $cfgPath = [System.IO.Path]::GetFullPath("{{ verify_cfg_path }}")
      secedit /export /cfg "$cfgPath" /areas SECURITYPOLICY /quiet
      $raw = [System.IO.File]::ReadAllText($cfgPath, [System.Text.Encoding]::Unicode)
      $match = [regex]::Match($raw, '(?im)^[ \t]*MaximumPasswordAge[ \t]*=[ \t]*(.+)[ \t]*\r?$')
      if ($match.Success) {
        $val = $match.Groups[1].Value.Trim()
        Write-Output "MaximumPasswordAge=$val"
        if ($val -eq '{{ max_password_age_days }}') {
          Write-Output 'VERIFY_PASS'
        } else {
          Write-Output 'VERIFY_FAIL'
        }
      } else {
        Write-Output 'VERIFY_FAIL: MaximumPasswordAge not found'
      }
    register: _step07_output
    when: "is_member | bool"
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-08 - Clean up temporary security policy files"
    ansible.windows.win_shell: |
      Remove-Item "{{ secpol_cfg_path }}", "{{ verify_cfg_path }}" -ErrorAction SilentlyContinue
      Write-Output 'files removed'
    register: _step08_output
    when: "is_member | bool"
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-09 - Store requirement statuses"
    ansible.builtin.set_fact:
      task_01_name: "Detect server role"
      task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
      task_01_rc: "{{ _step01_output.rc | default(-1) }}"
      data_01: "{{ _step01_output.stdout | default('') | trim }}"
      status_01: "{{ 'PASS' if (_step01_output.rc | default(-1) == 0 and (_step01_output.stdout | default('') | trim) in ['1','2','3','4','5']) else 'ERROR' }}"
      details_01: "See status"

      task_02_name: "Apply maximum password age on Domain Controller"
      task_02_cmd: "Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DistinguishedName -MaxPasswordAge (New-TimeSpan -Days {{ max_password_age_days }})"
      task_02_rc: "{{ _step02_output.rc | default(-1) }}"
      data_02: "{{ _step02_output.stdout | default('') | trim }}"
      status_02: "{{ 'PASS' if (is_dc | bool and _step02_output.rc | default(-1) == 0 and 'policy updated' in (_step02_output.stdout | default(''))) else 'SKIP' if (not (is_dc | bool) or 'SKIP' in (_step02_output.stdout | default(''))) else 'FAIL' }}"
      details_02: "See status"

      task_03_name: "Verify maximum password age on Domain Controller"
      task_03_cmd: "Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty MaxPasswordAge"
      task_03_rc: "{{ _step03_output.rc | default(-1) }}"
      data_03: "{{ _step03_output.stdout | default('') | trim }}"
      status_03: "{{ 'PASS' if (is_dc | bool and _step03_output.rc | default(-1) == 0 and (max_password_age_days | string) in (_step03_output.stdout | default(''))) else 'SKIP' if (not (is_dc | bool) or 'SKIP' in (_step03_output.stdout | default(''))) else 'FAIL' }}"
      details_03: "See status"

      task_04_name: "Export current security policy on Member Server"
      task_04_cmd: |-
        secedit /export /cfg C:\\secpol.cfg /areas SECURITYPOLICY
      task_04_rc: "{{ _step04_output.rc | default(-1) }}"
      data_04: "{{ _step04_output.stdout | default('') | trim }}"
      status_04: "{{ 'PASS' if (is_member | bool and _step04_output.rc | default(-1) == 0) else 'SKIP' if not (is_member | bool) else 'FAIL' }}"
      details_04: "See status"

      task_05_name: "Edit security policy configuration file to set MaximumPasswordAge"
      task_05_cmd: |-
        Edit C:\\secpol.cfg with UTF-16 LE ReadAllLines/WriteAllLines to set MaximumPasswordAge = {{ max_password_age_days }}
      task_05_rc: "{{ _step05_output.rc | default(-1) }}"
      data_05: "{{ _step05_output.stdout | default('') | trim }}"
      status_05: "{{ 'PASS' if (is_member | bool and _step05_output.rc | default(-1) == 0 and ('updated to' in (_step05_output.stdout | default('')) or 'already set' in (_step05_output.stdout | default('')))) else 'SKIP' if not (is_member | bool) else 'FAIL' }}"
      details_05: "See status"

      task_06_name: "Apply modified security policy on Member Server using fresh temp database"
      task_06_cmd: |-
        secedit /configure /db \"{{ backup_dir }}\\cis_secedit.sdb\" /cfg \"{{ secpol_cfg_path | trim }}\" /areas SECURITYPOLICY /quiet
      task_06_rc: "{{ _step06_output.rc | default(-1) }}"
      data_06: "{{ _step06_output.stdout | default('') | trim }}"
      status_06: "{{ 'PASS' if (is_member | bool and _step06_output.rc | default(-1) == 0) else 'SKIP' if not (is_member | bool) else 'FAIL' }}"
      details_06: "See status"

      task_07_name: "Verify maximum password age on Member Server"
      task_07_cmd: |-
        secedit /export /cfg C:\\verify.cfg /areas SECURITYPOLICY; Select-String -Path C:\\verify.cfg -Pattern 'MaximumPasswordAge'
      task_07_rc: "{{ _step07_output.rc | default(-1) }}"
      data_07: "{{ _step07_output.stdout | default('') | trim }}"
      status_07: "{{ 'PASS' if (is_member | bool and _step07_output.rc | default(-1) == 0 and 'VERIFY_PASS' in (_step07_output.stdout | default(''))) else 'SKIP' if not (is_member | bool) else 'FAIL' }}"
      details_07: "See status"

      task_08_name: "Clean up temporary security policy files"
      task_08_cmd: |-
        Remove-Item C:\\secpol.cfg, C:\\verify.cfg -ErrorAction SilentlyContinue
      task_08_rc: "{{ _step08_output.rc | default(-1) }}"
      data_08: "{{ _step08_output.stdout | default('') | trim }}"
      status_08: "{{ 'PASS' if (is_member | bool and _step08_output.rc | default(-1) == 0 and 'files removed' in (_step08_output.stdout | default(''))) else 'SKIP' if not (is_member | bool) else 'FAIL' }}"
      details_08: "See status"
    tags: [execute]

  - name: "Req step-09 - Set cis_result"
    ansible.builtin.set_fact:
      cis_result: >-
        {{
          'ERROR' if 'ERROR' in (
            [status_01]
            + ([status_02, status_03] if (is_dc | bool) else [])
            + ([status_04, status_05, status_06, status_07, status_08] if (is_member | bool) else [])
          ) else
          'FAIL' if 'FAIL' in (
            [status_01]
            + ([status_02, status_03] if (is_dc | bool) else [])
            + ([status_04, status_05, status_06, status_07, status_08] if (is_member | bool) else [])
          ) else
          'PASS' if 'PASS' in (
            [status_01]
            + ([status_02, status_03] if (is_dc | bool) else [])
            + ([status_04, status_05, status_06, status_07, status_08] if (is_member | bool) else [])
          ) else
          'SKIP'
        }}
    tags: [execute]

  - name: "Req step-09 - Set requirement 09 status"
    ansible.builtin.set_fact:
      task_09_name: "Store final remediation result in cis_result"
      task_09_cmd: "N/A"
      task_09_rc: "0"
      data_09: "{{ cis_result }}"
      status_09: "{{ cis_result }}"
      details_09: "See status"
    tags: [execute]

  - name: "Req step-10 - Generate remediation report"
    ansible.builtin.debug:
      msg:
      - "REMEDIATION REPORT — CIS 1.1.2"
      - "Reference: CIS Benchmark checkpoint 1.1.2"
      - ""
      - "REQUIREMENT 01 - {{ req_01 }}:"
      - "  Task: {{ task_01_name | default('Not recorded') }}"
      - "  Command: {{ task_01_cmd | default('N/A') }}"
      - "  Exit code: {{ task_01_rc | default(-1) }}"
      - "  Data: {{ data_01 | default('') | trim }}"
      - "  Status: {{ status_01 | default('ERROR') | trim }}"
      - "  Details: {{ details_01 | default('') | trim }}"
      - ""
      - "REQUIREMENT 02 - {{ req_02 }}:"
      - "  Task: {{ task_02_name | default('Not recorded') }}"
      - "  Command: {{ task_02_cmd | default('N/A') }}"
      - "  Exit code: {{ task_02_rc | default(-1) }}"
      - "  Data: {{ data_02 | default('') | trim }}"
      - "  Status: {{ status_02 | default('ERROR') | trim }}"
      - "  Details: {{ details_02 | default('') | trim }}"
      - ""
      - "REQUIREMENT 03 - {{ req_03 }}:"
      - "  Task: {{ task_03_name | default('Not recorded') }}"
      - "  Command: {{ task_03_cmd | default('N/A') }}"
      - "  Exit code: {{ task_03_rc | default(-1) }}"
      - "  Data: {{ data_03 | default('') | trim }}"
      - "  Status: {{ status_03 | default('ERROR') | trim }}"
      - "  Details: {{ details_03 | default('') | trim }}"
      - ""
      - "REQUIREMENT 04 - {{ req_04 }}:"
      - "  Task: {{ task_04_name | default('Not recorded') }}"
      - "  Command: {{ task_04_cmd | default('N/A') }}"
      - "  Exit code: {{ task_04_rc | default(-1) }}"
      - "  Data: {{ data_04 | default('') | trim }}"
      - "  Status: {{ status_04 | default('ERROR') | trim }}"
      - "  Details: {{ details_04 | default('') | trim }}"
      - ""
      - "REQUIREMENT 05 - {{ req_05 }}:"
      - "  Task: {{ task_05_name | default('Not recorded') }}"
      - "  Command: {{ task_05_cmd | default('N/A') }}"
      - "  Exit code: {{ task_05_rc | default(-1) }}"
      - "  Data: {{ data_05 | default('') | trim }}"
      - "  Status: {{ status_05 | default('ERROR') | trim }}"
      - "  Details: {{ details_05 | default('') | trim }}"
      - ""
      - "REQUIREMENT 06 - {{ req_06 }}:"
      - "  Task: {{ task_06_name | default('Not recorded') }}"
      - "  Command: {{ task_06_cmd | default('N/A') }}"
      - "  Exit code: {{ task_06_rc | default(-1) }}"
      - "  Data: {{ data_06 | default('') | trim }}"
      - "  Status: {{ status_06 | default('ERROR') | trim }}"
      - "  Details: {{ details_06 | default('') | trim }}"
      - ""
      - "REQUIREMENT 07 - {{ req_07 }}:"
      - "  Task: {{ task_07_name | default('Not recorded') }}"
      - "  Command: {{ task_07_cmd | default('N/A') }}"
      - "  Exit code: {{ task_07_rc | default(-1) }}"
      - "  Data: {{ data_07 | default('') | trim }}"
      - "  Status: {{ status_07 | default('ERROR') | trim }}"
      - "  Details: {{ details_07 | default('') | trim }}"
      - ""
      - "REQUIREMENT 08 - {{ req_08 }}:"
      - "  Task: {{ task_08_name | default('Not recorded') }}"
      - "  Command: {{ task_08_cmd | default('N/A') }}"
      - "  Exit code: {{ task_08_rc | default(-1) }}"
      - "  Data: {{ data_08 | default('') | trim }}"
      - "  Status: {{ status_08 | default('ERROR') | trim }}"
      - "  Details: {{ details_08 | default('') | trim }}"
      - ""
      - "REQUIREMENT 09 - {{ req_09 }}:"
      - "  Task: {{ task_09_name | default('Not recorded') }}"
      - "  Command: {{ task_09_cmd | default('N/A') }}"
      - "  Exit code: {{ task_09_rc | default(-1) }}"
      - "  Data: {{ data_09 | default('') | trim }}"
      - "  Status: {{ status_09 | default('ERROR') | trim }}"
      - "  Details: {{ details_09 | default('') | trim }}"
      - ""
      - "OVERALL REMEDIATION:"
      - "  Result: {{ cis_result }}"
    tags: [execute]

  always:
  - name: "Restore - Restore temporary files and remove backup directory"
    ansible.windows.win_shell: |
      $ErrorActionPreference = 'Continue'
      $backupDir = "{{ backup_dir }}"
      function Restore-File {
        param([string]$name, [string]$dest)
        $p = Join-Path $backupDir "$name.present"
        $a = Join-Path $backupDir "$name.absent"
        if (Test-Path -LiteralPath $p) {
          Copy-Item -LiteralPath $p -Destination $dest -Force
          Write-Output "Restored $dest"
        } elseif (Test-Path -LiteralPath $a) {
          Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
          Write-Output "Removed $dest"
        }
      }
      Restore-File -name 'secpol.cfg' -dest "{{ secpol_cfg_path }}"
      Restore-File -name 'verify.cfg' -dest "{{ verify_cfg_path }}"
      if (Test-Path -LiteralPath $backupDir) {
        Remove-Item -LiteralPath $backupDir -Recurse -Force -ErrorAction SilentlyContinue
        Write-Output 'Backup directory removed'
      }
    failed_when: false
    changed_when: false
    tags: [restore]
