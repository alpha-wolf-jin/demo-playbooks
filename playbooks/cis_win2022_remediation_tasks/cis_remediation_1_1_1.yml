---
- name: Initialize meta data variables
  include_vars: cis_remediation_var_1_1_1.yml

- name: "Snapshot - Remove stale backup directory"
  ansible.windows.win_file:
    path: "{{ backup_dir | trim }}"
    state: absent
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Create backup directory"
  ansible.windows.win_file:
    path: "{{ backup_dir | trim }}"
    state: directory
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Detect server role for snapshot selection"
  ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
  register: _snap_role
  failed_when: false
  changed_when: false
  tags: [snapshot]
- name: "Snapshot - Check if C:\\secpol.cfg exists"
  ansible.windows.win_stat:
    path: "{{ secpol_cfg_path | trim }}"
  register: _snap_secpol_check
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Backup C:\\secpol.cfg if exists"
  ansible.windows.win_shell: |
    $dest = "{{ backup_dir | trim }}\secpol.cfg.present"
    Copy-Item -LiteralPath "{{ secpol_cfg_path | trim }}" -Destination $dest -Force
  when: _snap_secpol_check.stat.exists | default(false)
  failed_when: false
  changed_when: false
  tags: [snapshot]
- name: "Snapshot - Mark C:\\secpol.cfg absent if missing"
  ansible.windows.win_shell: |
    $path = "{{ backup_dir | trim }}\secpol.cfg.absent"
    Set-Content -Path $path -Value 'absent' -Force
  when: not (_snap_secpol_check.stat.exists | default(false))
  failed_when: false
  changed_when: false
  tags: [snapshot]
- name: "Snapshot - Check if C:\\verify.cfg exists"
  ansible.windows.win_stat:
    path: "{{ verify_cfg_path | trim }}"
  register: _snap_verify_check
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Backup C:\\verify.cfg if exists"
  ansible.windows.win_shell: |
    $dest = "{{ backup_dir | trim }}\verify.cfg.present"
    Copy-Item -LiteralPath "{{ verify_cfg_path | trim }}" -Destination $dest -Force
  when: _snap_verify_check.stat.exists | default(false)
  failed_when: false
  changed_when: false
  tags: [snapshot]
- name: "Snapshot - Mark C:\\verify.cfg absent if missing"
  ansible.windows.win_shell: |
    $path = "{{ backup_dir | trim }}\verify.cfg.absent"
    Set-Content -Path $path -Value 'absent' -Force
  when: not (_snap_verify_check.stat.exists | default(false))
  failed_when: false
  changed_when: false
  tags: [snapshot]
- name: "Snapshot - Record original AD default domain password history"
  ansible.windows.win_shell: |
    $count = (Get-ADDefaultDomainPasswordPolicy).PasswordHistoryCount
    Set-Content -Path "{{ backup_dir | trim }}\dc_password_history_count.txt" -Value $count -Force
  when: "(_snap_role.stdout | default('') | trim) in ['4', '5']"
  failed_when: false
  changed_when: false
  tags: [snapshot]
- name: "Snapshot - Export current security policy baseline for Member Server"
  ansible.windows.win_shell: >-
    secedit /export /cfg "{{ backup_dir | trim }}\secpol_original.cfg" /quiet
  when: "(_snap_role.stdout | default('') | trim) in ['1', '2', '3']"
  failed_when: false
  changed_when: false
  tags: [snapshot]

- name: "Execute remediation"
  block:
  - name: "Req step-01 - Detect server role using WMI DomainRole"
    ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
    register: _step01_output
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-01 - Set is_dc and is_member role flags"
    ansible.builtin.set_fact:
      is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
      is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
    tags: [execute]

  - name: "Req step-01 - Store role detection status"
    ansible.builtin.set_fact:
      status_01: "{{ 'PASS' if (_step01_output.stdout | default('') | trim) in ['1','2','3','4','5'] else 'ERROR' }}"
      data_01: "{{ _step01_output.stdout | default('') | trim }}"
      details_01: "{{ 'DomainRole=' + (_step01_output.stdout | default('') | trim) }}"
      task_01_name: "Detect server role via WMI DomainRole"
      task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
      task_01_rc: "{{ _step01_output.rc | default(-1) }}"
    tags: [execute]

  - name: "Req step-02 - Apply password history count of 24 to AD default domain password policy"
    ansible.windows.win_shell: |
      $dom = (Get-ADDomain).DistinguishedName
      Set-ADDefaultDomainPasswordPolicy -Identity $dom -PasswordHistoryCount 24
    register: _step02_output
    failed_when: false
    changed_when: false
    when: is_dc | bool
    tags: [execute]

  - name: "Req step-02 - Store DC apply status"
    ansible.builtin.set_fact:
      status_02: "{{ 'PASS' if _step02_output.rc | default(1) == 0 else 'FAIL' }}"
      data_02: "{{ _step02_output.stdout | default('') | trim }}"
      details_02: "{{ 'Set-ADDefaultDomainPasswordPolicy completed successfully' if _step02_output.rc | default(1) == 0 else 'Set-ADDefaultDomainPasswordPolicy failed' }}"
      task_02_name: "Apply password history count of 24 via Set-ADDefaultDomainPasswordPolicy"
      task_02_cmd: "$dom = (Get-ADDomain).DistinguishedName; Set-ADDefaultDomainPasswordPolicy -Identity $dom -PasswordHistoryCount 24"
      task_02_rc: "{{ _step02_output.rc | default(-1) }}"
    when: is_dc | bool
    tags: [execute]

  - name: "Req step-03 - Export current security policy to C:\\secpol.cfg"
    ansible.windows.win_shell: "secedit /export /cfg {{ secpol_cfg_path | trim }} /quiet"
    register: _step03_output
    failed_when: false
    changed_when: false
    when: is_member | bool
    tags: [execute]

  - name: "Req step-03 - Store member export status"
    ansible.builtin.set_fact:
      status_03: "{{ 'PASS' if _step03_output.rc | default(1) == 0 else 'FAIL' }}"
      data_03: "{{ _step03_output.stdout | default('') | trim }}"
      details_03: |
        {{ 'Security policy exported to C:\\secpol.cfg' if _step03_output.rc | default(1) == 0 else 'secedit export failed' }}
      task_03_name: |
        Export current security policy to C:\\secpol.cfg
      task_03_cmd: "secedit /export /cfg {{ secpol_cfg_path | trim }} /quiet"
      task_03_rc: "{{ _step03_output.rc | default(-1) }}"
    when: is_member | bool
    tags: [execute]

  - name: "Req step-04 - Set PasswordHistorySize to 24 in C:\\secpol.cfg"
    ansible.windows.win_shell: |
      $path = '{{ secpol_cfg_path | trim }}'
      $line = 'PasswordHistorySize = 24'
      $content = Get-Content -Path $path
      $found = $false
      for ($i = 0; $i -lt $content.Count; $i++) {
        if ($content[$i] -match '^PasswordHistorySize\s*=') {
          $content[$i] = $line
          $found = $true
        }
      }
      if (-not $found) {
        $content += $line
      }
      Set-Content -Path $path -Value $content -Force
      Write-Output 'PasswordHistorySize = 24'
    register: _step04_output
    failed_when: false
    changed_when: false
    when: is_member | bool
    tags: [execute]

  - name: "Req step-04 - Store member edit status"
    ansible.builtin.set_fact:
      status_04: "{{ 'PASS' if _step04_output.rc | default(1) == 0 else 'FAIL' }}"
      data_04: "{{ _step04_output.stdout | default('') | trim }}"
      details_04: |
        {{ 'PasswordHistorySize set to 24' if _step04_output.rc | default(1) == 0 else 'Failed to update C:\\secpol.cfg' }}
      task_04_name: |
        Set PasswordHistorySize to 24 in C:\\secpol.cfg
      task_04_cmd: |
        PowerShell regex replace PasswordHistorySize = 24 in C:\\secpol.cfg
      task_04_rc: "{{ _step04_output.rc | default(-1) }}"
    when: is_member | bool
    tags: [execute]

  - name: "Req step-05 - Apply security policy using secedit configure"
    ansible.windows.win_shell: >-
      secedit /configure /db {{ secedit_db_path | trim }} /cfg {{ secpol_cfg_path | trim }} /areas SECURITYPOLICY /quiet
    register: _step05_output
    async: 120
    poll: 10
    failed_when: false
    changed_when: false
    when: is_member | bool
    tags: [execute]

  - name: "Req step-05 - Store member apply status"
    ansible.builtin.set_fact:
      status_05: "{{ 'PASS' if _step05_output.rc | default(1) == 0 else 'FAIL' }}"
      data_05: "{{ _step05_output.stdout | default('') | trim }}"
      details_05: "{{ 'Security policy applied successfully' if _step05_output.rc | default(1) == 0 else 'secedit configure failed' }}"
      task_05_name: "Apply security policy using secedit configure"
      task_05_cmd: "secedit /configure /db {{ secedit_db_path | trim }} /cfg {{ secpol_cfg_path | trim }} /areas SECURITYPOLICY /quiet"
      task_05_rc: "{{ _step05_output.rc | default(-1) }}"
    when: is_member | bool
    tags: [execute]

  - name: "Req step-06 - Verify AD default domain password history count"
    ansible.windows.win_shell: "Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount"
    register: _step06_output
    failed_when: false
    changed_when: false
    when: is_dc | bool
    tags: [execute]

  - name: "Req step-06 - Store DC verify status"
    ansible.builtin.set_fact:
      status_06: "{{ 'PASS' if (_step06_output.rc | default(1) == 0 and (_step06_output.stdout | default('') | trim) == '24') else 'FAIL' }}"
      data_06: "{{ _step06_output.stdout | default('') | trim }}"
      details_06: "{{ 'PasswordHistoryCount is 24' if (_step06_output.rc | default(1) == 0 and (_step06_output.stdout | default('') | trim) == '24') else 'PasswordHistoryCount is not 24 or command failed' }}"
      task_06_name: "Verify AD default domain password history count"
      task_06_cmd: "Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount"
      task_06_rc: "{{ _step06_output.rc | default(-1) }}"
    when: is_dc | bool
    tags: [execute]

  - name: "Req step-07 - Verify member security policy PasswordHistorySize"
    ansible.windows.win_shell: |
      secedit /export /cfg {{ verify_cfg_path | trim }} /quiet
      $raw = Get-Content {{ verify_cfg_path | trim }} -Raw
      $match = [regex]::Match($raw, '(?im)^[ \t]*PasswordHistorySize[ \t]*=[ \t]*(.+)[ \t]*$')
      if ($match.Success) {
        $val = $match.Groups[1].Value.Trim()
        Write-Output "PasswordHistorySize=$val"
        if ($val -eq '24') { Write-Output 'VERIFY_PASS' } else { Write-Output 'VERIFY_FAIL' }
      } else {
        Write-Output 'VERIFY_FAIL: PasswordHistorySize not found'
      }
    register: _step07_output
    failed_when: false
    changed_when: false
    when: is_member | bool
    tags: [execute]

  - name: "Req step-07 - Store member verify status"
    ansible.builtin.set_fact:
      status_07: "{{ 'PASS' if (_step07_output.rc | default(1) == 0 and 'VERIFY_PASS' in (_step07_output.stdout | default(''))) else 'FAIL' }}"
      data_07: "{{ _step07_output.stdout | default('') | trim }}"
      details_07: "{{ 'PasswordHistorySize is 24' if (_step07_output.rc | default(1) == 0 and 'VERIFY_PASS' in (_step07_output.stdout | default(''))) else 'PasswordHistorySize is not 24 or verification failed' }}"
      task_07_name: "Verify member security policy PasswordHistorySize"
      task_07_cmd: "secedit /export /cfg {{ verify_cfg_path | trim }} /quiet; PowerShell regex check PasswordHistorySize = 24"
      task_07_rc: "{{ _step07_output.rc | default(-1) }}"
    when: is_member | bool
    tags: [execute]

  - name: "Req step-08 - Store final remediation result in cis_result"
    ansible.builtin.set_fact:
      cis_result: "{{ (status_06 | default('ERROR') | trim) if (is_dc | default(false) | bool) else ((status_07 | default('ERROR') | trim) if (is_member | default(false) | bool) else 'ERROR') }}"
    tags: [execute]

  - name: "Req step-08 - Store final remediation report data"
    ansible.builtin.set_fact:
      status_08: "{{ cis_result | default('ERROR') | trim }}"
      data_08: "{{ cis_result | default('ERROR') | trim }}"
      details_08: "Overall remediation result derived from active branch verify status"
      task_08_name: "Store final remediation result in cis_result"
      task_08_cmd: "set_fact"
      task_08_rc: 0
    when: cis_result is defined
    tags: [execute]

  - name: "Req step-09 - Generate remediation report"
    ansible.builtin.debug:
      msg:
      - "REMEDIATION REPORT — CIS 1.1.1"
      - "Reference: CIS Benchmark checkpoint 1.1.1"
      - ""
      - "REQUIREMENT 01 - {{ req_01 }}:"
      - "  Task: {{ task_01_name | default('Not recorded') }}"
      - "  Command: {{ task_01_cmd | default('N/A') }}"
      - "  Exit code: {{ task_01_rc | default(-1) }}"
      - "  Data: {{ data_01 | default('') | trim }}"
      - "  Status: {{ status_01 | default('ERROR') | trim }}"
      - "  Details: {{ details_01 | default('') | trim }}"
      - ""
      - "REQUIREMENT 02 - {{ req_02 }}:"
      - "  Task: {{ task_02_name | default('Not recorded') }}"
      - "  Command: {{ task_02_cmd | default('N/A') }}"
      - "  Exit code: {{ task_02_rc | default(-1) }}"
      - "  Data: {{ data_02 | default('') | trim }}"
      - "  Status: {{ status_02 | default('SKIP') | trim }}"
      - "  Details: {{ details_02 | default('') | trim }}"
      - ""
      - "REQUIREMENT 03 - {{ req_03 }}:"
      - "  Task: {{ task_03_name | default('Not recorded') }}"
      - "  Command: {{ task_03_cmd | default('N/A') }}"
      - "  Exit code: {{ task_03_rc | default(-1) }}"
      - "  Data: {{ data_03 | default('') | trim }}"
      - "  Status: {{ status_03 | default('SKIP') | trim }}"
      - "  Details: {{ details_03 | default('') | trim }}"
      - ""
      - "REQUIREMENT 04 - {{ req_04 }}:"
      - "  Task: {{ task_04_name | default('Not recorded') }}"
      - "  Command: {{ task_04_cmd | default('N/A') }}"
      - "  Exit code: {{ task_04_rc | default(-1) }}"
      - "  Data: {{ data_04 | default('') | trim }}"
      - "  Status: {{ status_04 | default('SKIP') | trim }}"
      - "  Details: {{ details_04 | default('') | trim }}"
      - ""
      - "REQUIREMENT 05 - {{ req_05 }}:"
      - "  Task: {{ task_05_name | default('Not recorded') }}"
      - "  Command: {{ task_05_cmd | default('N/A') }}"
      - "  Exit code: {{ task_05_rc | default(-1) }}"
      - "  Data: {{ data_05 | default('') | trim }}"
      - "  Status: {{ status_05 | default('SKIP') | trim }}"
      - "  Details: {{ details_05 | default('') | trim }}"
      - ""
      - "REQUIREMENT 06 - {{ req_06 }}:"
      - "  Task: {{ task_06_name | default('Not recorded') }}"
      - "  Command: {{ task_06_cmd | default('N/A') }}"
      - "  Exit code: {{ task_06_rc | default(-1) }}"
      - "  Data: {{ data_06 | default('') | trim }}"
      - "  Status: {{ status_06 | default('SKIP') | trim }}"
      - "  Details: {{ details_06 | default('') | trim }}"
      - ""
      - "REQUIREMENT 07 - {{ req_07 }}:"
      - "  Task: {{ task_07_name | default('Not recorded') }}"
      - "  Command: {{ task_07_cmd | default('N/A') }}"
      - "  Exit code: {{ task_07_rc | default(-1) }}"
      - "  Data: {{ data_07 | default('') | trim }}"
      - "  Status: {{ status_07 | default('SKIP') | trim }}"
      - "  Details: {{ details_07 | default('') | trim }}"
      - ""
      - "REQUIREMENT 08 - {{ req_08 }}:"
      - "  Task: {{ task_08_name | default('Not recorded') }}"
      - "  Command: {{ task_08_cmd | default('N/A') }}"
      - "  Exit code: {{ task_08_rc | default(-1) }}"
      - "  Data: {{ data_08 | default('') | trim }}"
      - "  Status: {{ status_08 | default('ERROR') | trim }}"
      - "  Details: {{ details_08 | default('') | trim }}"
      - ""
      - "========================================================"
      - "OVERALL REMEDIATION:"
      - "  Result: {{ cis_result }}"
      - "========================================================"
    tags: [execute]

  always:
  - name: "Restore - Start restore and cleanup"
    ansible.windows.win_shell: |
      $backupDir = "{{ backup_dir | trim }}"
      if (-not (Test-Path -LiteralPath $backupDir)) {
        Write-Output 'No backup; nothing to restore'
        exit 0
      }

      function Restore-FileOrDelete($name, $dest) {
        $p = Join-Path $backupDir "$name.present"
        $a = Join-Path $backupDir "$name.absent"
        if (Test-Path -LiteralPath $p) {
          Copy-Item -LiteralPath $p -Destination $dest -Force
          Write-Output "Restored: $dest"
        } elseif (Test-Path -LiteralPath $a) {
          Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
          Write-Output "Removed (was absent): $dest"
        }
      }

      Restore-FileOrDelete 'secpol.cfg' '{{ secpol_cfg_path | trim }}'
      Restore-FileOrDelete 'verify.cfg' '{{ verify_cfg_path | trim }}'

      $dcSnap = Join-Path $backupDir 'dc_password_history_count.txt'
      if (Test-Path -LiteralPath $dcSnap) {
        $count = (Get-Content -LiteralPath $dcSnap -Raw).Trim()
        if ($count -match '^\d+$') {
          Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DistinguishedName -PasswordHistoryCount ([int]$count)
          Write-Output "Restored DC PasswordHistoryCount to $count"
        }
      }

      $memberOrigCfg = Join-Path $backupDir 'secpol_original.cfg'
      if (Test-Path -LiteralPath $memberOrigCfg) {
        $tmpDb = Join-Path $env:TEMP 'secedit_restore.sdb'
        secedit /configure /cfg "$memberOrigCfg" /db "$tmpDb" /areas SECURITYPOLICY /quiet
        Remove-Item -LiteralPath $tmpDb -Force -ErrorAction SilentlyContinue
        Write-Output 'Restored Member Server security policy'
      }

      Remove-Item -LiteralPath $backupDir -Recurse -Force -ErrorAction SilentlyContinue
      Write-Output 'Restore completed'
    async: 300
    poll: 0
    register: _restore_job
    failed_when: false
    changed_when: false
    tags: [restore]

  - name: "Restore - Wait for restore to complete"
    ansible.builtin.async_status:
      jid: "{{ _restore_job.ansible_job_id }}"
    register: _restore_result
    until: _restore_result.finished
    retries: 30
    delay: 10
    failed_when: false
    when: _restore_job.ansible_job_id is defined
    tags: [restore]
