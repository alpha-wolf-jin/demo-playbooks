playbook_name: "cis_18_6_9_1_remediation"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
lltd_path: |-
  HKLM:\SOFTWARE\Policies\Microsoft\Windows\LLTD
lltd_values:
  - "AllowLLTDIOOnDomain"
  - "AllowLLTDIOOnPublicNet"
  - "EnableLLTDIO"
  - "ProhibitLLTDIOOnPrivateNet"
is_dc: false
is_member: false
role_ok: false
status_01: "ERROR"
status_02: "SKIP"
status_03: "SKIP"
status_04: "SKIP"
status_05: "SKIP"
status_06: "SKIP"
status_07: "PASS"
req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: |-
  If Domain Controller: Set ALL 4 CIS-required GP registry values using ansible.windows.win_regedit in a loop (one iteration per value name). Common path: 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\LLTD'. type=dword. data=0 for every item. Value names to set: ['AllowLLTDIOOnDomain', 'AllowLLTDIOOnPublicNet', 'EnableLLTDIO', 'ProhibitLLTDIOOnPrivateNet']. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry keys that the CIS benchmark audit checks.
req_03: |-
  If Member Server: Set ALL 4 CIS-required GP registry values using ansible.windows.win_regedit in a loop (one iteration per value name). Common path: 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\LLTD'. type=dword. data=0 for every item. Value names to set: ['AllowLLTDIOOnDomain', 'AllowLLTDIOOnPublicNet', 'EnableLLTDIO', 'ProhibitLLTDIOOnPrivateNet']. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry keys that the CIS benchmark audit checks.
req_04: |-
  If Domain Controller: Verify ALL 4 CIS-required GP registry values using ansible.windows.win_reg_stat in a loop under path='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\LLTD'. Loop over value names: ['AllowLLTDIOOnDomain', 'AllowLLTDIOOnPublicNet', 'EnableLLTDIO', 'ProhibitLLTDIOOnPrivateNet']. Each result has structured data — .exists (bool) and .value (integer for REG_DWORD). PASS only if ALL loop items have .exists == true AND .value == 0. FAIL if ANY value is absent (NOT_CONFIGURED) OR has .value != 0. Do NOT check .stdout or .rc — win_reg_stat returns structured data. changed_when: false; failed_when: false.
req_05: |-
  If Member Server: Verify ALL 4 CIS-required GP registry values using ansible.windows.win_reg_stat in a loop under path='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\LLTD'. Loop over value names: ['AllowLLTDIOOnDomain', 'AllowLLTDIOOnPublicNet', 'EnableLLTDIO', 'ProhibitLLTDIOOnPrivateNet']. Each result has structured data — .exists (bool) and .value (integer for REG_DWORD). PASS only if ALL loop items have .exists == true AND .value == 0. FAIL if ANY value is absent (NOT_CONFIGURED) OR has .value != 0. Do NOT check .stdout or .rc — win_reg_stat returns structured data. changed_when: false; failed_when: false.
req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_07: "Create a task named 'Generate remediation report' using debug msg with EXACTLY this format: REMEDIATION REPORT — CIS 18.6.9.1, Reference: CIS Benchmark checkpoint 18.6.9.1, then REQUIREMENT NN fields, and OVERALL REMEDIATION with Result: cis_result."
