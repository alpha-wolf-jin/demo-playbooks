---
- name: Initialize meta data variables
  include_vars: cis_remediation_var_18_9_20_1_1.yml

- name: "Snapshot - Remove stale backup directory"
  ansible.windows.win_file:
    path: "{{ backup_dir }}"
    state: absent
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Create backup directory"
  ansible.windows.win_file:
    path: "{{ backup_dir }}"
    state: directory
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Capture current DisableWebPnPDownload state"
  ansible.windows.win_shell: |
    $p = '{{ reg_path }}'
    $stateFile = "{{ backup_dir }}/{{ reg_name }}.state"
    $keyExists = Test-Path -LiteralPath $p
    $val = Get-ItemProperty -Path $p -Name '{{ reg_name }}' -ErrorAction SilentlyContinue
    if ($null -eq $val) {
      if ($keyExists) {
        Set-Content -LiteralPath $stateFile -Value 'KEY_WITHOUT_PROPERTY' -Force
      } else {
        Set-Content -LiteralPath $stateFile -Value 'NO_KEY' -Force
      }
    } else {
      Set-Content -LiteralPath $stateFile -Value $val.'{{ reg_name }}' -Force
    }
  failed_when: false
  changed_when: false
  tags: [snapshot]

- block:
  - name: "Req step-01 - Detect Windows server role"
    ansible.windows.win_shell: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
    register: _step01_output
    failed_when: false
    changed_when: false
    tags: [execute]

  - name: "Req step-01 - Set is_dc and is_member role flags"
    ansible.builtin.set_fact:
      is_dc: "{{ ((_step01_output.stdout | default('') | trim) in ['4', '5']) }}"
      is_member: "{{ ((_step01_output.stdout | default('') | trim) in ['1', '2', '3']) }}"
      role_detection_error: "{{ ((_step01_output.rc | default(-1) | int) != 0) or ((_step01_output.stdout | default('') | trim) not in ['1', '2', '3', '4', '5']) }}"
      task_01_name: "Detect Windows server role using Win32_ComputerSystem"
      task_01_cmd: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
      task_01_rc: "{{ _step01_output.rc | default(-1) }}"
      data_01: "{{ _step01_output.stdout | default('') | trim }}"
      status_01: >-
        {{ 'ERROR' if ((_step01_output.rc | default(-1) | int) != 0) or ((_step01_output.stdout | default('') | trim) not in ['1', '2', '3', '4', '5']) else
           'PASS' }}
      details_01: >-
        {{ 'Role detected: ' ~ (_step01_output.stdout | default('') | trim) if ((_step01_output.rc | default(-1) | int) == 0) and ((_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5']) else
           'Role detection failed or invalid output' }}
    tags: [execute]

  - name: "Req step-02 - Set DisableWebPnPDownload registry DWORD to 1 for Domain Controller"
    ansible.windows.win_regedit:
      path: "{{ reg_path }}"
      name: "{{ reg_name }}"
      data: "{{ expected_value }}"
      type: dword
    when: is_dc | bool
    failed_when: false
    register: _step02_output
    tags: [execute]

  - name: "Req step-02 - Record Domain Controller apply results"
    ansible.builtin.set_fact:
      task_02_name: "Set registry DisableWebPnPDownload DWORD for Domain Controller"
      task_02_cmd: |-
        win_regedit path=HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers name=DisableWebPnPDownload data=1 type=dword
      task_02_rc: "{{ 1 if (((_step02_output | default({})).msg | default('') | string | length > 0) or ((_step02_output | default({})).exception | default('') | string | length > 0) or ((_step02_output | default({})).failed | default(false) | bool)) else 0 }}"
      data_02: "{{ _step02_output | default({}) | to_json }}"
      status_02: >-
        {{ 'SKIP' if not (is_dc | bool) else
           'FAIL' if (((_step02_output | default({})).msg | default('') | string | length > 0) or
                      ((_step02_output | default({})).exception | default('') | string | length > 0) or
                      ((_step02_output | default({})).failed | default(false) | bool)) else
           'PASS' }}
      details_02: >-
        {{ 'Domain Controller apply skipped' if not (is_dc | bool) else
           'Failed to write GP registry key' if (((_step02_output | default({})).msg | default('') | string | length > 0) or
                                                 ((_step02_output | default({})).exception | default('') | string | length > 0) or
                                                 ((_step02_output | default({})).failed | default(false) | bool)) else
           'Successfully wrote GP registry key' }}
    tags: [execute]

  - name: "Req step-03 - Set DisableWebPnPDownload registry DWORD to 1 for Member Server"
    ansible.windows.win_regedit:
      path: "{{ reg_path }}"
      name: "{{ reg_name }}"
      data: "{{ expected_value }}"
      type: dword
    when: is_member | bool
    failed_when: false
    register: _step03_output
    tags: [execute]

  - name: "Req step-03 - Record Member Server apply results"
    ansible.builtin.set_fact:
      task_03_name: "Set registry DisableWebPnPDownload DWORD for Member Server"
      task_03_cmd: |-
        win_regedit path=HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers name=DisableWebPnPDownload data=1 type=dword
      task_03_rc: "{{ 1 if (((_step03_output | default({})).msg | default('') | string | length > 0) or ((_step03_output | default({})).exception | default('') | string | length > 0) or ((_step03_output | default({})).failed | default(false) | bool)) else 0 }}"
      data_03: "{{ _step03_output | default({}) | to_json }}"
      status_03: >-
        {{ 'SKIP' if not (is_member | bool) else
           'FAIL' if (((_step03_output | default({})).msg | default('') | string | length > 0) or
                      ((_step03_output | default({})).exception | default('') | string | length > 0) or
                      ((_step03_output | default({})).failed | default(false) | bool)) else
           'PASS' }}
      details_03: >-
        {{ 'Member Server apply skipped' if not (is_member | bool) else
           'Failed to write GP registry key' if (((_step03_output | default({})).msg | default('') | string | length > 0) or
                                                 ((_step03_output | default({})).exception | default('') | string | length > 0) or
                                                 ((_step03_output | default({})).failed | default(false) | bool)) else
           'Successfully wrote GP registry key' }}
    tags: [execute]

  - name: "Req step-04 - Verify Domain Controller GP registry key"
    ansible.windows.win_reg_stat:
      path: "{{ reg_path }}"
      name: "{{ reg_name }}"
    when: is_dc | bool
    changed_when: false
    failed_when: false
    register: _step04_output
    tags: [execute]

  - name: "Req step-04 - Record Domain Controller verify results"
    ansible.builtin.set_fact:
      task_04_name: "Verify Domain Controller GP registry key"
      task_04_cmd: |-
        win_reg_stat path=HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers name=DisableWebPnPDownload
      task_04_rc: "{{ 0 if (_step04_output.exists | default(false) | bool) else 1 }}"
      data_04: "{{ (_step04_output.value | default('NOT_CONFIGURED')) if (_step04_output.exists | default(false)) else 'NOT_CONFIGURED' }}"
      status_04: >-
        {{ 'SKIP' if not (is_dc | bool) else
           'ERROR' if ('exists' not in (_step04_output | default({}))) else
           'PASS' if ((_step04_output.exists | default(false) | bool) and ((_step04_output.value | default(-1) | int) == (expected_value | int))) else
           'FAIL' }}
      details_04: >-
        {{ 'Domain Controller verify skipped' if not (is_dc | bool) else
           'Compliant: registry value exists and equals ' ~ expected_value if ((_step04_output.exists | default(false) | bool) and ((_step04_output.value | default(-1) | int) == (expected_value | int))) else
           'Non-compliant: registry value missing or not equal to ' ~ expected_value if ('exists' in (_step04_output | default({}))) else
           'Verify registry read returned no structured data' }}
    tags: [execute]

  - name: "Req step-05 - Verify Member Server GP registry key"
    ansible.windows.win_reg_stat:
      path: "{{ reg_path }}"
      name: "{{ reg_name }}"
    when: is_member | bool
    changed_when: false
    failed_when: false
    register: _step05_output
    tags: [execute]

  - name: "Req step-05 - Record Member Server verify results"
    ansible.builtin.set_fact:
      task_05_name: "Verify Member Server GP registry key"
      task_05_cmd: |-
        win_reg_stat path=HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Printers name=DisableWebPnPDownload
      task_05_rc: "{{ 0 if (_step05_output.exists | default(false) | bool) else 1 }}"
      data_05: "{{ (_step05_output.value | default('NOT_CONFIGURED')) if (_step05_output.exists | default(false)) else 'NOT_CONFIGURED' }}"
      status_05: >-
        {{ 'SKIP' if not (is_member | bool) else
           'ERROR' if ('exists' not in (_step05_output | default({}))) else
           'PASS' if ((_step05_output.exists | default(false) | bool) and ((_step05_output.value | default(-1) | int) == (expected_value | int))) else
           'FAIL' }}
      details_05: >-
        {{ 'Member Server verify skipped' if not (is_member | bool) else
           'Compliant: registry value exists and equals ' ~ expected_value if ((_step05_output.exists | default(false) | bool) and ((_step05_output.value | default(-1) | int) == (expected_value | int))) else
           'Non-compliant: registry value missing or not equal to ' ~ expected_value if ('exists' in (_step05_output | default({}))) else
           'Verify registry read returned no structured data' }}
    tags: [execute]

  - name: "Req step-06 - Set cis_result from active branch status"
    ansible.builtin.set_fact:
      cis_result: >-
        {{ 'ERROR' if (role_detection_error | default(true) | bool) else
           'ERROR' if (is_dc | bool and ('ERROR' in [status_02, status_04])) else
           'FAIL' if (is_dc | bool and ('FAIL' in [status_02, status_04])) else
           'PASS' if (is_dc | bool and status_04 == 'PASS') else
           'ERROR' if (is_member | bool and ('ERROR' in [status_03, status_05])) else
           'FAIL' if (is_member | bool and ('FAIL' in [status_03, status_05])) else
           'PASS' if (is_member | bool and status_05 == 'PASS') else
           'ERROR' if not (is_dc | bool) and not (is_member | bool) else
           'SKIP' }}
    tags: [execute]

  - name: "Req step-06 - Record aggregation details"
    ansible.builtin.set_fact:
      task_06_name: "Set cis_result from active branch status"
      task_06_cmd: "set_fact cis_result"
      task_06_rc: "0"
      data_06: "{{ cis_result | default('ERROR') | trim }}"
      status_06: "{{ cis_result | default('ERROR') | trim }}"
      details_06: "Aggregated remediation status"
    tags: [execute]

  - name: "Req step-07 - Prepare report details"
    ansible.builtin.set_fact:
      task_07_name: "Generate remediation report"
      task_07_cmd: "debug msg"
      task_07_rc: "0"
      data_07: "Report generated"
      status_07: "{{ cis_result | default('ERROR') | trim }}"
      details_07: "Remediation report generated from cis_result"
    tags: [execute]

  - name: "Req step-07 - Generate remediation report"
    ansible.builtin.debug:
      msg:
      - "REMEDIATION REPORT — CIS 18.9.20.1.1"
      - "Reference: CIS Benchmark checkpoint 18.9.20.1.1"
      - ""
      - "REQUIREMENT 01 - {{ req_01 }}:"
      - "  Task: {{ task_01_name | default('Not recorded') }}"
      - "  Command: {{ task_01_cmd | default('N/A') }}"
      - "  Exit code: {{ task_01_rc | default(-1) }}"
      - "  Data: {{ data_01 | default('') | trim }}"
      - "  Status: {{ status_01 | default('ERROR') | trim }}"
      - "  Details: {{ details_01 | default('') | trim }}"
      - ""
      - "REQUIREMENT 02 - {{ req_02 }}:"
      - "  Task: {{ task_02_name | default('Not recorded') }}"
      - "  Command: {{ task_02_cmd | default('N/A') }}"
      - "  Exit code: {{ task_02_rc | default(-1) }}"
      - "  Data: {{ data_02 | default('') | trim }}"
      - "  Status: {{ status_02 | default('ERROR') | trim }}"
      - "  Details: {{ details_02 | default('') | trim }}"
      - ""
      - "REQUIREMENT 03 - {{ req_03 }}:"
      - "  Task: {{ task_03_name | default('Not recorded') }}"
      - "  Command: {{ task_03_cmd | default('N/A') }}"
      - "  Exit code: {{ task_03_rc | default(-1) }}"
      - "  Data: {{ data_03 | default('') | trim }}"
      - "  Status: {{ status_03 | default('ERROR') | trim }}"
      - "  Details: {{ details_03 | default('') | trim }}"
      - ""
      - "REQUIREMENT 04 - {{ req_04 }}:"
      - "  Task: {{ task_04_name | default('Not recorded') }}"
      - "  Command: {{ task_04_cmd | default('N/A') }}"
      - "  Exit code: {{ task_04_rc | default(-1) }}"
      - "  Data: {{ data_04 | default('') | trim }}"
      - "  Status: {{ status_04 | default('ERROR') | trim }}"
      - "  Details: {{ details_04 | default('') | trim }}"
      - ""
      - "REQUIREMENT 05 - {{ req_05 }}:"
      - "  Task: {{ task_05_name | default('Not recorded') }}"
      - "  Command: {{ task_05_cmd | default('N/A') }}"
      - "  Exit code: {{ task_05_rc | default(-1) }}"
      - "  Data: {{ data_05 | default('') | trim }}"
      - "  Status: {{ status_05 | default('ERROR') | trim }}"
      - "  Details: {{ details_05 | default('') | trim }}"
      - ""
      - "REQUIREMENT 06 - {{ req_06 }}:"
      - "  Task: {{ task_06_name | default('Not recorded') }}"
      - "  Command: {{ task_06_cmd | default('N/A') }}"
      - "  Exit code: {{ task_06_rc | default(-1) }}"
      - "  Data: {{ data_06 | default('') | trim }}"
      - "  Status: {{ status_06 | default('ERROR') | trim }}"
      - "  Details: {{ details_06 | default('') | trim }}"
      - ""
      - "REQUIREMENT 07 - {{ req_07 }}:"
      - "  Task: {{ task_07_name | default('Not recorded') }}"
      - "  Command: {{ task_07_cmd | default('N/A') }}"
      - "  Exit code: {{ task_07_rc | default(-1) }}"
      - "  Data: {{ data_07 | default('') | trim }}"
      - "  Status: {{ status_07 | default('ERROR') | trim }}"
      - "  Details: {{ details_07 | default('') | trim }}"
      - ""
      - "OVERALL REMEDIATION:"
      - "  Result: {{ cis_result | default('ERROR') | trim }}"
    tags: [execute]

  always:
  - name: "Restore - Restore original DisableWebPnPDownload state"
    ansible.windows.win_shell: |
      $stateFile = "{{ backup_dir }}/{{ reg_name }}.state"
      if (-not (Test-Path -LiteralPath $stateFile)) {
        Write-Output 'No snapshot to restore'
        exit 0
      }
      $state = (Get-Content -LiteralPath $stateFile -Raw).Trim()
      $p = '{{ reg_path }}'
      $name = '{{ reg_name }}'
      if ($state -eq 'NO_KEY') {
        if (Test-Path -LiteralPath $p) {
          Remove-Item -LiteralPath $p -Recurse -Force
        }
      } elseif ($state -eq 'KEY_WITHOUT_PROPERTY') {
        if (-not (Test-Path -LiteralPath $p)) {
          New-Item -Path $p -Force | Out-Null
        }
        Remove-ItemProperty -Path $p -Name $name -Force -ErrorAction SilentlyContinue
      } else {
        if (-not (Test-Path -LiteralPath $p)) {
          New-Item -Path $p -Force | Out-Null
        }
        Set-ItemProperty -Path $p -Name $name -Value ([int]$state) -Type DWord
      }
    failed_when: false
    changed_when: false
    tags: [restore]

  - name: "Restore - Remove backup directory"
    ansible.windows.win_file:
      path: "{{ backup_dir }}"
      state: absent
    failed_when: false
    tags: [restore]
