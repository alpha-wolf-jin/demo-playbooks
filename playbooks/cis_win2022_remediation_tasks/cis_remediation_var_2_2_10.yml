playbook_name: "cis_2_2_10_remediation"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
req_01: "Check if the Remote Desktop Services role is installed. Use ansible.windows.win_shell to run a PowerShell command that checks the presence of the Remote Desktop Services role. If not installed, set a variable to skip the remediation."
req_02: "Set 'Allow log on through Remote Desktop Services' to 'Administrators, Remote Desktop Users'. Recommended module: ansible.windows.win_user_right with action: set and the appropriate users list (empty list [] for No One, or named accounts). Do NOT use secedit — it does not manage User Rights Assignment."
req_03: "Verify 'Allow log on through Remote Desktop Services' is correctly set to 'Administrators, Remote Desktop Users'. Use read-only PowerShell to query the value; changed_when: false."
req_04: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
