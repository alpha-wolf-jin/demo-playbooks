playbook_name: "cis_18_5_3_remediation"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
reg_path: |-
  HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
reg_name: "DisableIPSourceRouting"
reg_data: 2
req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: |-
  If Domain Controller: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters', name='DisableIPSourceRouting', data=2, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
req_03: |-
  If Member Server: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters', name='DisableIPSourceRouting', data=2, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
req_04: |-
  If Domain Controller: Verify the GP registry key: use PowerShell Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters' -Name DisableIPSourceRouting. PASS if value equals 2. FAIL if 0 or NOT_CONFIGURED. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
req_05: |-
  If Member Server: Verify the GP registry key: use PowerShell Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters' -Name DisableIPSourceRouting. PASS if value equals 2. FAIL if 0 or NOT_CONFIGURED. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
