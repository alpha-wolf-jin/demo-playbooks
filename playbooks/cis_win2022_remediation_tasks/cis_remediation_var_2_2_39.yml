playbook_name: "cis_2_2_39_remediation"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: "If Domain Controller: Set 'Modify an object label' to 'No One'. Recommended module: ansible.windows.win_user_right. Use name (the Se* privilege constant) and users (empty list [] for No One, or named accounts). action: set. Do NOT use secedit — secedit /areas SECURITYPOLICY does not manage User Rights Assignment."
req_03: "If Member Server: Set 'Modify an object label' to 'No One'. Recommended module: ansible.windows.win_user_right (identical to DC branch). Do NOT use secedit for user rights."
req_04: "If Domain Controller: Verify 'Modify an object label' is correctly set to 'No One'. Use read-only PowerShell to query the value; changed_when: false."
req_05: "If Member Server: Verify 'Modify an object label' is correctly set to 'No One'. Use read-only PowerShell to query the value; changed_when: false."
req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
