playbook_name: "cis_1_1_2_max_password_age"
# Use forward slashes to avoid YAML/JSON backslash escaping issues when
# the path is serialized to the Windows PowerShell wrapper.
backup_dir: "C:/Windows/Temp/ai-playbooks-backup/{{ playbook_name }}"
max_password_age_days: "365"
req_01: |
  Apply the Maximum password age policy setting to 365 or fewer days, but not 0, via Group Policy at Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Maximum password age. Expected result: Maximum password age is configured to a value between 1 and 365 days.
req_02: "Verify the Maximum password age setting is configured to 365 or fewer days, but not 0, by reviewing the effective password policy via Group Policy or running `net accounts` on a domain-joined machine. Expected result: Maximum password age shows a value of 365 or fewer days and is not 0 or Unlimited."
req_03: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
