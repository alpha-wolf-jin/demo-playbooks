playbook_name: "cis_9_1_1_remediation"
backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: "If Domain Controller: Apply 'Firewall state' to 'On (recommended)' via GPO or the most appropriate Windows module."
req_03: "If Member Server: Apply 'Firewall state' to 'On (recommended)' via the most appropriate Windows module. Prefer native modules over raw PowerShell."
req_04: "If Domain Controller: Verify 'Firewall state' is correctly set to 'On (recommended)'. Use read-only PowerShell to query the value; changed_when: false."
req_05: "If Member Server: Verify 'Firewall state' is correctly set to 'On (recommended)'. Use read-only PowerShell to query the value; changed_when: false."
req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_07: "Create a task named 'Generate remediation report' using debug msg with EXACTLY this format: REMEDIATION REPORT — CIS 9.1.1"
