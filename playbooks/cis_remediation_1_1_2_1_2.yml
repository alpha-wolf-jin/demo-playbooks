---
- name: "Remediate CIS checkpoint 1.1.2.1.2: Ensure nodev option set on /tmp partition"
  hosts: all
  become: yes
  gather_facts: false
  vars:
    fs_option: "nodev"
    partition: "/tmp"
    playbook_name: "cis-1.1.2.1.2-nodev-tmp"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    req_01: "Run two read-only checks and register boolean facts"
    req_04: "Add nodev to the /tmp mount options in /etc/fstab"
    req_05: "Run mount -o remount /tmp to activate the nodev option without rebooting"
    req_06: "Run findmnt -kn -o OPTIONS /tmp to read the live mount options"
    req_07: "Set cis_result based on _verify_output and raw_mount_options"
    req_08: "Store the final cis_result using set_fact. Ensure cis_result is one of PASS/FAIL/SKIP/ERROR. For separate partitions, cis_result and raw_mount_options were already set in step-07. This step finalises the result for the paths that converged through step-07."
    req_12: "Set cis_result=SKIP and raw_mount_options='' when /tmp is not a separate mount"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Check if /etc/fstab exists"
      ansible.builtin.stat:
        path: /etc/fstab
      register: _snap_fstab_stat
      tags: [snapshot]

    - name: "Snapshot - Backup /etc/fstab"
      ansible.builtin.copy:
        src: /etc/fstab
        dest: "{{ backup_dir }}/fstab.present"
        remote_src: true
      when: _snap_fstab_stat.stat.exists
      tags: [snapshot]

  tasks:
    - block:
        - name: "Initialize execution variables"
          ansible.builtin.set_fact:
            cis_result: "ERROR"
            raw_mount_options: ""
            _verify_output: {"rc": -1, "stdout": ""}
            _fstab_modify: {"rc": -1, "stdout": ""}
            _remount_output: {"rc": -1, "stdout": ""}
          tags: [execute]

        - name: "Req step-01 - Run audit for /tmp separate mount and nodev in fstab"
          ansible.builtin.shell: |
            set -o pipefail
            findmnt -kn {{ partition }}; grep -E '\s{{ partition }}\s' /etc/fstab | grep -c {{ fs_option }}
          args:
            executable: /bin/bash
          register: _audit_output
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req step-01 - Register partition_is_separate and option_in_fstab facts"
          ansible.builtin.set_fact:
            _partition_is_separate: "{{ (_audit_output.stdout_lines | default([]) | length) > 1 }}"
            _option_in_fstab: "{{ ((_audit_output.stdout_lines | default(['0']) | last) | trim | int) > 0 }}"
          tags: [execute]

        - name: "Req step-04 - Add nodev option to /tmp entry in /etc/fstab"
          ansible.builtin.shell: |
            sed -i -E '\#^[[:space:]]*[^[:space:]]+[[:space:]]+{{ partition }}[[:space:]]# s#^([[:space:]]*[^[:space:]]+[[:space:]]+{{ partition }}[[:space:]]+[^[:space:]]+[[:space:]]+)([^[:space:]]+)#\1\2,{{ fs_option }}#' /etc/fstab
          args:
            executable: /bin/bash
          register: _fstab_modify
          failed_when: false
          changed_when: false
          when:
            - _partition_is_separate | bool
            - not (_option_in_fstab | bool)
          tags: [execute]

        - name: "Req step-05 - Remount /tmp to activate nodev option"
          ansible.builtin.shell: mount -o remount {{ partition }}
          args:
            executable: /bin/bash
          register: _remount_output
          failed_when: false
          changed_when: false
          when: _partition_is_separate | bool
          tags: [execute]

        - name: "Req step-06 - Read live mount options of /tmp"
          ansible.builtin.shell: findmnt -kn -o OPTIONS {{ partition }}
          args:
            executable: /bin/bash
          register: _verify_output
          failed_when: false
          changed_when: false
          when: _partition_is_separate | bool
          tags: [execute]

        - name: "Req step-07 - Set cis_result based on live mount options"
          ansible.builtin.set_fact:
            cis_result: "{{ 'PASS' if (fs_option in (_verify_output.stdout | default(''))) else 'FAIL' }}"
            raw_mount_options: "{{ _verify_output.stdout | default('') | trim }}"
          when: _partition_is_separate | bool
          tags: [execute]

        - name: "Req step-08 - Finalise compliance status for separate partitions"
          ansible.builtin.set_fact:
            cis_result: "{{ cis_result if (cis_result | default('ERROR')) in ['PASS', 'FAIL', 'SKIP', 'ERROR'] else 'ERROR' }}"
            raw_mount_options: "{{ raw_mount_options | default('') }}"
          when: _partition_is_separate | bool
          tags: [execute]

        - name: "Req step-12 - Set cis_result to SKIP when /tmp is not a separate mount"
          ansible.builtin.set_fact:
            cis_result: "SKIP"
            raw_mount_options: ""
          when: not (_partition_is_separate | bool)
          tags: [execute]

        - name: "Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 1.1.2.1.2"
              - "Reference: CIS Benchmark checkpoint 1.1.2.1.2"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: Run audit for /tmp separate mount and nodev in fstab"
              - "  Command: set -o pipefail; findmnt -kn /tmp; grep -E '\\s/tmp\\s' /etc/fstab | grep -c nodev"
              - "  Exit code: {{ _audit_output.rc | default(-1) }}"
              - "  Data: {{ _audit_output.stdout | default('') | trim }}"
              - "  Status: PASS"
              - "  Details: partition_is_separate={{ _partition_is_separate | default(false) }}, option_in_fstab={{ _option_in_fstab | default(false) }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: Add nodev option to /tmp entry in /etc/fstab"
              - "  Command: sed -i -E delimiter-safe /tmp fstab edit (\\#...# address, 4th-field backref append)"
              - "  Exit code: {{ _fstab_modify.rc | default(-1) }}"
              - "  Data: fstab_modified={{ (_partition_is_separate | bool) and (not (_option_in_fstab | bool)) }}"
              - "  Status: {{ 'SKIP' if (not (_partition_is_separate | bool)) or (_option_in_fstab | bool) else ('PASS' if (_fstab_modify.rc | default(-1)) == 0 else 'FAIL') }}"
              - "  Details: nodev option appended to /tmp fstab entry when /tmp is a separate mount and option was missing"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: Remount /tmp to activate nodev option"
              - "  Command: mount -o remount /tmp"
              - "  Exit code: {{ _remount_output.rc | default(-1) }}"
              - "  Data: remounted={{ _partition_is_separate | default(false) }}"
              - "  Status: {{ 'SKIP' if not (_partition_is_separate | bool) else ('PASS' if (_remount_output.rc | default(-1)) == 0 else 'FAIL') }}"
              - "  Details: Live /tmp remount triggered to activate nodev from fstab"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: Read live mount options of /tmp"
              - "  Command: findmnt -kn -o OPTIONS /tmp"
              - "  Exit code: {{ _verify_output.rc | default(-1) }}"
              - "  Data: {{ _verify_output.stdout | default('') | trim }}"
              - "  Status: {{ 'SKIP' if not (_partition_is_separate | bool) else 'PASS' }}"
              - "  Details: Live mount options of /tmp captured for verification"
              - ""
              - "REQUIREMENT 07 - {{ req_07 }}:"
              - "  Task: Set cis_result based on live mount options"
              - "  Command: n/a (set_fact)"
              - "  Exit code: {{ _verify_output.rc | default(-1) }}"
              - "  Data: raw_mount_options={{ raw_mount_options | default('') }}"
              - "  Status: {{ 'SKIP' if not (_partition_is_separate | bool) else 'PASS' }}"
              - "  Details: cis_result={{ cis_result | default('ERROR') }} computed from live mount options"
              - ""
              - "REQUIREMENT 08 - {{ req_08 }}:"
              - "  Task: Finalise compliance status for separate partitions"
              - "  Command: n/a (set_fact)"
              - "  Exit code: 0"
              - "  Data: cis_result={{ cis_result | default('ERROR') }}, raw_mount_options={{ raw_mount_options | default('') }}"
              - "  Status: {{ 'SKIP' if not (_partition_is_separate | bool) else 'PASS' }}"
              - "  Details: cis_result finalised to one of PASS/FAIL/SKIP/ERROR for the separate-partition path"
              - ""
              - "REQUIREMENT 12 - {{ req_12 }}:"
              - "  Task: Set cis_result to SKIP when /tmp is not a separate mount"
              - "  Command: n/a (set_fact)"
              - "  Exit code: 0"
              - "  Data: partition_is_separate={{ _partition_is_separate | default(false) }}"
              - "  Status: {{ 'SKIP' if (_partition_is_separate | bool) else 'PASS' }}"
              - "  Details: cis_result set to SKIP if /tmp is not a separate mount"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') }}"
              - "  Raw mount options: {{ raw_mount_options | default('') }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Check if backup exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/fstab.present"
          register: _restore_stat
          failed_when: false
          tags: [restore]

        - name: "Restore - Overwrite /etc/fstab with original"
          ansible.builtin.copy:
            src: "{{ backup_dir }}/fstab.present"
            dest: /etc/fstab
            remote_src: true
          when: _restore_stat.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Remount /tmp to reflect restored fstab"
          ansible.builtin.shell: mount -o remount {{ partition }}
          args:
            executable: /bin/bash
          when: _restore_stat.stat.exists | default(false)
          failed_when: false
          changed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]