---
- name: "SOP playbook 'filesystem_kernel_modules_audit' (DATA COLLECTOR — read-only): Run the provided filesystem kernel modules audit script on a target Linux server and determine pass/fail based on whether any non-disabled or loaded modules are found."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  become_user: root
  gather_facts: false
  vars:
    target_server: ""
    fs_type_blacklist: "afs,ceph,cifs,exfat,ext,fat,fscache,fuse,gfs2,nfs_common,nfsd,smbfs_common"
    fs_type_whitelist: "xfs,vfat,ext2,ext3,ext4"
    script_dest: "/tmp/fs_audit.sh"

  pre_tasks:
    - name: "Snapshot - Ensure backup directory exists"
      ansible.builtin.file:
        path: "/var/log/ai-playbooks-backup/filesystem_kernel_modules_audit"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Check if audit script already exists"
      ansible.builtin.stat:
        path: "{{ script_dest }}"
      register: _script_stat
      tags: [snapshot]

    - name: "Snapshot - Record existence marker"
      ansible.builtin.copy:
        content: "{{ _script_stat.stat.exists | ternary('true', 'false') }}"
        dest: "/var/log/ai-playbooks-backup/filesystem_kernel_modules_audit/script_existed_before"
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req 01 - Validate required variable target_server"
          ansible.builtin.assert:
            that:
              - target_server != ''
            fail_msg: "target_server must be provided and must not be empty"

        - name: "Req 02 - Set script static body"
          ansible.builtin.set_fact:
            _script_body: !unsafe |
              f_module_chk()
              {
                 l_out2=""; grep -Pq -- "\b$l_mod_name\b" <<< "${a_cve_exists[*]}" && l_out2=" <- CVE exists!"
                 if ! grep -Pq -- '\bblacklist\h+'"$l_mod_name"'\b' <<< "${a_modprope_config[*]}"; then
                    a_output2+=("  - Kernel module: \"$l_mod_name\" is not fully disabled $l_out2")
                 elif ! grep -Pq -- '\binstall\h+'"$l_mod_name"'\h+\/bin\/(false|true)\b' <<< "${a_modprope_config[*]}"; then
                    a_output2+=("  - Kernel module: \"$l_mod_name\" is not fully disabled $l_out2")
                 fi
                 if lsmod | grep "$l_mod_name" &> /dev/null; then
                    l_output2+=("  - Kernel module: \"$l_mod_name\" is loaded" "")
                 fi
              }
              while IFS= read -r -d $'\0' l_module_dir; do
                 a_available_modules+=("$(basename "$l_module_dir")")
              done < <(find "$(readlink -f /lib/modules/"$(uname -r)"/kernel/fs)" -mindepth 1 -maxdepth 1 -type d ! -empty -print0)
              while IFS= read -r l_exclude; do
                 if grep -Pq -- "\b$l_exclude\b" <<< "${a_cve_exists[*]}"; then
                    a_output2+=("  - ** WARNING: kernel module: \"$l_exclude\" has a CVE and is currently mounted! **")
                 elif grep -Pq -- "\b$l_exclude\b" <<< "${a_available_modules[*]}"; then
                    a_output+=("  - Kernel module: \"$l_exclude\" is currently mounted - do NOT unload or disable")
                 fi
                 ! grep -Pq -- "\b$l_exclude\b" <<< "${a_ignore[*]}" && a_ignore+=("$l_exclude")
              done < <(findmnt -knD | awk '{print $2}' | sort -u)
              while IFS= read -r l_config; do
                 a_modprope_config+=("$l_config")
              done < <(modprobe --showconfig | grep -P '^\h*(blacklist|install)')
              for l_mod_name in "${a_available_modules[@]}"; do
                 [[ "$l_mod_name" =~ overlay ]] && l_mod_name="${l_mod_name::-2}"
                 if grep -Pq -- "\b$l_mod_name\b" <<< "${a_ignore[*]}"; then
                    a_excluded+=(" - Kernel module: \"$l_mod_name\"")
                 else
                    f_module_chk
                 fi
              done
              [ "${#a_excluded[@]}" -gt 0 ] && printf '%s\n' "" " -- INFO --" "The following intentionally skipped" "${a_excluded[@]}"
              if [ "${#a_output2[@]}" -le 0 ]; then
                 printf '%s\n' "" "  - No unused filesystem kernel modules are enabled" "${a_output[@]}" ""
              else
                 printf '%s\n' "" "-- Audit Result: --" "  ** REVIEW the following **" "${a_output2[@]}"
                 [ "${#a_output[@]}" -gt 0 ] && printf '%s\n' "" "-- Correctly set: --" "${a_output[@]}" ""
              fi
          tags: [execute]

        - name: "Req 02 - Assemble script content"
          ansible.builtin.set_fact:
            _script_path: "{{ script_dest }}"
            _script_content: |
              a_output=(); a_output2=(); a_modprope_config=(); a_excluded=(); a_available_modules=()
              a_ignore=( {{ fs_type_whitelist | split(',') | map('trim') | reject('equalto', '') | join(' ') }} )
              a_cve_exists=( {{ fs_type_blacklist | split(',') | map('trim') | reject('equalto', '') | join(' ') }} )
              {{ _script_body }}
          tags: [execute]

        - name: "Req 03 - Copy audit script to target"
          ansible.builtin.copy:
            dest: "{{ script_dest }}"
            content: "{{ _script_content }}"
            mode: '0700'
          changed_when: false
          tags: [execute]

        - name: "Req 04 - Execute audit script"
          ansible.builtin.shell:
            cmd: /bin/bash "{{ script_dest }}"
          args:
            executable: /bin/bash
          register: _script_result
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req 05 - Check for review indicator"
          ansible.builtin.set_fact:
            _audit_issues: true
          when: '"** REVIEW the following **" in _script_result.stdout'
          tags: [execute]

        - name: "Req 06 - Set audit result to fail"
          ansible.builtin.set_fact:
            _audit_result: "fail"
          when: _audit_issues | default(false) | bool
          tags: [execute]

        - name: "Req 07 - Set audit result to pass"
          ansible.builtin.set_fact:
            _audit_result: "pass"
          when: not _audit_issues | default(true) | bool
          tags: [execute]

        - name: "Req 08 - Emit audit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              audit_result: {{ _audit_result }}
              </result>
          tags: [execute]

      rescue:
        - name: "Capture error details"
          ansible.builtin.set_fact:
            _error_host: "{{ inventory_hostname }}"
            _error_reason: "{{ ansible_failed_task.name | default('Unknown task') }} - {{ ansible_failed_result.msg | default('No message') }} {{ ansible_failed_result.stderr | default('') }}"
          failed_when: false

        - name: "Emit error result block"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: {{ _error_host }} - Filesystem kernel modules audit failed: {{ _error_reason }}
              </result>

        - name: "Abort"
          ansible.builtin.fail:
            msg: "Filesystem kernel modules audit failed"

      always:
        - name: "Restore - Read existence marker"
          ansible.builtin.slurp:
            src: "/var/log/ai-playbooks-backup/filesystem_kernel_modules_audit/script_existed_before"
          register: _marker
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove audit script if it was created"
          ansible.builtin.file:
            path: "{{ script_dest }}"
            state: absent
          when:
            - _marker.content is defined
            - (_marker.content | b64decode | trim) == 'false'
          tags: [restore]

        - name: "Restore - Clean up existence marker"
          ansible.builtin.file:
            path: "/var/log/ai-playbooks-backup/filesystem_kernel_modules_audit/script_existed_before"
            state: absent
          failed_when: false
          tags: [restore]