---
- name: Initialize meta data variables
  include_vars: cis_remediation_var_1_1_2_1_2.yml

- name: "Snapshot - Remove stale backup directory"
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: absent
  tags: [snapshot]
- name: "Snapshot - Create backup directory"
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: '0700'
  tags: [snapshot]
- name: "Snapshot - Check if /tmp was mounted before remediation"
  ansible.builtin.command: findmnt -kn -o OPTIONS {{ partition }}
  register: _snapshot_mount_raw
  changed_when: false
  failed_when: false
  tags: [snapshot]
- name: "Snapshot - Save original /tmp mount options"
  ansible.builtin.copy:
    content: "{{ _snapshot_mount_raw.stdout | default('') | trim }}"
    dest: "{{ backup_dir }}/tmp_mount.state"
  when: (_snapshot_mount_raw.stdout | default('') | trim) != ''
  tags: [snapshot]
- name: "Snapshot - Mark /tmp not mounted before remediation"
  ansible.builtin.copy:
    content: "absent"
    dest: "{{ backup_dir }}/tmp_mount.absent"
  when:
  - (_snapshot_mount_raw.stdout | default('') | trim) == ''
  - (_snapshot_mount_raw.rc | default(-1)) == 1
  tags: [snapshot]
- name: "Snapshot - Check if /etc/fstab exists"
  ansible.builtin.stat:
    path: /etc/fstab
  register: _fstab_stat
  tags: [snapshot]
- name: "Snapshot - Backup /etc/fstab if exists"
  ansible.builtin.copy:
    src: /etc/fstab
    dest: "{{ backup_dir }}/fstab.present"
    remote_src: true
  when: _fstab_stat.stat.exists | default(false)
  tags: [snapshot]

- block:
  - name: "Req step-01 - PRECHECK: Read partition mount state and fstab config"
    ansible.builtin.shell: |
      set -o pipefail
      findmnt -kn {{ partition }}; grep -E '\s{{ partition }}\s' /etc/fstab | grep -c {{ fs_option }}
    args:
      executable: /bin/bash
    register: _precheck_shell
    changed_when: false
    failed_when: false
    tags: [execute]

  - name: "Req step-02 - Check if /tmp is a separate mount"
    ansible.builtin.command: findmnt -kn {{ partition }}
    register: _findmnt_raw
    changed_when: false
    failed_when: false
    tags: [execute]

  - name: "Req step-02 - Set partition separate flag"
    ansible.builtin.set_fact:
      _partition_is_separate: "{{ (_findmnt_raw.stdout | default('') | trim) != '' }}"
    tags: [execute]

  - name: "Ensure backup directory exists for rollback marker"
    ansible.builtin.file:
      path: "{{ backup_dir }}"
      state: directory
      mode: '0700'
    when: _partition_is_separate | bool
    failed_when: false
    tags: [execute]

  - name: "Create rollback marker before fstab modification"
    ansible.builtin.copy:
      content: "restore"
      dest: "{{ backup_dir }}/restore.flag"
    when: _partition_is_separate | bool
    failed_when: false
    tags: [execute]

  - name: "Req step-03 - Check if nodev option is present in /etc/fstab for /tmp"
    ansible.builtin.shell: |
      set -o pipefail
      grep -E '\s{{ partition }}\s' /etc/fstab | grep -c {{ fs_option }}
    args:
      executable: /bin/bash
    register: _fstab_raw
    changed_when: false
    failed_when: false
    when: _partition_is_separate | bool
    tags: [execute]

  - name: "Req step-03 - Set fstab option flag"
    ansible.builtin.set_fact:
      _option_in_fstab: "{{ (_fstab_raw.stdout | default('0') | trim | int) > 0 }}"
    when: _partition_is_separate | bool
    tags: [execute]

  - name: "Req step-04 - Add nodev option to /tmp mount entry in /etc/fstab"
    ansible.builtin.shell: |
      sed -i '/\s{{ partition }}\s/ s/\(\s\S\+\)\(\s\S\+\)\(\s\S\+\)\(\s\S\+\)/\1 \2 \3 \4,{{ fs_option }}/' /etc/fstab
    args:
      executable: /bin/bash
    register: _fstab_sed
    failed_when: false
    when:
    - _partition_is_separate | bool
    - not (_option_in_fstab | default(false) | bool)
    tags: [execute]

  - name: "Req step-05 - Remount /tmp partition to activate mount options"
    ansible.builtin.shell: mount -o remount {{ partition }}
    args:
      executable: /bin/bash
    register: _remount_result
    failed_when: false
    when: _partition_is_separate | bool
    tags: [execute]

  - name: "Req step-06 - Verify live mount options for /tmp"
    ansible.builtin.command: findmnt -kn -o OPTIONS {{ partition }}
    register: _verify_output
    changed_when: false
    failed_when: false
    when: _partition_is_separate | bool
    tags: [execute]

  - name: "Req step-07 - Set cis_result based on live mount options"
    ansible.builtin.set_fact:
      cis_result: "{{ 'PASS' if (fs_option in (_verify_output.stdout | default(''))) else 'FAIL' }}"
      raw_mount_options: "{{ _verify_output.stdout | default('') }}"
    when: _partition_is_separate | bool
    tags: [execute]

  - name: "Req step-12 - Set cis_result SKIP when /tmp is not a separate mount"
    ansible.builtin.set_fact:
      cis_result: "SKIP"
      raw_mount_options: ""
    when: not (_partition_is_separate | bool)
    tags: [execute]

  - name: "Remove rollback marker after successful verification"
    ansible.builtin.file:
      path: "{{ backup_dir }}/restore.flag"
      state: absent
    when:
    - _partition_is_separate | bool
    - cis_result | default('FAIL') == 'PASS'
    failed_when: false
    tags: [execute]

  - name: "Store requirement 05 details"
    ansible.builtin.set_fact:
      task_05_name: "{{ 'Req step-07 - Set cis_result from verification' if (_partition_is_separate | bool) else 'Req step-12 - Set cis_result SKIP' }}"
      task_05_cmd: "ansible.builtin.set_fact cis_result={{ cis_result | default('ERROR') }} raw_mount_options={{ raw_mount_options | default('') }}"
      task_05_rc: 0
      data_05: "{{ cis_result | default('ERROR') }}"
      status_05: "{{ 'PASS' if (cis_result | default('ERROR') in ['PASS', 'FAIL', 'SKIP', 'ERROR']) else 'ERROR' }}"
      details_05: "Final cis_result is {{ cis_result | default('ERROR') }}"
    tags: [execute]

  - name: "Store requirement 06 details"
    ansible.builtin.set_fact:
      task_06_name: "Generate remediation report"
      task_06_cmd: "ansible.builtin.debug"
      task_06_rc: 0
      data_06: "Remediation report emitted below"
      status_06: "{{ 'PASS' if (cis_result | default('ERROR') in ['PASS', 'FAIL', 'SKIP', 'ERROR']) else 'ERROR' }}"
      details_06: "Report generated with final cis_result"
    tags: [execute]

  - name: "Req step-08 - Generate remediation report"
    ansible.builtin.debug:
      msg:
      - "REMEDIATION REPORT — CIS 1.1.2.1.2"
      - "Reference: CIS Benchmark checkpoint 1.1.2.1.2"
      - ""
      - "REQUIREMENT 05 - {{ req_05 }}:"
      - "  Task: {{ task_05_name }}"
      - "  Command: {{ task_05_cmd }}"
      - "  Exit code: {{ task_05_rc }}"
      - "  Data: {{ data_05 }}"
      - "  Status: {{ status_05 }}"
      - "  Details: {{ details_05 }}"
      - ""
      - "REQUIREMENT 06 - {{ req_06 }}:"
      - "  Task: {{ task_06_name }}"
      - "  Command: {{ task_06_cmd }}"
      - "  Exit code: {{ task_06_rc }}"
      - "  Data: {{ data_06 }}"
      - "  Status: {{ status_06 }}"
      - "  Details: {{ details_06 }}"
      - ""
      - "OVERALL REMEDIATION:"
      - "  Result: {{ cis_result | default('ERROR') }}"
    tags: [execute]

  always:
  - name: "Restore - Check if rollback is needed"
    ansible.builtin.stat:
      path: "{{ backup_dir }}/restore.flag"
    register: _restore_needed
    failed_when: false
    tags: [restore]

  - name: "Restore - Set remediation failure flag"
    ansible.builtin.set_fact:
      _remediation_failed: "{{ _restore_needed.stat.exists | default(false) }}"
    tags: [restore]

  - name: "Restore - Check if fstab backup exists"
    ansible.builtin.stat:
      path: "{{ backup_dir }}/fstab.present"
    register: _restore_backup
    failed_when: false
    tags: [restore]

  - name: "Restore - Overwrite /etc/fstab with original"
    ansible.builtin.copy:
      src: "{{ backup_dir }}/fstab.present"
      dest: /etc/fstab
      remote_src: true
    register: _restore_fstab_copy
    when:
    - _remediation_failed | bool
    - _restore_backup.stat.exists | default(false)
    failed_when: false
    tags: [restore]

  - name: "Restore - Check if original /tmp mount options were saved"
    ansible.builtin.stat:
      path: "{{ backup_dir }}/tmp_mount.state"
    register: _restore_tmp_mount_state
    failed_when: false
    tags: [restore]

  - name: "Restore - Read saved /tmp mount options"
    ansible.builtin.slurp:
      src: "{{ backup_dir }}/tmp_mount.state"
    register: _restore_tmp_mount_raw
    when: _restore_tmp_mount_state.stat.exists | default(false)
    failed_when: false
    tags: [restore]

  - name: "Restore - Restore original mount state for /tmp partition"
    ansible.builtin.shell: "mount -o remount,{{ _restore_tmp_mount_raw.content | b64decode | trim }} {{ partition }}"
    args:
      executable: /bin/bash
    when: >-
      (_remediation_failed | bool) and
      _restore_tmp_mount_raw is defined and
      _restore_tmp_mount_raw.content is defined and
      (_restore_tmp_mount_raw.content | b64decode | trim) != '' and
      (_restore_fstab_copy is not defined or _restore_fstab_copy is not failed)
    failed_when: false
    tags: [restore]

  - name: "Restore - Check if /tmp was not mounted before remediation"
    ansible.builtin.stat:
      path: "{{ backup_dir }}/tmp_mount.absent"
    register: _restore_tmp_mount_absent
    failed_when: false
    tags: [restore]

  - name: "Restore - Unmount /tmp if it was not mounted before remediation"
    ansible.builtin.command: umount {{ partition }}
    when:
    - _remediation_failed | bool
    - _restore_tmp_mount_absent.stat.exists | default(false)
    failed_when: false
    tags: [restore]

  - name: "Restore - Remove backup directory"
    ansible.builtin.file:
      path: "{{ backup_dir }}"
      state: absent
    when: >-
      (not (_remediation_failed | bool)) or
      (_restore_fstab_copy is not defined or _restore_fstab_copy is not failed)
    failed_when: false
    tags: [restore]
