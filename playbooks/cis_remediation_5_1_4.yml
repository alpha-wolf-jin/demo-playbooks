---
- name: "Remediate CIS checkpoint 5.1.4: Ensure sshd Ciphers are configured"
  hosts: all
  become: yes
  gather_facts: false
  vars:
    playbook_name: "cis_5_1_4_remediation"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"

    req_01: "Apply prerequisite check for system-wide crypto policy package using command: `rpm -q crypto-policies-scripts`. Expected result: package is installed and version is displayed."
    req_02: |
      Apply creation of a crypto policy module to disable weak SSH ciphers using command: `printf '%s\\n' \"# This is a subpolicy to disable weak ciphers\" \"# for the SSH protocol (libssh and OpenSSH)\" \"cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305\" >> /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod`. Expected result: file /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod is created with the specified content.
    req_03: "Apply update of system-wide cryptographic policy using command: `update-crypto-policies --set DEFAULT:NO-SHA1:NO-WEAKMAC:NO-SSHCBC:NO-SSHCHACHA20:NO-SSHWEAKCIPHERS`. Expected result: command completes successfully and system crypto policy is updated."
    req_04: "Apply reload of OpenSSH server to make cryptographic settings effective using command: `systemctl reload-or-restart sshd`. Expected result: sshd service reloads or restarts without errors."
    req_05: "Verify that the sshd Ciphers configuration is compliant using command: `sshd -T | grep -i ciphers`. Expected result: output shows only allowed ciphers (aes256-gcm@openssh.com, aes128-gcm@openssh.com, aes256-ctr, aes192-ctr, aes128-ctr) and does not include weak ciphers like 3des-cbc, aes128-cbc, aes192-cbc, aes256-cbc, or chacha20-poly1305."
    req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_07: "Generate remediation report with EXACT format: REMEDIATION REPORT — CIS 5.1.4, then for each requirement: REQUIREMENT NN - ..., with fields Task, Command, Exit code, Data, Status (PASS/FAIL/SKIP/ERROR), Details, ending with OVERALL REMEDIATION section containing Result: cis_result."

    subpolicy_file: "/etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod"
    subpolicy_content_line: "cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Check if NO-SSHWEAKCIPHERS.pmod exists"
      ansible.builtin.stat:
        path: "{{ subpolicy_file }}"
      register: _subpolicy_snap_stat
      tags: [snapshot]

    - name: "Snapshot - Backup NO-SSHWEAKCIPHERS.pmod if exists"
      ansible.builtin.copy:
        src: "{{ subpolicy_file }}"
        dest: "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.bak"
        remote_src: true
      when: _subpolicy_snap_stat.stat.exists
      tags: [snapshot]

    - name: "Snapshot - Mark NO-SSHWEAKCIPHERS.pmod as absent if not exists"
      ansible.builtin.file:
        path: "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.absent"
        state: touch
        mode: '0600'
      when: not _subpolicy_snap_stat.stat.exists
      tags: [snapshot]

    - name: "Snapshot - Capture current crypto policy"
      ansible.builtin.shell: update-crypto-policies --show
      args:
        executable: /bin/bash
      register: _snap_crypto_policy
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save current crypto policy to state file"
      ansible.builtin.copy:
        content: "{{ _snap_crypto_policy.stdout | default('') }}"
        dest: "{{ backup_dir }}/crypto_policy_original.state"
        mode: '0600'
      when: _snap_crypto_policy.stdout | default('') | length > 0
      tags: [snapshot]

  tasks:
    - block:
        - name: "Gather package facts"
          ansible.builtin.package_facts:
            manager: auto
          tags: [execute]

        - name: "Check if required packages are installed"
          ansible.builtin.set_fact:
            _crypto_policy_installed: "{{ 'crypto-policies-scripts' in ansible_facts.packages }}"
            _sshd_installed: "{{ 'openssh-server' in ansible_facts.packages }}"
          tags: [execute]

        # ──────────────────────────────────────────────
        # Requirement 01: Prerequisite check
        # ──────────────────────────────────────────────
        - name: "Req step-01 - Check crypto-policies-scripts version"
          ansible.builtin.shell: rpm -q crypto-policies-scripts
          args:
            executable: /bin/bash
          register: _step01_output
          failed_when: false
          when: _crypto_policy_installed | bool
          tags: [execute]

        - name: "Store requirement 01 details"
          ansible.builtin.set_fact:
            task_01_name: "Check crypto-policies-scripts version"
            task_01_cmd: "rpm -q crypto-policies-scripts"
            task_01_rc: "{{ _step01_output.rc | default(-1) }}"
            data_01: "{{ _step01_output.stdout | default('') | trim }}"
            status_01: >-
              {%- if _step01_output.skipped | default(false) -%} SKIP
              {%- elif _step01_output.rc | default(-1) == 0 -%} PASS
              {%- else -%} FAIL
              {%- endif -%}
            details_01: >-
              {%- if _step01_output.skipped | default(false) -%} crypto-policies-scripts not installed
              {%- elif _step01_output.rc | default(-1) == 0 -%} Package version obtained successfully
              {%- else -%} Command failed with exit code {{ _step01_output.rc }}
              {%- endif -%}
          tags: [execute]

        # ──────────────────────────────────────────────
        # Requirement 02: Create crypto policy module
        # ──────────────────────────────────────────────
        - name: "Req step-02 - Create NO-SSHWEAKCIPHERS policy module"
          ansible.builtin.shell: |
            if grep -qF 'cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305' '{{ subpolicy_file }}' 2>/dev/null; then
              echo "ALREADY_PRESENT"
            else
              printf '%s\n' "# This is a subpolicy to disable weak ciphers" "# for the SSH protocol (libssh and OpenSSH)" "cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305" >> '{{ subpolicy_file }}'
              echo "ADDED"
            fi
          args:
            executable: /bin/bash
          register: _step02_output
          changed_when: _step02_output.stdout is search('ADDED')
          failed_when: false
          when: _crypto_policy_installed | bool
          tags: [execute]

        - name: "Store requirement 02 details"
          ansible.builtin.set_fact:
            task_02_name: "Create/update NO-SSHWEAKCIPHERS subpolicy"
            task_02_cmd: |
              printf '%s\\n' ... >> /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod (via grep‑idempotent shell)
            task_02_rc: "{{ _step02_output.rc | default(-1) }}"
            data_02: "{{ _step02_output.stdout | default('') | trim }}"
            status_02: >-
              {%- if _step02_output.skipped | default(false) -%} SKIP
              {%- elif _step02_output.rc | default(-1) == 0 -%} PASS
              {%- else -%} FAIL
              {%- endif -%}
            details_02: >-
              {%- if _step02_output.skipped | default(false) -%} crypto-policies-scripts not installed
              {%- elif _step02_output.rc | default(-1) == 0 -%}
                {%- if 'ALREADY_PRESENT' in _step02_output.stdout -%} Subpolicy was already present
                {%- else -%} Subpolicy created successfully
                {%- endif -%}
              {%- else -%} Command failed with exit code {{ _step02_output.rc }}
              {%- endif -%}
          tags: [execute]

        # ──────────────────────────────────────────────
        # Requirement 03: Update system-wide crypto policy
        # ──────────────────────────────────────────────
        - name: "Req step-03 - Update system-wide cryptographic policy"
          ansible.builtin.shell: update-crypto-policies --set DEFAULT:NO-SHA1:NO-WEAKMAC:NO-SSHCBC:NO-SSHCHACHA20:NO-SSHWEAKCIPHERS
          args:
            executable: /bin/bash
          register: _step03_output
          failed_when: false
          when: _crypto_policy_installed | bool
          tags: [execute]

        - name: "Store requirement 03 details"
          ansible.builtin.set_fact:
            task_03_name: "Update system-wide crypto policy"
            task_03_cmd: "update-crypto-policies --set DEFAULT:NO-SHA1:NO-WEAKMAC:NO-SSHCBC:NO-SSHCHACHA20:NO-SSHWEAKCIPHERS"
            task_03_rc: "{{ _step03_output.rc | default(-1) }}"
            data_03: "{{ _step03_output.stdout | default('') | trim }}"
            status_03: >-
              {%- if _step03_output.skipped | default(false) -%} SKIP
              {%- elif _step03_output.rc | default(-1) == 0 -%} PASS
              {%- else -%} FAIL
              {%- endif -%}
            details_03: >-
              {%- if _step03_output.skipped | default(false) -%} crypto-policies-scripts not installed
              {%- elif _step03_output.rc | default(-1) == 0 -%} Policy updated successfully
              {%- else -%} Command failed with exit code {{ _step03_output.rc }}
              {%- endif -%}
          tags: [execute]

        # ──────────────────────────────────────────────
        # Requirement 04: Reload sshd
        # ──────────────────────────────────────────────
        - name: "Req step-04 - Reload sshd to apply crypto settings"
          ansible.builtin.shell: systemctl reload-or-restart sshd
          args:
            executable: /bin/bash
          register: _step04_output
          failed_when: false
          when: _sshd_installed | bool
          tags: [execute]

        - name: "Store requirement 04 details"
          ansible.builtin.set_fact:
            task_04_name: "Reload sshd service"
            task_04_cmd: "systemctl reload-or-restart sshd"
            task_04_rc: "{{ _step04_output.rc | default(-1) }}"
            data_04: "{{ _step04_output.stdout | default('') | trim }}"
            status_04: >-
              {%- if _step04_output.skipped | default(false) -%} SKIP
              {%- elif _step04_output.rc | default(-1) == 0 -%} PASS
              {%- else -%} FAIL
              {%- endif -%}
            details_04: >-
              {%- if _step04_output.skipped | default(false) -%} openssh-server not installed
              {%- elif _step04_output.rc | default(-1) == 0 -%} sshd reloaded/restarted successfully
              {%- else -%} Command failed with exit code {{ _step04_output.rc }}
              {%- endif -%}
          tags: [execute]

        # ──────────────────────────────────────────────
        # Requirement 05: Verify sshd ciphers configuration
        # ──────────────────────────────────────────────
        - name: "Req step-05 - Verify sshd ciphers configuration"
          ansible.builtin.shell: set -o pipefail && sshd -T | grep -i ciphers
          args:
            executable: /bin/bash
          register: _step05_output
          failed_when: false
          changed_when: false
          when: _sshd_installed | bool and _crypto_policy_installed | bool
          tags: [execute]

        - name: "Store requirement 05 details"
          ansible.builtin.set_fact:
            task_05_name: "Verify sshd ciphers"
            task_05_cmd: "sshd -T | grep -i ciphers"
            task_05_rc: "{{ _step05_output.rc | default(-1) }}"
            data_05: "{{ _step05_output.stdout | default('') | trim }}"
            status_05: >-
              {%- if _step05_output.skipped | default(false) -%} SKIP
              {%- elif _step05_output.stdout | default('') | regex_search('(?:3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc|chacha20-poly1305)', ignorecase=true) -%} FAIL
              {%- elif _step05_output.rc | default(-1) == 0 -%} PASS
              {%- else -%} FAIL
              {%- endif -%}
            details_05: >-
              {%- if _step05_output.skipped | default(false) -%} openssh-server or crypto-policies-scripts not installed
              {%- elif _step05_output.stdout | default('') | regex_search('(?:3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc|chacha20-poly1305)', ignorecase=true) -%} WEAK CIPHER DETECTED
              {%- elif _step05_output.rc | default(-1) == 0 -%} Only allowed ciphers present
              {%- else -%} Verification command failed
              {%- endif -%}
          tags: [execute]

        # ──────────────────────────────────────────────
        # Requirement 06: Store overall result in cis_result
        # ──────────────────────────────────────────────
        - name: "Req step-06 - Store final remediation result"
          ansible.builtin.set_fact:
            cis_result: "{{ status_05 | default('ERROR') | trim }}"
          tags: [execute]

        # ──────────────────────────────────────────────
        # Requirement 07: Generate remediation report
        # ──────────────────────────────────────────────
        - name: "Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 5.1.4"
              - "Reference: CIS Benchmark checkpoint 5.1.4"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: {{ task_04_name | default('Not recorded') }}"
              - "  Command: {{ task_04_cmd | default('N/A') }}"
              - "  Exit code: {{ task_04_rc | default(-1) }}"
              - "  Data: {{ data_04 | default('') | trim }}"
              - "  Status: {{ status_04 | default('ERROR') | trim }}"
              - "  Details: {{ details_04 | default('') | trim }}"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: {{ task_05_name | default('Not recorded') }}"
              - "  Command: {{ task_05_cmd | default('N/A') }}"
              - "  Exit code: {{ task_05_rc | default(-1) }}"
              - "  Data: {{ data_05 | default('') | trim }}"
              - "  Status: {{ status_05 | default('ERROR') | trim }}"
              - "  Details: {{ details_05 | default('') | trim }}"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: Store cis_result variable"
              - "  Command: N/A"
              - "  Exit code: N/A"
              - "  Data: {{ cis_result | default('ERROR') | trim }}"
              - "  Status: N/A"
              - "  Details: Overall status derived from Requirement 05"
              - ""
              - "REQUIREMENT 07 - {{ req_07 }}:"
              - "  Task: Generate remediation report"
              - "  Command: N/A"
              - "  Exit code: N/A"
              - "  Data: Report generated"
              - "  Status: N/A"
              - "  Details: Report output"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Check if NO-SSHWEAKCIPHERS.pmod backup exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.bak"
          register: _restore_check
          failed_when: false
          tags: [restore]

        - name: "Restore - Overwrite NO-SSHWEAKCIPHERS.pmod with original"
          ansible.builtin.copy:
            src: "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.bak"
            dest: "{{ subpolicy_file }}"
            remote_src: true
          when: _restore_check.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if absent marker exists for subpolicy file"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.absent"
          register: _restore_absent_marker
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete created subpolicy file"
          ansible.builtin.file:
            path: "{{ subpolicy_file }}"
            state: absent
          when: _restore_absent_marker.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if crypto policy state file exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/crypto_policy_original.state"
          register: _restore_policy_state
          failed_when: false
          tags: [restore]

        - name: "Restore - Read original crypto policy"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/crypto_policy_original.state"
          register: _restore_original_policy
          when: _restore_policy_state.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Apply original crypto policy"
          ansible.builtin.shell: "update-crypto-policies --set {{ _restore_original_policy.content | b64decode | trim }}"
          args:
            executable: /bin/bash
          when:
            - _restore_policy_state.stat.exists | default(false)
            - _restore_original_policy.content is defined
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if sshd binary exists"
          ansible.builtin.stat:
            path: "/usr/sbin/sshd"
          register: _restore_sshd_bin
          failed_when: false
          tags: [restore]

        - name: "Restore - Reload sshd after policy restore"
          ansible.builtin.shell: systemctl reload-or-restart sshd
          args:
            executable: /bin/bash
          when:
            - _restore_policy_state.stat.exists | default(false)
            - _restore_original_policy.content is defined
            - _restore_sshd_bin.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]