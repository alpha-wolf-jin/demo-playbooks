---
- name: "Remediate CIS checkpoint 5.1.4: Ensure sshd Ciphers are configured"
  hosts: all
  become: yes
  gather_facts: false
  vars:
    playbook_name: "cis_5_1_4_sshd_ciphers"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    weak_ciphers: "3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc,chacha20-poly1305"
    sshd_config_path: "/etc/ssh/sshd_config"
    sshd_config_d_dir: "/etc/ssh/sshd_config.d"
    sshd_config_d_file: "50-redhat.conf"
    crypto_policy_modules_dir: "/etc/crypto-policies/policies/modules"
    crypto_policy_name: "NO-SSHWEAKCIPHERS.pmod"
    crypto_policy_set: "DEFAULT:NO-SHA1:NO-WEAKMAC:NO-SSHCBC:NO-SSHCHACHA20:NO-SSHWEAKCIPHERS"
    use_system_wide_crypto_policy: "true"
    rollback_remediation: false
    req_01: "Apply system-wide crypto policy defaults by ensuring /etc/ssh/sshd_config includes the line `Include /etc/ssh/sshd_config.d/*.conf` before any Ciphers lines. Expected result: default includes present."
    req_02: "Ensure /etc/ssh/sshd_config.d/50-redhat.conf exists and contains the line `Include /etc/crypto-policies/back-ends/opensshserver.config`. Expected result: file present with include line."
    req_03: |-
      Create or edit a .pmod file in /etc/crypto-policies/policies/modules/ adding `cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305` using command: `printf '%s\\n' \"# This is a subpolicy to disable weak ciphers\" \"# for the SSH protocol (libssh and OpenSSH)\" \"cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305\" >> /etc/crypto-policies/policies/modules/NO-SSHWEAKCIPHERS.pmod`. Expected result: file created with line.
    req_04: "Apply the updated crypto policy using command: `update-crypto-policies --set DEFAULT:NO-SHA1:NO-WEAKMAC:NO-SSHCBC:NO-SSHCHACHA20:NO-SSHWEAKCIPHERS`. Expected result: policy updated."
    req_05: "Reload the OpenSSH server using command: `systemctl reload-or-restart sshd`. Expected result: service reloaded."
    req_06: "If not using system-wide-crypto-policy, edit /etc/ssh/sshd_config to add/modify the Ciphers line with `Ciphers -3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc,chacha20-poly1305@openssh.com` above any Include entries. Expected result: weak ciphers disabled."
    req_07: "Verify the applied ciphers by running `sshd -T | grep ciphers` and confirming only strong ciphers (aes256-gcm@openssh.com, aes128-gcm@openssh.com, aes256-ctr, aes192-ctr, aes128-ctr) are listed. Expected result: output shows only approved ciphers."
    req_08: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  pre_tasks:
    - name: "Snapshot - Remove stale backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: absent
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0700"
      tags: [snapshot]

    - name: "Snapshot - Check if sshd_config.d directory existed before remediation"
      ansible.builtin.stat:
        path: "{{ sshd_config_d_dir }}"
      register: _snap_sshd_config_d_dir_stat
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Mark sshd_config.d absent if it did not exist"
      ansible.builtin.copy:
        content: "absent"
        dest: "{{ backup_dir }}/sshd_config_d.dir.absent"
      when: not (_snap_sshd_config_d_dir_stat.stat.exists | default(false) | bool)
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Check if crypto policy modules directory existed before remediation"
      ansible.builtin.stat:
        path: "{{ crypto_policy_modules_dir }}"
      register: _snap_crypto_policy_modules_dir_stat
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Mark crypto policy modules directory absent if it did not exist"
      ansible.builtin.copy:
        content: "absent"
        dest: "{{ backup_dir }}/crypto_policy_modules.dir.absent"
      when: not (_snap_crypto_policy_modules_dir_stat.stat.exists | default(false) | bool)
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save current system-wide crypto policy"
      ansible.builtin.shell: |
        if command -v update-crypto-policies >/dev/null 2>&1; then
          if update-crypto-policies --show > "{{ backup_dir }}/crypto_policy.state" 2>/dev/null; then
            echo "SAVED"
          else
            echo "ERROR" > "{{ backup_dir }}/crypto_policy.state"
            echo "ERROR"
          fi
        else
          echo "NOT_AVAILABLE" > "{{ backup_dir }}/crypto_policy.state"
          echo "NOT_AVAILABLE"
        fi
      args:
        executable: /bin/bash
      register: _snap_crypto_policy
      changed_when: false
      failed_when: false
      when: use_system_wide_crypto_policy | bool
      tags: [snapshot]

    - name: "Snapshot - Back up sshd_config, drop-in, and crypto policy module"
      ansible.builtin.shell: |
        set -e
        if [ -f "{{ sshd_config_path }}" ]; then
          cp -a "{{ sshd_config_path }}" "{{ backup_dir }}/sshd_config.present"
        else
          touch "{{ backup_dir }}/sshd_config.absent"
        fi
        if [ -f "{{ sshd_config_d_dir }}/{{ sshd_config_d_file }}" ]; then
          cp -a "{{ sshd_config_d_dir }}/{{ sshd_config_d_file }}" "{{ backup_dir }}/50-redhat.conf.present"
        else
          touch "{{ backup_dir }}/50-redhat.conf.absent"
        fi
        if [ -f "{{ crypto_policy_modules_dir }}/{{ crypto_policy_name }}" ]; then
          cp -a "{{ crypto_policy_modules_dir }}/{{ crypto_policy_name }}" "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.present"
        else
          touch "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.absent"
        fi
      args:
        executable: /bin/bash
      register: _snapshot_result
      failed_when: false
      changed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req step-01 - Check if openssh-server package is installed"
          ansible.builtin.package_facts:
            manager: auto
          failed_when: false
          tags: [execute]

        - name: "Req step-01 - Set openssh-server installed flag"
          ansible.builtin.set_fact:
            _sshd_installed: "{{ 'openssh-server' in (ansible_facts.packages | default({})) }}"
          tags: [execute]

        - name: "Req step-01 - Remove existing Include directives from sshd_config"
          ansible.builtin.lineinfile:
            path: "{{ sshd_config_path }}"
            regexp: |-
              ^Include /etc/ssh/sshd_config\.d/\*\.conf
            state: absent
          register: result_01_remove
          failed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-01 - Ensure Include directive is present before Ciphers in sshd_config"
          ansible.builtin.lineinfile:
            path: "{{ sshd_config_path }}"
            regexp: |-
              ^Include /etc/ssh/sshd_config\.d/\*\.conf
            line: "Include /etc/ssh/sshd_config.d/*.conf"
            insertbefore: |-
              ^[Cc]iphers\s
            firstmatch: true
          register: _step01_output
          failed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-01 - Verify Include directive before Ciphers in sshd_config"
          ansible.builtin.shell: |
            set -o pipefail
            awk '/^Include \/etc\/ssh\/sshd_config\.d\/\*\.conf/{inc=NR} /^[Cc]iphers[[:space:]]/{if(!cip) cip=NR} END{if(inc>0 && (cip==0 || inc<cip)){print "PASS"; exit 0} else {print "FAIL"; exit 1}}' "{{ sshd_config_path }}"
          args:
            executable: /bin/bash
          register: _verify_01
          failed_when: false
          changed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-02 - Ensure sshd_config.d directory exists"
          ansible.builtin.file:
            path: "{{ sshd_config_d_dir }}"
            state: directory
            mode: "0755"
          failed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-02 - Ensure 50-redhat.conf contains crypto policy include"
          ansible.builtin.lineinfile:
            path: "{{ sshd_config_d_dir }}/{{ sshd_config_d_file }}"
            regexp: |-
              ^Include /etc/crypto-policies/back-ends/opensshserver\.config
            line: "Include /etc/crypto-policies/back-ends/opensshserver.config"
            create: true
            mode: "0644"
          register: _step02_output
          failed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-02 - Verify 50-redhat.conf contains crypto policy include"
          ansible.builtin.shell: |
            set -o pipefail
            grep -n '^Include /etc/crypto-policies/back-ends/opensshserver\.config' "{{ sshd_config_d_dir }}/{{ sshd_config_d_file }}"
          args:
            executable: /bin/bash
          register: _verify_02
          failed_when: false
          changed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-03 - Ensure crypto policy modules directory exists"
          ansible.builtin.file:
            path: "{{ crypto_policy_modules_dir }}"
            state: directory
            mode: "0755"
          failed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-03 - Create NO-SSHWEAKCIPHERS.pmod with weak cipher directives"
          ansible.builtin.lineinfile:
            path: "{{ crypto_policy_modules_dir }}/{{ crypto_policy_name }}"
            regexp: |-
              ^[ \t]*cipher@SSH\s*=
            line: 'cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305'
            create: true
            mode: "0644"
          register: _step03_output
          failed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-03 - Verify cipher@SSH line in crypto policy file"
          ansible.builtin.shell: |
            set -o pipefail
            grep -F 'cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305' "{{ crypto_policy_modules_dir }}/{{ crypto_policy_name }}"
          args:
            executable: /bin/bash
          register: _verify_03
          failed_when: false
          changed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-04 - Apply updated crypto policy"
          ansible.builtin.shell: "update-crypto-policies --set {{ crypto_policy_set }}"
          args:
            executable: /bin/bash
          register: _step04_output
          failed_when: false
          when: _sshd_installed | bool and use_system_wide_crypto_policy | bool
          tags: [execute]

        - name: "Req step-06 - Remove existing Ciphers lines from sshd_config"
          ansible.builtin.lineinfile:
            path: "{{ sshd_config_path }}"
            regexp: |-
              ^Ciphers\s
            state: absent
          register: result_06_remove
          failed_when: false
          when: _sshd_installed | bool and not (use_system_wide_crypto_policy | bool)
          tags: [execute]

        - name: "Req step-06 - Configure Ciphers line in sshd_config when not using system-wide crypto policy"
          ansible.builtin.lineinfile:
            path: "{{ sshd_config_path }}"
            regexp: |-
              ^Ciphers\s
            line: "Ciphers -{{ weak_ciphers }}@openssh.com"
            insertbefore: '^Include '
            firstmatch: true
          register: _step06_output
          failed_when: false
          when: _sshd_installed | bool and not (use_system_wide_crypto_policy | bool)
          tags: [execute]

        - name: "Req step-06 - Verify Ciphers line above Include in sshd_config"
          ansible.builtin.shell: |
            set -o pipefail
            awk '/^Ciphers[[:space:]]/{cip=NR} /^Include[[:space:]]/{if(!inc) inc=NR} END{if(cip>0 && (inc==0 || cip<inc)){print "PASS"; exit 0} else {print "FAIL"; exit 1}}' "{{ sshd_config_path }}"
          args:
            executable: /bin/bash
          register: _verify_06
          failed_when: false
          changed_when: false
          when: _sshd_installed | bool and not (use_system_wide_crypto_policy | bool)
          tags: [execute]

        - name: "Req step-05 - Reload OpenSSH server"
          ansible.builtin.shell: "systemctl reload-or-restart sshd"
          args:
            executable: /bin/bash
          register: _step05_output
          failed_when: false
          when: _sshd_installed | bool
          tags: [execute]

        - name: "Req step-07 - Verify applied ciphers with sshd -T"
          ansible.builtin.shell: |
            set -o pipefail
            sshd -T | grep -i '^ciphers '
          args:
            executable: /bin/bash
          register: _step07_output
          failed_when: false
          changed_when: false
          when: _sshd_installed | bool
          tags: [execute]

        - name: "Store all requirement statuses and data"
          ansible.builtin.set_fact:
            task_01_name: "Req step-01 - Ensure Include directive before Ciphers in sshd_config"
            task_01_cmd: "lineinfile Include /etc/ssh/sshd_config.d/*.conf before Ciphers"
            task_01_rc: "{{ _verify_01.rc | default(-1) }}"
            data_01: "{{ _verify_01.stdout | default('') | trim }}"
            status_01: "{{ 'SKIP' if not (_sshd_installed | default(false) | bool) or not (use_system_wide_crypto_policy | bool) else ('PASS' if (_verify_01.rc | default(1)) == 0 else 'FAIL') }}"
            details_01: "{{ 'Skipped' if not (_sshd_installed | default(false) | bool) or not (use_system_wide_crypto_policy | bool) else ('Include directive correctly placed before Ciphers' if (_verify_01.rc | default(1)) == 0 else 'Include directive missing or not before Ciphers') }}"

            task_02_name: "Req step-02 - Ensure /etc/ssh/sshd_config.d/50-redhat.conf include"
            task_02_cmd: "lineinfile Include /etc/crypto-policies/back-ends/opensshserver.config"
            task_02_rc: "{{ _verify_02.rc | default(-1) }}"
            data_02: "{{ _verify_02.stdout | default('') | trim }}"
            status_02: "{{ 'SKIP' if not (_sshd_installed | default(false) | bool) or not (use_system_wide_crypto_policy | bool) else ('PASS' if (_verify_02.rc | default(1)) == 0 else 'FAIL') }}"
            details_02: "{{ 'Skipped' if not (_sshd_installed | default(false) | bool) or not (use_system_wide_crypto_policy | bool) else ('50-redhat.conf include line present' if (_verify_02.rc | default(1)) == 0 else 'Failed to find include line in 50-redhat.conf') }}"

            task_03_name: "Req step-03 - Create NO-SSHWEAKCIPHERS.pmod"
            task_03_cmd: |-
              lineinfile path={{ crypto_policy_modules_dir }}/{{ crypto_policy_name }} regexp='^[ \\t]*cipher@SSH\\s*=' line='cipher@SSH = -3DES-CBC -AES-128-CBC -AES-192-CBC -AES-256-CBC -CHACHA20-POLY1305' create=yes mode=0644
            task_03_rc: "{{ _verify_03.rc | default(-1) }}"
            data_03: "{{ _verify_03.stdout | default('') | trim }}"
            status_03: "{{ 'SKIP' if not (_sshd_installed | default(false) | bool) or not (use_system_wide_crypto_policy | bool) else ('PASS' if (_verify_03.rc | default(1)) == 0 else 'FAIL') }}"
            details_03: "{{ 'Skipped' if not (_sshd_installed | default(false) | bool) or not (use_system_wide_crypto_policy | bool) else ('Crypto policy module contains required cipher line' if (_verify_03.rc | default(1)) == 0 else 'Crypto policy module missing or incorrect cipher line') }}"

            task_04_name: "Req step-04 - Apply updated crypto policy"
            task_04_cmd: "update-crypto-policies --set {{ crypto_policy_set }}"
            task_04_rc: "{{ _step04_output.rc | default(-1) }}"
            data_04: "{{ _step04_output.stdout | default('') | trim }}"
            status_04: "{{ 'SKIP' if not (_sshd_installed | default(false) | bool) or not (use_system_wide_crypto_policy | bool) else ('PASS' if (_step04_output.rc | default(-1)) == 0 else 'FAIL') }}"
            details_04: "{{ 'Skipped' if not (_sshd_installed | default(false) | bool) or not (use_system_wide_crypto_policy | bool) else ('Crypto policy updated' if (_step04_output.rc | default(-1)) == 0 else 'Failed to update crypto policy') }}"

            task_05_name: "Req step-05 - Reload OpenSSH server"
            task_05_cmd: "systemctl reload-or-restart sshd"
            task_05_rc: "{{ _step05_output.rc | default(-1) }}"
            data_05: "{{ _step05_output.stdout | default('') | trim }}"
            status_05: "{{ 'SKIP' if not (_sshd_installed | default(false) | bool) else ('PASS' if (_step05_output.rc | default(-1)) == 0 else 'FAIL') }}"
            details_05: "{{ 'Skipped' if not (_sshd_installed | default(false) | bool) else ('OpenSSH server reloaded' if (_step05_output.rc | default(-1)) == 0 else 'Failed to reload OpenSSH server') }}"

            task_06_name: "Req step-06 - Configure Ciphers line when not using system-wide crypto policy"
            task_06_cmd: "lineinfile Ciphers -{{ weak_ciphers }}@openssh.com above Include"
            task_06_rc: "{{ _verify_06.rc | default(-1) }}"
            data_06: "{{ _verify_06.stdout | default('') | trim }}"
            status_06: "{{ 'SKIP' if not (_sshd_installed | default(false) | bool) or (use_system_wide_crypto_policy | bool) else ('PASS' if (_verify_06.rc | default(1)) == 0 else 'FAIL') }}"
            details_06: "{{ 'Skipped' if not (_sshd_installed | default(false) | bool) or (use_system_wide_crypto_policy | bool) else ('Ciphers line configured above Include' if (_verify_06.rc | default(1)) == 0 else 'Ciphers line missing or not above Include') }}"

            task_07_name: "Req step-07 - Verify applied ciphers with sshd -T"
            task_07_cmd: "sshd -T | grep -i '^ciphers '"
            task_07_rc: "{{ _step07_output.rc | default(-1) }}"
            data_07: "{{ _step07_output.stdout | default('') | trim }}"
            status_07: >-
              {{ 'SKIP' if not (_sshd_installed | default(false) | bool) else
                 ('ERROR' if (_step07_output.rc | default(-1)) != 0 else
                  ('FAIL' if (_step07_output.stdout | default('') | regex_search('3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc|chacha20-poly1305'))
                   else 'PASS')) }}
            details_07: "{{ 'Skipped' if not (_sshd_installed | default(false) | bool) else 'Ciphers verification completed' }}"
          tags: [execute]

        - name: "Req step-08 - Store final remediation result in cis_result"
          ansible.builtin.set_fact:
            cis_result: "{{ status_07 | default('ERROR') | trim }}"
            status_08: "{{ 'PASS' if (status_07 | default('ERROR') | trim) in ['PASS', 'FAIL', 'SKIP', 'ERROR'] else 'ERROR' }}"
            data_08: "cis_result={{ status_07 | default('ERROR') | trim }}"
            details_08: "Final remediation result stored"
            task_08_name: "Req step-08 - set_fact cis_result"
            task_08_cmd: "cis_result = status_07"
            task_08_rc: "0"
          tags: [execute]

        - name: "Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 5.1.4"
              - "Reference: CIS Benchmark checkpoint 5.1.4"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: {{ task_04_name | default('Not recorded') }}"
              - "  Command: {{ task_04_cmd | default('N/A') }}"
              - "  Exit code: {{ task_04_rc | default(-1) }}"
              - "  Data: {{ data_04 | default('') | trim }}"
              - "  Status: {{ status_04 | default('ERROR') | trim }}"
              - "  Details: {{ details_04 | default('') | trim }}"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: {{ task_05_name | default('Not recorded') }}"
              - "  Command: {{ task_05_cmd | default('N/A') }}"
              - "  Exit code: {{ task_05_rc | default(-1) }}"
              - "  Data: {{ data_05 | default('') | trim }}"
              - "  Status: {{ status_05 | default('ERROR') | trim }}"
              - "  Details: {{ details_05 | default('') | trim }}"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: {{ task_06_name | default('Not recorded') }}"
              - "  Command: {{ task_06_cmd | default('N/A') }}"
              - "  Exit code: {{ task_06_rc | default(-1) }}"
              - "  Data: {{ data_06 | default('') | trim }}"
              - "  Status: {{ status_06 | default('ERROR') | trim }}"
              - "  Details: {{ details_06 | default('') | trim }}"
              - ""
              - "REQUIREMENT 07 - {{ req_07 }}:"
              - "  Task: {{ task_07_name | default('Not recorded') }}"
              - "  Command: {{ task_07_cmd | default('N/A') }}"
              - "  Exit code: {{ task_07_rc | default(-1) }}"
              - "  Data: {{ data_07 | default('') | trim }}"
              - "  Status: {{ status_07 | default('ERROR') | trim }}"
              - "  Details: {{ details_07 | default('') | trim }}"
              - ""
              - "REQUIREMENT 08 - {{ req_08 }}:"
              - "  Task: {{ task_08_name | default('Not recorded') }}"
              - "  Command: {{ task_08_cmd | default('N/A') }}"
              - "  Exit code: {{ task_08_rc | default(-1) }}"
              - "  Data: {{ data_08 | default('') | trim }}"
              - "  Status: {{ status_08 | default('ERROR') | trim }}"
              - "  Details: {{ details_08 | default('') | trim }}"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Evaluate rollback condition"
          ansible.builtin.set_fact:
            _rollback_enabled: "{{ rollback_remediation | bool }}"
          tags: [restore]

        - name: "Restore - Restore original config files"
          ansible.builtin.shell: |
            set -e
            if [ -f "{{ backup_dir }}/sshd_config.present" ]; then
              cp -a "{{ backup_dir }}/sshd_config.present" "{{ sshd_config_path }}"
            elif [ -f "{{ backup_dir }}/sshd_config.absent" ]; then
              rm -f "{{ sshd_config_path }}"
            fi
            if [ -f "{{ backup_dir }}/50-redhat.conf.present" ]; then
              cp -a "{{ backup_dir }}/50-redhat.conf.present" "{{ sshd_config_d_dir }}/{{ sshd_config_d_file }}"
            elif [ -f "{{ backup_dir }}/50-redhat.conf.absent" ]; then
              rm -f "{{ sshd_config_d_dir }}/{{ sshd_config_d_file }}"
            fi
            if [ -f "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.present" ]; then
              cp -a "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.present" "{{ crypto_policy_modules_dir }}/{{ crypto_policy_name }}"
            elif [ -f "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.absent" ]; then
              rm -f "{{ crypto_policy_modules_dir }}/{{ crypto_policy_name }}"
            fi
          args:
            executable: /bin/bash
          register: _restore_config
          failed_when: false
          when: _rollback_enabled | bool
          tags: [restore]

        - name: "Restore - Check if sshd_config backup exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/sshd_config.present"
          register: _restore_sshd_config_backup_stat
          failed_when: false
          when: _rollback_enabled | bool
          tags: [restore]

        - name: "Restore - Restore sshd_config from backup"
          ansible.builtin.copy:
            src: "{{ backup_dir }}/sshd_config.present"
            dest: "{{ sshd_config_path }}"
            remote_src: true
          when:
            - _rollback_enabled | bool
            - _restore_sshd_config_backup_stat.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if sshd_config absent marker exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/sshd_config.absent"
          register: _restore_sshd_config_absent_stat
          failed_when: false
          when: _rollback_enabled | bool
          tags: [restore]

        - name: "Restore - Remove sshd_config if it was absent before remediation"
          ansible.builtin.file:
            path: "{{ sshd_config_path }}"
            state: absent
          when:
            - _rollback_enabled | bool
            - _restore_sshd_config_absent_stat.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if 50-redhat.conf absent marker exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/50-redhat.conf.absent"
          register: _restore_50_redhat_absent_stat
          failed_when: false
          when: _rollback_enabled | bool
          tags: [restore]

        - name: "Restore - Remove 50-redhat.conf if it was absent before remediation"
          ansible.builtin.file:
            path: "{{ sshd_config_d_dir }}/{{ sshd_config_d_file }}"
            state: absent
          when:
            - _rollback_enabled | bool
            - _restore_50_redhat_absent_stat.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if NO-SSHWEAKCIPHERS.pmod absent marker exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/NO-SSHWEAKCIPHERS.pmod.absent"
          register: _restore_pmod_absent_stat
          failed_when: false
          when: _rollback_enabled | bool
          tags: [restore]

        - name: "Restore - Remove NO-SSHWEAKCIPHERS.pmod if it was absent before remediation"
          ansible.builtin.file:
            path: "{{ crypto_policy_modules_dir }}/{{ crypto_policy_name }}"
            state: absent
          when:
            - _rollback_enabled | bool
            - _restore_pmod_absent_stat.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if sshd_config.d directory was absent before remediation"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/sshd_config_d.dir.absent"
          register: _restore_sshd_config_d_dir_stat
          failed_when: false
          when: _rollback_enabled | bool
          tags: [restore]

        - name: "Restore - Remove sshd_config.d directory if it was created during remediation"
          ansible.builtin.file:
            path: "{{ sshd_config_d_dir }}"
            state: absent
          when:
            - _rollback_enabled | bool
            - _restore_sshd_config_d_dir_stat.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if crypto policy modules directory was absent before remediation"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/crypto_policy_modules.dir.absent"
          register: _restore_crypto_policy_modules_dir_stat
          failed_when: false
          when: _rollback_enabled | bool
          tags: [restore]

        - name: "Restore - Remove crypto policy modules directory if it was created during remediation"
          ansible.builtin.file:
            path: "{{ crypto_policy_modules_dir }}"
            state: absent
          when:
            - _rollback_enabled | bool
            - _restore_crypto_policy_modules_dir_stat.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore original system-wide crypto policy"
          ansible.builtin.shell: |
            set -o pipefail
            if [ -s "{{ backup_dir }}/crypto_policy.state" ]; then
              ORIG=$(cat "{{ backup_dir }}/crypto_policy.state")
              if [ -n "$ORIG" ] && [ "$ORIG" != "NOT_AVAILABLE" ] && [ "$ORIG" != "ERROR" ]; then
                CURRENT=$(update-crypto-policies --show 2>/dev/null || true)
                if [ -n "$CURRENT" ] && [ "$ORIG" != "$CURRENT" ]; then
                  if update-crypto-policies --set "$ORIG"; then
                    echo "RESTORED_POLICY"
                  else
                    echo "RESTORE_POLICY_FAILED"
                    exit 1
                  fi
                else
                  echo "POLICY_UNCHANGED"
                fi
              else
                echo "POLICY_RESTORE_SKIPPED"
              fi
            else
              echo "POLICY_STATE_MISSING"
            fi
          args:
            executable: /bin/bash
          register: _restore_policy
          failed_when: false
          when:
            - _rollback_enabled | bool
            - use_system_wide_crypto_policy | bool
          tags: [restore]

        - name: "Restore - Reload sshd service after restore"
          ansible.builtin.shell: "systemctl reload-or-restart sshd"
          args:
            executable: /bin/bash
          register: _restore_sshd_reload
          failed_when: false
          when: _rollback_enabled | bool
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          when: _rollback_enabled | bool
          failed_when: false
          tags: [restore]