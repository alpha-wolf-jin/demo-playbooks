        - name: "Req step-18 - Capture provisioning evidence"
          ansible.builtin.set_fact:
            _evidence: >-
              {{ 'new_vm_name: ' ~ new_vm_name
                 ~ '; cloned_vm_ext_id: ' ~ _cloned_vm_ext_id
