            nutanix_username: "{{ nutanix_username }}"
            nutanix_password: "{{ nutanix_password }}"
            validate_certs: "{{ validate_certs }}"
            state: present
            ext_id: "{{ _cloned_vm_ext_id }}"
            categories: "{{ _security_zone_category_list }}"
            cluster:
              ext_id: "{{ _site_cluster_ext_id }}"
          register: _vm_categories_assigned
          tags: [execute]

