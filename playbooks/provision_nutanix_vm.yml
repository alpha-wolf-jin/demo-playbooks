---
- name: "SOP playbook 'provision_nutanix_vm' (ACTION — changes system state): Provisions a Nutanix AHV VM by cloning an approved pre-hardened template, configuring CPU/RAM/NIC/guest customization, creating the disk layout, initializing the OS (Windows Server 2025 or RHEL 10), and capturing a pre-CIS hardening checkpoint with provisioning evidence. [target host: localhost (localhost)]"
  hosts: localhost
  connection: local
  become: true
  become_user: root
  gather_facts: false

  vars:
    playbook_name: "provision_nutanix_vm"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"

    nutanix_host: ""
    nutanix_username: ""
    nutanix_password: ""
    validate_certs: false

    template_vm_name: ""
    new_vm_name: ""
    os_family: ""
    cpu_sockets: 2
    cpu_cores_per_socket: 2
    cpu_threads_per_core: 1
    memory_gb: 8
    provisioning_port_group_name: ""
    hostname: ""
    os_disk_gb: 100
    data_disk_gb: 0
    checkpoint_name: ""

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

  tasks:
    - name: "Execute provisioning workflow"
      block:
        - name: "Validate required provisioning inputs"
          ansible.builtin.assert:
            that:
              - nutanix_host | length > 0
              - nutanix_username | length > 0
              - nutanix_password | length > 0
              - template_vm_name | length > 0
              - new_vm_name | length > 0
              - os_family | length > 0
              - provisioning_port_group_name | length > 0
              - hostname | length > 0
              - checkpoint_name | length > 0
            fail_msg: "Missing required provisioning variable(s)"
          tags: [execute]

        - name: "Req step-01 - Resolve template VM name to ext_id"
          nutanix.ncp.ntnx_vms_info_v2:
            nutanix_host: "{{ nutanix_host }}"
            nutanix_username: "{{ nutanix_username }}"
            nutanix_password: "{{ nutanix_password }}"
            validate_certs: "{{ validate_certs }}"
            filter: "name eq '{{ template_vm_name }}'"
          register: _template_vm_lookup
          tags: [execute]

        - name: "Req step-02 - Normalize template VM lookup result"
          ansible.builtin.set_fact:
            _template_vm_list: "{{ _template_vm_lookup.response.data | default(_template_vm_lookup.response.entities | default(_template_vm_lookup.entities | default([]))) }}"
          tags: [execute]

        - name: "Req step-02 - Extract template VM ext_id"
          ansible.builtin.set_fact:
            _template_vm_ext_id: >-
              {{ (_template_vm_list | selectattr('ext_id', 'defined') | map(attribute='ext_id') | first)
                 | default(_template_vm_list | selectattr('uuid', 'defined') | map(attribute='uuid') | first)
                 | default('') }}
          tags: [execute]

        - name: "Req step-03 - Set template VM exists flag"
          ansible.builtin.set_fact:
            _template_vm_exists: "{{ _template_vm_list | length > 0 }}"
          tags: [execute]

        - name: "Req step-03 - Abort when template VM not found"
          ansible.builtin.fail:
            msg: "Template VM '{{ template_vm_name }}' was not found."
          when: not _template_vm_exists
          tags: [execute]

        - name: "Req step-04 - Resolve provisioning port group name to subnet ext_id"
          nutanix.ncp.ntnx_subnets_info_v2:
            nutanix_host: "{{ nutanix_host }}"
            nutanix_username: "{{ nutanix_username }}"
            nutanix_password: "{{ nutanix_password }}"
            validate_certs: "{{ validate_certs }}"
            filter: "name eq '{{ provisioning_port_group_name }}'"
          register: _subnet_lookup
          when: _template_vm_exists
          tags: [execute]

        - name: "Req step-05 - Set provisioning port group exists flag"
          ansible.builtin.set_fact:
            _subnet_exists: "{{ (_subnet_lookup.response.data | default(_subnet_lookup.response.entities | default(_subnet_lookup.entities | default([]))) | length > 0) }}"
          when: _template_vm_exists
          tags: [execute]

        - name: "Req step-05 - Abort when provisioning port group not found"
          ansible.builtin.fail:
            msg: "Provisioning port group '{{ provisioning_port_group_name }}' was not found."
          when: not _subnet_exists
          tags: [execute]

        - name: "Req step-06 - Normalize subnet lookup result"
          ansible.builtin.set_fact:
            _subnet_list: "{{ _subnet_lookup.response.data | default(_subnet_lookup.response.entities | default(_subnet_lookup.entities | default([]))) }}"
          when: _subnet_exists
          tags: [execute]

        - name: "Req step-06 - Extract subnet ext_id"
          ansible.builtin.set_fact:
            _subnet_ext_id: >-
              {{ (_subnet_list | selectattr('ext_id', 'defined') | map(attribute='ext_id') | first)
                 | default(_subnet_list | selectattr('uuid', 'defined') | map(attribute='uuid') | first)
                 | default('') }}
          when: _subnet_exists
          tags: [execute]

        - name: "Req step-07 - Build cloud-init user data"
          ansible.builtin.set_fact:
            _cloud_init_user_data: |
              #cloud-config
              hostname: {{ hostname }}
              network:
                version: 2
                ethernets:
                  id0:
                    dhcp4: true
          tags: [execute]

        - name: "Req step-07 - Build guest customization"
          ansible.builtin.set_fact:
            _guest_customization: >-
              {{ {'is_overridable': true, 'sysprep': {'install_type': 'PREPARED', 'unattend_xml': '<?xml version="1.0" encoding="utf-8"?><unattend xmlns="urn:schemas-microsoft-com:unattend"><settings pass="specialize"><component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS"><ComputerName>' ~ hostname ~ '</ComputerName></component></settings></unattend>'}}
                 if os_family | lower == 'windows'
                 else {'is_overridable': true, 'cloud_init': {'user_data': _cloud_init_user_data | b64encode}}
              }}
          tags: [execute]

        - name: "Req step-07 - Clone template VM with CPU/RAM/NIC/guest customization"
          nutanix.ncp.ntnx_vms_clone_v2:
            nutanix_host: "{{ nutanix_host }}"
            nutanix_username: "{{ nutanix_username }}"
            nutanix_password: "{{ nutanix_password }}"
            validate_certs: "{{ validate_certs }}"
            ext_id: "{{ _template_vm_ext_id }}"
            name: "{{ new_vm_name }}"
            num_sockets: "{{ cpu_sockets | int }}"
            num_cores_per_socket: "{{ cpu_cores_per_socket | int }}"
            num_threads_per_core: "{{ cpu_threads_per_core | int }}"
            memory_size_bytes: "{{ (memory_gb | int) * 1073741824 }}"
            nics:
              - subnet_ext_id: "{{ _subnet_ext_id }}"
                is_connected: true
            guest_customization: "{{ _guest_customization }}"
          register: _clone_result
          when: _subnet_exists
          tags: [execute]

        - name: "Req step-07 - Normalize clone result"
          ansible.builtin.set_fact:
            _clone_response_obj: "{{ _clone_result.response | default(_clone_result) }}"
          when:
            - _clone_result is defined
            - not (_clone_result.failed | default(true))
          tags: [execute]

        - name: "Req step-07 - Store new VM ext_id"
          ansible.builtin.set_fact:
            _new_vm_ext_id: >-
              {{ _clone_response_obj.ext_id
                 | default(_clone_response_obj.metadata.uuid
                 | default(_clone_response_obj.metadata.ext_id
                 | default(_clone_result.ext_id
                 | default('')))) }}
          when:
            - _clone_response_obj is defined
          tags: [execute]

        - name: "Store new VM ext_id for restore"
          ansible.builtin.copy:
            content: "{{ _new_vm_ext_id }}"
            dest: "{{ backup_dir }}/vm_ext_id"
            mode: '0600'
          when: _new_vm_ext_id | length > 0
          tags: [execute]

        - name: "Req step-08 - Set Windows OS family flag"
          ansible.builtin.set_fact:
            _os_is_windows: "{{ os_family | lower == 'windows' }}"
          tags: [execute]

        - name: "Req step-09 - Get cloned VM details for disk layout"
          ansible.builtin.uri:
            url: "https://{{ nutanix_host }}:9440/api/nutanix/v3/vms/{{ _new_vm_ext_id }}"
            method: GET
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: "{{ validate_certs }}"
            status_code: [200]
          register: _disk_layout_get
          when: _os_is_windows
          tags: [execute]

        - name: "Req step-09 - Extract existing OS disk"
          ansible.builtin.set_fact:
            _existing_os_disk: "{{ (_disk_layout_get.json.spec.resources.disk_list | default([]) | first) | default({}) }}"
          when: _os_is_windows
          tags: [execute]

        - name: "Req step-09 - Build updated disk list"
          ansible.builtin.set_fact:
            _windows_disk_list: >-
              {{ [_existing_os_disk | combine({'disk_size_bytes': (os_disk_gb | int) * 1073741824})]
                 + ([{'device_properties': {'device_type': 'DISK', 'disk_address': {'device_index': 1, 'adapter_type': 'SCSI'}}, 'disk_size_bytes': (data_disk_gb | int) * 1073741824}] if (data_disk_gb | int) > 0 else []) }}
          when: _os_is_windows
          tags: [execute]

        - name: "Req step-09 - Create OS and data disk layout on cloned VM"
          ansible.builtin.uri:
            url: "https://{{ nutanix_host }}:9440/api/nutanix/v3/vms/{{ _new_vm_ext_id }}"
            method: PUT
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: "{{ validate_certs }}"
            body_format: json
            body:
              api_version: "3.1.0"
              metadata:
                kind: "vm"
              spec:
                resources:
                  disk_list: "{{ _windows_disk_list }}"
            status_code: [200, 202]
          register: _disk_layout_result
          when: _os_is_windows
          tags: [execute]

        - name: "Req step-10 - Initialize Windows Server 2025 guest with Unattend and NGT Tools"
          ansible.builtin.uri:
            url: "https://{{ nutanix_host }}:9440/api/nutanix/v3/vms/{{ _new_vm_ext_id }}"
            method: PUT
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: "{{ validate_certs }}"
            body_format: json
            body:
              spec:
                name: "{{ new_vm_name }}"
                resources:
                  guest_tools:
                    is_installed: true
                  power_state: "ON"
            status_code: [200, 202]
          register: _windows_init_result
          when: _os_is_windows
          tags: [execute]

        - name: "Req step-11 - Set RHEL OS family flag"
          ansible.builtin.set_fact:
            _os_is_rhel: "{{ os_family | lower == 'rhel' }}"
          when: not _os_is_windows
          tags: [execute]

        - name: "Req step-11 - Abort when OS family is neither Windows nor RHEL"
          ansible.builtin.fail:
            msg: "Unsupported OS family '{{ os_family }}'. Expected windows or rhel."
          when: not _os_is_windows and not _os_is_rhel
          tags: [execute]

        - name: "Req step-12 - Initialize RHEL 10 guest with Cloud-init and NGT Tools"
          ansible.builtin.uri:
            url: "https://{{ nutanix_host }}:9440/api/nutanix/v3/vms/{{ _new_vm_ext_id }}"
            method: PUT
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: "{{ validate_certs }}"
            body_format: json
            body:
              spec:
                name: "{{ new_vm_name }}"
                resources:
                  guest_tools:
                    is_installed: true
                  power_state: "ON"
            status_code: [200, 202]
          register: _rhel_init_result
          when: _os_is_rhel
          tags: [execute]

        - name: "Req step-13 - Create pre-CIS hardening checkpoint"
          ansible.builtin.uri:
            url: "https://{{ nutanix_host }}:9440/api/nutanix/v3/snapshots"
            method: POST
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: "{{ validate_certs }}"
            body_format: json
            body:
              api_version: "3.1.0"
              metadata:
                kind: "snapshot"
              spec:
                name: "{{ checkpoint_name }}"
                resources:
                  snapshot_type: "CRASH_CONSISTENT"
                  vm_snapshot_spec:
                    vm_reference:
                      uuid: "{{ _new_vm_ext_id }}"
            status_code: [200, 202]
          register: _checkpoint_response
          tags: [execute]

        - name: "Req step-13 - Extract checkpoint ext_id"
          ansible.builtin.set_fact:
            _checkpoint_ext_id: "{{ _checkpoint_response.json.metadata.uuid | default(_checkpoint_response.json.entity_uuid | default(_checkpoint_response.json.spec.resources.snapshot_uuid | default(''))) }}"
          tags: [execute]

        - name: "Req step-13 - Verify checkpoint was created"
          ansible.builtin.fail:
            msg: "Pre-CIS hardening checkpoint was not created."
          when: not (_checkpoint_ext_id | length > 0)
          tags: [execute]

        - name: "Store checkpoint ext_id for restore"
          ansible.builtin.copy:
            content: "{{ _checkpoint_ext_id }}"
            dest: "{{ backup_dir }}/checkpoint_ext_id"
            mode: '0600'
          when: _checkpoint_ext_id | length > 0
          tags: [execute]

        - name: "Req step-14 - Capture provisioning evidence"
          ansible.builtin.set_fact:
            _provisioning_evidence: >-
              {{ 'new_vm_name: ' ~ new_vm_name ~ '; new_vm_ext_id: ' ~ _new_vm_ext_id
                 ~ '; checkpoint_name: ' ~ checkpoint_name ~ '; checkpoint_ext_id: ' ~ _checkpoint_ext_id }}
          tags: [execute]

        - name: "Req step-15 - Emit provisioning result block"
          ansible.builtin.debug:
            msg: |-
              <result>
              new_vm_name: {{ new_vm_name }}
              new_vm_ext_id: {{ _new_vm_ext_id }}
              checkpoint_name: {{ checkpoint_name }}
              checkpoint_ext_id: {{ _checkpoint_ext_id }}
              provisioning_evidence: {{ _provisioning_evidence }}
              </result>
          tags: [execute]

      rescue:
        - name: "Req step-16 - Emit error and fail"
          ansible.builtin.debug:
            msg: |-
              <result>
              ERROR: provision_nutanix_vm failed on {{ inventory_hostname }}: {{ ansible_failed_task.name | default('unknown task') }} - {{ ansible_failed_result.msg | default('unknown error') }}
              </result>
          when: true
          tags: [execute]

        - name: "Req step-16 - Force termination on failure"
          ansible.builtin.fail:
            msg: "provision_nutanix_vm failed"
          when: true
          tags: [execute]

      always:
        - name: "Restore - Check for saved VM ext id state file"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/vm_ext_id"
          register: _restore_vm_stat
          tags: [restore]

        - name: "Restore - Read saved VM ext id"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/vm_ext_id"
          register: _restore_vm_slurp
          when: _restore_vm_stat.stat.exists | default(false)
          tags: [restore]

        - name: "Restore - Set VM ext id to restore"
          ansible.builtin.set_fact:
            _restore_vm_ext_id: "{{ (_restore_vm_slurp.content | b64decode | trim) if (_restore_vm_stat.stat.exists | default(false)) else '' }}"
          tags: [restore]

        - name: "Restore - Check for saved checkpoint ext id state file"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/checkpoint_ext_id"
          register: _restore_checkpoint_stat
          tags: [restore]

        - name: "Restore - Read saved checkpoint ext id"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/checkpoint_ext_id"
          register: _restore_checkpoint_slurp
          when: _restore_checkpoint_stat.stat.exists | default(false)
          tags: [restore]

        - name: "Restore - Set checkpoint ext id to restore"
          ansible.builtin.set_fact:
            _restore_checkpoint_ext_id: "{{ (_restore_checkpoint_slurp.content | b64decode | trim) if (_restore_checkpoint_stat.stat.exists | default(false)) else '' }}"
          tags: [restore]

        - name: "Restore - Delete provisioned checkpoint"
          ansible.builtin.uri:
            url: "https://{{ nutanix_host }}:9440/api/nutanix/v3/snapshots/{{ _restore_checkpoint_ext_id }}"
            method: DELETE
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: "{{ validate_certs }}"
            status_code: [200, 202, 204, 404]
          when:
            - _restore_checkpoint_ext_id | length > 0
            - nutanix_host | length > 0
            - nutanix_username | length > 0
            - nutanix_password | length > 0
          ignore_errors: true
          tags: [restore]

        - name: "Restore - Delete provisioned VM"
          ansible.builtin.uri:
            url: "https://{{ nutanix_host }}:9440/api/nutanix/v3/vms/{{ _restore_vm_ext_id }}"
            method: DELETE
            user: "{{ nutanix_username }}"
            password: "{{ nutanix_password }}"
            force_basic_auth: true
            validate_certs: "{{ validate_certs }}"
            status_code: [200, 202, 204, 404]
          when:
            - _restore_vm_ext_id | length > 0
            - nutanix_host | length > 0
            - nutanix_username | length > 0
            - nutanix_password | length > 0
          ignore_errors: true
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          tags: [restore]