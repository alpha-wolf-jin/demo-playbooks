            nutanix_password: "{{ nutanix_password }}"
            validate_certs: "{{ validate_certs }}"
            ext_id: "{{ _clone_params.ext_id }}"
            name: "{{ _clone_params.name }}"
            num_sockets: "{{ _clone_params.num_sockets }}"
            num_cores_per_socket: "{{ _clone_params.num_cores_per_socket }}"
