            ext_id: "{{ _cloned_vm_ext_id }}"
          register: _vm_ip_info
          tags: [execute]

        - name: "Req step-15 - Store cloned VM IP"
          ansible.builtin.set_fact:
            _cloned_vm_ip: >-
              {{ (_vm_ip_info.response.entities | default(_vm_ip_info.response.data | default(_vm_ip_info.entities | default([])))
