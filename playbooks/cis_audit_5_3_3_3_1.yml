---
- name: "Audit CIS checkpoint 5.3.3.3.1 - Ensure password history remember is configured"
  hosts: all
  become: yes
  become_user: root
  gather_facts: false
  vars:
    password_history_remember: '24'
    req_01: "Check if the /etc/security/pwhistory.conf file exists using command: `test -f /etc/security/pwhistory.conf`. Expected result: exit status 0 (file exists)."
    req_02: |
      Check if the pam_pwhistory module is configured in /etc/pam.d/password-auth or /etc/pam.d/system-auth using command: `grep -Pi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\.so' /etc/pam.d/password-auth /etc/pam.d/system-auth`. Expected result: at least one match is returned (module is present).
    req_03: |
      Check that the remember option in /etc/security/pwhistory.conf is set to {{ password_history_remember }} or more using command: `grep -Pi -- '^\\h*remember\\h*=\\h*(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,})\\b' /etc/security/pwhistory.conf` and verify the value is >= {{ password_history_remember }}. Expected result: a line matching the pattern is returned with a value >= {{ password_history_remember }}.
    req_04: |
      Check that the remember option in /etc/security/pwhistory.conf is not set to less than {{ password_history_remember }} using command: `grep -Pi -- '^\\h*remember\\h*=\\h*(2[0-3]|1[0-9]|[0-9])\\b' /etc/security/pwhistory.conf` and verify no value is < {{ password_history_remember }}. Expected result: no output (nothing returned).
    req_05: |
      Check that the remember option on the pam_pwhistory.so module in /etc/pam.d/password-auth is not set to less than {{ password_history_remember }} using command: `grep -Pi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\.so\\h+([^#\\n\\r]+\\h+)?remember=(2[0-3]|1[0-9]|[0-9])\\b' /etc/pam.d/password-auth` and verify no value is < {{ password_history_remember }}. Expected result: no output (nothing returned).
    req_06: |
      Check that the remember option on the pam_pwhistory.so module in /etc/pam.d/system-auth is not set to less than {{ password_history_remember }} using command: `grep -Pi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\.so\\h+([^#\\n\\r]+\\h+)?remember=(2[0-3]|1[0-9]|[0-9])\\b' /etc/pam.d/system-auth` and verify no value is < {{ password_history_remember }}. Expected result: no output (nothing returned).
    req_07: "Check overall compliance status: if /etc/security/pwhistory.conf does not exist, or pam_pwhistory module is not present in both /etc/pam.d/password-auth and /etc/pam.d/system-auth, then SKIP; otherwise, if all previous checks pass, then PASS; if any check fails, then FAIL. Expected result: PASS if all checks pass, SKIP if prerequisite not met, FAIL if feature exists but is misconfigured."
    req_08: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  tasks:
    - name: "Initialize data variables"
      set_fact:
        data_01: "Not collected yet"
        status_01: "ERROR"
        details_01: "Not evaluated"
        data_02: "Not collected yet"
        status_02: "ERROR"
        details_02: "Not evaluated"
        data_03: "Not collected yet"
        status_03: "ERROR"
        details_03: "Not evaluated"
        data_04: "Not collected yet"
        status_04: "ERROR"
        details_04: "Not evaluated"
        data_05: "Not collected yet"
        status_05: "ERROR"
        details_05: "Not evaluated"
        data_06: "Not collected yet"
        status_06: "ERROR"
        details_06: "Not evaluated"
        data_07: "Not collected yet"
        status_07: "ERROR"
        details_07: "Not evaluated"
        data_08: "Not collected yet"
        status_08: "ERROR"
        details_08: "Not evaluated"
        task_01_name: "Not executed"
        task_01_cmd: "N/A"
        task_01_rc: -1
        task_02_name: "Not executed"
        task_02_cmd: "N/A"
        task_02_rc: -1
        task_03_name: "Not executed"
        task_03_cmd: "N/A"
        task_03_rc: -1
        task_04_name: "Not executed"
        task_04_cmd: "N/A"
        task_04_rc: -1
        task_05_name: "Not executed"
        task_05_cmd: "N/A"
        task_05_rc: -1
        task_06_name: "Not executed"
        task_06_cmd: "N/A"
        task_06_rc: -1
        task_07_name: "Not executed"
        task_07_cmd: "N/A"
        task_07_rc: -1
        task_08_name: "Not executed"
        task_08_cmd: "N/A"
        task_08_rc: -1

    - name: "Req 01 - Check if pwhistory.conf exists"
      ansible.builtin.shell: test -f /etc/security/pwhistory.conf
      args:
        executable: /bin/bash
      register: result_01
      failed_when: false
      changed_when: false

    - name: "Store requirement 01 details"
      set_fact:
        task_01_name: "Check /etc/security/pwhistory.conf existence"
        task_01_cmd: "test -f /etc/security/pwhistory.conf"
        task_01_rc: "{{ result_01.rc | default(-1) }}"
        data_01: "{{ result_01.stdout | default('') | trim }}"
        status_01: "{{ 'PASS' if result_01.rc | default(-1) == 0 else 'FAIL' }}"
        details_01: "{{ 'File exists' if result_01.rc | default(-1) == 0 else 'File does not exist' }}"

    - name: "Req 02 - Check pam_pwhistory module in PAM files"
      ansible.builtin.shell: |
        grep -Pi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwhistory\.so' /etc/pam.d/password-auth /etc/pam.d/system-auth
      args:
        executable: /bin/bash
      register: result_02
      failed_when: false
      changed_when: false

    - name: "Store requirement 02 details"
      set_fact:
        task_02_name: "Check pam_pwhistory module presence"
        task_02_cmd: |
          grep -Pi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\.so' /etc/pam.d/password-auth /etc/pam.d/system-auth
        task_02_rc: "{{ result_02.rc | default(-1) }}"
        data_02: "{{ result_02.stdout | default('') | trim }}"
        status_02: "{{ 'PASS' if result_02.stdout | default('') | trim != '' else 'FAIL' }}"
        details_02: "{{ 'Module found' if result_02.stdout | default('') | trim != '' else 'Module not found in any file' }}"

    - name: "Req 03 - Check remember option >= 24 in pwhistory.conf"
      ansible.builtin.shell: |
        grep -Pi -- '^\h*remember\h*=\h*(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,})\b' /etc/security/pwhistory.conf
      args:
        executable: /bin/bash
      register: result_03
      failed_when: false
      changed_when: false

    - name: "Store requirement 03 details"
      set_fact:
        task_03_name: "Check remember >= 24 in pwhistory.conf"
        task_03_cmd: |
          grep -Pi -- '^\\h*remember\\h*=\\h*(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,})\\b' /etc/security/pwhistory.conf
        task_03_rc: "{{ result_03.rc | default(-1) }}"
        data_03: "{{ result_03.stdout | default('') | trim }}"
        status_03: "{{ 'PASS' if result_03.stdout | default('') | trim != '' else 'FAIL' }}"
        details_03: "{{ 'Match found for remember >= 24' if result_03.stdout | default('') | trim != '' else 'No match for remember >= 24' }}"

    - name: "Req 04 - Check absence of remember < 24 in pwhistory.conf"
      ansible.builtin.shell: |
        grep -Pi -- '^\h*remember\h*=\h*(2[0-3]|1[0-9]|[0-9])\b' /etc/security/pwhistory.conf
      args:
        executable: /bin/bash
      register: result_04
      failed_when: false
      changed_when: false

    - name: "Store requirement 04 details"
      set_fact:
        task_04_name: "Check no remember < 24 in pwhistory.conf"
        task_04_cmd: |
          grep -Pi -- '^\\h*remember\\h*=\\h*(2[0-3]|1[0-9]|[0-9])\\b' /etc/security/pwhistory.conf
        task_04_rc: "{{ result_04.rc | default(-1) }}"
        data_04: "{{ result_04.stdout | default('') | trim }}"
        status_04: "{{ 'PASS' if result_04.stdout | default('') | trim == '' else 'FAIL' }}"
        details_04: "{{ 'No remember < 24 found' if result_04.stdout | default('') | trim == '' else 'Found remember < 24' }}"

    - name: "Req 05 - Check remember < 24 in password-auth pam_pwhistory"
      ansible.builtin.shell: |
        grep -Pi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?remember=(2[0-3]|1[0-9]|[0-9])\b' /etc/pam.d/password-auth
      args:
        executable: /bin/bash
      register: result_05
      failed_when: false
      changed_when: false

    - name: "Store requirement 05 details"
      set_fact:
        task_05_name: "Check remember < 24 in password-auth"
        task_05_cmd: |
          grep -Pi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\.so\\h+([^#\\n\\r]+\\h+)?remember=(2[0-3]|1[0-9]|[0-9])\\b' /etc/pam.d/password-auth
        task_05_rc: "{{ result_05.rc | default(-1) }}"
        data_05: "{{ result_05.stdout | default('') | trim }}"
        status_05: "{{ 'PASS' if result_05.stdout | default('') | trim == '' else 'FAIL' }}"
        details_05: "{{ 'No remember < 24 found' if result_05.stdout | default('') | trim == '' else 'Found remember < 24' }}"

    - name: "Req 06 - Check remember < 24 in system-auth pam_pwhistory"
      ansible.builtin.shell: |
        grep -Pi -- '^\h*password\h+(requisite|required|sufficient)\h+pam_pwhistory\.so\h+([^#\n\r]+\h+)?remember=(2[0-3]|1[0-9]|[0-9])\b' /etc/pam.d/system-auth
      args:
        executable: /bin/bash
      register: result_06
      failed_when: false
      changed_when: false

    - name: "Store requirement 06 details"
      set_fact:
        task_06_name: "Check remember < 24 in system-auth"
        task_06_cmd: |
          grep -Pi -- '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\.so\\h+([^#\\n\\r]+\\h+)?remember=(2[0-3]|1[0-9]|[0-9])\\b' /etc/pam.d/system-auth
        task_06_rc: "{{ result_06.rc | default(-1) }}"
        data_06: "{{ result_06.stdout | default('') | trim }}"
        status_06: "{{ 'PASS' if result_06.stdout | default('') | trim == '' else 'FAIL' }}"
        details_06: "{{ 'No remember < 24 found' if result_06.stdout | default('') | trim == '' else 'Found remember < 24' }}"

    - name: "Req 07 - Determine overall compliance status"
      set_fact:
        status_07: >-
          {%- if status_01 | trim == 'FAIL' or status_02 | trim == 'FAIL' -%}
            SKIP
          {%- elif status_03 | trim == 'PASS' and status_04 | trim == 'PASS' and status_05 | trim == 'PASS' and status_06 | trim == 'PASS' -%}
            PASS
          {%- else -%}
            FAIL
          {%- endif %}
        details_07: >-
          {%- if status_01 | trim == 'FAIL' -%}
            Skip: pwhistory.conf does not exist
          {%- elif status_02 | trim == 'FAIL' -%}
            Skip: pam_pwhistory module not present
          {%- elif status_03 | trim == 'PASS' and status_04 | trim == 'PASS' and status_05 | trim == 'PASS' and status_06 | trim == 'PASS' -%}
            All checks passed
          {%- else -%}
            One or more checks failed
          {%- endif %}
        task_07_name: "Evaluate overall compliance"
        task_07_cmd: "N/A"
        task_07_rc: "N/A"
        data_07: "N/A"

    - name: "Req 08 - Store final audit result in cis_result"
      set_fact:
        cis_result: "{{ status_07 | default('ERROR') | trim }}"

    - name: "Store requirement 08 details (no circular reference)"
      set_fact:
        task_08_name: "Store cis_result"
        task_08_cmd: "N/A"
        task_08_rc: "N/A"
        data_08: "{{ status_07 | default('ERROR') | trim }}"
        status_08: "{{ status_07 | default('ERROR') | trim }}"
        details_08: "{{ details_07 | default('') | trim }}"

    - name: "Generate audit report"
      debug:
        msg:
          - "AUDIT REPORT — CIS 5.3.3.3.1"
          - "Reference: CIS Benchmark checkpoint 5.3.3.3.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: {{ task_04_name | default('Not recorded') }}"
          - "  Command: {{ task_04_cmd | default('N/A') }}"
          - "  Exit code: {{ task_04_rc | default(-1) }}"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: {{ task_05_name | default('Not recorded') }}"
          - "  Command: {{ task_05_cmd | default('N/A') }}"
          - "  Exit code: {{ task_05_rc | default(-1) }}"
          - "  Data: {{ data_05 | default('') | trim }}"
          - "  Status: {{ status_05 | default('ERROR') | trim }}"
          - "  Details: {{ details_05 | default('') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: {{ task_06_name | default('Not recorded') }}"
          - "  Command: {{ task_06_cmd | default('N/A') }}"
          - "  Exit code: {{ task_06_rc | default(-1) }}"
          - "  Data: {{ data_06 | default('') | trim }}"
          - "  Status: {{ status_06 | default('ERROR') | trim }}"
          - "  Details: {{ details_06 | default('') | trim }}"
          - ""
          - "REQUIREMENT 07 - {{ req_07 }}:"
          - "  Task: {{ task_07_name | default('Not recorded') }}"
          - "  Command: {{ task_07_cmd | default('N/A') }}"
          - "  Exit code: {{ task_07_rc | default(-1) }}"
          - "  Data: {{ data_07 | default('') | trim }}"
          - "  Status: {{ status_07 | default('ERROR') | trim }}"
          - "  Details: {{ details_07 | default('') | trim }}"
          - ""
          - "REQUIREMENT 08 - {{ req_08 }}:"
          - "  Task: {{ task_08_name | default('Not recorded') }}"
          - "  Command: {{ task_08_cmd | default('N/A') }}"
          - "  Exit code: {{ task_08_rc | default(-1) }}"
          - "  Data: {{ data_08 | default('') | trim }}"
          - "  Status: {{ status_08 | default('ERROR') | trim }}"
          - "  Details: {{ details_08 | default('') | trim }}"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: {{ details_08 | default('Not evaluated') | trim }}"
          - "========================================================"