---
- name: "Audit CIS checkpoint 1.1.1 - Ensure 'Enforce password history' is set to '24 or more password(s)'"
  hosts: all
  # Windows: privilege is handled at the WinRM connection level.
  # Do NOT add become: yes — see windows-no-become skill.
  gather_facts: false

  vars:
    password_history_min: "24"
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: "If Domain Controller: Read 'Enforce password history' via Get-ADDefaultDomainPasswordPolicy. changed_when: false."
    req_03: "If Member Server: Read 'Enforce password history' using community.windows.win_security_policy with section=System Access. changed_when: false."
    req_04: "If Domain Controller: Evaluate whether 'Enforce password history' is equals '24 or more password(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_05: "If Member Server: Evaluate whether 'Enforce password history' is equals '24 or more password(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_07: "Create a task named 'Generate audit report' using debug msg with EXACTLY this format: AUDIT REPORT — CIS 1.1.1 / Reference: CIS Benchmark checkpoint 1.1.1"

  tasks:
    - name: "Initialize data variables"
      ansible.builtin.set_fact:
        is_dc: false
        is_member: false
        cis_result: "ERROR"
        task_01_name: "Not executed"
        task_01_cmd: "N/A"
        task_01_rc: -1
        data_01: "Not collected yet"
        status_01: "ERROR"
        details_01: "Not evaluated"
        task_02_name: "Not executed"
        task_02_cmd: "N/A"
        task_02_rc: -1
        data_02: "Not collected yet"
        status_02: "ERROR"
        details_02: "Not evaluated"
        task_03_name: "Not executed"
        task_03_cmd: "N/A"
        task_03_rc: -1
        data_03: "Not collected yet"
        status_03: "ERROR"
        details_03: "Not evaluated"
        task_04_name: "Not executed"
        task_04_cmd: "N/A"
        task_04_rc: -1
        data_04: "Not collected yet"
        status_04: "ERROR"
        details_04: "Not evaluated"
        task_05_name: "Not executed"
        task_05_cmd: "N/A"
        task_05_rc: -1
        data_05: "Not collected yet"
        status_05: "ERROR"
        details_05: "Not evaluated"

    # -----------------------------------------------------------------------
    # Req 01 - Detect Windows server role
    # -----------------------------------------------------------------------
    - name: "Req 01 - Detect Windows server role via Win32_ComputerSystem DomainRole"
      ansible.windows.win_shell: |
        (Get-CimInstance Win32_ComputerSystem).DomainRole
      register: result_01
      failed_when: false
      changed_when: false

    - name: "Store requirement 01 details"
      ansible.builtin.set_fact:
        is_dc: "{{ (result_01.stdout | default('') | trim) in ['4','5'] }}"
        is_member: "{{ (result_01.stdout | default('') | trim) in ['1','2','3'] }}"
        task_01_name: "Detect Windows server role via Win32_ComputerSystem DomainRole"
        task_01_cmd: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
        task_01_rc: "{{ result_01.rc | default(-1) }}"
        data_01: "DomainRole={{ result_01.stdout | default('unknown') | trim }}"
        status_01: "{{ ('PASS' if (result_01.rc | default(-1)) == 0 and (result_01.stdout | default('') | trim) in ['1','2','3','4','5'] else 'ERROR') | trim }}"
        details_01: "Server role detected from Win32_ComputerSystem.DomainRole: is_dc={{ (result_01.stdout | default('') | trim) in ['4','5'] }}, is_member={{ (result_01.stdout | default('') | trim) in ['1','2','3'] }}"

    # -----------------------------------------------------------------------
    # Req 02 - Domain Controller - Read Enforce password history
    # -----------------------------------------------------------------------
    - name: "Req 02 - Read Enforce password history via Get-ADDefaultDomainPasswordPolicy"
      ansible.windows.win_shell: |
        try {
          $p = Get-ADDefaultDomainPasswordPolicy -ErrorAction Stop
          Write-Output $p.PasswordHistoryCount
        } catch {
          Write-Output "ERROR: $($_.Exception.Message)"
          exit 1
        }
      register: result_02
      failed_when: false
      changed_when: false
      when: is_dc | bool

    - name: "Store requirement 02 details"
      ansible.builtin.set_fact:
        task_02_name: "Read Enforce password history via Get-ADDefaultDomainPasswordPolicy"
        task_02_cmd: "(Get-ADDefaultDomainPasswordPolicy).PasswordHistoryCount"
        task_02_rc: "{{ result_02.rc | default(-1) }}"
        data_02: "{{ result_02.stdout | default('') | trim }}"
        status_02: "{{ ('PASS' if (result_02.rc | default(-1)) == 0 else 'ERROR') | trim }}"
        details_02: "{{ ('Domain password policy read successfully' if (result_02.rc | default(-1)) == 0 else 'Failed to read domain password policy') | trim }}"
      when: is_dc | bool

    - name: "Store requirement 02 skip"
      ansible.builtin.set_fact:
        task_02_name: "Read Enforce password history via Get-ADDefaultDomainPasswordPolicy"
        task_02_cmd: "N/A - not applicable"
        data_02: "N/A"
        status_02: "SKIP"
        details_02: "Not applicable - host is a Member Server, not a Domain Controller"
      when: not (is_dc | bool)

    # -----------------------------------------------------------------------
    # Req 03 - Member Server - Read Enforce password history via secedit export
    # -----------------------------------------------------------------------
    - name: "Req 03 - Read Enforce password history on Member Server via secedit export"
      ansible.windows.win_shell: |
        $tmp = Join-Path $env:TEMP 'cis_111_secpol.cfg'
        secedit /export /areas SECURITYPOLICY /cfg $tmp | Out-Null
        $line = Get-Content $tmp | Select-String 'PasswordHistorySize' | Select-Object -First 1
        if ($line) {
          $m = [regex]::Match($line.Line, 'PasswordHistorySize\s*=\s*([0-9]+)')
          if ($m.Success) { Write-Output $m.Groups[1].Value } else { Write-Output $line.Line }
        } else {
          Write-Output 'NOT_FOUND'
        }
        Remove-Item $tmp -ErrorAction SilentlyContinue
      register: result_03
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Store requirement 03 details"
      ansible.builtin.set_fact:
        task_03_name: "Read Enforce password history on Member Server via secedit export"
        task_03_cmd: "secedit /export /areas SECURITYPOLICY | Select-String PasswordHistorySize"
        task_03_rc: "{{ result_03.rc | default(-1) }}"
        data_03: "{{ result_03.stdout | default('') | trim }}"
        status_03: "{{ ('PASS' if (result_03.rc | default(-1)) == 0 and (result_03.stdout | default('') | trim) not in ['', 'NOT_FOUND'] else 'ERROR') | trim }}"
        details_03: "{{ ('Local security policy read successfully' if (result_03.rc | default(-1)) == 0 and (result_03.stdout | default('') | trim) not in ['', 'NOT_FOUND'] else 'Failed to read local security policy value') | trim }}"
      when: is_member | bool

    - name: "Store requirement 03 skip"
      ansible.builtin.set_fact:
        task_03_name: "Read Enforce password history on Member Server via secedit export"
        task_03_cmd: "N/A - not applicable"
        data_03: "N/A"
        status_03: "SKIP"
        details_03: "Not applicable - host is a Domain Controller, not a Member Server"
      when: not (is_member | bool)

    # -----------------------------------------------------------------------
    # Req 04 - Evaluate on Domain Controller
    # -----------------------------------------------------------------------
    - name: "Req 04 - Evaluate Enforce password history on Domain Controller"
      ansible.builtin.set_fact:
        task_04_name: "Evaluate Enforce password history on Domain Controller"
        task_04_cmd: "Compare (Get-ADDefaultDomainPasswordPolicy).PasswordHistoryCount >= {{ password_history_min }}"
        task_04_rc: "{{ result_02.rc | default(-1) }}"
        data_04: "{{ data_02 | default('N/A') | trim }}"
        status_04: "{{ ('ERROR' if (result_02.rc | default(-1)) != 0 else ('PASS' if ((data_02 | default('0') | trim) | int) >= (password_history_min | int) else 'FAIL')) | trim }}"
        details_04: "{{ ('Unable to read domain password policy' if (result_02.rc | default(-1)) != 0 else ('Compliant - password history is ' ~ (data_02 | default('N/A') | trim) ~ ', minimum required is ' ~ password_history_min ~ ' or more' if ((data_02 | default('0') | trim) | int) >= (password_history_min | int) else 'Non-compliant - password history is ' ~ (data_02 | default('N/A') | trim) ~ ', must be ' ~ password_history_min ~ ' or more')) | trim }}"
      when: is_dc | bool

    - name: "Store requirement 04 skip"
      ansible.builtin.set_fact:
        task_04_name: "Evaluate Enforce password history on Domain Controller"
        task_04_cmd: "N/A - not applicable"
        data_04: "N/A"
        status_04: "SKIP"
        details_04: "Not applicable - host is a Member Server, not a Domain Controller"
      when: not (is_dc | bool)

    # -----------------------------------------------------------------------
    # Req 05 - Evaluate on Member Server
    # -----------------------------------------------------------------------
    - name: "Req 05 - Evaluate Enforce password history on Member Server"
      ansible.builtin.set_fact:
        task_05_name: "Evaluate Enforce password history on Member Server"
        task_05_cmd: "Compare secedit PasswordHistorySize >= {{ password_history_min }}"
        task_05_rc: "{{ result_03.rc | default(-1) }}"
        data_05: "{{ data_03 | default('N/A') | trim }}"
        status_05: "{{ ('ERROR' if (result_03.rc | default(-1)) != 0 or (data_03 | default('') | trim) in ['', 'NOT_FOUND'] else ('PASS' if ((data_03 | default('0') | trim) | int) >= (password_history_min | int) else 'FAIL')) | trim }}"
        details_05: "{{ ('Unable to read local security policy PasswordHistorySize' if (result_03.rc | default(-1)) != 0 or (data_03 | default('') | trim) in ['', 'NOT_FOUND'] else ('Compliant - password history is ' ~ (data_03 | default('N/A') | trim) ~ ', minimum required is ' ~ password_history_min ~ ' or more' if ((data_03 | default('0') | trim) | int) >= (password_history_min | int) else 'Non-compliant - password history is ' ~ (data_03 | default('N/A') | trim) ~ ', must be ' ~ password_history_min ~ ' or more')) | trim }}"
      when: is_member | bool

    - name: "Store requirement 05 skip"
      ansible.builtin.set_fact:
        task_05_name: "Evaluate Enforce password history on Member Server"
        task_05_cmd: "N/A - not applicable"
        data_05: "N/A"
        status_05: "SKIP"
        details_05: "Not applicable - host is a Domain Controller, not a Member Server"
      when: not (is_member | bool)

    # -----------------------------------------------------------------------
    # Req 06 - Store final audit result in cis_result
    # -----------------------------------------------------------------------
    - name: "Req 06 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        cis_result: >-
          {{ 'ERROR' if (not (is_dc | bool) and not (is_member | bool))
             else 'PASS' if (status_04 | default('SKIP') | trim == 'PASS') or (status_05 | default('SKIP') | trim == 'PASS')
             else 'FAIL' if (status_04 | default('SKIP') | trim == 'FAIL') or (status_05 | default('SKIP') | trim == 'FAIL')
             else 'ERROR' if (status_04 | default('SKIP') | trim == 'ERROR') or (status_05 | default('SKIP') | trim == 'ERROR')
             else 'SKIP' }}

    # -----------------------------------------------------------------------
    # Req 07 - Generate audit report
    # -----------------------------------------------------------------------
    - name: "Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.1"
          - "Reference: CIS Benchmark checkpoint 1.1.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: {{ task_04_name | default('Not recorded') }}"
          - "  Command: {{ task_04_cmd | default('N/A') }}"
          - "  Exit code: {{ task_04_rc | default(-1) }}"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: {{ task_05_name | default('Not recorded') }}"
          - "  Command: {{ task_05_cmd | default('N/A') }}"
          - "  Exit code: {{ task_05_rc | default(-1) }}"
          - "  Data: {{ data_05 | default('') | trim }}"
          - "  Status: {{ status_05 | default('ERROR') | trim }}"
          - "  Details: {{ details_05 | default('') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: Req 06 - Store final audit result in cis_result"
          - "  Command: set_fact cis_result"
          - "  Exit code: 0"
          - "  Data: {{ cis_result | default('ERROR') | trim }}"
          - "  Status: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: Overall compliance status derived from Domain Controller and Member Server evaluation branches"
          - ""
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"