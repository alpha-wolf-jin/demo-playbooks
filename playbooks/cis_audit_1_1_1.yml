---
- name: "Audit CIS checkpoint 1.1.1: Ensure 'Enforce password history' is set to '24 or more password(s)'"
  hosts: all
  gather_facts: false
  vars:
    password_history_min: "24"
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: "If Domain Controller: Read 'Enforce password history' via Get-ADDefaultDomainPasswordPolicy. changed_when: false."
    req_03: "If Member Server: Read 'Enforce password history' using community.windows.win_security_policy with section=System Access. changed_when: false."
    req_04: "If Domain Controller: Evaluate whether 'Enforce password history' is equals '24 or more password(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_05: "If Member Server: Evaluate whether 'Enforce password history' is equals '24 or more password(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  tasks:
    - name: "Initialize audit variables"
      ansible.builtin.set_fact:
        is_dc: false
        is_member: false
        _cis_status: "ERROR"
        data_01: "Not collected"
        status_01: "ERROR"
        details_01: "Not evaluated"
        task_01_name: "Not executed"
        task_01_cmd: "N/A"
        task_01_rc: -1
        data_02: "Not collected"
        status_02: "ERROR"
        details_02: "Not evaluated"
        task_02_name: "Not executed"
        task_02_cmd: "N/A"
        task_02_rc: -1
        data_03: "Not collected"
        status_03: "ERROR"
        details_03: "Not evaluated"
        task_03_name: "Not executed"
        task_03_cmd: "N/A"
        task_03_rc: -1
        data_04: "Not collected"
        status_04: "ERROR"
        details_04: "Not evaluated"
        task_04_name: "Not executed"
        task_04_cmd: "N/A"
        task_04_rc: -1
        data_05: "Not collected"
        status_05: "ERROR"
        details_05: "Not evaluated"
        task_05_name: "Not executed"
        task_05_cmd: "N/A"
        task_05_rc: -1
        cis_result: "ERROR"

    - name: "Req step-01 - Detect Windows server role using DomainRole from Win32_ComputerSystem"
      ansible.windows.win_shell: |
        (Get-CimInstance Win32_ComputerSystem).DomainRole
      register: _step01_output
      failed_when: false
      changed_when: false

    - name: "Req step-01 - Set role flags based on detected DomainRole"
      ansible.builtin.set_fact:
        is_dc: "{{ (_step01_output.stdout | default('') | trim | int(-1)) in [4, 5] }}"
        is_member: "{{ (_step01_output.stdout | default('') | trim | int(-1)) in [1, 2, 3] }}"
        task_01_name: "Detect Windows server role using DomainRole from Win32_ComputerSystem"
        task_01_cmd: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
        task_01_rc: "{{ _step01_output.rc | default(-1) }}"
        data_01: "DomainRole={{ _step01_output.stdout | default('') | trim }}"
        status_01: >-
          {{ 'PASS' if (_step01_output.stdout | default('') | trim) in ['1','2','3','4','5'] else 'ERROR' }}
        details_01: >-
          {{ 'DomainRole=' + (_step01_output.stdout | default('') | trim) + ' - ' + ('Domain Controller' if (_step01_output.stdout | default('') | trim) in ['4','5'] else ('Member Server' if (_step01_output.stdout | default('') | trim) in ['1','2','3'] else 'Unknown')) }}

    - name: "Req step-02 - If Domain Controller: Read Enforce password history via Get-ADDefaultDomainPasswordPolicy"
      ansible.windows.win_shell: |
        try {
          $p = Get-ADDefaultDomainPasswordPolicy -ErrorAction Stop
          Write-Output $p.PasswordHistoryCount
        } catch {
          Write-Output "ERROR: $($_.Exception.Message)"
          exit 1
        }
      register: _step02_output
      when: is_dc | bool
      failed_when: false
      changed_when: false

    - name: "Req step-02 - Store Domain Controller password history read result"
      ansible.builtin.set_fact:
        task_02_name: "Read Enforce password history via Get-ADDefaultDomainPasswordPolicy"
        task_02_cmd: "Get-ADDefaultDomainPasswordPolicy"
        task_02_rc: "{{ _step02_output.rc | default(-1) }}"
        data_02: "{{ (_step02_output.stdout | default('N/A', true) | trim) if (is_dc | bool) else 'N/A (not a Domain Controller)' }}"
        status_02: >-
          {{ 'SKIP' if not (is_dc | bool) else
             ('ERROR' if (_step02_output.rc | default(-1)) != 0 or ((_step02_output.stdout | default('', true) | trim) == '') else 'PASS') }}
        details_02: >-
          {{ 'Not a Domain Controller' if not (is_dc | bool) else
             ('Read failed' if (_step02_output.rc | default(-1)) != 0 else 'PasswordHistoryCount=' + (_step02_output.stdout | default('', true) | trim)) }}

    - name: "Req step-03 - If Member Server: Read Enforce password history via community.windows.win_security_policy"
      community.windows.win_security_policy:
        section: "System Access"
        key: "PasswordHistorySize"
        value: "{{ password_history_min }}"
      check_mode: true
      register: _step03_output
      when: is_member | bool
      failed_when: false
      changed_when: false

    - name: "Req step-03 - Read actual PasswordHistorySize value via secedit export"
      ansible.windows.win_shell: |
        $cfg = Join-Path $env:TEMP 'cis_secpol_1_1_1.cfg'
        secedit /export /cfg $cfg /areas SECURITYPOLICY 2>&1 | Out-Null
        if (Test-Path -LiteralPath $cfg) {
          $m = Select-String -Path $cfg -Pattern '^\s*PasswordHistorySize\s*=\s*\d+'
          if ($m) {
            $val = [regex]::Match($m.Line, '\d+').Value
            Write-Output $val
          } else {
            Write-Output 'NOT_FOUND'
          }
          Remove-Item -LiteralPath $cfg -ErrorAction SilentlyContinue
        } else {
          Write-Output 'EXPORT_FAILED'
        }
      register: result_03b
      when: is_member | bool
      failed_when: false
      changed_when: false

    - name: "Req step-03 - Store Member Server password history read result"
      ansible.builtin.set_fact:
        task_03_name: "Read Enforce password history via community.windows.win_security_policy and secedit export"
        task_03_cmd: "community.windows.win_security_policy (section=System Access, key=PasswordHistorySize) + secedit /export /areas SECURITYPOLICY"
        task_03_rc: "{{ 0 if ((is_member | bool) and ((result_03b.stdout | default('', true) | trim) not in ['', 'NOT_FOUND', 'EXPORT_FAILED'])) else -1 }}"
        data_03: "{{ (result_03b.stdout | default('N/A', true) | trim) if (is_member | bool) else 'N/A (not a Member Server)' }}"
        status_03: >-
          {{ 'SKIP' if not (is_member | bool) else
             ('ERROR' if ((result_03b.stdout | default('', true) | trim) in ['', 'NOT_FOUND', 'EXPORT_FAILED']) else 'PASS') }}
        details_03: >-
          {{ 'Not a Member Server' if not (is_member | bool) else
             ('Read failed or key absent' if ((result_03b.stdout | default('', true) | trim) in ['', 'NOT_FOUND', 'EXPORT_FAILED']) else 'PasswordHistorySize=' + (result_03b.stdout | default('', true) | trim)) }}

    - name: "Req step-04 - If Domain Controller: Evaluate Enforce password history compliance and set _cis_status"
      ansible.builtin.set_fact:
        _cis_status: >-
          {{ 'SKIP' if not (is_dc | bool) else
             ('ERROR' if (_step02_output.rc | default(-1)) != 0 or ((_step02_output.stdout | default('', true) | trim) == '') else
              ('PASS' if ((_step02_output.stdout | default('', true) | trim) | int(-1)) >= (password_history_min | int) else 'FAIL')) }}
        task_04_name: "Evaluate Enforce password history on Domain Controller"
        task_04_cmd: "N/A (evaluation of Get-ADDefaultDomainPasswordPolicy output)"
        task_04_rc: 0
        data_04: "{{ (_step02_output.stdout | default('N/A', true) | trim) if (is_dc | bool) else 'N/A (not a Domain Controller)' }}"
        status_04: >-
          {{ 'SKIP' if not (is_dc | bool) else
             ('ERROR' if (_step02_output.rc | default(-1)) != 0 or ((_step02_output.stdout | default('', true) | trim) == '') else
              ('PASS' if ((_step02_output.stdout | default('', true) | trim) | int(-1)) >= (password_history_min | int) else 'FAIL')) }}
        details_04: >-
          {{ 'Not a Domain Controller' if not (is_dc | bool) else
             ('Read failed or no value returned' if (_step02_output.rc | default(-1)) != 0 or ((_step02_output.stdout | default('', true) | trim) == '') else
              ('PasswordHistoryCount=' + (_step02_output.stdout | default('', true) | trim) + ' >= ' + password_history_min + ' - password history requirement met') if ((_step02_output.stdout | default('', true) | trim) | int(-1)) >= (password_history_min | int) else
              ('PasswordHistoryCount=' + (_step02_output.stdout | default('', true) | trim) + ' < ' + password_history_min + ' - password history requirement NOT met')) }}

    - name: "Req step-05 - If Member Server: Evaluate Enforce password history compliance and set _cis_status"
      ansible.builtin.set_fact:
        _cis_status: >-
          {{ _cis_status if not (is_member | bool) else
             ('ERROR' if ((result_03b.stdout | default('', true) | trim) in ['', 'NOT_FOUND', 'EXPORT_FAILED']) else
              ('PASS' if ((result_03b.stdout | default('', true) | trim) | int(-1)) >= (password_history_min | int) else 'FAIL')) }}
        task_05_name: "Evaluate Enforce password history on Member Server"
        task_05_cmd: "N/A (evaluation of secedit PasswordHistorySize)"
        task_05_rc: 0
        data_05: "{{ (result_03b.stdout | default('N/A', true) | trim) if (is_member | bool) else 'N/A (not a Member Server)' }}"
        status_05: >-
          {{ 'SKIP' if not (is_member | bool) else
             ('ERROR' if ((result_03b.stdout | default('', true) | trim) in ['', 'NOT_FOUND', 'EXPORT_FAILED']) else
              ('PASS' if ((result_03b.stdout | default('', true) | trim) | int(-1)) >= (password_history_min | int) else 'FAIL')) }}
        details_05: >-
          {{ 'Not a Member Server' if not (is_member | bool) else
             ('Read failed or no value returned' if ((result_03b.stdout | default('', true) | trim) in ['', 'NOT_FOUND', 'EXPORT_FAILED']) else
              ('PasswordHistorySize=' + (result_03b.stdout | default('', true) | trim) + ' >= ' + password_history_min + ' - password history requirement met') if ((result_03b.stdout | default('', true) | trim) | int(-1)) >= (password_history_min | int) else
              ('PasswordHistorySize=' + (result_03b.stdout | default('', true) | trim) + ' < ' + password_history_min + ' - password history requirement NOT met')) }}

    - name: "Req step-06 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        cis_result: "{{ _cis_status | default('ERROR') | trim }}"

    - name: "Req step-07 - Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.1"
          - "Reference: CIS Benchmark checkpoint 1.1.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: {{ task_04_name | default('Not recorded') }}"
          - "  Command: {{ task_04_cmd | default('N/A') }}"
          - "  Exit code: {{ task_04_rc | default(-1) }}"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: {{ task_05_name | default('Not recorded') }}"
          - "  Command: {{ task_05_cmd | default('N/A') }}"
          - "  Exit code: {{ task_05_rc | default(-1) }}"
          - "  Data: {{ data_05 | default('') | trim }}"
          - "  Status: {{ status_05 | default('ERROR') | trim }}"
          - "  Details: {{ details_05 | default('') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: Store final audit result in cis_result"
          - "  Command: set_fact cis_result"
          - "  Exit code: 0"
          - "  Data: {{ cis_result | default('ERROR') | trim }}"
          - "  Status: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: Derived from _cis_status (active branch evaluation status)."
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: Role={{ 'Domain Controller' if (is_dc | bool) else ('Member Server' if (is_member | bool) else 'Unknown') }}; minimum required password history = {{ password_history_min }}"
          - "========================================================"