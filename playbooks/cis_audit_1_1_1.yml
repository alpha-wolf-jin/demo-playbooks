---
- name: "Audit CIS checkpoint 1.1.1: Ensure 'Enforce password history' is set to '24 or more password(s)'"
  hosts: all
  gather_facts: false
  vars:
    password_history_min: "24"
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: "If Domain Controller: Read 'Enforce password history' via Get-ADDefaultDomainPasswordPolicy. changed_when: false."
    req_03: "If Member Server: Read 'Enforce password history' using community.windows.win_security_policy with section=System Access. changed_when: false."
    req_04: "If Domain Controller: Evaluate whether 'Enforce password history' is equals '24 or more password(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_05: "If Member Server: Evaluate whether 'Enforce password history' is equals '24 or more password(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_07: "Create a task named 'Generate audit report' using debug msg with EXACTLY this format."

  tasks:
    - name: "Req step-01 - Detect Windows server role using DomainRole property"
      ansible.windows.win_shell: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
      register: _step01_output
      failed_when: false
      changed_when: false

    - name: "Req step-01 - Set role flags and record detection details"
      ansible.builtin.set_fact:
        is_dc: "{{ _step01_output.stdout | default('') | trim in ['4','5'] }}"
        is_member: "{{ _step01_output.stdout | default('') | trim in ['1','2','3'] }}"
        role_detection_error: "{{ _step01_output.rc | default(-1) != 0 or ((_step01_output.stdout | default('') | trim) not in ['1','2','3','4','5']) }}"
        data_01: "{{ _step01_output.stdout | default('') | trim }}"
        status_01: "{{ 'PASS' if (_step01_output.rc | default(-1) == 0 and (_step01_output.stdout | default('') | trim in ['1','2','3','4','5'])) else 'ERROR' }}"
        details_01: "{{ ('Detected DomainRole ' ~ (_step01_output.stdout | default('') | trim)) if (_step01_output.rc | default(-1) == 0 and (_step01_output.stdout | default('') | trim in ['1','2','3','4','5'])) else 'Role detection failed or unrecognised DomainRole' }}"
        task_01_name: "Detect Windows server role using DomainRole property"
        task_01_cmd: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
        task_01_rc: "{{ _step01_output.rc | default(-1) }}"
        status_02: "SKIP"
        data_02: "N/A"
        status_03: "SKIP"
        data_03: "N/A"
        status_04: "SKIP"
        data_04: "N/A"
        status_05: "SKIP"
        data_05: "N/A"

    - name: "Req step-02 - Read Enforce password history from Active Directory default domain policy"
      ansible.windows.win_shell: "Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount"
      register: _step02_output
      when: is_dc | bool
      failed_when: false
      changed_when: false

    - name: "Req step-03 - Read Enforce password history using win_security_policy module"
      community.windows.win_security_policy:
        section: System Access
        key: PasswordHistorySize
        value: "{{ password_history_min }}"
      check_mode: true
      register: _step03_output
      when: is_member | bool
      failed_when: false
      changed_when: false

    - name: "Req step-03 - Read Enforce password history value via secedit"
      ansible.windows.win_shell: |
        $tmp = Join-Path $env:TEMP 'cis_secpol_audit.cfg'
        secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet | Out-Null
        if (Test-Path $tmp) {
          $line = Select-String -Path $tmp -Pattern '^\s*PasswordHistorySize\s*=\s*\d+' | Select-Object -First 1
          if ($line) {
            $val = [regex]::Match($line.Line, '\d+').Value
            Write-Output $val
          } else {
            Write-Output 'NOT_FOUND'
          }
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue
        } else {
          Write-Output 'EXPORT_FAILED'
        }
      register: _member_secedit
      when: is_member | bool
      failed_when: false
      changed_when: false

    - name: "Req step-04 - Evaluate Enforce password history compliance on Domain Controller"
      ansible.builtin.set_fact:
        data_02: "{{ _step02_output.stdout | default('') | trim }}"
        status_02: "{{ 'PASS' if ((_step02_output.rc | default(-1) == 0) and ((_step02_output.stdout | default('') | trim) is match('^[0-9]+$'))) else 'ERROR' }}"
        details_02: "{{ ('Read AD default domain password policy PasswordHistoryCount=' ~ (_step02_output.stdout | default('') | trim)) if ((_step02_output.rc | default(-1) == 0) and ((_step02_output.stdout | default('') | trim) is match('^[0-9]+$'))) else 'Failed to read AD default domain password policy' }}"
        task_02_name: "Read Enforce password history from Active Directory default domain policy"
        task_02_cmd: "Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount"
        task_02_rc: "{{ _step02_output.rc | default(-1) }}"
        data_04: "{{ _step02_output.stdout | default('') | trim }}"
        status_04: >-
          {{ 'ERROR' if ((_step02_output.rc | default(-1) != 0) or not ((_step02_output.stdout | default('') | trim) is match('^[0-9]+$'))) else
             'PASS' if ((_step02_output.stdout | default('') | trim) | int) >= (password_history_min | int) else
             'FAIL' }}
        _cis_status: >-
          {{ 'ERROR' if ((_step02_output.rc | default(-1) != 0) or not ((_step02_output.stdout | default('') | trim) is match('^[0-9]+$'))) else
             'PASS' if ((_step02_output.stdout | default('') | trim) | int) >= (password_history_min | int) else
             'FAIL' }}
        details_04: >-
          {{ ('Failed to read AD policy') if ((_step02_output.rc | default(-1) != 0) or not ((_step02_output.stdout | default('') | trim) is match('^[0-9]+$'))) else
             ('DC password history is ' ~ (_step02_output.stdout | default('') | trim) ~ '; required ' ~ password_history_min ~ ' or more') }}
      when: is_dc | bool

    - name: "Req step-05 - Evaluate Enforce password history compliance on Member Server"
      ansible.builtin.set_fact:
        data_03: "{{ (_member_secedit.stdout | default('') | trim) if (is_member | bool) else 'N/A' }}"
        status_03: "{{ 'SKIP' if not (is_member | bool) else ('PASS' if ((_member_secedit.stdout | default('') | trim) is match('^[0-9]+$')) else 'ERROR') }}"
        details_03: "{{ 'Not applicable' if not (is_member | bool) else (('Read PasswordHistorySize=' ~ (_member_secedit.stdout | default('') | trim)) if ((_member_secedit.stdout | default('') | trim) is match('^[0-9]+$')) else 'Failed to read PasswordHistorySize') }}"
        task_03_name: "Read Enforce password history from local security policy"
        task_03_cmd: |-
          secedit /export /cfg %TEMP%\\cis_secpol_audit.cfg /areas SECURITYPOLICY /quiet
        task_03_rc: "{{ (_member_secedit.rc | default(-1)) if (is_member | bool) else -1 }}"
        data_05: "{{ (_member_secedit.stdout | default('') | trim) if (is_member | bool) else 'N/A' }}"
        status_05: >-
          {{ 'SKIP' if not (is_member | bool) else
             'ERROR' if not ((_member_secedit.stdout | default('') | trim) is match('^[0-9]+$')) else
             'PASS' if ((_member_secedit.stdout | default('') | trim) | int) >= (password_history_min | int) else
             'FAIL' }}
        _cis_status: >-
          {{ 'SKIP' if not (is_member | bool) else
             'ERROR' if not ((_member_secedit.stdout | default('') | trim) is match('^[0-9]+$')) else
             'PASS' if ((_member_secedit.stdout | default('') | trim) | int) >= (password_history_min | int) else
             'FAIL' }}
        details_05: >-
          {{ 'Not applicable' if not (is_member | bool) else
             ('Error reading Member Server password history') if not ((_member_secedit.stdout | default('') | trim) is match('^[0-9]+$')) else
             ('Member Server password history is ' ~ (_member_secedit.stdout | default('') | trim) ~ '; required ' ~ password_history_min ~ ' or more') }}
      when: is_member | bool

    - name: "Req step-06 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        cis_result: "{{ 'ERROR' if (role_detection_error | default(true) | bool) else (_cis_status | default('ERROR') | trim) }}"
        data_06: "{{ 'ERROR' if (role_detection_error | default(true) | bool) else (_cis_status | default('ERROR') | trim) }}"
        status_06: "{{ 'ERROR' if (role_detection_error | default(true) | bool) else (_cis_status | default('ERROR') | trim) }}"
        details_06: "Overall compliance result derived from active branch verification"
        task_06_name: "Store final audit result in cis_result"
        task_06_cmd: "set_fact cis_result from active branch verify status"
        task_06_rc: 0

    - name: "Req step-07 - Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.1"
          - "Reference: CIS Benchmark checkpoint 1.1.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: Evaluate Enforce password history compliance on Domain Controller"
          - "  Command: Compare PasswordHistoryCount to {{ password_history_min }}"
          - "  Exit code: 0"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: Evaluate Enforce password history compliance on Member Server"
          - "  Command: Compare PasswordHistorySize to {{ password_history_min }}"
          - "  Exit code: 0"
          - "  Data: {{ data_05 | default('') | trim }}"
          - "  Status: {{ status_05 | default('ERROR') | trim }}"
          - "  Details: {{ details_05 | default('') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: {{ task_06_name | default('Not recorded') }}"
          - "  Command: {{ task_06_cmd | default('N/A') }}"
          - "  Exit code: {{ task_06_rc | default(-1) }}"
          - "  Data: {{ data_06 | default('') | trim }}"
          - "  Status: {{ status_06 | default('ERROR') | trim }}"
          - "  Details: {{ details_06 | default('') | trim }}"
          - ""
          - "REQUIREMENT 07 - {{ req_07 }}:"
          - "  Task: Generate audit report"
          - "  Command: N/A"
          - "  Exit code: 0"
          - "  Data: Audit report generated"
          - "  Status: PASS"
          - "  Details: Report generated successfully"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: {{ details_06 | default('') | trim }}"
          - "========================================================"