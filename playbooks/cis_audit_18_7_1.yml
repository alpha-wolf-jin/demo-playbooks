---
- name: "Audit CIS checkpoint 18.7.1: Ensure 'Allow Print Spooler to accept client connections' is set to 'Disabled'"
  hosts: all
  gather_facts: false
  vars:
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: |-
      If Domain Controller: Use ansible.windows.win_reg_stat to read the GP registry key: path='HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers' name='RegisterSpoolerRemoteRpcEndPoint'. The module returns structured data — result.exists (bool) and result.value (integer for REG_DWORD). Do NOT use win_shell or Get-ItemProperty — win_reg_stat is the correct read-only module for registry keys. changed_when: false; failed_when: false.
    req_03: |-
      If Member Server: Use ansible.windows.win_reg_stat to read the GP registry key: path='HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers' name='RegisterSpoolerRemoteRpcEndPoint'. The module returns structured data — result.exists (bool) and result.value (integer for REG_DWORD). Do NOT use win_shell or Get-ItemProperty — win_reg_stat is the correct read-only module for registry keys. changed_when: false; failed_when: false.
    req_04: "If Domain Controller: Evaluate whether 'Ensure 'Allow Print Spooler to accept client connections' is set to 'Disabled'' is set correctly. Check the registry data collected by the previous step — the result has structured fields, NOT stdout text: PASS if .exists == true AND .value == 2 (REG_DWORD integer). FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 2. ERROR if the registry read step failed unexpectedly. Do NOT check .stdout or .rc — the result is a structured dict."
    req_05: "If Member Server: Evaluate whether 'Ensure 'Allow Print Spooler to accept client connections' is set to 'Disabled'' is set correctly. Check the registry data collected by the previous step — the result has structured fields, NOT stdout text: PASS if .exists == true AND .value == 2 (REG_DWORD integer). FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 2. ERROR if the registry read step failed unexpectedly. Do NOT check .stdout or .rc — the result is a structured dict."
    req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_10: "Check if Print Spooler service is installed/available. If NOT installed, report SKIP for all checks."
    reg_path: |-
      HKLM:\Software\Policies\Microsoft\Windows NT\Printers
    reg_name: 'RegisterSpoolerRemoteRpcEndPoint'

  tasks:
    - name: "Initialize audit report variables"
      ansible.builtin.set_fact:
        status_01: "SKIP"
        status_02: "SKIP"
        status_03: "SKIP"
        status_04: "SKIP"
        status_05: "SKIP"
        status_06: "SKIP"
        status_10: "SKIP"
        data_01: ""
        data_02: ""
        data_03: ""
        data_04: ""
        data_05: ""
        data_06: ""
        data_10: ""
        details_01: ""
        details_02: ""
        details_03: ""
        details_04: ""
        details_05: ""
        details_06: ""
        details_10: ""
        task_01_name: "Not executed"
        task_01_cmd: "N/A"
        task_01_rc: -1
        task_02_name: "Not executed"
        task_02_cmd: "N/A"
        task_02_rc: -1
        task_03_name: "Not executed"
        task_03_cmd: "N/A"
        task_03_rc: -1
        task_04_name: "Not executed"
        task_04_cmd: "N/A"
        task_04_rc: -1
        task_05_name: "Not executed"
        task_05_cmd: "N/A"
        task_05_rc: -1
        task_06_name: "Not executed"
        task_06_cmd: "N/A"
        task_06_rc: -1
        task_10_name: "Not executed"
        task_10_cmd: "N/A"
        task_10_rc: -1
        spooler_installed: false
        spooler_check_error: false
      changed_when: false

    - name: "Req step-01 - Detect Windows server role using DomainRole"
      ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
      register: _step01_output
      changed_when: false
      failed_when: false

    - name: "Req step-01 - Set role flags and store requirement 01 details"
      ansible.builtin.set_fact:
        is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
        is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
        role_detection_error: "{{ (_step01_output.rc | default(-1) != 0) or ((_step01_output.stdout | default('') | trim) not in ['1', '2', '3', '4', '5']) }}"
        status_01: "{{ 'PASS' if (_step01_output.rc | default(-1) == 0) and ((_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5']) else 'ERROR' }}"
        data_01: "{{ _step01_output.stdout | default('') | trim }}"
        details_01: "{{ 'DomainRole ' ~ (_step01_output.stdout | default('') | trim) ~ ' detected' if (_step01_output.rc | default(-1) == 0) and ((_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5']) else 'Failed or invalid DomainRole' }}"
        task_01_name: "Detect Windows server role via Win32_ComputerSystem.DomainRole"
        task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
        task_01_rc: "{{ _step01_output.rc | default(-1) }}"
      changed_when: false

    - name: "Req step-10 - Check Print Spooler service availability"
      ansible.windows.win_service_info:
        name: Spooler
      register: spooler_service_info
      changed_when: false
      failed_when: false

    - name: "Req step-10 - Store spooler_installed fact and requirement 10 details"
      ansible.builtin.set_fact:
        spooler_installed: "{{ (spooler_service_info.exists | default(false)) | bool }}"
        spooler_check_error: "{{ spooler_service_info.exists is not defined }}"
        status_10: >-
          {{ 'ERROR' if (spooler_service_info.exists is not defined) else
             'PASS' if (spooler_service_info.exists | default(false) | bool) else
             'SKIP' }}
        data_10: "{{ (spooler_service_info.exists | default('') | string) if spooler_service_info.exists is defined else 'N/A' }}"
        details_10: >-
          {{ 'Print Spooler service check failed' if (spooler_service_info.exists is not defined) else
             'Print Spooler service is installed' if (spooler_service_info.exists | default(false) | bool) else
             'Print Spooler service is not installed' }}
        task_10_name: "Check Print Spooler service availability"
        task_10_cmd: "ansible.windows.win_service_info name='Spooler'"
        task_10_rc: "{{ 0 if spooler_service_info.exists is defined else 1 }}"
      changed_when: false

    - name: "Req step-02 - Read GP registry key on Domain Controller"
      ansible.windows.win_reg_stat:
        path: "{{ reg_path }}"
        name: "{{ reg_name }}"
      register: _step02_output
      when: is_dc | bool and spooler_installed | bool
      changed_when: false
      failed_when: false

    - name: "Req step-02 - Store DC registry read details"
      ansible.builtin.set_fact:
        status_02: >-
          {{ 'ERROR' if (spooler_check_error | bool) else
             'SKIP' if not (spooler_installed | bool) else
             'PASS' if (_step02_output is defined and _step02_output.exists is defined) else
             'ERROR' }}
        data_02: "{{ (_step02_output.value | default('')) if (spooler_installed | bool and _step02_output is defined and _step02_output.exists is defined) else 'N/A' }}"
        details_02: >-
          {{ 'ERROR: Print Spooler service check failed' if (spooler_check_error | bool) else
             'SKIP: Print Spooler service not installed' if not (spooler_installed | bool) else
             'Registry key read successfully; exists=' ~ (_step02_output.exists | default(false) | string) ~ ', value=' ~ (_step02_output.value | default('') | string) if (_step02_output is defined and _step02_output.exists is defined) else
             'Registry read failed' }}
        task_02_name: "Read GP registry key on Domain Controller"
        task_02_cmd: |-
          ansible.windows.win_reg_stat path='HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers' name='RegisterSpoolerRemoteRpcEndPoint'
        task_02_rc: "{{ 0 if (_step02_output is defined and _step02_output.exists is defined) else 1 }}"
      when: is_dc | bool
      changed_when: false

    - name: "Req step-03 - Read GP registry key on Member Server"
      ansible.windows.win_reg_stat:
        path: "{{ reg_path }}"
        name: "{{ reg_name }}"
      register: _step03_output
      when: is_member | bool and spooler_installed | bool
      changed_when: false
      failed_when: false

    - name: "Req step-03 - Store Member registry read details"
      ansible.builtin.set_fact:
        status_03: >-
          {{ 'ERROR' if (spooler_check_error | bool) else
             'SKIP' if not (spooler_installed | bool) else
             'PASS' if (_step03_output is defined and _step03_output.exists is defined) else
             'ERROR' }}
        data_03: "{{ (_step03_output.value | default('')) if (spooler_installed | bool and _step03_output is defined and _step03_output.exists is defined) else 'N/A' }}"
        details_03: >-
          {{ 'ERROR: Print Spooler service check failed' if (spooler_check_error | bool) else
             'SKIP: Print Spooler service not installed' if not (spooler_installed | bool) else
             'Registry key read successfully; exists=' ~ (_step03_output.exists | default(false) | string) ~ ', value=' ~ (_step03_output.value | default('') | string) if (_step03_output is defined and _step03_output.exists is defined) else
             'Registry read failed' }}
        task_03_name: "Read GP registry key on Member Server"
        task_03_cmd: |-
          ansible.windows.win_reg_stat path='HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers' name='RegisterSpoolerRemoteRpcEndPoint'
        task_03_rc: "{{ 0 if (_step03_output is defined and _step03_output.exists is defined) else 1 }}"
      when: is_member | bool
      changed_when: false

    - name: "Req step-04 - Evaluate DC registry compliance"
      ansible.builtin.set_fact:
        _cis_status: >-
          {{ 'ERROR' if (spooler_check_error | bool) else
             'SKIP' if not (spooler_installed | bool) else
             'ERROR' if not (_step02_output is defined and _step02_output.exists is defined) else
             'PASS' if (_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 2) else
             'FAIL' }}
        status_04: >-
          {{ 'ERROR' if (spooler_check_error | bool) else
             'SKIP' if not (spooler_installed | bool) else
             'ERROR' if not (_step02_output is defined and _step02_output.exists is defined) else
             'PASS' if (_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 2) else
             'FAIL' }}
        data_04: "{{ (_step02_output.value | default('')) if (spooler_installed | bool and _step02_output is defined and _step02_output.exists is defined) else 'N/A' }}"
        details_04: >-
          {{ 'ERROR: Print Spooler service check failed' if (spooler_check_error | bool) else
             'SKIP: Print Spooler service not installed' if not (spooler_installed | bool) else
             'ERROR: registry read failed' if not (_step02_output is defined and _step02_output.exists is defined) else
             'PASS: exists=true value=2' if (_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 2) else
             'FAIL: exists=' ~ (_step02_output.exists | default(false) | string) ~ ' value=' ~ (_step02_output.value | default('') | string) }}
        task_04_name: "Evaluate DC compliance status"
        task_04_cmd: "N/A"
        task_04_rc: "{{ 0 if (_step02_output is defined and _step02_output.exists is defined) else 1 }}"
      when: is_dc | bool
      changed_when: false

    - name: "Req step-05 - Evaluate Member registry compliance"
      ansible.builtin.set_fact:
        _cis_status: >-
          {{ 'ERROR' if (spooler_check_error | bool) else
             'SKIP' if not (spooler_installed | bool) else
             'ERROR' if not (_step03_output is defined and _step03_output.exists is defined) else
             'PASS' if (_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 2) else
             'FAIL' }}
        status_05: >-
          {{ 'ERROR' if (spooler_check_error | bool) else
             'SKIP' if not (spooler_installed | bool) else
             'ERROR' if not (_step03_output is defined and _step03_output.exists is defined) else
             'PASS' if (_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 2) else
             'FAIL' }}
        data_05: "{{ (_step03_output.value | default('')) if (spooler_installed | bool and _step03_output is defined and _step03_output.exists is defined) else 'N/A' }}"
        details_05: >-
          {{ 'ERROR: Print Spooler service check failed' if (spooler_check_error | bool) else
             'SKIP: Print Spooler service not installed' if not (spooler_installed | bool) else
             'ERROR: registry read failed' if not (_step03_output is defined and _step03_output.exists is defined) else
             'PASS: exists=true value=2' if (_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 2) else
             'FAIL: exists=' ~ (_step03_output.exists | default(false) | string) ~ ' value=' ~ (_step03_output.value | default('') | string) }}
        task_05_name: "Evaluate Member compliance status"
        task_05_cmd: "N/A"
        task_05_rc: "{{ 0 if (_step03_output is defined and _step03_output.exists is defined) else 1 }}"
      when: is_member | bool
      changed_when: false

    - name: "Req step-06 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        cis_result: >-
          {{ 'ERROR' if (role_detection_error | default(false) | bool) or (spooler_check_error | bool) else
             'SKIP' if not (spooler_installed | bool) else
             (status_04 if (is_dc | default(false) | bool) else
              status_05 if (is_member | default(false) | bool) else
              'ERROR') }}
        status_06: >-
          {{ 'ERROR' if (role_detection_error | default(false) | bool) or (spooler_check_error | bool) else
             'SKIP' if not (spooler_installed | bool) else
             (status_04 if (is_dc | default(false) | bool) else
              status_05 if (is_member | default(false) | bool) else
              'ERROR') }}
        data_06: "N/A"
        details_06: "Stored final audit result in cis_result"
        task_06_name: "Store final audit result in cis_result"
        task_06_cmd: "set_fact"
        task_06_rc: 0
      changed_when: false

    - name: "Req step-07 - Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 18.7.1"
          - "Reference: CIS Benchmark checkpoint 18.7.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: {{ task_04_name | default('Not recorded') }}"
          - "  Command: {{ task_04_cmd | default('N/A') }}"
          - "  Exit code: {{ task_04_rc | default(-1) }}"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: {{ task_05_name | default('Not recorded') }}"
          - "  Command: {{ task_05_cmd | default('N/A') }}"
          - "  Exit code: {{ task_05_rc | default(-1) }}"
          - "  Data: {{ data_05 | default('') | trim }}"
          - "  Status: {{ status_05 | default('ERROR') | trim }}"
          - "  Details: {{ details_05 | default('') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: {{ task_06_name | default('Not recorded') }}"
          - "  Command: {{ task_06_cmd | default('N/A') }}"
          - "  Exit code: {{ task_06_rc | default(-1) }}"
          - "  Data: {{ data_06 | default('') | trim }}"
          - "  Status: {{ status_06 | default('ERROR') | trim }}"
          - "  Details: {{ details_06 | default('') | trim }}"
          - ""
          - "REQUIREMENT 10 - {{ req_10 }}:"
          - "  Task: {{ task_10_name | default('Not recorded') }}"
          - "  Command: {{ task_10_cmd | default('N/A') }}"
          - "  Exit code: {{ task_10_rc | default(-1) }}"
          - "  Data: {{ data_10 | default('') | trim }}"
          - "  Status: {{ status_10 | default('ERROR') | trim }}"
          - "  Details: {{ details_10 | default('') | trim }}"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "========================================================"