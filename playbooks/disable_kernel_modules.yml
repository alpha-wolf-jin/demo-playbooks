---
- name: "SOP playbook 'disable_kernel_modules' (ACTION — changes system state): Disables specified kernel modules on managed Linux hosts by unloading them (if loaded) and adding install and blacklist directives to configuration files under /etc/modprobe.d/. Processes a comma-separated list of module names."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    playbook_name: "disable_kernel_modules"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    target_server: ""
    module_list: "gfs2"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Backup /etc/modprobe.d/ directory"
      ansible.builtin.shell: |
        set -o pipefail
        if [ -d /etc/modprobe.d ]; then
          cp -a /etc/modprobe.d/ {{ backup_dir }}/modprobe.d.backup
        fi
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Record initial module load state"
      ansible.builtin.shell: |
        set -o pipefail
        mod={{ item }}
        if lsmod | grep -q "^$mod "; then
          echo "loaded" > "{{ backup_dir }}/module_state_$mod"
        else
          echo "not_loaded" > "{{ backup_dir }}/module_state_$mod"
        fi
      args:
        executable: /bin/bash
      loop: "{{ module_list.split(',') | map('trim') | reject('equalto', '') | list }}"
      changed_when: false
      failed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Validate required variable target_server is not empty"
          ansible.builtin.assert:
            that:
              - "target_server != ''"
            fail_msg: "target_server must be provided and must not be empty"
          tags: [execute]

        - name: "Step-01 - Parse input module list"
          ansible.builtin.set_fact:
            _module_list: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | list }}"
            _module_list_str: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | join(' ') }}"
          tags: [execute]

        - name: "Step-02 - Remediate kernel modules"
          ansible.builtin.shell: |
            set -o pipefail
            for mod in {{ _module_list_str }}; do
              actions=""
              error=""
              status="success"
              # Unload if loaded
              if lsmod | grep -q "^$mod "; then
                if modprobe -r $mod 2>/dev/null; then
                  actions="$actions,unloaded"
                else
                  status="failure"
                  error="$error,unload_failed"
                  actions="$actions,unload_failed"
                fi
              else
                actions="$actions,already_unloaded"
              fi
              # Ensure install directive
              conf_file="/etc/modprobe.d/$mod.conf"
              if ! grep -q "^install $mod /bin/false$" "$conf_file" 2>/dev/null; then
                echo "install $mod /bin/false" >> "$conf_file" && actions="$actions,install_added" || { status="failure"; error="$error,install_fail"; }
              else
                actions="$actions,install_exists"
              fi
              # Ensure blacklist
              if ! grep -q "^blacklist $mod$" "$conf_file" 2>/dev/null; then
                echo "blacklist $mod" >> "$conf_file" && actions="$actions,blacklist_added" || { status="failure"; error="$error,blacklist_fail"; }
              else
                actions="$actions,blacklist_exists"
              fi
              # Final verification: module not loaded and config contains both lines
              if lsmod | grep -q "^$mod "; then
                status="failure"
                error="$error,still_loaded"
              fi
              if ! grep -q "^install $mod /bin/false$" "$conf_file" 2>/dev/null || ! grep -q "^blacklist $mod$" "$conf_file" 2>/dev/null; then
                status="failure"
                error="$error,config_missing"
              fi
              # Trim leading comma
              actions="${actions#,}"
              error="${error#,}"
              echo "module:$mod status:$status actions:$actions error:$error"
            done
          args:
            executable: /bin/bash
          register: _remediation_result
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Step-03 - Parse per-module results"
          ansible.builtin.set_fact:
            _module_results: |
              {%- set ns = namespace(results=[]) -%}
              {%- for line in _remediation_result.stdout_lines -%}
              {%-   set parts = line | regex_replace('^module:(\S+) status:(\S+) actions:(.*) error:(.*)$', '\g<1>|||\g<2>|||\g<3>|||\g<4>') | split('|||') -%}
              {%-   set name = parts[0] | trim -%}
              {%-   set status = parts[1] | trim -%}
              {%-   set actions_str = parts[2] | trim -%}
              {%-   set error_val = parts[3] | trim -%}
              {%-   set actions_list = actions_str.split(',') | map('trim') | reject('equalto', '') | list -%}
              {%-   set ns.results = ns.results + [{'name': name, 'status': status, 'actions': actions_list, 'error': error_val}] -%}
              {%- endfor -%}
              {{ ns.results }}
          tags: [execute]

        - name: "Step-03b - Derive overall success flag"
          ansible.builtin.set_fact:
            _all_succeeded: "{{ (_module_results | selectattr('status', 'equalto', 'failure') | list | length) == 0 }}"
          tags: [execute]

        - name: "Step-04 - Emit result block (success)"
          ansible.builtin.debug:
            msg: |
              <result>
              all_succeeded: {{ _all_succeeded }}
              modules: {{ _module_results }}
              </result>
          tags: [execute]

      rescue:
        - name: "Step-05 - Emit error block"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: disable_kernel_modules failed. Host: {{ inventory_hostname }} Reason: {{ ansible_failed_task.name | default('unknown') }} - {{ ansible_failed_result.msg | default('No message') }}
              </result>
          failed_when: false

        - name: "Fail the playbook"
          ansible.builtin.fail:
            msg: "disable_kernel_modules failed"

      always:
        - name: "Restore - Check if modprobe backup exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/modprobe.d.backup"
          register: _restore_modprobe_backup
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore /etc/modprobe.d/ from backup"
          ansible.builtin.shell: |
            set -o pipefail
            rm -rf /etc/modprobe.d/*
            cp -a {{ backup_dir }}/modprobe.d.backup/* /etc/modprobe.d/ 2>/dev/null || true
          args:
            executable: /bin/bash
          when:
            - _restore_modprobe_backup.stat.exists | default(false)
            - _restore_modprobe_backup.stat.isdir | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Reload modules that were originally loaded"
          ansible.builtin.shell: |
            set -o pipefail
            mod={{ item }}
            if [ -f "{{ backup_dir }}/module_state_$mod" ] && [ "$(cat {{ backup_dir }}/module_state_$mod)" = "loaded" ]; then
              modprobe $mod 2>/dev/null || true
            fi
          args:
            executable: /bin/bash
          loop: "{{ module_list.split(',') | map('trim') | reject('equalto', '') | list }}"
          when:
            - _restore_modprobe_backup.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Clean up backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]