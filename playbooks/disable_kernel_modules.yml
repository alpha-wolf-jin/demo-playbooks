---
- name: "SOP playbook 'disable_kernel_modules' (ACTION — changes system state): Disables specified kernel modules on managed Linux hosts by unloading them (if loaded) and adding install and blacklist directives to configuration files under /etc/modprobe.d/. Processes a comma-separated list of module names."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  become_user: root
  gather_facts: false
  vars:
    target_server: ""
    module_list: "gfs2"
    playbook_name: "disable_kernel_modules"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Back up entire /etc/modprobe.d/ directory"
      ansible.builtin.shell: |
        set -o pipefail
        cp -a /etc/modprobe.d/ "{{ backup_dir }}/modprobe.d.bak" 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Record currently loaded kernel modules"
      ansible.builtin.shell: |
        set -o pipefail
        lsmod | awk '{if(NR>1) print $1}'
      args:
        executable: /bin/bash
      register: _snap_lsmod
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save loaded module list to file"
      ansible.builtin.copy:
        content: "{{ _snap_lsmod.stdout }}"
        dest: "{{ backup_dir }}/loaded_modules.txt"
        force: false
        mode: '0600'
      tags: [snapshot]

  tasks:
    - block:
        - name: "Validate required variable target_server is not empty"
          ansible.builtin.assert:
            that:
              - target_server != ''
            fail_msg: "target_server must be provided and must not be empty"
          tags: [execute]

        - name: "Req 2 - Parse input module list"
          ansible.builtin.set_fact:
            _module_list: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | list }}"
            _module_list_str: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | join(' ') }}"
          tags: [execute]

        - name: "Req 3 - Remediate kernel modules and output per-module results"
          ansible.builtin.shell: |
            set -o pipefail
            for mod in {{ _module_list_str }}; do
              actions=""
              error=""
              if lsmod | grep -q "^${mod} "; then
                if modprobe -r "${mod}" 2>/dev/null; then
                  actions="${actions}unloaded,"
                else
                  error="failed to unload ${mod}"
                  echo "module:${mod} status:failure actions:${actions%,} error:${error}"
                  continue
                fi
              fi
              conf="/etc/modprobe.d/${mod}.conf"
              printf '%s\n' "install ${mod} /bin/false" > "${conf}"
              printf '%s\n' "blacklist ${mod}" >> "${conf}"
              actions="${actions}blacklisted,install_directive"
              if ! grep -q "^install ${mod} /bin/false$" "${conf}" || ! grep -q "^blacklist ${mod}$" "${conf}"; then
                error="config verification failed"
                echo "module:${mod} status:failure actions:${actions} error:${error}"
                continue
              fi
              if lsmod | grep -q "^${mod} "; then
                error="module still loaded"
                echo "module:${mod} status:failure actions:${actions} error:${error}"
                continue
              fi
              echo "module:${mod} status:success actions:${actions} error:"
            done
          args:
            executable: /bin/bash
          register: _remediation_result
          changed_when: true
          tags: [execute]

        - name: "Req 4 - Initialize final module results list"
          ansible.builtin.set_fact:
            _module_results: []
          tags: [execute]

        - name: "Req 4 - Parse per-module result lines into structured list"
          ansible.builtin.set_fact:
            _module_results: "{{ _module_results + [
              {
                'name': item | regex_replace('^module:(\\S+) .*$', '\\1'),
                'status': item | regex_replace('^module:\\S+ status:(\\S+) .*$', '\\1'),
                'actions': ((item | regex_replace('^module:\\S+ status:\\S+ actions:(.*) error:.*$', '\\1')) | default('')).split(',') | reject('equalto', '') | list,
                'error': (item | regex_replace('^module:\\S+ status:\\S+ actions:.* error:(.*)$', '\\1') | default('')) | trim
              }
            ] }}"
          loop: "{{ _remediation_result.stdout_lines }}"
          when: "item is search('^module:')"
          tags: [execute]

        - name: "Req 4 - Derive overall success flag"
          ansible.builtin.set_fact:
            _all_succeeded: "{{ _module_results | selectattr('status', 'equalto', 'failure') | list | length == 0 }}"
          tags: [execute]

        # === VERIFICATION STEP ===
        - name: "Verification - Verify kernel modules are actually disabled"
          ansible.builtin.shell: |
            set -o pipefail
            for mod in {{ _module_list_str }}; do
              if lsmod | grep -q "^${mod} "; then
                echo "module:${mod} status:failure"
              else
                echo "module:${mod} status:success"
              fi
            done
          args:
            executable: /bin/bash
          register: _verification
          changed_when: false
          tags: [execute]

        - name: "Verification - Initialize verified list"
          ansible.builtin.set_fact:
            _verified: []
          tags: [execute]

        - name: "Verification - Parse verification output into verified list"
          ansible.builtin.set_fact:
            _verified: "{{ _verified | default([]) + [ {'name': item.split(' ')[0].split(':')[1], 'status': item.split(' ')[1].split(':')[1]} ] }}"
          loop: "{{ _verification.stdout_lines }}"
          when: "item is match('^module:')"
          tags: [execute]

        - name: "Verification - Update overall success from verification"
          ansible.builtin.set_fact:
            _all_succeeded: "{{ _verified | selectattr('status', 'equalto', 'failure') | list | length == 0 }}"
          tags: [execute]

        - name: "Verification - Replace module results with verification results"
          ansible.builtin.set_fact:
            _module_results: "{{ _verified }}"
          tags: [execute]
        # === END OF VERIFICATION ===

        - name: "Req 5 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              all_succeeded: {{ _all_succeeded }}
              modules: {{ _module_results }}
              </result>
          tags: [execute]

      rescue:
        - name: "Req 6 - Emit error block on failure"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: disable_kernel_modules failed
              </result>
          tags: [execute]

        - name: "Req 6 - Fail playbook to signal error"
          ansible.builtin.fail:
            msg: "disable_kernel_modules failed"
          tags: [execute]

      always:
        - name: "Restore - Check if modprobe backup directory exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/modprobe.d.bak"
          register: _restore_modprobe_backup
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore /etc/modprobe.d/ from backup"
          ansible.builtin.shell: |
            set -o pipefail
            if [ -d "{{ backup_dir }}/modprobe.d.bak" ]; then
              rm -rf /etc/modprobe.d/*
              cp -a "{{ backup_dir }}/modprobe.d.bak"/* /etc/modprobe.d/ 2>/dev/null || true
            fi
          args:
            executable: /bin/bash
          when:
            - _restore_modprobe_backup.stat.exists | default(false)
            - _restore_modprobe_backup.stat.isdir | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Read original loaded module list"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/loaded_modules.txt"
          register: _restore_loaded_modules
          failed_when: false
          tags: [restore]

        - name: "Restore - Reload previously loaded modules"
          ansible.builtin.shell: |
            set -o pipefail
            while IFS= read -r mod; do
              modprobe "${mod}" 2>/dev/null || true
            done <<< "$(echo "{{ _restore_loaded_modules.content | default('') | b64decode }}")"
          args:
            executable: /bin/bash
          when: _restore_loaded_modules.content is defined and (_restore_loaded_modules.content | b64decode | trim) | length > 0
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]