---
- name: "SOP playbook 'disable_kernel_modules' (ACTION — changes system state) - Disables specified kernel modules on managed Linux hosts by unloading them and adding install/blacklist directives"
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  become_user: root
  gather_facts: false
  vars:
    playbook_name: "disable_kernel_modules"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    # Required variables (override via extra_vars)
    target_server: ""             # mandatory – a real hostname or IP
    module_list: "gfs2"           # comma-separated list of modules to disable

  pre_tasks:
    # ================================================================
    # SNAPSHOT PHASE (tag: snapshot) – capture pre‑execution state
    # ================================================================
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Parse module list"
      ansible.builtin.set_fact:
        _snap_modules: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | list }}"
      tags: [snapshot]

    - name: "Snapshot - Save module list"
      ansible.builtin.copy:
        content: "{{ _snap_modules | join('\n') }}"
        dest: "{{ backup_dir }}/module_list.lst"
        force: false
      tags: [snapshot]

    - name: "Snapshot - Check if modprobe.d config exists for each module"
      ansible.builtin.stat:
        path: "/etc/modprobe.d/{{ item }}.conf"
      loop: "{{ _snap_modules }}"
      register: _snap_config_stat
      tags: [snapshot]

    - name: "Snapshot - Backup existing modprobe.d configs"
      ansible.builtin.copy:
        src: "/etc/modprobe.d/{{ item.item }}.conf"
        dest: "{{ backup_dir }}/{{ item.item }}.conf.orig"
        remote_src: true
        force: false
      loop: "{{ _snap_config_stat.results }}"
      when: item.stat.exists | default(false)
      tags: [snapshot]

    - name: "Snapshot - Record existence of config files"
      ansible.builtin.copy:
        content: "{{ item.stat.exists | default(false) }}"
        dest: "{{ backup_dir }}/{{ item.item }}.conf_existed"
        force: false
      loop: "{{ _snap_config_stat.results }}"
      tags: [snapshot]

    - name: "Snapshot - Record loaded kernel modules"
      ansible.builtin.shell: |
        set -o pipefail
        for mod in {{ _snap_modules | join(' ') }}; do
          if lsmod | grep -q "^${mod} "; then
            echo "${mod}"
          fi
        done
      args:
        executable: /bin/bash
      register: _snap_loaded
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save loaded modules list"
      ansible.builtin.copy:
        content: "{{ _snap_loaded.stdout }}"
        dest: "{{ backup_dir }}/loaded_modules.lst"
        force: false
      tags: [snapshot]

  tasks:
    - block:
        # ============================================================
        # EXECUTE PHASE (tag: execute) – main remediation
        # ============================================================
        - name: "Validate required variables"
          ansible.builtin.assert:
            that:
              - target_server is defined
              - target_server != ''
              - target_server != 'localhost'
            fail_msg: "target_server must be provided and cannot be localhost"
          tags: [execute]

        - name: "Req 2 - Parse input module list"
          ansible.builtin.set_fact:
            _module_list: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | list }}"
            _module_list_str: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | join(' ') }}"
          tags: [execute]

        - name: "Req 3 - Remediate kernel modules"
          ansible.builtin.shell: |
            set -o pipefail
            MODULES="{{ _module_list_str }}"
            for mod in $MODULES; do
              actions=""
              error=""
              # unload if loaded
              if lsmod | grep -q "^${mod} "; then
                if modprobe -r "${mod}" 2>/dev/null; then
                  actions="${actions}unloaded,"
                else
                  error="unload_failed"
                  echo "module:${mod} status:failure actions:[] error:${error}"
                  continue
                fi
              fi
              # write install directive
              echo "install ${mod} /bin/false" > /etc/modprobe.d/${mod}.conf
              actions="${actions}install_added,"
              # write blacklist
              echo "blacklist ${mod}" >> /etc/modprobe.d/${mod}.conf
              actions="${actions}blacklist_added"
              echo "module:${mod} status:success actions:[${actions%,}] error:"
            done
          args:
            executable: /bin/bash
          register: _remediation_result
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req 4 - Parse raw remediation output into structured list"
          ansible.builtin.set_fact:
            _parsed_modules: >-
              {{ _remediation_result.stdout_lines
                 | select('match', '^module:')
                 | map('regex_replace',
                       '^module:(\S+) status:(\S+) actions:\[(\S*)\] error:(.*)$',
                       '{"name": "\g<1>", "status": "\g<2>", "actions_str": "\g<3>", "error": "\g<4>"}')
                 | map('from_json')
                 | list }}
          tags: [execute]

        - name: "Req 4 - Split actions into lists"
          ansible.builtin.set_fact:
            _module_results: "{{ _module_results | default([]) + [ {'name': item.name, 'status': item.status, 'actions': (item.actions_str.split(',') | reject('equalto','') | list), 'error': item.error} ] }}"
          loop: "{{ _parsed_modules }}"
          tags: [execute]

        - name: "Req 4 - Compute overall success flag"
          ansible.builtin.set_fact:
            _all_succeeded: "{{ (_module_results | selectattr('status', 'equalto', 'failure') | list | length == 0) }}"
          tags: [execute]

        - name: "Verify - Check modules are unloaded and config directives present"
          ansible.builtin.shell: |
            set -o pipefail
            MODULES="{{ _module_list_str }}"
            for mod in $MODULES; do
              if lsmod | grep -q "^${mod} "; then
                echo "FAIL_LOADED $mod"
                continue
              fi
              if [ ! -f "/etc/modprobe.d/${mod}.conf" ]; then
                echo "FAIL_CONF_MISSING $mod"
                continue
              fi
              if ! grep -q "^install ${mod} /bin/false$" "/etc/modprobe.d/${mod}.conf"; then
                echo "FAIL_INSTALL $mod"
                continue
              fi
              if ! grep -q "^blacklist ${mod}$" "/etc/modprobe.d/${mod}.conf"; then
                echo "FAIL_BLACKLIST $mod"
                continue
              fi
              echo "OK_${mod}"
            done
          args:
            executable: /bin/bash
          register: _verify_result
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Update all_succeeded with verification outcome"
          ansible.builtin.set_fact:
            _all_succeeded: "{{ _all_succeeded | bool and (_verify_result.stdout is not search('FAIL_')) }}"
          tags: [execute]

        - name: "Step 04 - Emit result block"
          ansible.builtin.debug:
            msg:
              - "<result>"
              - "all_succeeded: {{ _all_succeeded | lower }}"
              - "modules: {{ _module_results }}"
              - "</result>"
          tags: [execute]

      rescue:
        # ============================================================
        # ERROR PATH (emitted on ANY task failure)
        # ============================================================
        - name: "Step 05 - Emit error block"
          ansible.builtin.debug:
            msg:
              - "<result>"
              - "ERROR: disable_kernel_modules failed. Host: {{ ansible_host }} Reason: {{ ansible_failed_result | default('Unknown error') }}"
              - "</result>"
          tags: [execute]

        - name: "Ensure playbook fails"
          ansible.builtin.fail:
            msg: "Playbook execution failed"
          tags: [always]

      always:
        # ============================================================
        # RESTORE PHASE (tag: restore) – return to pre‑execution state
        # ============================================================
        - name: "Restore - Read saved module list"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/module_list.lst"
          register: _restore_module_list
          failed_when: false
          tags: [restore]

        - name: "Restore - Parse module list for restore"
          ansible.builtin.set_fact:
            _restore_modules: "{{ (_restore_module_list.content | default('') | b64decode).splitlines() | reject('equalto','') | list }}"
          when: _restore_module_list.content | default('') | length > 0
          tags: [restore]

        - name: "Restore - Check if config backup exists for each module"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/{{ item }}.conf.orig"
          loop: "{{ _restore_modules }}"
          register: _restore_config_check
          when: _restore_modules is defined and _restore_modules | length > 0
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore config files from backup"
          ansible.builtin.copy:
            src: "{{ backup_dir }}/{{ item.item }}.conf.orig"
            dest: "/etc/modprobe.d/{{ item.item }}.conf"
            remote_src: true
          loop: "{{ _restore_config_check.results }}"
          when: item.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete config files created during execution"
          ansible.builtin.file:
            path: "/etc/modprobe.d/{{ item.item }}.conf"
            state: absent
          loop: "{{ _restore_config_check.results }}"
          when: not (item.stat.exists | default(false))
          failed_when: false
          tags: [restore]

        - name: "Restore - Read saved loaded modules list"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/loaded_modules.lst"
          register: _restore_loaded
          failed_when: false
          tags: [restore]

        - name: "Restore - Reload modules that were originally loaded"
          ansible.builtin.shell: |
            set -o pipefail
            while IFS= read -r mod; do
              modprobe "${mod}" 2>/dev/null || true
            done <<< "$(echo "{{ _restore_loaded.content | default('') | b64decode }}")"
          args:
            executable: /bin/bash
          when: _restore_loaded.content is defined and (_restore_loaded.content | b64decode | trim) | length > 0
          failed_when: false
          changed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]