---
- name: "SOP playbook 'disable_kernel_modules' (ACTION — changes system state): Disables specified kernel modules on managed Linux hosts by unloading them (if loaded) and adding install and blacklist directives to configuration files under /etc/modprobe.d/. Processes a comma-separated list of module names."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  become_user: root
  gather_facts: false
  vars:
    target_server: ""
    module_list: "gfs2"
    playbook_name: "disable_kernel_modules"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"

  pre_tasks:
    # === SNAPSHOT (tag: snapshot) ===
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Save original modprobe.d file list"
      ansible.builtin.shell: |
        set -o pipefail && find /etc/modprobe.d/ -maxdepth 1 -type f -name '*.conf' 2>/dev/null || true
      args:
        executable: /bin/bash
      register: _snap_conf_files
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Write file list to backup"
      ansible.builtin.copy:
        content: "{{ _snap_conf_files.stdout | default('') }}"
        dest: "{{ backup_dir }}/modprobe_d_filelist"
      tags: [snapshot]

    - name: "Snapshot - Backup modprobe.d conf files"
      ansible.builtin.shell: |
        set -o pipefail && mkdir -p "{{ backup_dir }}/modprobe_d" && cp /etc/modprobe.d/*.conf "{{ backup_dir }}/modprobe_d/" 2>/dev/null || true
      args:
        executable: /bin/bash
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Record loaded modules for target modules"
      ansible.builtin.shell: |
        set -o pipefail
        for mod in {{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | join(' ') }}; do
          if lsmod | grep -q "^${mod} "; then
            echo "$mod"
          fi
        done
      args:
        executable: /bin/bash
      register: _snap_loaded
      changed_when: false
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save loaded modules list"
      ansible.builtin.copy:
        content: "{{ _snap_loaded.stdout | default('') }}"
        dest: "{{ backup_dir }}/loaded_modules"
      tags: [snapshot]

  tasks:
    - block:
        # === EXECUTE (tag: execute) ===
        - name: "Req 1 - Validate required input target_server is not empty"
          ansible.builtin.assert:
            that: target_server != ''
            fail_msg: "target_server must be provided and must not be empty"
          tags: [execute]

        - name: "Req 2 - Parse input module list"
          ansible.builtin.set_fact:
            _module_list: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | list }}"
            _module_list_str: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | join(' ') }}"
          tags: [execute]

        - name: "Req 3 - Remediate kernel modules"
          ansible.builtin.shell: |
            set -o pipefail
            for mod in {{ _module_list_str }}; do
              actions=""
              err=""
              status=""
              # Unload if loaded
              if lsmod | grep -q "^${mod} "; then
                if modprobe -r "$mod" 2>/dev/null; then
                  actions="${actions}unload"
                else
                  err="unload_failed;"
                  status="failure"
                fi
              fi
              # Write install and blacklist directives
              conf="/etc/modprobe.d/${mod}.conf"
              echo "install ${mod} /bin/false" > "$conf" 2>/dev/null
              if [ $? -ne 0 ]; then
                err="${err}install_write_failed;"
                [ "$status" != "failure" ] && status="failure"
              else
                [ -n "$actions" ] && actions="${actions},"
                actions="${actions}install"
              fi
              echo "blacklist ${mod}" >> "$conf" 2>/dev/null
              if [ $? -ne 0 ]; then
                err="${err}blacklist_write_failed;"
                [ "$status" != "failure" ] && status="failure"
              else
                [ -n "$actions" ] && actions="${actions},"
                actions="${actions}blacklist"
              fi
              # Final status check
              if [ "$status" != "failure" ]; then
                if lsmod | grep -q "^${mod} "; then
                  status="failure"
                  err="${err}still_loaded;"
                else
                  status="success"
                fi
              fi
              err="${err%;}"
              [ -z "$err" ] && err=""
              echo "module:$mod status:$status actions:$actions error:$err"
            done
          args:
            executable: /bin/bash
          register: _remediation_result
          failed_when: false
          changed_when: true
          tags: [execute]

        - name: "Req 4 - Parse raw per-module results"
          ansible.builtin.set_fact:
            _module_results_raw: |
              {{ _remediation_result.stdout_lines | default([])
                 | map('regex_replace', '^module:(\S+) status:(\S+) actions:(\S*) error:(.*)$', '{"name":"\g<1>","status":"\g<2>","actions_str":"\g<3>","error":"\g<4>"}')
                 | map('from_json')
                 | list }}
          tags: [execute]

        - name: "Req 4 - Convert actions and build final module list"
          ansible.builtin.set_fact:
            _module_results: "{%- set out = [] %}{%- for item in _module_results_raw %}{%- set acts = (item.actions_str.split(',') | map('trim') | reject('equalto', '') | list) if item.actions_str else [] %}{{- out.append(dict(name=item.name, status=item.status, actions=acts, error=item.error)) -}}{%- endfor %}{{ out }}"
          tags: [execute]

        - name: "Req 4 - Determine overall success"
          ansible.builtin.set_fact:
            _all_succeeded: "{{ not _module_results | selectattr('status', 'equalto', 'failure') | list | length > 0 }}"
          tags: [execute]

        - name: "Req 5 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              all_succeeded: {{ _all_succeeded }}
              modules: {{ _module_results }}
              </result>
          tags: [execute]

      rescue:
        - name: "Req 6 - Emit error block and fail"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: disable_kernel_modules failed on {{ inventory_hostname }}
              </result>
        - ansible.builtin.fail:
            msg: "Playbook failed, see error above"

      always:
        # === RESTORE (tag: restore) ===
        - name: "Restore - Read original modprobe.d file list"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/modprobe_d_filelist"
          register: _restore_orig_files
          failed_when: false
          tags: [restore]

        - name: "Restore - Find current modprobe.d conf files"
          ansible.builtin.shell: |
            set -o pipefail && find /etc/modprobe.d/ -maxdepth 1 -type f -name '*.conf' 2>/dev/null || true
          args:
            executable: /bin/bash
          register: _restore_curr_files
          changed_when: false
          failed_when: false
          when: _restore_orig_files.content is defined
          tags: [restore]

        - name: "Restore - Delete files added during execution"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: >-
            {{
              (_restore_curr_files.stdout_lines | default([]))
              | difference((_restore_orig_files.content | default('') | b64decode).splitlines())
            }}
          when:
            - _restore_orig_files.content is defined
            - _restore_curr_files.stdout_lines is defined
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore original modprobe.d conf files"
          ansible.builtin.shell: |
            set -o pipefail && if [ -d "{{ backup_dir }}/modprobe_d" ]; then cp "{{ backup_dir }}/modprobe_d"/*.conf /etc/modprobe.d/ 2>/dev/null || true; fi
          args:
            executable: /bin/bash
          failed_when: false
          tags: [restore]

        - name: "Restore - Read saved loaded modules list"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/loaded_modules"
          register: _restore_loaded
          failed_when: false
          tags: [restore]

        - name: "Restore - Reload previously loaded modules"
          ansible.builtin.shell: |
            set -o pipefail
            while IFS= read -r mod; do
              modprobe "$mod" 2>/dev/null || true
            done <<< "$(echo "{{ _restore_loaded.content | default('') | b64decode }}")"
          args:
            executable: /bin/bash
          when: _restore_loaded.content is defined and (_restore_loaded.content | b64decode | trim) | length > 0
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]