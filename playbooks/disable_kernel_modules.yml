---
- name: "SOP playbook 'disable_kernel_modules' (ACTION — changes system state): Disables specified kernel modules on managed Linux hosts by unloading them (if loaded) and adding install and blacklist directives to configuration files under /etc/modprobe.d/. Processes a comma-separated list of module names."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    playbook_name: "disable_kernel_modules"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    target_server: ""          # sentinel – must be overridden by extra_vars
    module_list: "gfs2"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Backup modprobe configs and record module states"
      ansible.builtin.shell: |
        set -o pipefail
        IFS=' ' read -ra modules <<< "{{ module_list.split(',') | map('trim') | reject('equalto', '') | join(' ') }}"
        for mod in "${modules[@]}"; do
          conf="/etc/modprobe.d/${mod}.conf"
          if [ -f "$conf" ]; then
            cp -a "$conf" "{{ backup_dir }}/${mod}.conf.orig"
            echo "present" > "{{ backup_dir }}/${mod}.conf_existed"
          else
            echo "absent" > "{{ backup_dir }}/${mod}.conf_existed"
          fi
          if lsmod | grep -q "^${mod} "; then
            echo "loaded" > "{{ backup_dir }}/${mod}.load_state"
          else
            echo "not_loaded" > "{{ backup_dir }}/${mod}.load_state"
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save full file list of /etc/modprobe.d/"
      ansible.builtin.shell: set -o pipefail && find /etc/modprobe.d/ -maxdepth 1 -type f 2>/dev/null || true
      args:
        executable: /bin/bash
      register: _snap_modprobe_d_files
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Persist modprobe.d file list"
      ansible.builtin.copy:
        content: "{{ _snap_modprobe_d_files.stdout | default('') }}"
        dest: "{{ backup_dir }}/modprobe_d.filelist"
        force: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Validate required variable target_server is not empty"
          ansible.builtin.assert:
            that:
              - "target_server != ''"
            fail_msg: "target_server must be provided and must not be empty"
          delegate_to: localhost
          tags: [execute]

        - name: "Req 2 - Parse input module list"
          ansible.builtin.set_fact:
            _module_list: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | list }}"
            _module_list_str: "{{ (module_list | default('gfs2')).split(',') | map('trim') | reject('equalto', '') | join(' ') }}"
          tags: [execute]

        - name: "Req 3 - Remediate kernel modules"
          ansible.builtin.shell: |
            set -o pipefail
            IFS=' ' read -ra modules <<< "{{ _module_list_str }}"
            for mod in "${modules[@]}"; do
              # unload if loaded
              if lsmod | grep -q "^${mod} "; then
                rmmod "$mod" 2>/dev/null || true
              fi
              # write config file without heredoc (avoids YAML parsing issue)
              printf 'install %s /bin/false\nblacklist %s\n' "$mod" "$mod" > "/etc/modprobe.d/${mod}.conf"
              # verify and produce result line
              status="success"; err=""; actions=""
              if lsmod | grep -q "^${mod} "; then
                status="failure"; err="still_loaded"
              elif ! grep -q "^install ${mod} /bin/false$" "/etc/modprobe.d/${mod}.conf" || ! grep -q "^blacklist ${mod}$" "/etc/modprobe.d/${mod}.conf"; then
                status="failure"; err="config_missing"
              else
                actions="unloaded,blacklisted"
              fi
              echo "module:${mod} status:${status} actions:${actions} error:${err}"
            done
          args:
            executable: /bin/bash
          register: _remediation_result
          failed_when: false
          tags: [execute]

        - name: "Req 4a - Build module results JSON"
          ansible.builtin.set_fact:
            _module_results_json: >-
              {%- set results = [] -%}
              {%- for line in _remediation_result.stdout_lines -%}
              {%-   set entry = {} -%}
              {%-   for token in line.split() -%}
              {%-     set kv = token.split(':', 1) -%}
              {%-     if kv | length == 2 -%}
              {%-       set _ = entry.update({kv[0]: kv[1]}) -%}
              {%-     endif -%}
              {%-   endfor -%}
              {%-   set actions_raw = entry.get('actions', '') -%}
              {%-   set _ = entry.update({'actions': actions_raw.split(',') | map('trim') | reject('equalto', '') | list }) -%}
              {%-   set _ = results.append(entry) -%}
              {%- endfor -%}
              {{ results | to_json }}
          tags: [execute]

        - name: "Req 4b - Parse module results from JSON"
          ansible.builtin.set_fact:
            _module_results: "{{ _module_results_json | from_json }}"
          tags: [execute]

        - name: "Req 4c - Derive overall success flag"
          ansible.builtin.set_fact:
            _all_succeeded: "{{ _module_results | selectattr('status', 'equalto', 'failure') | list | length == 0 }}"
          tags: [execute]

        - name: "Req 5 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              all_succeeded: {{ _all_succeeded }}
              modules: {{ _module_results }}
              </result>
          tags: [execute]

      rescue:
        - name: "Req 6 - Emit error block"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: disable_kernel_modules failed
              </result>
          tags: [execute]

        - name: "Req 6 - Fail the play"
          ansible.builtin.fail:
            msg: "disable_kernel_modules failed"
          tags: [execute]

      always:
        - name: "Restore - Restore modprobe configs and module states"
          ansible.builtin.shell: |
            set -o pipefail
            IFS=' ' read -ra modules <<< "{{ module_list.split(',') | map('trim') | reject('equalto', '') | join(' ') }}"
            for mod in "${modules[@]}"; do
              conf="/etc/modprobe.d/${mod}.conf"
              # Restore config file
              if [ -f "{{ backup_dir }}/${mod}.conf_existed" ]; then
                existed=$(cat "{{ backup_dir }}/${mod}.conf_existed")
                if [ "$existed" = "present" ] && [ -f "{{ backup_dir }}/${mod}.conf.orig" ]; then
                  cp -f "{{ backup_dir }}/${mod}.conf.orig" "$conf"
                elif [ "$existed" = "absent" ]; then
                  rm -f "$conf"
                fi
              fi
              # Restore module load state
              if [ -f "{{ backup_dir }}/${mod}.load_state" ]; then
                load_state=$(cat "{{ backup_dir }}/${mod}.load_state")
                if [ "$load_state" = "loaded" ]; then
                  modprobe "$mod" 2>/dev/null || true
                fi
              fi
            done
          args:
            executable: /bin/bash
          failed_when: false
          tags: [restore]

        - name: "Restore - Read original modprobe.d file list"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/modprobe_d.filelist"
          register: _restore_modprobe_d_filelist
          failed_when: false
          tags: [restore]

        - name: "Restore - Find current files in modprobe.d"
          ansible.builtin.shell: set -o pipefail && find /etc/modprobe.d/ -maxdepth 1 -type f 2>/dev/null || true
          args:
            executable: /bin/bash
          register: _restore_modprobe_d_current
          changed_when: false
          failed_when: false
          when: _restore_modprobe_d_filelist.content is defined
          tags: [restore]

        - name: "Restore - Delete files added during execution in modprobe.d"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: >-
            {{
              (_restore_modprobe_d_current.stdout_lines | default([]))
              | difference((_restore_modprobe_d_filelist.content | default('') | b64decode).splitlines())
            }}
          when:
            - _restore_modprobe_d_filelist.content is defined
            - _restore_modprobe_d_current.stdout_lines is defined
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]