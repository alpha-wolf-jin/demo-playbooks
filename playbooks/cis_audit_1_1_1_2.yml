---
- name: "Audit CIS checkpoint 1.1.1.2: Ensure freevxfs kernel module is not available"
  hosts: all
  become: yes
  gather_facts: false
  vars:
    kernel_module_name: "freevxfs"
    audit_script_path: "/tmp/cis_audit_freevxfs.sh"
    audit_script_content: |
      #!/usr/bin/env bash
      l_mod_name="{{ kernel_module_name }}"
      {% raw %}
      {
         l_output3="" l_dl="" # clear variables
         unset a_output; unset a_output2 # unset arrays
         l_mod_type="fs" # set module type
         l_mod_path="$(readlink -f /lib/modules/**/kernel/$l_mod_type | sort -u)"
         f_module_chk()
         {
            l_dl="y" # Set to ignore duplicate checks
            a_showconfig=() # Create array with modprobe output
            while IFS= read -r l_showconfig; do
               a_showconfig+=("$l_showconfig")
            done < <(modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+'"${l_mod_name//-/_}"'\b')
            if ! lsmod | grep "$l_mod_name" &> /dev/null; then # Check if the module is currently loaded
               a_output+=("  - kernel module: \"$l_mod_name\" is not loaded")
            else
               a_output2+=("  - kernel module: \"$l_mod_name\" is loaded")
            fi
            if grep -Pq -- '\binstall\h+'"${l_mod_name//-/_}"'\h+\/bin\/(true|false)\b' <<< "${a_showconfig[*]}"; then
               a_output+=("  - kernel module: \"$l_mod_name\" is not loadable")
            else
               a_output2+=("  - kernel module: \"$l_mod_name\" is loadable")
            fi
            if grep -Pq -- '\bblacklist\h+'"${l_mod_name//-/_}"'\b' <<< "${a_showconfig[*]}"; then
               a_output+=("  - kernel module: \"$l_mod_name\" is deny listed")
            else
               a_output2+=("  - kernel module: \"$l_mod_name\" is not deny listed")
            fi
         }
         for l_mod_base_directory in $l_mod_path; do # Check if the module exists on the system
            if [ -d "$l_mod_base_directory/${l_mod_name/-/\/}" ] && [ -n "$(ls -A $l_mod_base_directory/${l_mod_name/-/\/})" ]; then
               l_output3="$l_output3\n  - \"$l_mod_base_directory\""
               [[ "$l_mod_name" =~ overlay ]] && l_mod_name="${l_mod_name::-2}"
               [ "$l_dl" != "y" ] && f_module_chk
            else
               a_output+=(" - kernel module: \"$l_mod_name\" doesn't exist in \"$l_mod_base_directory\"")
            fi
         done
         [ -n "$l_output3" ] && echo -e "\n\n -- INFO --\n - module: \"$l_mod_name\" exists in:$l_output3"
         if [ "${#a_output2[@]}" -le 0 ]; then
            printf '%s\n' "" "- Audit Result:" "  ** PASS **" "${a_output[@]}"
         else
            printf '%s\n' "" "- Audit Result:" "  ** FAIL **" " - Reason(s) for audit failure:" "${a_output2[@]}"
            [ "${#a_output[@]}" -gt 0 ] && printf '%s\n' "- Correctly set:" "${a_output[@]}"
         fi
      }
      {% endraw %}
    req_01: "1. Run the provided audit script to verify Ensure freevxfs kernel module is not available. Run the following script to verify: - IF - the freevxfs kernel module is available in ANY installed kernel, verify: • An entry including /bin/true or /bin/false exists in a file within the /etc/modprobe.d/ directory • The module is deny listed in a file within the /etc/modprobe.d/ directory • The module is not loaded in the running kernel - IF - the freevxfs kernel module is not available on the system, or pre-compiled into the kernel, no additional configuration is necessary"
    req_02: "VERIFY: Summarise compliance status for Ensure freevxfs kernel module is not available. Expected result: PASS if compliant, SKIP if prerequisite not met (e.g., partition/package does not exist), FAIL if misconfigured"
    req_03: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  tasks:
    - name: "Initialize data variables"
      ansible.builtin.set_fact:
        data_01: "Not collected yet"
        status_01: "ERROR"
        details_01: "Not evaluated"
        task_01_name: "Not executed"
        task_01_cmd: "N/A"
        task_01_rc: -1
        data_02: "Not collected yet"
        status_02: "ERROR"
        details_02: "Not evaluated"
        task_02_name: "Not executed"
        task_02_cmd: "N/A"
        task_02_rc: -1
        data_03: "Not collected yet"
        status_03: "ERROR"
        details_03: "Not evaluated"
        task_03_name: "Not executed"
        task_03_cmd: "N/A"
        task_03_rc: -1

    - name: "Req step-01 - Copy audit script to target"
      ansible.builtin.copy:
        dest: "{{ audit_script_path }}"
        mode: '0700'
        content: "{{ audit_script_content }}"
      changed_when: false
      failed_when: false

    - name: "Req step-01 - Execute audit script for freevxfs"
      ansible.builtin.shell: /bin/bash "{{ audit_script_path }}"
      args:
        executable: /bin/bash
      register: _audit_output
      failed_when: false
      changed_when: false

    - name: "Req step-01 - Store requirement 01 details"
      ansible.builtin.set_fact:
        task_01_name: "Execute freevxfs audit script"
        task_01_cmd: "/bin/bash {{ audit_script_path }}"
        task_01_rc: "{{ _audit_output.rc | default(-1) }}"
        data_01: "{{ _audit_output.stdout | default('') | trim }}"
        status_01: "{{ 'PASS' if _audit_output.rc | default(-1) == 0 else 'ERROR' }}"
        details_01: "{{ 'Script executed successfully' if _audit_output.rc | default(-1) == 0 else 'Script execution error' }}"

    - name: "Req step-01 - Remove temporary audit script"
      ansible.builtin.file:
        path: "{{ audit_script_path }}"
        state: absent
      changed_when: false
      failed_when: false

    - name: "Req step-02 - Set compliance status from audit result"
      ansible.builtin.set_fact:
        task_02_name: "Execute freevxfs audit script"
        task_02_cmd: "/bin/bash {{ audit_script_path }}"
        task_02_rc: "{{ _audit_output.rc | default(-1) }}"
        data_02: "{{ _audit_output.stdout | default('') | trim }}"
        status_02: >-
          {{ 'PASS' if '** PASS **' in (_audit_output.stdout | default('') | trim) else
             ('FAIL' if '** FAIL **' in (_audit_output.stdout | default('') | trim) else 'ERROR') }}
        details_02: >-
          {{ 'Compliant' if '** PASS **' in (_audit_output.stdout | default('') | trim) else
             ('Non-compliant' if '** FAIL **' in (_audit_output.stdout | default('') | trim) else 'Script execution error') }}
        _cis_status: >-
          {{ 'PASS' if '** PASS **' in (_audit_output.stdout | default('') | trim) else
             ('FAIL' if '** FAIL **' in (_audit_output.stdout | default('') | trim) else 'ERROR') }}

    - name: "Req step-03 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        task_03_name: "Set cis_result variable"
        task_03_cmd: "set_fact: cis_result = status_02"
        task_03_rc: 0
        data_03: "cis_result set to {{ status_02 | trim }}"
        status_03: "PASS"
        details_03: "Final compliance result stored"
        cis_result: "{{ status_02 | default('ERROR') | trim }}"

    - name: "Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.1.2"
          - "Reference: CIS Benchmark checkpoint 1.1.1.2"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "========================================================"