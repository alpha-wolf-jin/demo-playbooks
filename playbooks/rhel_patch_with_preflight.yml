        - name: "Req step-01 - Gather pre-patch memory and filesystem facts"
          ansible.builtin.setup:
            gather_subset:
              - hardware
            gather_timeout: 10
          register: _pre_facts
          tags: [execute]

        - name: "Req step-02 - Set pre-patch check flag"
          ansible.builtin.set_fact:
            _pre_check_failed: >-
              {{ (_pre_facts.ansible_facts.ansible_memfree_mb | int) < (min_free_mem_mb | int)
