- name: "SOP playbook 'rhel_patch_with_preflight' (ACTION — changes system state): Patch a RHEL server by validating pre-patch memory, disk, and service state, applying all package updates, rebooting, and reporting post-patch status."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
