gpo_name: "Default Domain Policy"
min_reset_seconds: 900
req_01: "Check if the Account Lockout Policy is applied via the Default Domain Policy GPO using command: `Get-GPO -Name 'Default Domain Policy' | Get-GPOReport -ReportType Xml | Select-String -Pattern 'LockoutDuration|LockoutObservationWindow|LockoutThreshold'`. Expected result: The Default Domain Policy GPO contains the Account Lockout Policy settings (LockoutDuration, LockoutObservationWindow, LockoutThreshold)."
req_02: "Check the 'Reset account lockout counter after' value using command: `Get-GPO -Name 'Default Domain Policy' | Get-GPOReport -ReportType Xml | Select-String -Pattern 'LockoutObservationWindow'`. Expected result: LockoutObservationWindow value is set to 15 or more minutes (900 or more seconds)."
req_03: "Check that the 'Reset account lockout counter after' value is less than or equal to the 'Account lockout duration' value using command: `Get-GPO -Name 'Default Domain Policy' | Get-GPOReport -ReportType Xml | Select-String -Pattern 'LockoutDuration|LockoutObservationWindow'`. Expected result: LockoutObservationWindow (reset counter) value is less than or equal to LockoutDuration value."
req_04: "Check the overall compliance status. Expected result: PASS if the Account Lockout Policy is applied via Default Domain Policy GPO and 'Reset account lockout counter after' is set to 15 or more minutes and is less than or equal to the Account lockout duration; SKIP if the Account Lockout Policy is not applied via the Default Domain Policy GPO; FAIL if the policy is applied but 'Reset account lockout counter after' is set to less than 15 minutes or exceeds the Account lockout duration."
req_05: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
