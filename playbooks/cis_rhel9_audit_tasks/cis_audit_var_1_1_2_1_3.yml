req_1: "Run the audit procedure for Ensure nosuid option set on /tmp partition: - IF - a separate partition exists for /tmp, verify that the nosuid option is set. Run the following command to verify that the nosuid mount option is set. Example: # findmnt -kn /tmp | grep -v nosuid. Nothing should be returned. Expected result: Output shows compliance status"
req_2: "VERIFY: Summarise compliance status for Ensure nosuid option set on /tmp partition. Expected result: PASS if compliant, SKIP if prerequisite not met (e.g., partition/package does not exist), FAIL if misconfigured"
req_3: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
