req_01: "Run the audit procedure for Ensure nosuid option set on /tmp partition: - IF - a separate partition exists for /tmp, verify that the nosuid option is set. Run the following command to verify that the nosuid mount option is set. Example: # findmnt -kn /tmp | grep -v nosuid. Nothing should be returned. Expected result: Output shows compliance status"
req_02: "VERIFY: Summarise compliance status for Ensure nosuid option set on /tmp partition. Expected result: PASS if compliant, SKIP if prerequisite not met (e.g., partition/package does not exist), FAIL if misconfigured"
req_03: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_04: "Create a task named 'Generate audit report' using debug msg in audit report format: AUDIT REPORT header, Reference line, then one REQUIREMENT NN block per requirement with fields Task, Command, Exit code, Data, Status, Details. End with OVERALL COMPLIANCE section containing Result: cis_result"
