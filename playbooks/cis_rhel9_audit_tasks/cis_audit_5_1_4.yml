---
- name: Initialize meta data variables
  include_vars: cis_audit_var_5_1_4.yml

- name: "Req step-01 - Check if OpenSSH server is installed"
  ansible.builtin.shell: command -v sshd
  args:
    executable: /bin/bash
  register: _sshd_installed
  changed_when: false
  failed_when: false

- name: "Req step-02 - Detect weak ciphers in sshd effective configuration"
  ansible.builtin.shell: |
    set -o pipefail
    sshd -T | grep -i '^ciphers' | grep -oPi '\b({{ weak_ciphers | replace(',', '|') }})\b' | sort -u
  args:
    executable: /bin/bash
  register: _weak_ciphers_output
  changed_when: false
  failed_when: false
  when: ((_sshd_installed.rc | default(-1)) == 0)

- name: "Req step-03 - Determine compliance status"
  ansible.builtin.set_fact:
    status_01: "{{ ((_sshd_installed.rc | default(-1)) == 0) | ternary('PASS', 'SKIP') }}"
    status_02: "{{ ((_sshd_installed.rc | default(-1)) != 0) | ternary('SKIP', ((_weak_ciphers_output.stdout | default('') | trim) == '') | ternary('PASS', 'FAIL')) }}"
    status_03: "{{ ((_sshd_installed.rc | default(-1)) != 0) | ternary('SKIP', 'PASS') }}"
    weak_ciphers_found: "{{ ((_sshd_installed.rc | default(-1)) != 0) | ternary('none', ((_weak_ciphers_output.stdout | default('') | trim) == '') | ternary('none', _weak_ciphers_output.stdout | default('') | trim)) }}"
    cis_result: "{{ ((_sshd_installed.rc | default(-1)) != 0) | ternary('SKIP', ((_weak_ciphers_output.stdout | default('') | trim) == '') | ternary('PASS', 'FAIL')) }}"

- name: "Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 5.1.4"
    - "Reference: CIS Benchmark checkpoint 5.1.4"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: Req step-01 - Check if OpenSSH server is installed"
    - "  Command: command -v sshd"
    - "  Exit code: {{ _sshd_installed.rc | default(-1) }}"
    - "  Data: {{ _sshd_installed.stdout | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ (status_01 | default('ERROR') | trim == 'PASS') | ternary('sshd binary found', 'sshd not installed - audit skipped') }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: Req step-02 - Detect weak ciphers in sshd effective configuration"
    - "  Command: sshd -T | grep -i '^ciphers' | grep -oPi '\\b({{ weak_ciphers | replace(',', '|') }})\\b' | sort -u"
    - "  Exit code: {{ (_weak_ciphers_output.rc | default(-1)) if _weak_ciphers_output is defined else -1 }}"
    - "  Data: {{ (_weak_ciphers_output.stdout | default('') | trim) if _weak_ciphers_output is defined else '' }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ (status_02 | default('ERROR') | trim == 'SKIP') | ternary('skipped - sshd not installed', ((status_02 | default('ERROR') | trim == 'FAIL') | ternary('weak ciphers detected', 'no weak ciphers detected'))) }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: Req step-03 - Determine compliance status"
    - "  Command: N/A (set_fact)"
    - "  Exit code: N/A"
    - "  Data: {{ weak_ciphers_found }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: Compliance status determined as {{ cis_result | default('ERROR') | trim }}"
    - ""
    - "Weak Ciphers Found: {{ weak_ciphers_found }}."
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
