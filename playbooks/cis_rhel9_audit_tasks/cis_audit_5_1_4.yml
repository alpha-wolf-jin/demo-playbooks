---
- name: Initialize meta data variables
  include_vars: cis_audit_var_5_1_4.yml

- name: "Initialize data variables"
  set_fact:
    data_01: "Not collected yet"
    status_01: "ERROR"
    details_01: "Not evaluated"
    data_02: "Not collected yet"
    status_02: "ERROR"
    details_02: "Not evaluated"
    data_03: "Not collected yet"
    status_03: "ERROR"
    details_03: "Not evaluated"
    data_04: "Not collected yet"
    status_04: "ERROR"
    details_04: "Not evaluated"
    data_05: "Not collected yet"
    status_05: "ERROR"
    details_05: "Not evaluated"
    data_06: "Not collected yet"
    status_06: "ERROR"
    details_06: "Not evaluated"
    task_01_name: "Not executed"
    task_01_cmd: "N/A"
    task_01_rc: -1

    # ------------------------------------------------------------------
    # Requirement 01: Check OpenSSH server installation
# ------------------------------------------------------------------
- name: "Req step-01 - Check if OpenSSH server is installed"
  ansible.builtin.shell: |
    set -o pipefail && sshd -V 2>&1 || dpkg -l openssh-server 2>/dev/null || rpm -q openssh-server 2>/dev/null
  args:
    executable: /bin/bash
  register: _step01_output
  failed_when: false
  changed_when: false

- name: "Req step-01 - Set facts for sshd installed check"
  set_fact:
    sshd_installed: "{{ _step01_output.rc == 0 }}"
    task_01_name: "Check if OpenSSH server is installed"
    task_01_cmd: "sshd -V 2>&1 || dpkg -l openssh-server 2>/dev/null || rpm -q openssh-server 2>/dev/null"
    task_01_rc: "{{ _step01_output.rc | default(-1) }}"
    data_01: "{{ _step01_output.stdout | default('') | trim }}"
    status_01: "{{ 'PASS' if _step01_output.rc == 0 else 'FAIL' | trim }}"
    details_01: "{{ 'sshd is installed' if _step01_output.rc == 0 else 'sshd not installed' | trim }}"

    # ------------------------------------------------------------------
    # Requirement 02: Check weak ciphers
# ------------------------------------------------------------------
- name: "Req step-02 - Check sshd configured ciphers for weak algorithms"
  ansible.builtin.shell: |
    set -o pipefail && sshd -T | grep -Pi -- '^ciphers\h+\"?([^#\n\r]+,)?((3des|blowfish|cast128|aes(128|192|256))-cbc|arcfour(128|256)?|rijndael-cbc@lysator\.liu\.se|chacha20-poly1305@openssh\.com)\b'
  args:
    executable: /bin/bash
  register: _step02_output
  failed_when: false
  changed_when: false
  when: sshd_installed | bool

- name: "Req step-02 - Set facts for weak ciphers check"
  set_fact:
    chacha_present: "{{ 'chacha20-poly1305@openssh.com' in _step02_output.stdout | default('') }}"
    task_02_name: "Check sshd configured ciphers for weak algorithms"
    task_02_cmd: "sshd -T | grep -Pi '^ciphers...' (weak cipher regex)"
    task_02_rc: "{{ _step02_output.rc | default(-1) }}"
    data_02: "{{ _step02_output.stdout | default('') | trim }}"
    status_02: "{{ 'PASS' if _step02_output.rc == 1 else 'FAIL' if _step02_output.rc == 0 else 'ERROR' | trim }}"
    details_02: "{{ 'No weak ciphers found' if _step02_output.rc == 1 else 'Weak ciphers found' if _step02_output.rc == 0 else 'Error executing command' | trim }}"
  when: sshd_installed | bool

- name: "Req step-02 - Set facts SKIP (sshd not installed)"
  set_fact:
    chacha_present: false
    task_02_name: "Check sshd configured ciphers for weak algorithms"
    task_02_cmd: "N/A"
    task_02_rc: -1
    data_02: "Not applicable"
    status_02: "SKIP"
    details_02: "skipped: sshd not installed"
  when: not sshd_installed | bool

    # ------------------------------------------------------------------
    # Requirement 03: Check CVE patch for chacha20-poly1305
# ------------------------------------------------------------------
- name: "Req step-03 - Check if chacha20-poly1305 is patched against CVE-2023-48795"
  ansible.builtin.shell: |
    set -o pipefail && sshd -T | grep -i 'chacha20-poly1305@openssh.com' && (grep -i 'CVE-2023-48795' /usr/share/doc/openssh-server/changelog* 2>/dev/null || dpkg -l openssh-server 2>/dev/null | grep -E '^ii' || rpm -q --changelog openssh-server 2>/dev/null | grep -i 'CVE-2023-48795')
  args:
    executable: /bin/bash
  register: _step03_output
  failed_when: false
  changed_when: false
  when:
  - sshd_installed | bool
  - chacha_present | default(false) | bool

- name: "Req step-03 - Set facts for chacha20 patch check"
  set_fact:
    task_03_name: "Check if chacha20-poly1305 cipher is present and system is patched against CVE-2023-48795"
    task_03_cmd: "sshd -T | grep -i 'chacha20-poly1305@openssh.com' && (grep -i 'CVE-2023-48795' ...)"
    task_03_rc: "{{ _step03_output.rc | default(-1) }}"
    data_03: "{{ _step03_output.stdout | default('') | trim }}"
    status_03: "{{ 'PASS' if _step03_output.rc == 0 else 'FAIL' if _step03_output.rc == 1 else 'ERROR' | trim }}"
    details_03: "{{ 'Patch information found' if _step03_output.rc == 0 else 'No patch found' if _step03_output.rc == 1 else 'Error executing command' | trim }}"
  when:
  - sshd_installed | bool
  - chacha_present | default(false) | bool

- name: "Req step-03 - Set facts SKIP (no chacha20-poly1305 in use)"
  set_fact:
    task_03_name: "Check if chacha20-poly1305 cipher is present and system is patched against CVE-2023-48795"
    task_03_cmd: "N/A"
    task_03_rc: -1
    data_03: "Not applicable"
    status_03: "SKIP"
    details_03: "chacha20-poly1305 not in use"
  when:
  - sshd_installed | bool
  - not (chacha_present | default(false) | bool)

- name: "Req step-03 - Set facts SKIP (sshd not installed)"
  set_fact:
    task_03_name: "Check if chacha20-poly1305 cipher is present and system is patched against CVE-2023-48795"
    task_03_cmd: "N/A"
    task_03_rc: -1
    data_03: "Not applicable"
    status_03: "SKIP"
    details_03: "skipped: sshd not installed"
  when: not sshd_installed | bool

    # ------------------------------------------------------------------
    # Requirement 04: Check specific weak CBC ciphers
# ------------------------------------------------------------------
- name: "Req step-04 - Check for specific weak CBC ciphers in sshd configuration"
  ansible.builtin.shell: |
    set -o pipefail && sshd -T | grep -E '^ciphers\s+' | grep -E '(3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc)'
  args:
    executable: /bin/bash
  register: _step04_output
  failed_when: false
  changed_when: false
  when: sshd_installed | bool

- name: "Req step-04 - Set facts for CBC ciphers check"
  set_fact:
    task_04_name: "Check for specific weak CBC ciphers in sshd configuration"
    task_04_cmd: |
      sshd -T | grep -E '^ciphers\\s+' | grep -E '(3des-cbc|aes128-cbc|aes192-cbc|aes256-cbc)'
    task_04_rc: "{{ _step04_output.rc | default(-1) }}"
    data_04: "{{ _step04_output.stdout | default('') | trim }}"
    status_04: "{{ 'PASS' if _step04_output.rc == 1 else 'FAIL' if _step04_output.rc == 0 else 'ERROR' | trim }}"
    details_04: "{{ 'No weak CBC ciphers found' if _step04_output.rc == 1 else 'Weak CBC ciphers found' if _step04_output.rc == 0 else 'Error executing command' | trim }}"
  when: sshd_installed | bool

- name: "Req step-04 - Set facts SKIP (sshd not installed)"
  set_fact:
    task_04_name: "Check for specific weak CBC ciphers in sshd configuration"
    task_04_cmd: "N/A"
    task_04_rc: -1
    data_04: "Not applicable"
    status_04: "SKIP"
    details_04: "skipped: sshd not installed"
  when: not sshd_installed | bool

    # ------------------------------------------------------------------
    # Requirement 05: Overall compliance summary
# ------------------------------------------------------------------
- name: "Req step-05 - Summarize overall compliance status"
  set_fact:
    status_05: >-
      {%- if not sshd_installed | bool -%}
        SKIP
      {%- elif status_02 | trim == 'FAIL' or status_04 | trim == 'FAIL' -%}
        FAIL
      {%- elif chacha_present | default(false) | bool and status_03 | trim == 'FAIL' -%}
        FAIL
      {%- else -%}
        PASS
      {%- endif %}
    _cis_status: >-
      {%- if not sshd_installed | bool -%}
        SKIP
      {%- elif status_02 | trim == 'FAIL' or status_04 | trim == 'FAIL' -%}
        FAIL
      {%- elif chacha_present | default(false) | bool and status_03 | trim == 'FAIL' -%}
        FAIL
      {%- else -%}
        PASS
      {%- endif %}

    # ------------------------------------------------------------------
    # Requirement 06: Store final result in cis_result
# ------------------------------------------------------------------
- name: "Req step-06 - Store final audit result in cis_result"
  set_fact:
    cis_result: "{{ _cis_status | default('ERROR') | trim }}"
    task_06_name: "Store final audit result"
    task_06_cmd: "set_fact: cis_result = {{ _cis_status | default('ERROR') | trim }}"
    task_06_rc: 0
    data_06: "{{ _cis_status | default('ERROR') | trim }}"
    status_06: "{{ 'PASS' if _cis_status | default('ERROR') | trim == 'PASS' else 'FAIL' if _cis_status | default('ERROR') | trim == 'FAIL' else 'SKIP' if _cis_status | default('ERROR') | trim == 'SKIP' else 'ERROR' | trim }}"
    details_06: "Overall compliance status stored"
  register: _step06_output

    # ------------------------------------------------------------------
    # Final audit report
# ------------------------------------------------------------------
- name: "Generate audit report"
  debug:
    msg:
    - "AUDIT REPORT — CIS 5.1.4"
    - "Reference: CIS Benchmark checkpoint 5.1.4"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: {{ 'Summarize overall compliance status' }}"
    - "  Command: {{ 'set_fact based on previous audit results' }}"
    - "  Exit code: {{ 0 }}"
    - "  Data: {{ _cis_status | default('ERROR') | trim }}"
    - "  Status: {{ 'PASS' if _cis_status | default('ERROR') | trim in ['PASS','SKIP'] else _cis_status | default('ERROR') | trim }}"
    - "  Details: {{ 'Compliance evaluated' }}"
    - ""
    - "REQUIREMENT 06 - {{ req_06 }}:"
    - "  Task: {{ task_06_name | default('Not recorded') }}"
    - "  Command: {{ task_06_cmd | default('N/A') }}"
    - "  Exit code: {{ task_06_rc | default(-1) }}"
    - "  Data: {{ data_06 | default('') | trim }}"
    - "  Status: {{ status_06 | default('ERROR') | trim }}"
    - "  Details: {{ details_06 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ details_06 | default('Not evaluated') | trim }}"
    - "========================================================"
