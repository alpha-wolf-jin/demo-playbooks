---
- name: Initialize meta data variables
  include_vars: cis_audit_var_1_1_2_1_3.yml

- name: "Initialize data variables"
  ansible.builtin.set_fact:
    task_1_name: "Not executed"
    task_1_cmd: "N/A"
    task_1_rc: -1
    data_1: "Not collected yet"
    status_1: "ERROR"
    details_1: "Not evaluated"
    task_2_name: "Not executed"
    task_2_cmd: "N/A"
    task_2_rc: -1
    data_2: "Not collected yet"
    status_2: "ERROR"
    details_2: "Not evaluated"
    task_3_name: "Not executed"
    task_3_cmd: "N/A"
    task_3_rc: -1
    data_3: "Not collected yet"
    status_3: "ERROR"
    details_3: "Not evaluated"

- name: "Req step-01 - Check if /tmp is a separate mounted partition"
  ansible.builtin.command: findmnt -kn /tmp
  register: _step01_mount
  failed_when: false
  changed_when: false

- name: "Req step-01 - Determine /tmp separate partition flag"
  ansible.builtin.set_fact:
    _step01_separate: "{{ ((_step01_mount.stdout | default('') | trim).split() | length) > 1 and (((_step01_mount.stdout | default('') | trim).split()[0]) | default('')) == '/tmp' }}"

- name: "Req step-01 - Run the audit procedure using findmnt and grep for nosuid"
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -kn /tmp | grep -v nosuid
  args:
    executable: /bin/bash
  register: _step01_output
  failed_when: false
  changed_when: false
  when: _step01_separate | bool

- name: "Req step-01 - Store nosuid option audit details"
  ansible.builtin.set_fact:
    task_1_name: "Check nosuid option on /tmp partition using findmnt and grep"
    task_1_cmd: "findmnt -kn /tmp | grep -v nosuid"
    task_1_rc: "{{ _step01_output.rc | default(-1) }}"
    data_1: "{{ _step01_output.stdout | default('') | trim }}"
    status_1: "{{ ('SKIP' if not (_step01_separate | bool) else ('PASS' if (_step01_output.stdout | default('') | trim) == '' else 'FAIL')) | trim }}"
    details_1: "{{ ('No separate /tmp partition exists - prerequisite not met' if not (_step01_separate | bool) else ('nosuid option is set on /tmp partition' if (_step01_output.stdout | default('') | trim) == '' else 'nosuid option is NOT set on /tmp partition: ' + (_step01_output.stdout | default('') | trim))) | trim }}"

- name: "Req step-02 - VERIFY: Summarise compliance status for Ensure nosuid option set on /tmp partition"
  ansible.builtin.set_fact:
    _cis_status: "{{ status_1 | default('ERROR') | trim }}"
    task_2_name: "Summarise compliance status for nosuid option on /tmp partition"
    task_2_cmd: "Derived from Req step-01 audit result (findmnt -kn /tmp | grep -v nosuid)"
    task_2_rc: "{{ task_1_rc | default(-1) }}"
    data_2: "{{ data_1 | default('') | trim }}"
    status_2: "{{ status_1 | default('ERROR') | trim }}"
    details_2: "{{ details_1 | default('Not evaluated') | trim }}"

- name: "Req step-03 - Store the final audit result in a variable named cis_result using set_fact"
  ansible.builtin.set_fact:
    cis_result: "{{ _cis_status | default('ERROR') | trim }}"
    task_3_name: "Store final audit result in cis_result"
    task_3_cmd: "set_fact cis_result from _cis_status"
    task_3_rc: 0
    data_3: "{{ _cis_status | default('ERROR') | trim }}"
    status_3: "{{ _cis_status | default('ERROR') | trim }}"
    details_3: "Final compliance status stored in cis_result variable"

- name: "Req 4 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 1.1.2.1.3"
    - "Reference: CIS Benchmark checkpoint 1.1.2.1.3"
    - ""
    - "REQUIREMENT 01 - {{ req_1 }}:"
    - "  Task: {{ task_1_name | default('Not recorded') }}"
    - "  Command: {{ task_1_cmd | default('N/A') }}"
    - "  Exit code: {{ task_1_rc | default(-1) }}"
    - "  Data: {{ data_1 | default('') | trim }}"
    - "  Status: {{ status_1 | default('ERROR') | trim }}"
    - "  Details: {{ details_1 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_2 }}:"
    - "  Task: {{ task_2_name | default('Not recorded') }}"
    - "  Command: {{ task_2_cmd | default('N/A') }}"
    - "  Exit code: {{ task_2_rc | default(-1) }}"
    - "  Data: {{ data_2 | default('') | trim }}"
    - "  Status: {{ status_2 | default('ERROR') | trim }}"
    - "  Details: {{ details_2 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_3 }}:"
    - "  Task: {{ task_3_name | default('Not recorded') }}"
    - "  Command: {{ task_3_cmd | default('N/A') }}"
    - "  Exit code: {{ task_3_rc | default(-1) }}"
    - "  Data: {{ data_3 | default('') | trim }}"
    - "  Status: {{ status_3 | default('ERROR') | trim }}"
    - "  Details: {{ details_3 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ details_2 | default('Not evaluated') | trim }}"
    - "========================================================"
