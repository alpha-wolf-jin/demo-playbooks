---
- name: Initialize meta data variables
  include_vars: cis_audit_var_1_1_2_1_3.yml

- name: "Initialize data variables"
  ansible.builtin.set_fact:
    data_01: "Not collected yet"
    status_01: "ERROR"
    details_01: "Not evaluated"
    task_01_name: "Not executed"
    task_01_cmd: "N/A"
    task_01_rc: -1
    data_02: "Not collected yet"
    status_02: "ERROR"
    details_02: "Not evaluated"
    task_02_name: "Not executed"
    task_02_cmd: "N/A"
    task_02_rc: -1
    data_03: "Not collected yet"
    status_03: "ERROR"
    details_03: "Not evaluated"
    task_03_name: "Not executed"
    task_03_cmd: "N/A"
    task_03_rc: -1
    data_04: "Not collected yet"
    status_04: "ERROR"
    details_04: "Not evaluated"
    task_04_name: "Not executed"
    task_04_cmd: "N/A"
    task_04_rc: -1

- name: "Req step-01 - Check if /tmp is a separate mounted partition using findmnt"
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -kn /tmp | grep -E '^/tmp[[:space:]]'
  args:
    executable: /bin/bash
  register: tmp_is_separate
  failed_when: false
  changed_when: false

- name: "Req step-01 - Verify nosuid mount option is set on /tmp partition"
  ansible.builtin.shell: |
    set -o pipefail
    findmnt -kn /tmp | grep -v nosuid
  args:
    executable: /bin/bash
  register: _step01_output
  failed_when: false
  changed_when: false
  when: tmp_is_separate.rc | default(1) == 0

- name: "Req step-01 - Record nosuid audit result"
  ansible.builtin.set_fact:
    task_01_name: "Verify nosuid mount option on /tmp partition"
    task_01_cmd: "findmnt -kn /tmp | grep -v nosuid"
    task_01_rc: "{{ (_step01_output.rc | default(1)) if (tmp_is_separate.rc | default(1)) == 0 else 1 }}"
    data_01: "{{ (_step01_output.stdout | default('')) | trim }}"
    status_01: >-
      {{ 'SKIP' if (tmp_is_separate.rc | default(1)) != 0 else
         ('PASS' if (_step01_output.stdout | default('') | trim) == '' else 'FAIL') }}
    details_01: >-
      {{ '/tmp is not a separate mounted partition - check skipped' if (tmp_is_separate.rc | default(1)) != 0 else
         ('nosuid option is set on /tmp partition' if (_step01_output.stdout | default('') | trim) == '' else
          'nosuid option is NOT set on /tmp: ' + (_step01_output.stdout | default('') | trim)) }}

- name: "Req step-02 - Summarise compliance status for nosuid option on /tmp"
  ansible.builtin.set_fact:
    task_02_name: "Summarise compliance status for nosuid option on /tmp"
    task_02_cmd: "N/A"
    task_02_rc: -1
    data_02: "{{ status_01 | default('ERROR') | trim }}"
    status_02: "{{ status_01 | default('ERROR') | trim }}"
    details_02: "{{ details_01 | default('Not evaluated') | trim }}"
    _cis_status: "{{ status_01 | default('ERROR') | trim }}"

- name: "Req step-03 - Store final audit result in cis_result"
  ansible.builtin.set_fact:
    task_03_name: "Store final audit result in cis_result"
    task_03_cmd: "set_fact cis_result"
    task_03_rc: 0
    data_03: "{{ _cis_status | default('ERROR') | trim }}"
    status_03: "{{ _cis_status | default('ERROR') | trim }}"
    details_03: "{{ details_02 | default('Not evaluated') | trim }}"
    cis_result: "{{ _cis_status | default('ERROR') | trim }}"

- name: "Req 04 - Record report generation status"
  ansible.builtin.set_fact:
    task_04_name: "Generate audit report"
    task_04_cmd: "debug msg"
    task_04_rc: 0
    data_04: "Audit report rendered"
    status_04: "PASS"
    details_04: "Compliance report generated successfully"

- name: "Req 04 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 1.1.2.1.3"
    - "Reference: CIS Benchmark checkpoint 1.1.2.1.3"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('Not evaluated') | trim }}"
    - "========================================================"
