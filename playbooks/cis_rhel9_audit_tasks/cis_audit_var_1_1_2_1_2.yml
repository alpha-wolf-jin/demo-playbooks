partition: "/tmp"
fs_option: "nodev"
req_01: "Check if the target partition ({{ partition }}) is a separate partition using command: `findmnt -kn {{ partition }}`. Expected result: output exists"
req_02: "Check if the {{ fs_option }} option is set on {{ partition }} using command: `findmnt -kn {{ partition }} | grep -v {{ fs_option }}`. Expected result: no output returned"
req_03: "Summarize compliance: PASS if all checks pass, SKIP if {{ partition }} is not a separate partition, FAIL if {{ fs_option }} is missing."
req_04: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_05: "Create a task named 'Generate audit report' using debug msg with EXACTLY this format: AUDIT REPORT — CIS 1.1.2.1.2"
