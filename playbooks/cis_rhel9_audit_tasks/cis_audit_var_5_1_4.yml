weak_ciphers: "3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc"
req_01: "Check whether OpenSSH server is installed by locating the sshd binary. If not found, the audit will be skipped"
req_02: "Run the audit command using the configurable weak cipher list to detect any weak ciphers in the effective sshd configuration"
req_03: "Determine compliance status: if sshd is not installed, set cis_result=SKIP and weak_ciphers_found=none. If weak ciphers were found (non-empty _weak_ciphers_output), set cis_result=FAIL and weak_ciphers_found to the detected list. Otherwise set cis_result=PASS and weak_ciphers_found=none."
