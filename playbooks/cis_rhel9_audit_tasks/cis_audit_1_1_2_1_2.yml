---
- name: Initialize meta data variables
  include_vars: cis_audit_var_1_1_2_1_2.yml

- name: "Req step-01 - Check if {{ partition }} is a separate partition"
  ansible.builtin.shell: "findmnt -kn {{ partition }}"
  args:
    executable: /bin/bash
  register: _step01_output
  failed_when: false
  changed_when: false

- name: "Req step-01 - Record separate partition result"
  ansible.builtin.set_fact:
    _partition_separate: "{{ _step01_output.stdout | default('') | trim | length > 0 }}"
    task_01_name: "Check if {{ partition }} is a separate partition"
    task_01_cmd: "findmnt -kn {{ partition }}"
    task_01_rc: "{{ _step01_output.rc | default(-1) }}"
    data_01: "{{ _step01_output.stdout | default('') | trim }}"
    status_01: "{{ ('PASS' if (_step01_output.stdout | default('') | trim | length > 0) else 'FAIL') | trim }}"
    details_01: >-
      {{ ('Separate partition found for ' ~ partition ~ '.' if (_step01_output.stdout | default('') | trim | length > 0) else 'No separate partition found for ' ~ partition ~ '.') | trim }}

- name: "Req step-02 - Check if {{ fs_option }} option is set on {{ partition }}"
  ansible.builtin.shell: >-
    set -o pipefail && findmnt -kn {{ partition }} | grep -v {{ fs_option }}
  args:
    executable: /bin/bash
  register: _step02_output
  failed_when: false
  changed_when: false
  when: _partition_separate | bool

- name: "Req step-03 - Summarize compliance status"
  ansible.builtin.set_fact:
    _cis_status: >-
      {{ ('SKIP' if not (_partition_separate | bool) else
          ('ERROR' if (_step02_output is not defined or (_step02_output.stderr | default('') | trim | length > 0))
           else ('PASS' if (_step02_output.stdout | default('') | trim | length == 0) else 'FAIL'))) | trim }}
    task_02_name: "Check if {{ fs_option }} option is set on {{ partition }}"
    task_02_cmd: "findmnt -kn {{ partition }} | grep -v {{ fs_option }}"
    task_02_rc: "{{ _step02_output.rc | default(-1) }}"
    data_02: "{{ _step02_output.stdout | default('') | trim }}"
    status_02: >-
      {{ ('SKIP' if not (_partition_separate | bool) else
          ('ERROR' if (_step02_output is not defined or (_step02_output.stderr | default('') | trim | length > 0))
           else ('PASS' if (_step02_output.stdout | default('') | trim | length == 0) else 'FAIL'))) | trim }}
    details_02: >-
      {{ ('Skipped: ' ~ partition ~ ' is not a separate partition.' if not (_partition_separate | bool) else
          ('Error: mount option check could not be completed.' if (_step02_output is not defined or (_step02_output.stderr | default('') | trim | length > 0)) else
           ('Compliant: ' ~ fs_option ~ ' is set on ' ~ partition ~ '.' if (_step02_output.stdout | default('') | trim | length == 0) else
            'Non-compliant: ' ~ fs_option ~ ' is missing on ' ~ partition ~ '.'))) | trim }}
    task_03_name: "Summarize compliance status"
    task_03_cmd: "set_fact status_03"
    task_03_rc: 0
    data_03: >-
      {{ ('SKIP' if not (_partition_separate | bool) else
          ('ERROR' if (_step02_output is not defined or (_step02_output.stderr | default('') | trim | length > 0))
           else ('PASS' if (_step02_output.stdout | default('') | trim | length == 0) else 'FAIL'))) | trim }}
    status_03: >-
      {{ ('SKIP' if not (_partition_separate | bool) else
          ('ERROR' if (_step02_output is not defined or (_step02_output.stderr | default('') | trim | length > 0))
           else ('PASS' if (_step02_output.stdout | default('') | trim | length == 0) else 'FAIL'))) | trim }}
    details_03: >-
      {{ ('Skipped: ' ~ partition ~ ' is not a separate partition.' if not (_partition_separate | bool) else
          ('ERROR: mount option check could not be completed.' if (_step02_output is not defined or (_step02_output.stderr | default('') | trim | length > 0)) else
           ('Compliant: ' ~ fs_option ~ ' is set on ' ~ partition ~ '.' if (_step02_output.stdout | default('') | trim | length == 0) else
            'Non-compliant: ' ~ fs_option ~ ' is missing on ' ~ partition ~ '.'))) | trim }}

- name: "Req step-04 - Store final audit result in cis_result"
  ansible.builtin.set_fact:
    cis_result: "{{ status_03 | default('ERROR') | trim }}"
    _cis_status: "{{ status_03 | default('ERROR') | trim }}"
    task_04_name: "Store final audit result in cis_result"
    task_04_cmd: "set_fact cis_result={{ status_03 | default('ERROR') | trim }}"
    task_04_rc: 0
    data_04: "{{ status_03 | default('ERROR') | trim }}"
    status_04: "{{ status_03 | default('ERROR') | trim }}"
    details_04: "Final audit result stored in cis_result."

- name: "Req step-05 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 1.1.2.1.2"
    - "Reference: CIS Benchmark checkpoint 1.1.2.1.2"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('ERROR') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: Generate audit report"
    - "  Command: debug msg"
    - "  Exit code: 0"
    - "  Data: Audit report generated"
    - "  Status: PASS"
    - "  Details: Audit report displayed."
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "========================================================"
