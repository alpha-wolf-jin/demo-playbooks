        # step-17
        - name: "Req step-17 - Compute post-update disk issues list"
          ansible.builtin.set_fact:
            _post_disk_issues: >-
              {{ post_mounts
                 | rejectattr('mount', 'in', (fs_exclude_list | split(',') | map('trim') | list))
                 | rejectattr('fstype', 'in', (fs_type_exclude_list | split(',') | map('trim') | list))
                 | selectattr('size_available', 'lt', (min_free_disk_gb | int * 1073741824))
                 | map(attribute='mount') | list }}
          tags: [execute]

        - name: "Req step-17 - Set post-update disk OK flag"
          ansible.builtin.set_fact:
            _post_disk_ok: "{{ _post_disk_issues | length == 0 }}"
          tags: [execute]

        # step-18
        - name: "Req step-18 - Gather post-update service facts"
          ansible.builtin.service_facts:
          register: _ansible_services_post
          tags: [execute]

        - name: "Req step-18 - Store post-update service facts as dict"
          ansible.builtin.set_fact:
            post_services_facts: "{{ _ansible_services_post.ansible_facts.services }}"
