          tags: [execute]

        - name: "Req step-01 - Extract free memory MB"
          ansible.builtin.set_fact:
            pre_memfree_mb: "{{ _memfree_mb_pre.ansible_facts.ansible_memfree_mb | int }}"
          tags: [execute]

