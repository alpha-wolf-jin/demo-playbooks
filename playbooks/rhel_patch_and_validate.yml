- name: "SOP playbook 'rhel_patch_and_validate' (ACTION — changes system state): Updates all packages on a RHEL managed host, reboots, and validates memory, disk space, and running services both before and after the update, producing a comprehensive result report."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
