        - name: "Req step-15 - Check post-update memory threshold"
          ansible.builtin.set_fact:
            _post_mem_ok: "{{ (post_memfree_mb | int) >= (min_free_memory_gb | int * 1024) }}"
          tags: [execute]

        # step-16
        - name: "Req step-16 - Gather post-update mount facts"
          ansible.builtin.setup:
            gather_subset:
              - hardware
            filter:
              - ansible_mounts
          register: _ansible_mounts_post
