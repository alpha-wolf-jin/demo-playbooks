---
- name: "Audit CIS checkpoint 1.1.3: Ensure 'Minimum password age' is set to '1 or more day(s)'"
  hosts: all
  gather_facts: false
  vars:
    minimum_password_age: "1"
    req_01: "1. Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: "2. If Domain Controller: Read 'Minimum password age' via Get-ADDefaultDomainPasswordPolicy. changed_when: false."
    req_03: "3. If Member Server: Read 'Minimum password age' using community.windows.win_security_policy with section=System Access. changed_when: false."
    req_04: "4. If Domain Controller: Evaluate whether 'Minimum password age' is equals '1 or more day(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_05: "5. If Member Server: Evaluate whether 'Minimum password age' is equals '1 or more day(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_06: "6. Store cis_result: PASS, FAIL, SKIP, or ERROR based on the evaluation."
    req_07: "7. Generate the audit report using ansible.builtin.debug."
    req_08: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  tasks:
    - name: "Req step-01 - Detect Windows server role"
      ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
      register: _step01_output
      failed_when: false
      changed_when: false

    - name: "Req step-01 - Set server role flags"
      ansible.builtin.set_fact:
        is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4','5'] }}"
        is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1','2','3'] }}"
        role_detection_error: "{{ (_step01_output.rc | default(-1) != 0) or ((_step01_output.stdout | default('') | trim) not in ['1','2','3','4','5']) }}"
        role_status: "{{ 'PASS' if (_step01_output.rc | default(-1) == 0) and ((_step01_output.stdout | default('') | trim) in ['1','2','3','4','5']) else 'ERROR' }}"

    - name: "Req step-02 - Read Minimum password age from AD default domain password policy"
      ansible.windows.win_shell: |
        try {
          Import-Module ActiveDirectory -ErrorAction Stop
          $v = (Get-ADDefaultDomainPasswordPolicy).MinPasswordAge
          if ($v -is [TimeSpan]) { Write-Output $v.Days } else { Write-Output $v }
          exit 0
        } catch {
          Write-Output "ERROR: $($_.Exception.Message)"
          exit 2
        }
      register: _step02_output
      failed_when: false
      changed_when: false
      when: is_dc | bool

    - name: "Req step-03 - Check local security policy Minimum password age with win_security_policy"
      community.windows.win_security_policy:
        section: System Access
        key: MinimumPasswordAge
        value: "{{ minimum_password_age }}"
      check_mode: true
      register: _step03_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-03 - Read actual Minimum password age from local security policy"
      ansible.windows.win_shell: |
        $cfg = Join-Path $env:TEMP 'cis_11_3_secpol.cfg'
        $out = secedit /export /cfg "$cfg" /areas SECURITYPOLICY 2>&1 | Out-String
        if (Test-Path -LiteralPath $cfg) {
          $m = Select-String -Path $cfg -Pattern '^\s*MinimumPasswordAge\s*=\s*[0-9]+' | Select-Object -First 1
          if ($m) {
            $val = [regex]::Match($m.Line, '[0-9]+').Value
            Write-Output $val
            Remove-Item -LiteralPath $cfg -ErrorAction SilentlyContinue
            exit 0
          } else {
            Write-Output "NOT_FOUND"
            Remove-Item -LiteralPath $cfg -ErrorAction SilentlyContinue
            exit 1
          }
        } else {
          Write-Output "EXPORT_ERROR: $out"
          exit 2
        }
      register: _member_read
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-04 - Evaluate DC Minimum password age compliance"
      ansible.builtin.set_fact:
        dc_status: >-
          {{ 'SKIP' if not (is_dc | bool) else
             'ERROR' if (_step02_output.rc | default(-1) != 0) else
             'PASS' if ((_step02_output.stdout | default('') | trim) | int) >= (minimum_password_age | int) else
             'FAIL' }}
        dc_data: "{{ _step02_output.stdout | default('') | trim }}"
        dc_details: >-
          {{ 'Not applicable to this host' if not (is_dc | bool) else
             'AD policy check failed or returned no data' if (_step02_output.rc | default(-1) != 0) else
             'Minimum password age is ' ~ (_step02_output.stdout | default('') | trim) ~ ' day(s); required ' ~ minimum_password_age ~ ' or more' }}
        _cis_status: >-
          {{ 'ERROR' if (_step02_output.rc | default(-1) != 0) else
             'PASS' if ((_step02_output.stdout | default('') | trim) | int) >= (minimum_password_age | int) else
             'FAIL' }}
      when: is_dc | bool

    - name: "Req step-05 - Evaluate Member Server Minimum password age compliance"
      ansible.builtin.set_fact:
        member_status: >-
          {{ 'SKIP' if not (is_member | bool) else
             'ERROR' if (_member_read.rc | default(-1) != 0) else
             'PASS' if ((_member_read.stdout | default('') | trim) | int) >= (minimum_password_age | int) else
             'FAIL' }}
        member_data: "{{ _member_read.stdout | default('') | trim }}"
        member_details: >-
          {{ 'Not applicable to this host' if not (is_member | bool) else
             'Local security policy read failed' if (_member_read.rc | default(-1) != 0) else
             'Minimum password age is ' ~ (_member_read.stdout | default('') | trim) ~ ' day(s); required ' ~ minimum_password_age ~ ' or more' }}
        _cis_status: >-
          {{ 'ERROR' if (_member_read.rc | default(-1) != 0) else
             'PASS' if ((_member_read.stdout | default('') | trim) | int) >= (minimum_password_age | int) else
             'FAIL' }}
      when: is_member | bool

    - name: "Req step-06 - Store cis_result for Domain Controller branch"
      ansible.builtin.set_fact:
        cis_result: "{{ dc_status | default('ERROR') | trim }}"
      when: is_dc | bool

    - name: "Req step-06 - Store cis_result for Member Server branch"
      ansible.builtin.set_fact:
        cis_result: "{{ member_status | default('ERROR') | trim }}"
      when: is_member | bool

    - name: "Req step-08 - Store the final audit result in a variable named 'cis_result' using set_fact"
      ansible.builtin.set_fact:
        cis_result: "{{ (dc_status if (is_dc | bool) else member_status if (is_member | bool) else 'ERROR') | trim }}"

    - name: "Req step-07 - Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.3"
          - "Reference: CIS Benchmark checkpoint 1.1.3"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: Detect Windows server role"
          - "  Command: (Get-WmiObject Win32_ComputerSystem).DomainRole"
          - "  Exit code: {{ _step01_output.rc | default(-1) }}"
          - "  Data: {{ _step01_output.stdout | default('') | trim }}"
          - "  Status: {{ role_status | default('ERROR') | trim }}"
          - "  Details: {{ 'Role detection succeeded and DomainRole recognized' if (role_status | default('ERROR') | trim == 'PASS') else 'Role detection failed or DomainRole unrecognized' }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: Read AD default domain password policy"
          - "  Command: Get-ADDefaultDomainPasswordPolicy MinPasswordAge"
          - "  Exit code: {{ _step02_output.rc | default(-1) }}"
          - "  Data: {{ _step02_output.stdout | default('') | trim }}"
          - "  Status: {{ 'SKIP' if not (is_dc | bool) else 'ERROR' if (_step02_output.rc | default(-1) != 0) else 'PASS' }}"
          - "  Details: {{ 'Not applicable to this host' if not (is_dc | bool) else 'AD policy read succeeded' if (_step02_output.rc | default(-1) == 0) else 'AD policy read failed' }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: Read local security policy Minimum password age"
          - "  Command: community.windows.win_security_policy section=System Access key=MinimumPasswordAge value={{ minimum_password_age }} (check mode); secedit /export /cfg (Join-Path $env:TEMP 'cis_11_3_secpol.cfg')"
          - "  Exit code: {{ _member_read.rc | default(-1) }}"
          - "  Data: {{ _member_read.stdout | default('') | trim }}"
          - "  Status: {{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_member_read.rc | default(-1) != 0) else 'PASS' }}"
          - "  Details: {{ 'Not applicable to this host' if not (is_member | bool) else 'Local policy read succeeded' if (_member_read.rc | default(-1) == 0) else 'Local policy read failed' }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: Evaluate DC Minimum password age compliance"
          - "  Command: N/A"
          - "  Exit code: {{ _step02_output.rc | default(-1) }}"
          - "  Data: {{ dc_data | default('') | trim }}"
          - "  Status: {{ dc_status | default('SKIP') | trim }}"
          - "  Details: {{ dc_details | default('Not applicable to this host') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: Evaluate Member Server Minimum password age compliance"
          - "  Command: N/A"
          - "  Exit code: {{ _member_read.rc | default(-1) }}"
          - "  Data: {{ member_data | default('') | trim }}"
          - "  Status: {{ member_status | default('SKIP') | trim }}"
          - "  Details: {{ member_details | default('Not applicable to this host') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: Store final audit result in cis_result"
          - "  Command: N/A"
          - "  Exit code: 0"
          - "  Data: {{ cis_result | default('ERROR') | trim }}"
          - "  Status: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: Overall compliance result is {{ cis_result | default('ERROR') | trim }}"
          - ""
          - "REQUIREMENT 07 - {{ req_07 }}:"
          - "  Task: Generate audit report"
          - "  Command: ansible.builtin.debug"
          - "  Exit code: 0"
          - "  Data: Report generated"
          - "  Status: PASS"
          - "  Details: Audit report displayed to output"
          - ""
          - "REQUIREMENT 08 - {{ req_08 }}:"
          - "  Task: Store final audit result in a variable named 'cis_result' using set_fact"
          - "  Command: ansible.builtin.set_fact"
          - "  Exit code: 0"
          - "  Data: {{ cis_result | default('ERROR') | trim }}"
          - "  Status: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: Overall compliance result is {{ cis_result | default('ERROR') | trim }}"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: Overall audit result is {{ cis_result | default('ERROR') | trim }}"
          - "========================================================"