---
- name: "SOP playbook 'ensure_aap_inventory_with_hosts' (ACTION — changes system state): Ensures an AAP organization and inventory exist, then ensures a comma-separated list of hosts are present in that inventory. Reports per-host status: added, skipped, failed. [target host: localhost (localhost)]"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    playbook_name: "ensure_aap_inventory_with_hosts"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    aap_gateway_ip: ""
    aap_username: ""
    aap_password: ""
    organization_name: ""
    inventory_name: ""
    hosts_list: ""

  pre_tasks:
    # === SNAPSHOT (tag: snapshot) ===
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Look up organization"
      ansible.builtin.set_fact:
        _snap_org: "{{ query('ansible.controller.controller_api', 'organizations',
                              host=aap_gateway_ip,
                              username=aap_username,
                              password=aap_password,
                              verify_ssl=false,
                              query_params={'name': organization_name},
                              return_all=true) | flatten }}"
      tags: [snapshot]

    - name: "Snapshot - Check if organization snapshot exists"
      ansible.builtin.stat:
        path: "{{ backup_dir }}/org_snapshot.json"
      register: _snap_org_check
      tags: [snapshot]

    - name: "Snapshot - Save organization snapshot"
      ansible.builtin.copy:
        content: "{{ {'exists': (_snap_org | length > 0), 'id': (_snap_org | first).id if _snap_org else none} | to_json }}"
        dest: "{{ backup_dir }}/org_snapshot.json"
      when: not _snap_org_check.stat.exists
      tags: [snapshot]

    - name: "Snapshot - Look up inventory"
      ansible.builtin.set_fact:
        _snap_inv: "{{ query('ansible.controller.controller_api', 'inventories',
                              host=aap_gateway_ip,
                              username=aap_username,
                              password=aap_password,
                              verify_ssl=false,
                              query_params={'name': inventory_name, 'organization__name': organization_name},
                              return_all=true) | flatten }}"
      tags: [snapshot]

    - name: "Snapshot - Check if inventory snapshot exists"
      ansible.builtin.stat:
        path: "{{ backup_dir }}/inv_snapshot.json"
      register: _snap_inv_check
      tags: [snapshot]

    - name: "Snapshot - Save inventory snapshot"
      ansible.builtin.copy:
        content: "{{ {'exists': (_snap_inv | length > 0), 'id': (_snap_inv | first).id if _snap_inv else none} | to_json }}"
        dest: "{{ backup_dir }}/inv_snapshot.json"
      when: not _snap_inv_check.stat.exists
      tags: [snapshot]

    - name: "Snapshot - Look up hosts in inventory"
      ansible.builtin.set_fact:
        _snap_hosts: "{{ query('ansible.controller.controller_api', 'hosts',
                                host=aap_gateway_ip,
                                username=aap_username,
                                password=aap_password,
                                verify_ssl=false,
                                query_params={'inventory': (_snap_inv | first).id},
                                return_all=true) | flatten | map(attribute='name') | list }}"
      when: _snap_inv | length > 0
      tags: [snapshot]

    - name: "Snapshot - Check if hosts snapshot exists"
      ansible.builtin.stat:
        path: "{{ backup_dir }}/hosts_snapshot.json"
      register: _snap_hosts_check
      tags: [snapshot]

    - name: "Snapshot - Save hosts snapshot"
      ansible.builtin.copy:
        content: "{{ {'exists': true, 'hosts': _snap_hosts} | to_json }}"
        dest: "{{ backup_dir }}/hosts_snapshot.json"
      when:
        - _snap_hosts is defined
        - not _snap_hosts_check.stat.exists
      tags: [snapshot]

  tasks:
    - block:
        # === EXECUTE (tag: execute) ===
        - name: "Validate required variables"
          ansible.builtin.assert:
            that:
              - aap_gateway_ip | length > 0
              - aap_username | length > 0
              - aap_password | length > 0
              - organization_name | length > 0
              - inventory_name | length > 0
              - hosts_list | length > 0
            fail_msg: "All required variables must be provided and non-empty."
          tags: [execute]

        - name: "Req 2 - Parse hosts list"
          ansible.builtin.set_fact:
            _hosts: "{{ (hosts_list | default('')).split(',') | map('trim') | reject('equalto', '') | list }}"
          tags: [execute]

        - name: "Req 3 - Look up organization"
          ansible.builtin.set_fact:
            _org_lookup: "{{ query('ansible.controller.controller_api', 'organizations',
                              host=aap_gateway_ip,
                              username=aap_username,
                              password=aap_password,
                              verify_ssl=false,
                              query_params={'name': organization_name},
                              return_all=true) | flatten }}"
          tags: [execute]

        - name: "Req 4 - Check if organization exists"
          ansible.builtin.set_fact:
            _org_id: "{{ (_org_lookup | first).id }}"
          when: _org_lookup | length > 0
          tags: [execute]

        - name: "Req 5 - Create organization"
          ansible.controller.organization:
            name: "{{ organization_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          register: _org_created
          when: _org_lookup | length == 0
          tags: [execute]

        - name: "Req 6 - Set organization ID from creation if not already set"
          ansible.builtin.set_fact:
            _org_id: "{{ _org_created.id }}"
          when: _org_created is defined and _org_created.id is defined
          tags: [execute]

        - name: "Req 7 - Fetch all inventories"
          ansible.builtin.set_fact:
            _all_inventories: "{{ query('ansible.controller.controller_api', 'inventories',
                                  host=aap_gateway_ip,
                                  username=aap_username,
                                  password=aap_password,
                                  verify_ssl=false,
                                  return_all=true) | flatten }}"
          tags: [execute]

        - name: "Req 8 - Filter inventory by name and organization"
          ansible.builtin.set_fact:
            _existing_inventory: >-
              {{ _all_inventories
                 | selectattr('name', 'equalto', inventory_name)
                 | selectattr('organization', 'equalto', _org_id)
                 | list }}
          tags: [execute]

        - name: "Req 9 - Check if inventory exists"
          ansible.builtin.set_fact:
            _inventory_id: "{{ (_existing_inventory | first).id }}"
          when: _existing_inventory | length > 0
          tags: [execute]

        - name: "Req 10 - Create inventory"
          ansible.controller.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ _org_id }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          register: _inventory_created
          when: _existing_inventory | length == 0
          tags: [execute]

        - name: "Req 11 - Set inventory ID from creation if not already set"
          ansible.builtin.set_fact:
            _inventory_id: "{{ _inventory_created.id }}"
          when: _inventory_created is defined and _inventory_created.id is defined
          tags: [execute]

        - name: "Req 12 - Ensure hosts present"
          ansible.controller.host:
            name: "{{ item }}"
            inventory: "{{ _inventory_id }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          loop: "{{ _hosts }}"
          register: _host_results
          ignore_errors: true
          tags: [execute]

        - name: "Req 13 - Summarize host results"
          ansible.builtin.set_fact:
            _added_hosts: >-
              {{ _host_results.results
                 | rejectattr('failed')
                 | selectattr('changed')
                 | map(attribute='item')
                 | list }}
            _skipped_hosts: >-
              {{ _host_results.results
                 | rejectattr('failed')
                 | rejectattr('changed')
                 | map(attribute='item')
                 | list }}
            _failed_hosts: >-
              {{ _host_results.results
                 | selectattr('failed')
                 | map(attribute='item')
                 | list }}
          tags: [execute]

        - name: "Verify hosts are present in inventory"
          ansible.builtin.set_fact:
            _inventory_host_names: >-
              {{ query('ansible.controller.controller_api', 'hosts',
                       host=aap_gateway_ip,
                       username=aap_username,
                       password=aap_password,
                       verify_ssl=false,
                       query_params={'inventory': _inventory_id},
                       return_all=true) | flatten | map(attribute='name') | list }}
          tags: [execute]

        - name: "Identify missing hosts"
          ansible.builtin.set_fact:
            _missing_hosts: "{{ _hosts | difference(_inventory_host_names) }}"
          tags: [execute]

        - name: "Combine failed hosts with missing hosts"
          ansible.builtin.set_fact:
            _failed_hosts: "{{ (_failed_hosts + _missing_hosts) | unique | list }}"
          when: _missing_hosts | length > 0
          tags: [execute]

        - name: "Req 14 - Emit result"
          ansible.builtin.debug:
            msg: |
              <result>
              organization_name: {{ organization_name }}
              inventory_name: {{ inventory_name }}
              added_hosts: {{ _added_hosts }}
              skipped_hosts: {{ _skipped_hosts }}
              failed_hosts: {{ _failed_hosts }}
              </result>
          tags: [execute]

      rescue:
        - name: "Req 15 - Emit error result"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: ensure_aap_inventory_with_hosts failed
              </result>
          tags: [always]

        - name: "Abort on failure"
          ansible.builtin.fail:
            msg: "Playbook failed — see error result above"
          tags: [always]

      always:
        # === RESTORE (tag: restore) ===
        - name: "Restore - Read organization snapshot"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/org_snapshot.json"
          register: _restore_org_snap
          failed_when: false
          tags: [restore]

        - name: "Restore - Read inventory snapshot"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/inv_snapshot.json"
          register: _restore_inv_snap
          failed_when: false
          tags: [restore]

        - name: "Restore - Read hosts snapshot"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/hosts_snapshot.json"
          register: _restore_hosts_snap
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete inventory if created during run"
          ansible.controller.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - _restore_inv_snap.content is defined
            - not ((_restore_inv_snap.content | b64decode | from_json).exists)
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete organization if created during run"
          ansible.controller.organization:
            name: "{{ organization_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - _restore_org_snap.content is defined
            - not ((_restore_org_snap.content | b64decode | from_json).exists)
          failed_when: false
          tags: [restore]

        - name: "Restore - Compute current hosts if inventory existed before"
          ansible.builtin.set_fact:
            _restore_current_hosts: >-
              {{ query('ansible.controller.controller_api', 'hosts',
                       host=aap_gateway_ip,
                       username=aap_username,
                       password=aap_password,
                       verify_ssl=false,
                       query_params={'inventory': ((_restore_inv_snap.content | b64decode | from_json).id)},
                       return_all=true) | flatten | map(attribute='name') | list }}
          when:
            - _restore_inv_snap.content is defined
            - ((_restore_inv_snap.content | b64decode | from_json).exists)
          tags: [restore]

        - name: "Restore - Remove hosts added during execution"
          ansible.controller.host:
            name: "{{ item }}"
            inventory: "{{ inventory_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          loop: "{{ _restore_current_hosts | default([]) | difference(_restore_hosts_snap_list | default([])) }}"
          when:
            - _restore_hosts_snap.content is defined
            - _restore_current_hosts is defined
          vars:
            _restore_hosts_snap_list: "{{ (_restore_hosts_snap.content | b64decode | from_json).hosts }}"
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]