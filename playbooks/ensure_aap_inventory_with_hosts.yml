---
- name: "SOP playbook 'ensure_aap_inventory_with_hosts' (ACTION — changes system state): Ensures an AAP organization and inventory exist, then ensures a comma-separated list of hosts are present in that inventory. Reports per-host status: added, skipped, failed. [target host: localhost (localhost)]"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    playbook_name: "ensure_aap_inventory_with_hosts"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    aap_gateway_ip: ""          # required – override via extra_vars
    aap_username: ""            # required – override via extra_vars
    aap_password: ""            # required – override via extra_vars
    organization_name: ""       # required – override via extra_vars
    inventory_name: ""          # required – override via extra_vars
    hosts_list: ""              # required – override via extra_vars

  pre_tasks:
    - block:
        # ====================================================
        # SNAPSHOT tasks (tag: snapshot)
        # ====================================================
        - name: "Snapshot - Create backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: directory
            mode: '0700'
          tags: [snapshot]

        - name: "Snapshot - Check if organization exists"
          ansible.builtin.set_fact:
            _snap_org_result: "{{ query('ansible.controller.controller_api', 'organizations', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, query_params={'name': organization_name}, return_all=true) | flatten }}"
          tags: [snapshot]

        - name: "Snapshot - Save organization existence flag"
          ansible.builtin.copy:
            content: "{{ 'True' if (_snap_org_result | length > 0) else 'False' }}"
            dest: "{{ backup_dir }}/org_exists.flag"
          tags: [snapshot]

        - name: "Snapshot - Check if inventory exists"
          ansible.builtin.set_fact:
            _snap_inv_result: "{{ query('ansible.controller.controller_api', 'inventories', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, query_params={'name': inventory_name, 'organization__name': organization_name}, return_all=true) | flatten }}"
          tags: [snapshot]

        - name: "Snapshot - Save inventory existence and hosts if exists"
          block:
            - ansible.builtin.copy:
                content: "True"
                dest: "{{ backup_dir }}/inv_exists.flag"
            - ansible.builtin.set_fact:
                _snap_hosts: "{{ query('ansible.controller.controller_api', 'hosts', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, query_params={'inventory': (_snap_inv_result | first).id}, return_all=true) | flatten | map(attribute='name') | list }}"
            - ansible.builtin.copy:
                content: "{{ _snap_hosts | join(',') }}"
                dest: "{{ backup_dir }}/original_hosts.txt"
          when: _snap_inv_result | length > 0
          tags: [snapshot]

        - name: "Snapshot - Flag inventory does not exist"
          ansible.builtin.copy:
            content: "False"
            dest: "{{ backup_dir }}/inv_exists.flag"
          when: _snap_inv_result | length == 0
          tags: [snapshot]

      rescue:
        - name: "Emit error on snapshot failure"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: ensure_aap_inventory_with_hosts failed on pre_tasks - {{ ansible_failed_result.msg | default('Unknown error') }}
              </result>
          tags: [always]

  tasks:
    - block:
        # ====================================================
        # EXECUTE tasks (tag: execute)
        # ====================================================
        - name: "Validate required variables"
          ansible.builtin.assert:
            that:
              - aap_gateway_ip | length > 0
              - aap_username | length > 0
              - aap_password | length > 0
              - organization_name | length > 0
              - inventory_name | length > 0
              - hosts_list | length > 0
            fail_msg: "All required variables must be provided and non-empty."
          tags: [execute]

        - name: "Step-01 - Parse hosts list"
          ansible.builtin.set_fact:
            _hosts: "{{ (hosts_list | default('')).split(',') | map('trim') | reject('equalto', '') | list }}"
          tags: [execute]

        - name: "Step-02 - Look up organization"
          ansible.builtin.set_fact:
            _org_lookup: "{{ query('ansible.controller.controller_api', 'organizations', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, query_params={'name': organization_name}, return_all=true) | flatten }}"
          tags: [execute]

        - name: "Step-04 - Create organization"
          ansible.controller.organization:
            name: "{{ organization_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          register: _org_created
          when: _org_lookup | length == 0
          tags: [execute]

        - name: "Step-05 - Set organization ID"
          ansible.builtin.set_fact:
            _org_id: "{{ (_org_lookup | first).id if (_org_lookup | length > 0) else _org_created.id }}"
          tags: [execute]

        - name: "Step-06 - Fetch all inventories"
          ansible.builtin.set_fact:
            _all_inventories: "{{ query('ansible.controller.controller_api', 'inventories', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, return_all=true) | flatten }}"
          tags: [execute]

        - name: "Step-07 - Filter inventory by name and organization"
          ansible.builtin.set_fact:
            _existing_inventory: "{{ _all_inventories | selectattr('name', 'equalto', inventory_name) | selectattr('organization', 'equalto', _org_id) | list }}"
          tags: [execute]

        - name: "Step-09 - Create inventory"
          ansible.controller.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          register: _inventory_created
          when: _existing_inventory | length == 0
          tags: [execute]

        - name: "Step-10 - Set inventory ID"
          ansible.builtin.set_fact:
            _inventory_id: "{{ (_existing_inventory | first).id if (_existing_inventory | length > 0) else _inventory_created.id }}"
          tags: [execute]

        - name: "Step-11 - Ensure hosts present"
          ansible.controller.host:
            name: "{{ item }}"
            inventory: "{{ inventory_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          loop: "{{ _hosts }}"
          register: _host_results
          ignore_errors: yes
          tags: [execute]

        - name: "Step-12 - Summarize host results"
          ansible.builtin.set_fact:
            _added_hosts: "{{ _host_results.results | selectattr('changed', 'equalto', true) | rejectattr('failed', 'equalto', true) | map(attribute='item') | list }}"
            _skipped_hosts: "{{ _host_results.results | rejectattr('changed', 'equalto', true) | rejectattr('failed', 'equalto', true) | map(attribute='item') | list }}"
            _failed_hosts: "{{ _host_results.results | selectattr('failed', 'equalto', true) | map(attribute='item') | list }}"
          tags: [execute]

        - name: "Verify - Get current hosts from inventory"
          ansible.builtin.set_fact:
            _current_host_names: "{{ query('ansible.controller.controller_api', 'hosts', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, query_params={'inventory': _inventory_id}, return_all=true) | flatten | map(attribute='name') | list }}"
          tags: [execute]

        - name: "Verify - Assert all expected hosts are present"
          ansible.builtin.assert:
            that:
              - "_hosts | difference(_failed_hosts) | difference(_current_host_names) | length == 0"
            fail_msg: "Verification failed: not all expected hosts are present in the inventory."
          tags: [execute]

        - name: "Step-13 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              organization_name: {{ organization_name }}
              inventory_name: {{ inventory_name }}
              added_hosts: {{ _added_hosts }}
              skipped_hosts: {{ _skipped_hosts }}
              failed_hosts: {{ _failed_hosts }}
              verification: {{ (_hosts | difference(_failed_hosts) | difference(_current_host_names) | length == 0) | ternary('PASS','FAIL') }}
              </result>
          tags: [execute]

      rescue:
        - name: "Step-14 - Emit error on failure"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: ensure_aap_inventory_with_hosts failed on host {{ inventory_hostname }} - {{ ansible_failed_result.msg | default('Unknown error') }}
              </result>
          tags: [always]

      always:
        # ====================================================
        # RESTORE tasks (tag: restore)
        # ====================================================
        - name: "Restore - Read organization existence flag"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/org_exists.flag"
          register: _restore_org_flag
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete organization if created"
          ansible.controller.organization:
            name: "{{ organization_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - _restore_org_flag.content is defined
            - (_restore_org_flag.content | b64decode | trim) == 'False'
          tags: [restore]

        - name: "Restore - Read inventory existence flag"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/inv_exists.flag"
          register: _restore_inv_flag
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete inventory if created"
          ansible.controller.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - _restore_inv_flag.content is defined
            - (_restore_inv_flag.content | b64decode | trim) == 'False'
          tags: [restore]

        - name: "Restore - Remove added hosts (inventory existed before)"
          when:
            - _restore_inv_flag.content is defined
            - (_restore_inv_flag.content | b64decode | trim) == 'True'
          block:
            - name: "Restore - Get current hosts in inventory"
              ansible.builtin.set_fact:
                _restore_current_hosts: "{{ query('ansible.controller.controller_api', 'hosts', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, query_params={'inventory__name': inventory_name, 'organization__name': organization_name}, return_all=true) | flatten | map(attribute='name') | list }}"

            - name: "Restore - Read original hosts list"
              ansible.builtin.slurp:
                src: "{{ backup_dir }}/original_hosts.txt"
              register: _restore_orig_hosts_raw
              failed_when: false

            - name: "Restore - Set original hosts list"
              ansible.builtin.set_fact:
                _restore_original_hosts: "{{ (_restore_orig_hosts_raw.content | default('') | b64decode).split(',') | map('trim') | reject('equalto', '') | list }}"
              when: _restore_orig_hosts_raw.content is defined

            - name: "Restore - Delete hosts added by playbook"
              ansible.controller.host:
                name: "{{ item }}"
                inventory: "{{ inventory_name }}"
                state: absent
                controller_host: "https://{{ aap_gateway_ip }}"
                controller_username: "{{ aap_username }}"
                controller_password: "{{ aap_password }}"
                validate_certs: false
              loop: "{{ _restore_current_hosts | difference(_restore_original_hosts | default([])) }}"
              when: _restore_original_hosts is defined
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]