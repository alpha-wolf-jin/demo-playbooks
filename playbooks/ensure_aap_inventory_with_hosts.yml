---
- name: "SOP playbook 'ensure_aap_inventory_with_hosts' (ACTION — changes system state): Ensures an AAP organization and inventory exist, then ensures a comma-separated list of hosts are present in that inventory. Reports per-host status: added, skipped, failed. [target host: localhost (localhost)]"
  hosts: localhost
  connection: local
  become: yes
  become_user: root
  gather_facts: false
  vars:
    playbook_name: "ensure_aap_inventory_with_hosts"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    aap_gateway_ip: ""
    aap_username: ""
    aap_password: ""
    organization_name: ""
    inventory_name: ""
    hosts_list: ""

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req 00 - Validate required variables"
          ansible.builtin.assert:
            that:
              - "aap_gateway_ip is defined and aap_gateway_ip | length > 0"
              - "aap_username is defined and aap_username | length > 0"
              - "aap_password is defined and aap_password | length > 0"
              - "organization_name is defined and organization_name | length > 0"
              - "inventory_name is defined and inventory_name | length > 0"
              - "hosts_list is defined and hosts_list | length > 0"
            fail_msg: "All required variables must be provided via extra_vars."
          tags: [execute]

        - name: "Req 2 - Parse hosts list"
          ansible.builtin.set_fact:
            _hosts: "{{ (hosts_list | default('')).split(',') | map('trim') | reject('equalto', '') | list }}"
          tags: [execute]

        - name: "Req 3 - Look up organization"
          ansible.builtin.set_fact:
            _org_lookup: "{{ query('ansible.controller.controller_api', 'organizations', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, query_params={'name': organization_name}, return_all=true) | flatten }}"
          tags: [execute]

        - name: "Req 5 - Create organization if missing"
          ansible.controller.organization:
            name: "{{ organization_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          register: _org_created
          when: _org_lookup | length == 0
          tags: [execute]

        - name: "Req 6 - Set organization ID"
          ansible.builtin.set_fact:
            _org_id: "{{ (_org_lookup | first).id if (_org_lookup | length > 0) else _org_created.id }}"
          tags: [execute]

        - name: "Req 7 - Fetch all inventories"
          ansible.builtin.set_fact:
            _all_inventories: "{{ query('ansible.controller.controller_api', 'inventories', host=aap_gateway_ip, username=aap_username, password=aap_password, verify_ssl=false, return_all=true) | flatten }}"
          tags: [execute]

        - name: "Req 8 - Filter inventory by name and organization"
          ansible.builtin.set_fact:
            _existing_inventory: "{{ _all_inventories | selectattr('name', 'equalto', inventory_name) | selectattr('organization', 'equalto', _org_id) | list }}"
          tags: [execute]

        - name: "Req 9 - Create inventory if missing"
          ansible.controller.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          register: _inventory_created
          when: _existing_inventory | length == 0
          tags: [execute]

        - name: "Req 10 - Set inventory ID"
          ansible.builtin.set_fact:
            _inventory_id: "{{ (_existing_inventory | first).id if (_existing_inventory | length > 0) else _inventory_created.id }}"
          tags: [execute]

        - name: "Req 11 - Ensure hosts present"
          ansible.controller.host:
            name: "{{ item }}"
            inventory: "{{ inventory_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          loop: "{{ _hosts }}"
          register: _host_results
          ignore_errors: yes
          tags: [execute]

        - name: "Req 12 - Summarize host results"
          ansible.builtin.set_fact:
            _added_hosts: "{{ _host_results.results | selectattr('changed', 'eq', true) | selectattr('failed', 'eq', false) | map(attribute='item') | list }}"
            _skipped_hosts: "{{ _host_results.results | selectattr('changed', 'eq', false) | selectattr('failed', 'eq', false) | map(attribute='item') | list }}"
            _failed_hosts: "{{ _host_results.results | selectattr('failed', 'eq', true) | map(attribute='item') | list }}"
          tags: [execute]

        - name: "Req 19 - Query hosts in inventory for verification"
          ansible.builtin.set_fact:
            _queried_hosts: >-
              {{ query(
                'ansible.controller.controller_api',
                'hosts',
                host=aap_gateway_ip,
                username=aap_username,
                password=aap_password,
                verify_ssl=false,
                query_params={'inventory': _inventory_id},
                return_all=true
              ) | flatten | map(attribute='name') | list }}
          tags: [execute]

        - name: "Req 19 - Verify all desired hosts are present"
          ansible.builtin.set_fact:
            _verification_passed: "{{ (_hosts | difference(_queried_hosts) | length == 0) and (_failed_hosts | length == 0) }}"
          tags: [execute]

        - name: "Req 13 - Emit result"
          ansible.builtin.debug:
            msg: |
              <result>
              organization_name: {{ organization_name }}
              inventory_name: {{ inventory_name }}
              added_hosts: {{ _added_hosts }}
              skipped_hosts: {{ _skipped_hosts }}
              failed_hosts: {{ _failed_hosts }}
              verification_passed: {{ _verification_passed | default('false') }}
              </result>
          tags: [execute]

      rescue:
        - name: "Req 14 - Emit error result"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: ensure_aap_inventory_with_hosts failed.
              </result>
          tags: [execute]

        - name: "Fail play on error"
          ansible.builtin.fail:
            msg: "ensure_aap_inventory_with_hosts failed."
          tags: [execute]

      always:
        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]