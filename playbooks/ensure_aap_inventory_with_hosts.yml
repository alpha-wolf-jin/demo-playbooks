          ansible.builtin.set_fact:
            _existing_inventory: "{{ query('ansible.controller.controller_api', 'inventories', host=aap_gateway_ip, username=aap_user, password=aap_password, verify_ssl=false, query_params={'name': inventory_name, 'organization__name': organization_name}, return_all=true) | flatten }}"
