---
- name: "SOP playbook 'ensure_aap_inventory_with_hosts' (ACTION — changes system state): Ensures an AAP organization and inventory exist, then ensures a comma-separated list of hosts are present in that inventory. Reports per-host status: added, skipped, failed. [target host: localhost (localhost)]"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    playbook_name: "ensure_aap_inventory_with_hosts"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    aap_gateway_ip: ""
    aap_username: ""
    aap_password: ""
    organization_name: ""
    inventory_name: ""
    hosts_list: ""

  pre_tasks:
    # === SNAPSHOT (tag: snapshot) ===
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0700"
      tags: [snapshot]

    - name: "Snapshot - Check if organization exists"
      ansible.builtin.set_fact:
        _snap_org_exists: "{{ query('ansible.controller.controller_api', 'organizations',
                               host=aap_gateway_ip,
                               username=aap_username,
                               password=aap_password,
                               verify_ssl=false,
                               query_params={'name': organization_name},
                               return_all=true) | flatten | length > 0 }}"
      tags: [snapshot]

    - name: "Snapshot - Save organization existence"
      ansible.builtin.copy:
        content: "{{ _snap_org_exists }}"
        dest: "{{ backup_dir }}/org_existed"
        force: false
      tags: [snapshot]

    - name: "Snapshot - Check if inventory exists"
      ansible.builtin.set_fact:
        _snap_inv_exists: "{{ query('ansible.controller.controller_api', 'inventories',
                               host=aap_gateway_ip,
                               username=aap_username,
                               password=aap_password,
                               verify_ssl=false,
                               query_params={'name': inventory_name, 'organization__name': organization_name},
                               return_all=true) | flatten | length > 0 }}"
      tags: [snapshot]

    - name: "Snapshot - Save inventory existence"
      ansible.builtin.copy:
        content: "{{ _snap_inv_exists }}"
        dest: "{{ backup_dir }}/inv_existed"
        force: false
      tags: [snapshot]

    - name: "Snapshot - Get list of hosts in inventory if it exists"
      ansible.builtin.set_fact:
        _snap_hosts_list: "{{ query('ansible.controller.controller_api', 'hosts',
                               host=aap_gateway_ip,
                               username=aap_username,
                               password=aap_password,
                               verify_ssl=false,
                               query_params={'inventory__name': inventory_name, 'organization__name': organization_name},
                               return_all=true) | flatten | map(attribute='name') | list }}"
      when: _snap_inv_exists | bool
      tags: [snapshot]

    - name: "Snapshot - Save hosts list"
      ansible.builtin.copy:
        content: "{{ _snap_hosts_list | to_json }}"
        dest: "{{ backup_dir }}/hosts_list.json"
        force: false
      when: _snap_inv_exists | bool
      tags: [snapshot]

  tasks:
    - block:
        # === EXECUTE (tag: execute) ===
        - name: "Validate required variables"
          ansible.builtin.assert:
            that:
              - aap_gateway_ip | length > 0
              - aap_username | length > 0
              - aap_password | length > 0
              - organization_name | length > 0
              - inventory_name | length > 0
              - hosts_list | length > 0
          tags: [execute]

        # step-01
        - name: "Req 2 - Parse hosts list"
          ansible.builtin.set_fact:
            _hosts: "{{ (hosts_list | default('')).split(',') | map('trim') | reject('equalto', '') | list }}"
          tags: [execute]

        # step-02
        - name: "Req 3 - Look up organization"
          ansible.builtin.set_fact:
            _org_lookup: "{{ query('ansible.controller.controller_api', 'organizations',
                               host=aap_gateway_ip,
                               username=aap_username,
                               password=aap_password,
                               verify_ssl=false,
                               query_params={'name': organization_name},
                               return_all=true) | flatten }}"
          tags: [execute]

        # step-03
        - name: "Req 4 - Check if organization exists"
          ansible.builtin.set_fact:
            _org_exists: "{{ _org_lookup | length > 0 }}"
          tags: [execute]

        # step-04
        - name: "Req 5 - Create organization"
          ansible.controller.organization:
            name: "{{ organization_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          register: _org_created
          when: not _org_exists
          tags: [execute]

        # step-05
        - name: "Req 6 - Set organization ID"
          ansible.builtin.set_fact:
            _org_id: "{{ _org_lookup[0].id if _org_exists else _org_created.id }}"
          tags: [execute]

        # step-06
        - name: "Req 7 - Fetch all inventories"
          ansible.builtin.set_fact:
            _all_inventories: "{{ query('ansible.controller.controller_api', 'inventories',
                                    host=aap_gateway_ip,
                                    username=aap_username,
                                    password=aap_password,
                                    verify_ssl=false,
                                    return_all=true) | flatten }}"
          tags: [execute]

        # step-07
        - name: "Req 8 - Filter inventory by name and organization"
          ansible.builtin.set_fact:
            _existing_inventory: "{{ _all_inventories | selectattr('name', 'equalto', inventory_name) | selectattr('organization', 'equalto', _org_id) | list }}"
          tags: [execute]

        # step-08
        - name: "Req 9 - Check if inventory exists"
          ansible.builtin.set_fact:
            _inv_exists: "{{ _existing_inventory | length > 0 }}"
          tags: [execute]

        # step-09
        - name: "Req 10 - Create inventory"
          ansible.controller.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          register: _inventory_created
          when: not _inv_exists
          tags: [execute]

        # step-10
        - name: "Req 11 - Set inventory ID"
          ansible.builtin.set_fact:
            _inventory_id: "{{ _existing_inventory[0].id if _inv_exists else _inventory_created.id }}"
          tags: [execute]

        # step-11
        - name: "Req 12 - Ensure hosts present"
          ansible.controller.host:
            name: "{{ item }}"
            inventory: "{{ inventory_name }}"
            state: present
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          loop: "{{ _hosts }}"
          ignore_errors: true
          register: _host_results
          tags: [execute]

        # step-12
        - name: "Req 13 - Summarize host results"
          ansible.builtin.set_fact:
            _added_hosts: "{{ _host_results.results | selectattr('changed', 'equalto', true) | rejectattr('failed', 'equalto', true) | map(attribute='item') | list }}"
            _skipped_hosts: "{{ _host_results.results | selectattr('changed', 'equalto', false) | rejectattr('failed', 'equalto', true) | map(attribute='item') | list }}"
            _failed_hosts: "{{ _host_results.results | selectattr('failed', 'equalto', true) | map(attribute='item') | list }}"
          tags: [execute]

        # VERIFY
        - name: "Verify - Query hosts in inventory"
          ansible.builtin.set_fact:
            _queried_hosts: "{{ query('ansible.controller.controller_api', 'hosts',
                                   host=aap_gateway_ip,
                                   username=aap_username,
                                   password=aap_password,
                                   verify_ssl=false,
                                   query_params={'inventory': _inventory_id},
                                   return_all=true) | flatten | map(attribute='name') | list }}"
          tags: [execute]

        # step-13 (emit success)
        - name: "Req 14 - Emit result"
          ansible.builtin.debug:
            msg: |
              <result>
              organization_name: {{ organization_name }}
              inventory_name: {{ inventory_name }}
              added_hosts: {{ _added_hosts }}
              skipped_hosts: {{ _skipped_hosts }}
              failed_hosts: {{ _failed_hosts }}
              verified_hosts: {{ _queried_hosts }}
              </result>
          tags: [execute]

      always:
        # === RESTORE (tag: restore) ===
        - name: "Restore - Read organization existence"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/org_existed"
          register: _restore_org_existed
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete organization if created by us"
          ansible.controller.organization:
            name: "{{ organization_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - _restore_org_existed.content is defined
            - (_restore_org_existed.content | b64decode | trim) == 'False'
          failed_when: false
          tags: [restore]

        - name: "Restore - Read inventory existence"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/inv_existed"
          register: _restore_inv_existed
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete inventory if created by us"
          ansible.controller.inventory:
            name: "{{ inventory_name }}"
            organization: "{{ organization_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - _restore_inv_existed.content is defined
            - (_restore_inv_existed.content | b64decode | trim) == 'False'
          failed_when: false
          tags: [restore]

        - name: "Restore - Initialize hosts lists"
          ansible.builtin.set_fact:
            _restore_current_hosts: []
            _orig_hosts_list_restore: []
          tags: [restore]

        - name: "Restore - Read original hosts list"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/hosts_list.json"
          register: _restore_orig_hosts
          failed_when: false
          tags: [restore]

        - name: "Restore - Parse original hosts list"
          ansible.builtin.set_fact:
            _orig_hosts_list_restore: "{{ _restore_orig_hosts.content | b64decode | from_json }}"
          when:
            - _restore_orig_hosts.content is defined
          tags: [restore]

        - name: "Restore - Get current hosts in inventory"
          ansible.builtin.set_fact:
            _restore_current_hosts: "{{ query('ansible.controller.controller_api', 'hosts',
                                          host=aap_gateway_ip,
                                          username=aap_username,
                                          password=aap_password,
                                          verify_ssl=false,
                                          query_params={'inventory__name': inventory_name, 'organization__name': organization_name},
                                          return_all=true) | flatten | map(attribute='name') | list }}"
          when:
            - _restore_inv_existed.content is defined
            - (_restore_inv_existed.content | b64decode | trim) == 'True'
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove hosts added during execution"
          ansible.controller.host:
            name: "{{ item }}"
            inventory: "{{ inventory_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          loop: "{{ _restore_current_hosts | difference(_orig_hosts_list_restore) }}"
          when:
            - _restore_inv_existed.content is defined
            - (_restore_inv_existed.content | b64decode | trim) == 'True'
            - _restore_orig_hosts.content is defined
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]

      rescue:
        # step-14 (error path)
        - name: "Req 15 - Emit error result"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: ensure_aap_inventory_with_hosts failed
              </result>

        - name: "Fail the play"
          ansible.builtin.fail:
            msg: "ensure_aap_inventory_with_hosts failed"