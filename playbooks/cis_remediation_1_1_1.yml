---
- name: "Remediate CIS checkpoint 1.1.1: Ensure 'Enforce password history' is set to '24 or more password(s)'"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_1_1_1_remediation"
    backup_dir: "C:/ai-playbooks-backup/{{ playbook_name | trim }}"
    req_01: "Detect server role using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 4 or 5 for Domain Controller, 1-3 for Member Server."
    req_02: "If Domain Controller, apply password history of 24 via command: `Set-ADDefaultDomainPasswordPolicy -Identity <DomainDN> -PasswordHistoryCount 24`. Expected result: policy updated."
    req_03: |
      If Member Server, export current security policy using command: `secedit /export /cfg C:\\secpol.cfg`. Expected result: configuration file created.
    req_04: |
      If Member Server, edit C:\\secpol.cfg to set `PasswordHistorySize = 24` under [System Access]. Expected result: value changed.
    req_05: |
      If Member Server, apply policy using command: `secedit /configure /db secedit.sdb /cfg C:\\secpol.cfg /areas SECURITYPOLICY`. Expected result: policy applied.
    req_06: "Verify Domain Controller setting using command: `Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount`. Expected result: 24."
    req_07: |
      Verify Member Server setting using command: `secedit /export /cfg C:\\verify.cfg` then check `PasswordHistorySize` equals 24. Expected result: value confirmed.
    req_08: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_09: "Create a task named 'Generate remediation report' using debug msg with the required report format."

  pre_tasks:
    - name: "Snapshot - Remove stale backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir | trim }}"
        state: absent
      tags: [snapshot]

    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir | trim }}"
        state: directory
      tags: [snapshot]

    - name: "Snapshot - Detect server role for snapshot selection"
      ansible.windows.win_shell: '(Get-WmiObject Win32_ComputerSystem).DomainRole'
      register: _snap_role
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Record original AD default domain password history"
      ansible.windows.win_shell: |
        $count = Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount
        Set-Content -Path '{{ backup_dir | trim }}/dc_password_history_count.txt' -Value $count -Force
      when: (_snap_role.stdout | default('') | trim) in ['4', '5']
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Export current security policy baseline for member live restore"
      ansible.windows.win_shell: 'secedit /export /cfg "{{ backup_dir | trim }}/secpol_original.cfg"'
      when: (_snap_role.stdout | default('') | trim) in ['1', '2', '3']
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Check if secpol.cfg exists"
      ansible.windows.win_stat:
        path: 'C:/secpol.cfg'
      register: _snap_secpol
      tags: [snapshot]

    - name: "Snapshot - Backup secpol.cfg if present"
      ansible.windows.win_copy:
        src: 'C:/secpol.cfg'
        dest: "{{ backup_dir | trim }}/secpol.cfg.present"
        remote_src: true
        force: false
      when: _snap_secpol.stat.exists | default(false)
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Mark secpol.cfg as absent if missing"
      ansible.windows.win_copy:
        content: "absent"
        dest: "{{ backup_dir | trim }}/secpol.cfg.absent"
        force: false
      when: not (_snap_secpol.stat.exists | default(false))
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Check if verify.cfg exists"
      ansible.windows.win_stat:
        path: 'C:/verify.cfg'
      register: _snap_verify
      tags: [snapshot]

    - name: "Snapshot - Backup verify.cfg if present"
      ansible.windows.win_copy:
        src: 'C:/verify.cfg'
        dest: "{{ backup_dir | trim }}/verify.cfg.present"
        remote_src: true
        force: false
      when: _snap_verify.stat.exists | default(false)
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Mark verify.cfg as absent if missing"
      ansible.windows.win_copy:
        content: "absent"
        dest: "{{ backup_dir | trim }}/verify.cfg.absent"
        force: false
      when: not (_snap_verify.stat.exists | default(false))
      failed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req step-01 - Detect server role"
          ansible.windows.win_shell: '(Get-WmiObject Win32_ComputerSystem).DomainRole'
          register: _step01_output
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req step-01 - Set role flags and record detection"
          ansible.builtin.set_fact:
            is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
            is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
            task_01_name: "Detect server role"
            task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
            task_01_rc: "{{ _step01_output.rc | default(-1) }}"
            data_01: "{{ _step01_output.stdout | default('') | trim }}"
            status_01: "{{ 'PASS' if (_step01_output.rc | default(-1) == 0 and (_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5']) else 'ERROR' }}"
            details_01: "{{ 'Detected domain role ' ~ (_step01_output.stdout | default('') | trim) if (_step01_output.rc | default(-1) == 0 and (_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5']) else 'Detection command failed or unexpected output' }}"
          tags: [execute]

        - name: "Req step-02 - Apply AD default domain password history 24"
          ansible.windows.win_shell: |
            $dom = (Get-ADDomain).DistinguishedName
            Set-ADDefaultDomainPasswordPolicy -Identity $dom -PasswordHistoryCount 24
          register: _step02_output
          failed_when: false
          changed_when: false
          when: is_dc | bool
          tags: [execute]

        - name: "Req step-02 - Record DC apply result"
          ansible.builtin.set_fact:
            task_02_name: "Apply AD default domain password history 24"
            task_02_cmd: "Set-ADDefaultDomainPasswordPolicy -Identity ((Get-ADDomain).DistinguishedName) -PasswordHistoryCount 24"
            task_02_rc: "{{ _step02_output.rc | default(-1) }}"
            data_02: "{{ _step02_output.stdout | default('') | trim }}"
            status_02: "{{ 'PASS' if (_step02_output.rc | default(-1) == 0) else ('FAIL' if is_dc | bool else 'SKIP') }}"
            details_02: "{{ 'Policy update command succeeded' if (_step02_output.rc | default(-1) == 0) else ('Policy update command failed' if is_dc | bool else 'Not applicable: not a Domain Controller') }}"
          tags: [execute]

        - name: "Req step-03 - Export current security policy"
          ansible.windows.win_shell: 'secedit /export /cfg C:\secpol.cfg'
          register: _step03_output
          failed_when: false
          changed_when: false
          when: is_member | bool
          tags: [execute]

        - name: "Req step-03 - Record export result"
          ansible.builtin.set_fact:
            task_03_name: "Export current security policy"
            task_03_cmd: |
              secedit /export /cfg C:\\secpol.cfg
            task_03_rc: "{{ _step03_output.rc | default(-1) }}"
            data_03: "{{ _step03_output.stdout | default('') | trim }}"
            status_03: "{{ 'PASS' if (_step03_output.rc | default(-1) == 0) else ('FAIL' if is_member | bool else 'SKIP') }}"
            details_03: |
              {{ 'Security policy exported to C:\\secpol.cfg' if (_step03_output.rc | default(-1) == 0) else ('secedit export failed' if is_member | bool else 'Not applicable: not a Member Server') }}
          tags: [execute]

        - name: "Req step-04 - Set PasswordHistorySize to 24 in secpol.cfg"
          ansible.windows.win_shell: |
            {% raw %}
            $raw = Get-Content C:\secpol.cfg -Raw
            $before = $raw
            $updated = [regex]::Replace($raw, '(?im)^[ \t]*PasswordHistorySize[ \t]*=.*$', 'PasswordHistorySize = 24')
            if ($updated -notmatch '(?im)^[ \t]*PasswordHistorySize[ \t]*=24[ \t]*$') {
              if ($updated -match '(?im)^[ \t]*\[System Access\][ \t]*\r?\n') {
                $updated = $updated -replace '(?im)^(\[System Access\][ \t]*\r?\n)', '$1PasswordHistorySize = 24' + "`r`n"
              } else {
                $updated = $updated.TrimEnd() + "`r`n[System Access]`r`nPasswordHistorySize = 24`r`n"
              }
            }
            Set-Content -Path C:\secpol.cfg -Value $updated -Force
            $after = Get-Content C:\secpol.cfg -Raw
            Write-Output "BEFORE:`n$before`nAFTER:`n$after"
            {% endraw %}
          register: _step04_output
          failed_when: false
          changed_when: false
          when: is_member | bool
          tags: [execute]

        - name: "Req step-04 - Record edit result"
          ansible.builtin.set_fact:
            task_04_name: "Set PasswordHistorySize to 24"
            task_04_cmd: "PowerShell: [regex]::Replace secpol.cfg PasswordHistorySize = 24; Set-Content secpol.cfg"
            task_04_rc: "{{ _step04_output.rc | default(-1) }}"
            data_04: "{{ _step04_output.stdout | default('') | trim }}"
            status_04: "{{ 'PASS' if (_step04_output.rc | default(-1) == 0 and ('PasswordHistorySize = 24' in (_step04_output.stdout | default('')))) else ('FAIL' if is_member | bool else 'SKIP') }}"
            details_04: "{{ 'PasswordHistorySize updated to 24' if (_step04_output.rc | default(-1) == 0) else ('Failed to update PasswordHistorySize' if is_member | bool else 'Not applicable: not a Member Server') }}"
          tags: [execute]

        - name: "Req step-05 - Apply security policy via secedit configure"
          ansible.windows.win_shell: 'secedit /configure /db secedit.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY'
          register: _step05_output
          failed_when: false
          changed_when: false
          when: is_member | bool
          tags: [execute]

        - name: "Req step-05 - Record apply result"
          ansible.builtin.set_fact:
            task_05_name: "Apply security policy"
            task_05_cmd: |
              secedit /configure /db secedit.sdb /cfg C:\\secpol.cfg /areas SECURITYPOLICY
            task_05_rc: "{{ _step05_output.rc | default(-1) }}"
            data_05: "{{ _step05_output.stdout | default('') | trim }}"
            status_05: "{{ 'PASS' if (_step05_output.rc | default(-1) == 0) else ('FAIL' if is_member | bool else 'SKIP') }}"
            details_05: "{{ 'Security policy applied via secedit configure' if (_step05_output.rc | default(-1) == 0) else ('secedit configure failed' if is_member | bool else 'Not applicable: not a Member Server') }}"
          tags: [execute]

        - name: "Req step-06 - Verify AD default domain password policy PasswordHistoryCount equals 24"
          ansible.windows.win_shell: 'Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount'
          register: _step06_output
          failed_when: false
          changed_when: false
          when: is_dc | bool
          tags: [execute]

        - name: "Req step-06 - Record DC verify result"
          ansible.builtin.set_fact:
            dc_verify_status: "{{ 'PASS' if (_step06_output.rc | default(-1) == 0 and _step06_output.stdout | default('') | trim == '24') else ('FAIL' if is_dc | bool else 'SKIP') }}"
            task_06_name: "Verify AD default domain password policy PasswordHistoryCount equals 24"
            task_06_cmd: "Get-ADDefaultDomainPasswordPolicy | Select-Object -ExpandProperty PasswordHistoryCount"
            task_06_rc: "{{ _step06_output.rc | default(-1) }}"
            data_06: "{{ _step06_output.stdout | default('') | trim }}"
            status_06: "{{ 'PASS' if (_step06_output.rc | default(-1) == 0 and _step06_output.stdout | default('') | trim == '24') else ('FAIL' if is_dc | bool else 'SKIP') }}"
            details_06: "{{ 'Verified PasswordHistoryCount is 24' if (_step06_output.rc | default(-1) == 0 and _step06_output.stdout | default('') | trim == '24') else ('DC verification failed' if is_dc | bool else 'Not applicable: not a Domain Controller') }}"
          tags: [execute]

        - name: "Req step-07 - Export and verify PasswordHistorySize equals 24"
          ansible.windows.win_shell: |
            secedit /export /cfg C:\verify.cfg
            $raw = Get-Content C:\verify.cfg -Raw
            $match = [regex]::Match($raw, '(?im)^[ \t]*PasswordHistorySize[ \t]*=[ \t]*(.+)[ \t]*$')
            if ($match.Success) {
              $val = $match.Groups[1].Value.Trim()
              Write-Output "PasswordHistorySize=$val"
              if ($val -eq '24') { Write-Output 'VERIFY_PASS' } else { Write-Output 'VERIFY_FAIL' }
            } else {
              Write-Output 'VERIFY_FAIL: PasswordHistorySize not found'
            }
          register: _step07_output
          failed_when: false
          changed_when: false
          when: is_member | bool
          tags: [execute]

        - name: "Req step-07 - Record member verify result"
          ansible.builtin.set_fact:
            member_verify_status: "{{ 'PASS' if (_step07_output.rc | default(-1) == 0 and 'VERIFY_PASS' in (_step07_output.stdout | default(''))) else ('FAIL' if is_member | bool else 'SKIP') }}"
            task_07_name: "Verify Member Server PasswordHistorySize equals 24"
            task_07_cmd: |
              secedit /export /cfg C:\\verify.cfg; regex check PasswordHistorySize = 24
            task_07_rc: "{{ _step07_output.rc | default(-1) }}"
            data_07: "{{ _step07_output.stdout | default('') | trim }}"
            status_07: "{{ 'PASS' if (_step07_output.rc | default(-1) == 0 and 'VERIFY_PASS' in (_step07_output.stdout | default(''))) else ('FAIL' if is_member | bool else 'SKIP') }}"
            details_07: "{{ 'Verified PasswordHistorySize equals 24' if (_step07_output.rc | default(-1) == 0 and 'VERIFY_PASS' in (_step07_output.stdout | default(''))) else ('Member verification failed' if is_member | bool else 'Not applicable: not a Member Server') }}"
          tags: [execute]

        - name: "Req step-08 - Set cis_result from active branch verification"
          ansible.builtin.set_fact:
            cis_result: >-
              {%- if is_dc | bool -%}{{ dc_verify_status | default('ERROR') | trim }}
              {%- elif is_member | bool -%}{{ member_verify_status | default('ERROR') | trim }}
              {%- else -%}ERROR{%- endif -%}
          tags: [execute]

        - name: "Req step-08 - Record cis_result aggregation"
          ansible.builtin.set_fact:
            task_08_name: "Store final remediation result in cis_result"
            task_08_cmd: "set_fact: cis_result"
            task_08_rc: "0"
            data_08: "{{ cis_result | default('ERROR') | trim }}"
            status_08: "{{ cis_result | default('ERROR') | trim }}"
            details_08: "Overall remediation status derived from active branch verification"
          tags: [execute]

        - name: "Req step-09 - Set report generated status"
          ansible.builtin.set_fact:
            task_09_name: "Generate remediation report"
            task_09_cmd: "debug msg"
            task_09_rc: "0"
            data_09: "Remediation report generated"
            status_09: "{{ 'PASS' }}"
            details_09: "Report generated with final remediation result"
          tags: [execute]

        - name: "Req step-09 - Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 1.1.1"
              - "Reference: CIS Benchmark checkpoint 1.1.1"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: {{ task_04_name | default('Not recorded') }}"
              - "  Command: {{ task_04_cmd | default('N/A') }}"
              - "  Exit code: {{ task_04_rc | default(-1) }}"
              - "  Data: {{ data_04 | default('') | trim }}"
              - "  Status: {{ status_04 | default('ERROR') | trim }}"
              - "  Details: {{ details_04 | default('') | trim }}"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: {{ task_05_name | default('Not recorded') }}"
              - "  Command: {{ task_05_cmd | default('N/A') }}"
              - "  Exit code: {{ task_05_rc | default(-1) }}"
              - "  Data: {{ data_05 | default('') | trim }}"
              - "  Status: {{ status_05 | default('ERROR') | trim }}"
              - "  Details: {{ details_05 | default('') | trim }}"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: {{ task_06_name | default('Not recorded') }}"
              - "  Command: {{ task_06_cmd | default('N/A') }}"
              - "  Exit code: {{ task_06_rc | default(-1) }}"
              - "  Data: {{ data_06 | default('') | trim }}"
              - "  Status: {{ status_06 | default('ERROR') | trim }}"
              - "  Details: {{ details_06 | default('') | trim }}"
              - ""
              - "REQUIREMENT 07 - {{ req_07 }}:"
              - "  Task: {{ task_07_name | default('Not recorded') }}"
              - "  Command: {{ task_07_cmd | default('N/A') }}"
              - "  Exit code: {{ task_07_rc | default(-1) }}"
              - "  Data: {{ data_07 | default('') | trim }}"
              - "  Status: {{ status_07 | default('ERROR') | trim }}"
              - "  Details: {{ details_07 | default('') | trim }}"
              - ""
              - "REQUIREMENT 08 - {{ req_08 }}:"
              - "  Task: {{ task_08_name | default('Not recorded') }}"
              - "  Command: {{ task_08_cmd | default('N/A') }}"
              - "  Exit code: {{ task_08_rc | default(-1) }}"
              - "  Data: {{ data_08 | default('') | trim }}"
              - "  Status: {{ status_08 | default('ERROR') | trim }}"
              - "  Details: {{ details_08 | default('') | trim }}"
              - ""
              - "REQUIREMENT 09 - {{ req_09 }}:"
              - "  Task: {{ task_09_name | default('Not recorded') }}"
              - "  Command: {{ task_09_cmd | default('N/A') }}"
              - "  Exit code: {{ task_09_rc | default(-1) }}"
              - "  Data: {{ data_09 | default('') | trim }}"
              - "  Status: {{ status_09 | default('ERROR') | trim }}"
              - "  Details: {{ details_09 | default('') | trim }}"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Perform all restore actions and cleanup"
          ansible.windows.win_shell: |
            $backupDir = "{{ backup_dir | trim }}"
            {% raw %}
            $ErrorActionPreference = 'Continue'
            if (-not (Test-Path -LiteralPath $backupDir)) {
              Write-Output 'No backup directory found; nothing to restore'
              exit 0
            }

            function Restore-File {
              param($name, $dest)
              $present = Join-Path $backupDir "$name.present"
              $absent  = Join-Path $backupDir "$name.absent"
              if (Test-Path -LiteralPath $present) {
                Copy-Item -LiteralPath $present -Destination $dest -Force
                Write-Output "Restored: $dest"
              } elseif (Test-Path -LiteralPath $absent) {
                Remove-Item -LiteralPath $dest -Force -ErrorAction SilentlyContinue
                Write-Output "Removed: $dest (was absent before)"
              }
            }

            Restore-File 'secpol.cfg' 'C:\secpol.cfg'
            Restore-File 'verify.cfg' 'C:\verify.cfg'

            # Restore DC default domain password history if snapshot exists
            $dcCountFile = Join-Path $backupDir 'dc_password_history_count.txt'
            if (Test-Path -LiteralPath $dcCountFile) {
              try {
                $countText = [System.IO.File]::ReadAllText($dcCountFile).Trim()
                $count = [int]$countText
                $dom = (Get-ADDomain).DistinguishedName
                Set-ADDefaultDomainPasswordPolicy -Identity $dom -PasswordHistoryCount $count
                Write-Output "Restored DC password history count to $count"
              } catch {
                Write-Output "Error restoring DC password history: $($_.Exception.Message)"
              }
            }

            # Re-apply original security policy for member server if baseline exists
            $secpolOriginal = Join-Path $backupDir 'secpol_original.cfg'
            if (Test-Path -LiteralPath $secpolOriginal) {
              try {
                & secedit /configure /db secedit.sdb /cfg $secpolOriginal /areas SECURITYPOLICY
                Write-Output "Re-applied original security policy"
              } catch {
                Write-Output "Error re-applying original security policy: $($_.Exception.Message)"
              }
            }

            # Cleanup backup directory
            Remove-Item -LiteralPath $backupDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Output 'Restore completed'
            {% endraw %}
          failed_when: false
          changed_when: false
          tags: [restore]