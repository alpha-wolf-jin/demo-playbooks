---
- name: "Remediate CIS checkpoint 1.1.1: Ensure 'Enforce password history' is set to '24 or more password(s)'"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_1_1_1_remediation"
    backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
    password_history_min: "24"
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: "If Domain Controller: Set 'Enforce password history' to '24 or more password(s)' via Active Directory cmdlets (Set-ADDefaultDomainPasswordPolicy) or Group Policy. Do NOT use community.windows.win_security_policy on DC — use AD/GPO cmdlets."
    req_03: "If Member Server: Set 'Enforce password history' to '24 or more password(s)'. Recommended module: community.windows.win_security_policy with section=System Access and the key name. Do NOT use raw secedit CLI — community.windows.win_security_policy handles secedit internally and avoids encoding / path issues."
    req_04: "If Domain Controller: Verify 'Enforce password history' is correctly set to '24 or more password(s)'. Use community.windows.win_security_policy to read the value; changed_when: false."
    req_05: "If Member Server: Verify 'Enforce password history' is correctly set to '24 or more password(s)'. Use community.windows.win_security_policy to read the value; changed_when: false."
    req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  pre_tasks:
    - name: "Snapshot - Remove stale backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir }}"
        state: absent
      tags: [snapshot]

    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir }}"
        state: directory
      tags: [snapshot]

    - name: "Snapshot - Detect server role"
      ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
      register: _snap_role
      changed_when: false
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save original local password history value"
      ansible.windows.win_shell: |
        $line = net accounts | Select-String -Pattern 'Password history'
        if ($line) {
          $val = [regex]::Match($line.Line, '(\d+)').Groups[1].Value
          Set-Content -LiteralPath "{{ backup_dir }}/member_password_history_original.txt" -Value $val -Force
          Write-Output "Saved member baseline: $val"
        } else {
          Write-Output "NO_LOCAL_BASELINE"
        }
      when: (_snap_role.stdout | default('') | trim) in ['1', '2', '3']
      changed_when: false
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save original AD default domain password history value"
      ansible.windows.win_shell: |
        if (Get-Command Get-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue) {
          $val = (Get-ADDefaultDomainPasswordPolicy).PasswordHistoryCount
          Set-Content -LiteralPath "{{ backup_dir }}/dc_password_history_original.txt" -Value $val -Force
          Write-Output "Saved DC baseline: $val"
        } else {
          Write-Output "AD_MODULE_MISSING"
        }
      when: (_snap_role.stdout | default('') | trim) in ['4', '5']
      changed_when: false
      failed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req step-01 - Detect Windows server role"
          ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
          register: _step01_output
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-01 - Set role flags"
          ansible.builtin.set_fact:
            is_dc: "{{ (_step01_output.stdout | trim) in ['4', '5'] }}"
            is_member: "{{ (_step01_output.stdout | trim) in ['1', '2', '3'] }}"
            status_01: >-
              {{ ('PASS' if (_step01_output.rc | default(-1)) == 0 and
                  (_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5']
                  else 'ERROR') | trim }}
          tags: [execute]

        - name: "Req step-02 - Set Enforce password history on Domain Controller"
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            try {
              if (Get-Command Set-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue) {
                Set-ADDefaultDomainPasswordPolicy -PasswordHistoryCount {{ password_history_min }}
                Write-Output "DC_APPLY_OK"
                exit 0
              } else {
                Write-Output "DC_APPLY_FAIL: ActiveDirectory module not available"
                exit 1
              }
            } catch {
              Write-Output "DC_APPLY_FAIL: $($_.Exception.Message)"
              exit 1
            }
          register: _step02_output
          when: is_dc | bool
          failed_when: false
          changed_when: "'DC_APPLY_OK' in (_step02_output.stdout | default(''))"
          tags: [execute]

        - name: "Req step-03 - Set Enforce password history on Member Server"
          community.windows.win_security_policy:
            section: System Access
            key: PasswordHistorySize
            value: "{{ password_history_min }}"
          register: _step03_output
          when: is_member | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-04 - Verify Enforce password history on Domain Controller"
          community.windows.win_security_policy:
            section: System Access
            key: PasswordHistorySize
            value: "{{ password_history_min }}"
          check_mode: true
          register: _step04_output
          when: is_dc | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-05 - Verify Enforce password history on Member Server"
          community.windows.win_security_policy:
            section: System Access
            key: PasswordHistorySize
            value: "{{ password_history_min }}"
          check_mode: true
          register: _step05_output
          when: is_member | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-06 - Set remediation statuses"
          ansible.builtin.set_fact:
            status_02: >-
              {{ ('SKIP' if not (is_dc | bool) else
                  'FAIL' if (_step02_output.rc | default(-1)) != 0 or 'DC_APPLY_FAIL' in (_step02_output.stdout | default('')) else
                  'PASS' if 'DC_APPLY_OK' in (_step02_output.stdout | default('')) else
                  'ERROR') | trim }}
            status_03: >-
              {{ ('SKIP' if not (is_member | bool) else
                  'FAIL' if (_step03_output.failed | default(false)) or ((_step03_output.msg | default('')) | regex_search('(?i)error|failed|exception')) else
                  'PASS') | trim }}
            status_04: >-
              {{ ('SKIP' if not (is_dc | bool) else
                  'ERROR' if (_step04_output.msg | default('')) | regex_search('(?i)error|failed|exception') else
                  'PASS' if not (_step04_output.changed | default(true) | bool) else
                  'FAIL') | trim }}
            status_05: >-
              {{ ('SKIP' if not (is_member | bool) else
                  'ERROR' if (_step05_output.msg | default('')) | regex_search('(?i)error|failed|exception') else
                  'PASS' if not (_step05_output.changed | default(true) | bool) else
                  'FAIL') | trim }}
          tags: [execute]

        - name: "Req step-06 - Store final remediation result"
          ansible.builtin.set_fact:
            cis_result: >-
              {{ 'ERROR' if not ((is_dc | bool) or (is_member | bool)) else
                 (status_04 | default('ERROR') | trim) if (is_dc | bool) else
                 (status_05 | default('ERROR') | trim) }}
          tags: [execute]

        - name: "Req step-07 - Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 1.1.1"
              - "Reference: CIS Benchmark checkpoint 1.1.1"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: Req step-01 - Detect Windows server role"
              - "  Command: (Get-WmiObject Win32_ComputerSystem).DomainRole"
              - "  Exit code: {{ _step01_output.rc | default(-1) }}"
              - "  Data: {{ _step01_output.stdout | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: DomainRole {{ _step01_output.stdout | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: Req step-02 - Set Enforce password history on Domain Controller"
              - "  Command: Set-ADDefaultDomainPasswordPolicy -PasswordHistoryCount {{ password_history_min }}"
              - "  Exit code: {{ _step02_output.rc | default(-1) }}"
              - "  Data: {{ _step02_output.stdout | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: DC policy apply status"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: Req step-03 - Set Enforce password history on Member Server"
              - "  Command: community.windows.win_security_policy section=System Access key=PasswordHistorySize value={{ password_history_min }}"
              - "  Exit code: {{ _step03_output.rc | default('N/A') }}"
              - "  Data: {{ _step03_output.changed | default('N/A') }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: Member policy apply status"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: Req step-04 - Verify Enforce password history on Domain Controller"
              - "  Command: community.windows.win_security_policy check_mode section=System Access key=PasswordHistorySize value={{ password_history_min }}"
              - "  Exit code: {{ _step04_output.rc | default('N/A') }}"
              - "  Data: {{ _step04_output.changed | default('N/A') }}"
              - "  Status: {{ status_04 | default('ERROR') | trim }}"
              - "  Details: DC policy verify status"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: Req step-05 - Verify Enforce password history on Member Server"
              - "  Command: community.windows.win_security_policy check_mode section=System Access key=PasswordHistorySize value={{ password_history_min }}"
              - "  Exit code: {{ _step05_output.rc | default('N/A') }}"
              - "  Data: {{ _step05_output.changed | default('N/A') }}"
              - "  Status: {{ status_05 | default('ERROR') | trim }}"
              - "  Details: Member policy verify status"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: Req step-06 - Store final remediation result"
              - "  Command: set_fact cis_result"
              - "  Exit code: N/A"
              - "  Data: {{ cis_result | default('ERROR') | trim }}"
              - "  Status: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: Final aggregated remediation status"
              - ""
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
          tags: [execute]

      always:
        - name: "Cleanup - Remove backup directory"
          ansible.windows.win_file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]