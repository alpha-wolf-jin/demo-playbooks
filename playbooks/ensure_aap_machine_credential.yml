---
- name: "SOP playbook 'ensure_aap_machine_credential' (ACTION — changes system state): Check if an AAP Machine credential exists; create it if missing. Stop with an informational result if the organization is absent or the credential already exists. [target host: localhost (localhost)]"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    playbook_name: "ensure_aap_machine_credential"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    # Required, no default sentinels (override via extra_vars)
    aap_gateway_ip: ""
    aap_username: ""
    aap_password: ""
    organization_name: ""
    credential_name: ""
    user_name: ""
    user_password: ""
    ssh_private_key: ""
    sudo_password: ""
    credential_type: "Machine"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0700"
      tags: snapshot

    - name: "Snapshot - Query credential existence via API"
      ansible.builtin.uri:
        url: "https://{{ aap_gateway_ip }}/api/controller/v2/credentials/?name={{ credential_name | urlencode }}&organization__name={{ organization_name | urlencode }}"
        url_username: "{{ aap_username }}"
        url_password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
        status_code: [200]
      register: _snap_cred
      failed_when: false
      changed_when: false
      tags: snapshot

    - name: "Snapshot - Store credential existence flag"
      ansible.builtin.copy:
        content: "{{ (_snap_cred.json.results | length > 0) | ternary('true','false') }}"
        dest: "{{ backup_dir }}/credential_existed.dat"
      tags: snapshot

  tasks:
    - block:
        - name: "Req 1 - Validate required input variables"
          ansible.builtin.assert:
            that:
              - aap_gateway_ip != ""
              - aap_username != ""
              - aap_password != ""
              - organization_name != ""
              - credential_name != ""
              - user_name != ""
            fail_msg: "One or more required variables are empty or undefined"
          tags: execute

        - name: "Req 2 - Prepare API authentication variables"
          ansible.builtin.set_fact:
            _aap_host: "{{ aap_gateway_ip }}"
            _aap_user: "{{ aap_username }}"
            _aap_pass: "{{ aap_password }}"
          tags: execute

        - name: "Req 3 - Look up organization"
          ansible.builtin.set_fact:
            _org_result: "{{ lookup('ansible.controller.controller_api',
                                  'organizations',
                                  host=_aap_host,
                                  username=_aap_user,
                                  password=_aap_pass,
                                  verify_ssl=false,
                                  query_params={'name': organization_name},
                                  return_all=true) }}"
          tags: execute

        - name: "Req 4 - Determine if organization exists"
          ansible.builtin.set_fact:
            _org_exists: "{{ _org_result | length > 0 }}"
          tags: execute

        - name: "Req 5 - Extract organization ID"
          ansible.builtin.set_fact:
            _org_id: >-
              {% if _org_result is defined and (_org_result | length > 0) %}
              {{ (_org_result if _org_result is mapping else _org_result[0]).id }}
              {% else %}
              ''
              {% endif %}
          when: _org_result is defined and (_org_result | length > 0)
          tags: execute

        - name: "Req 6 - Look up credential"
          ansible.builtin.set_fact:
            _credential_result: "{{ lookup('ansible.controller.controller_api',
                                    'credentials',
                                    host=_aap_host,
                                    username=_aap_user,
                                    password=_aap_pass,
                                    verify_ssl=false,
                                    query_params={'name': credential_name,
                                                  'organization__name': organization_name},
                                    return_all=true) }}"
          when: _org_exists
          tags: execute

        - name: "Req 7 - Determine if credential exists"
          ansible.builtin.set_fact:
            _credential_exists: "{{ _credential_result | length > 0 }}"
          when: _org_exists
          tags: execute

        - name: "Req 8 - Set organization-absent output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "organization_missing"
            _message: "Organization '{{ organization_name }}' does not exist in AAP."
            _credential_id: ""
          when: not _org_exists
          tags: execute

        - name: "Req 9 - Set credential-exists output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "already_exists"
            _message: "Credential '{{ credential_name }}' already exists."
            _credential_id: >-
              {% if _credential_result is defined and (_credential_result | length > 0) %}
              {{ (_credential_result if _credential_result is mapping else _credential_result[0]).id }}
              {% else %}
              ''
              {% endif %}
          when: _org_exists and _credential_exists
          tags: execute

        - name: "Req 10 - Create Machine credential"
          ansible.controller.credential:
            name: "{{ credential_name }}"
            credential_type: "{{ credential_type }}"
            organization: "{{ organization_name }}"
            inputs:
              username: "{{ user_name }}"
              password: "{{ user_password }}"
              ssh_key_data: "{{ ssh_private_key }}"
              become_password: "{{ sudo_password }}"
              become_method: sudo
            state: present
            controller_host: "https://{{ _aap_host }}"
            controller_username: "{{ _aap_user }}"
            controller_password: "{{ _aap_pass }}"
            validate_certs: false
          register: _credential_creation_result
          when: _org_exists and not _credential_exists
          tags: execute

        - name: "Req 10a - Mark credential created for restore"
          ansible.builtin.copy:
            content: "created"
            dest: "{{ backup_dir }}/credential_created.flag"
          when: >-
            _org_exists and not _credential_exists
            and _credential_creation_result is defined
            and _credential_creation_result.credential.id is defined
          tags: execute

        - name: "Req 11 - Set credential-created output vars (initial from creation module)"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "created"
            _message: "Credential '{{ credential_name }}' created with ID {{ _credential_creation_result.credential.id }}"
            _credential_id: "{{ _credential_creation_result.credential.id }}"
          when: >-
            _org_exists and not _credential_exists
            and _credential_creation_result is defined
            and _credential_creation_result.credential.id is defined
          tags: execute

        - name: "Req 11 Verify - Lookup credential after creation"
          ansible.builtin.set_fact:
            _verify_cred_list: "{{ lookup('ansible.controller.controller_api',
                                    'credentials',
                                    host=_aap_host,
                                    username=_aap_user,
                                    password=_aap_pass,
                                    verify_ssl=false,
                                    query_params={'name': credential_name,
                                                  'organization__name': organization_name},
                                    return_all=true) }}"
          when: >-
            _org_exists and not _credential_exists
            and _credential_creation_result is defined
            and _credential_creation_result.credential.id is defined
          tags: execute

        - name: "Req 11 Verify - Assert credential found after creation"
          ansible.builtin.assert:
            that:
              - _verify_cred_list | length > 0
            fail_msg: "Credential creation verification failed - credential not found in API"
          when: >-
            _org_exists and not _credential_exists
            and _credential_creation_result is defined
            and _credential_creation_result.credential.id is defined
          tags: execute

        - name: "Req 11 Verify - Update output vars with verified credential ID"
          ansible.builtin.set_fact:
            _credential_id: "{{ _verify_cred_list[0].id }}"
            _message: "Credential '{{ credential_name }}' created with ID {{ _verify_cred_list[0].id }}"
          when: >-
            _org_exists and not _credential_exists
            and _credential_creation_result is defined
            and _credential_creation_result.credential.id is defined
            and _verify_cred_list is defined
            and _verify_cred_list | length > 0
          tags: execute

        - name: "Req 12 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              credential_name: {{ _credential_name }}
              status: {{ _status }}
              message: {{ _message }}
              credential_id: {{ _credential_id }}
              </result>
          tags: execute

      always:
        - name: "Restore - Read snapshot flag (credential existed before)"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/credential_existed.dat"
          register: _restore_existed_file
          tags: restore

        - name: "Restore - Check if credential was created during execution"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/credential_created.flag"
          register: _restore_created_flag
          tags: restore

        - name: "Restore - Delete credential if it was created during this run"
          ansible.controller.credential:
            name: "{{ credential_name }}"
            credential_type: "{{ credential_type }}"
            organization: "{{ organization_name }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - _restore_existed_file.content | b64decode | trim == 'false'
            - _restore_created_flag.stat.exists
          tags: restore

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          tags: restore

      rescue:
        - name: "Req 13 - Emit error result and fail"
          ansible.builtin.debug:
            msg: |
              <result>
              credential_name: {{ credential_name | default('unknown') }}
              status: error
              message: ERROR: {{ ansible_host | default('localhost') }} - An unexpected error occurred during playbook execution.
              credential_id: 
              </result>
          tags: execute

        - name: "Req 13 - Fail playbook after error"
          ansible.builtin.fail:
            msg: "Playbook execution failed"
          tags: execute