---
- name: "ensure_aap_machine_credential (ACTION — changes system state): Check if an AAP Machine credential exists; create it if missing. Stop with an informational result if the organization is absent or the credential already exists. [target host: localhost (localhost)]"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    playbook_name: "ensure_aap_machine_credential"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    aap_gateway_ip: ""
    aap_username: ""
    aap_password: ""
    organization_name: ""
    credential_name: ""
    user_name: ""
    user_password: ""
    ssh_private_key: ""
    sudo_password: ""
    credential_type: "Machine"

  pre_tasks:
    # === SNAPSHOT (tag: snapshot) ===
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Prepare API auth variables"
      ansible.builtin.set_fact:
        _aap_host: "{{ aap_gateway_ip }}"
        _aap_user: "{{ aap_username }}"
        _aap_pass: "{{ aap_password }}"
      tags: [snapshot]

    - name: "Snapshot - Look up organization"
      ansible.builtin.set_fact:
        _snap_org_lookup: "{{ query('ansible.controller.controller_api', 'organizations',
                                host=_aap_host,
                                username=_aap_user,
                                password=_aap_pass,
                                verify_ssl=false,
                                query_params={'name': organization_name},
                                return_all=true) | flatten }}"
      tags: [snapshot]

    - name: "Snapshot - Check if organization exists"
      ansible.builtin.set_fact:
        _snap_org_exists: "{{ _snap_org_lookup | length > 0 }}"
      tags: [snapshot]

    - name: "Snapshot - Look up credential if organization exists"
      ansible.builtin.set_fact:
        _snap_cred_lookup: "{{ query('ansible.controller.controller_api', 'credentials',
                                host=_aap_host,
                                username=_aap_user,
                                password=_aap_pass,
                                verify_ssl=false,
                                query_params={'name': credential_name, 'organization__name': organization_name},
                                return_all=true) | flatten }}"
      when: _snap_org_exists | bool
      tags: [snapshot]

    - name: "Snapshot - Record whether credential existed"
      ansible.builtin.copy:
        content: "{{ (_snap_cred_lookup | length > 0) | string }}"
        dest: "{{ backup_dir }}/credential_existed"
        mode: '0600'
      when: _snap_org_exists | bool
      tags: [snapshot]

    - name: "Snapshot - Record credential absent (org missing)"
      ansible.builtin.copy:
        content: "false"
        dest: "{{ backup_dir }}/credential_existed"
        mode: '0600'
      when: not _snap_org_exists | bool
      tags: [snapshot]

  tasks:
    - block:
        # === EXECUTE (tag: execute) ===
        - name: "Validate required variables"
          ansible.builtin.assert:
            that:
              - aap_gateway_ip | length > 0
              - aap_username | length > 0
              - aap_password | length > 0
              - organization_name | length > 0
              - credential_name | length > 0
              - user_name | length > 0
            fail_msg: "One or more required variables are missing or empty."
          tags: [execute]

        - name: "Req 2 - Prepare API auth variables"
          ansible.builtin.set_fact:
            _aap_host: "{{ aap_gateway_ip }}"
            _aap_user: "{{ aap_username }}"
            _aap_pass: "{{ aap_password }}"
          tags: [execute]

        - name: "Req 3 - Look up organization"
          ansible.builtin.set_fact:
            _org_lookup: "{{ query('ansible.controller.controller_api', 'organizations',
                            host=_aap_host,
                            username=_aap_user,
                            password=_aap_pass,
                            verify_ssl=false,
                            query_params={'name': organization_name},
                            return_all=true) | flatten }}"
          tags: [execute]

        - name: "Req 4 - Determine if organization exists"
          ansible.builtin.set_fact:
            _org_exists: "{{ _org_lookup | length > 0 }}"
          tags: [execute]

        - name: "Req 5 - Extract organization ID"
          ansible.builtin.set_fact:
            _org_id: "{{ _org_lookup[0].id }}"
          when: _org_exists
          tags: [execute]

        - name: "Req 6 - Look up credential"
          ansible.builtin.set_fact:
            _credential_lookup: "{{ query('ansible.controller.controller_api', 'credentials',
                                    host=_aap_host,
                                    username=_aap_user,
                                    password=_aap_pass,
                                    verify_ssl=false,
                                    query_params={'name': credential_name, 'organization__name': organization_name},
                                    return_all=true) | flatten }}"
          when: _org_exists
          tags: [execute]

        - name: "Req 7 - Determine if credential exists"
          ansible.builtin.set_fact:
            _credential_exists: "{{ _credential_lookup | length > 0 }}"
          when: _org_exists
          tags: [execute]

        - name: "Req 8 - Prepare credential inputs"
          ansible.builtin.set_fact:
            _cred_inputs: >-
              {{ { 'username': user_name } | combine(
                  ({'password': user_password} if user_password | default('') | length > 0 else {}),
                  ({'ssh_key_data': ssh_private_key} if ssh_private_key | default('') | length > 0 else {}),
                  ({'become_password': sudo_password} if sudo_password | default('') | length > 0 else {})
                 )
              }}
          when:
            - _org_exists
            - not _credential_exists
          tags: [execute]

        - name: "Req 8 - Create Machine credential"
          ansible.controller.credential:
            name: "{{ credential_name }}"
            organization: "{{ organization_name }}"
            credential_type: "{{ credential_type }}"
            inputs: "{{ _cred_inputs }}"
            state: present
            controller_host: "https://{{ _aap_host }}"
            controller_username: "{{ _aap_user }}"
            controller_password: "{{ _aap_pass }}"
            validate_certs: false
          register: _credential_creation_result
          when:
            - _org_exists
            - not _credential_exists
          tags: [execute]

        - name: "Req 9 - Verify credential creation"
          ansible.builtin.assert:
            that:
              - _credential_creation_result.credential.id is defined
            fail_msg: "Credential creation verification failed."
          when:
            - _org_exists
            - not _credential_exists
          tags: [execute]

        - name: "Req 10 - Set organization-absent output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "organization_missing"
            _message: "Organization '{{ organization_name }}' does not exist in AAP."
            _credential_id: ""
          when: not _org_exists
          tags: [execute]

        - name: "Req 10 - Set credential-exists output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "already_exists"
            _message: "Credential '{{ credential_name }}' already exists."
            _credential_id: ""
          when:
            - _org_exists
            - _credential_exists
          tags: [execute]

        - name: "Req 11 - Set credential-created output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "created"
            _message: "Credential '{{ credential_name }}' created with ID {{ _credential_creation_result.credential.id }}."
            _credential_id: "{{ _credential_creation_result.credential.id }}"
          when:
            - _org_exists
            - not _credential_exists
          tags: [execute]

        - name: "Mark credential creation for rollback"
          ansible.builtin.copy:
            content: "true"
            dest: "{{ backup_dir }}/credential_created"
            mode: '0600'
          when:
            - _org_exists
            - not _credential_exists
            - _credential_creation_result is changed
          tags: [execute]

        - name: "Step 11 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              credential_name: {{ _credential_name }}
              status: {{ _status }}
              message: {{ _message }}
              credential_id: {{ _credential_id }}
              </result>
          tags: [execute]

      rescue:
        - name: "Step 12 - Emit error result"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: {{ inventory_hostname }} An unexpected error occurred during playbook execution.
              </result>

        - name: "Step 12 - Fail the play"
          ansible.builtin.fail:
            msg: "Playbook failed."

      always:
        # === RESTORE (tag: restore) ===
        - name: "Restore - Read credential existence marker"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/credential_existed"
          register: _restore_existed
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if credential was created"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/credential_created"
          register: _restore_created_flag
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete credential if newly created"
          ansible.controller.credential:
            name: "{{ credential_name }}"
            organization: "{{ organization_name }}"
            credential_type: "{{ credential_type }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - _restore_existed.content is defined
            - (_restore_existed.content | b64decode | trim) == 'False'
            - _restore_created_flag.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]