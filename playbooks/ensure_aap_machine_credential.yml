---
- name: >-
    SOP playbook 'ensure_aap_machine_credential' (ACTION — changes system state):
    Check if an AAP Machine credential exists; create it if missing.
    Stop with an informational result if the organization is absent or
    the credential already exists.
    [target host: localhost (localhost)]
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - ansible.controller
  vars:
    playbook_name: "ensure_aap_machine_credential"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"

    # Input variables (all required; empty sentinel to be validated)
    # Exact names as per spec — do NOT rename
    aap_gateway_ip: ""
    aap_username: ""
    aap_password: ""
    organization_name: ""
    credential_name: ""
    user_name: ""
    user_password: ""
    ssh_private_key: ""
    sudo_password: ""
    credential_type: "Machine"

  pre_tasks:
    # === SNAPSHOT (tag: snapshot) ===
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Prepare API auth variables"
      ansible.builtin.set_fact:
        _aap_host: "{{ aap_gateway_ip }}"
        _aap_user: "{{ aap_username }}"
        _aap_pass: "{{ aap_password }}"
      tags: [snapshot]

    # Use lookup with errors='warn' so a transient API issue does not crash snapshot
    - name: "Snapshot - Look up organization (safe)"
      ansible.builtin.set_fact:
        _snap_org_list: "{{ lookup('ansible.controller.controller_api', 'organizations',
              host=_aap_host,
              username=_aap_user,
              password=_aap_pass,
              verify_ssl=false,
              query_params={'name': organization_name},
              return_all=true,
              errors='warn',
              wantlist=true) | default([]) }}"
      tags: [snapshot]

    - name: "Snapshot - Save organization ID"
      ansible.builtin.copy:
        content: "{{ _snap_org_list[0].id if _snap_org_list | length > 0 else '' }}"
        dest: "{{ backup_dir }}/org_id"
        force: false
      tags: [snapshot]

    - name: "Snapshot - Look up credential (if org exists) [safe]"
      ansible.builtin.set_fact:
        _snap_cred_list: "{{ lookup('ansible.controller.controller_api', 'credentials',
              host=_aap_host,
              username=_aap_user,
              password=_aap_pass,
              verify_ssl=false,
              query_params={'name': credential_name, 'organization': _snap_org_list[0].id},
              return_all=true,
              errors='warn',
              wantlist=true) | default([]) }}"
      when: "_snap_org_list | length > 0"
      tags: [snapshot]

    - name: "Snapshot - Save credential existed flag"
      ansible.builtin.copy:
        content: "{{ 'true' if (_snap_cred_list | default([])) | length > 0 else 'false' }}"
        dest: "{{ backup_dir }}/credential_existed"
        force: false
      when: "_snap_org_list | length > 0"
      tags: [snapshot]

  tasks:
    - name: "Execute block with rescue and always"
      block:
        # === EXECUTE (tag: execute) ===
        - name: "Req 00 - Validate required input variables"
          ansible.builtin.assert:
            that:
              - "aap_gateway_ip != ''"
              - "aap_username != ''"
              - "aap_password != ''"
              - "organization_name != ''"
              - "credential_name != ''"
              - "user_name != ''"
            fail_msg: "One or more required variables are empty"
          tags: [execute]

        - name: "Req step-01 - Prepare API auth variables"
          ansible.builtin.set_fact:
            _aap_host: "{{ aap_gateway_ip }}"
            _aap_user: "{{ aap_username }}"
            _aap_pass: "{{ aap_password }}"
          tags: [execute]

        - name: "Req step-02 - Look up organization"
          ansible.builtin.set_fact:
            _org_result: "{{ query('ansible.controller.controller_api', 'organizations',
                  host=_aap_host,
                  username=_aap_user,
                  password=_aap_pass,
                  verify_ssl=false,
                  query_params={'name': organization_name},
                  return_all=true) | flatten }}"
          tags: [execute]

        - name: "Req step-03 - Set organization found flag"
          ansible.builtin.set_fact:
            _org_found: "{{ _org_result | length > 0 }}"
          tags: [execute]

        - name: "Req step-04 - Extract organization ID"
          ansible.builtin.set_fact:
            _org_id: "{{ _org_result[0].id }}"
          when: "_org_found"
          tags: [execute]

        - name: "Req step-05 - Look up credential"
          ansible.builtin.set_fact:
            _credential_result: "{{ query('ansible.controller.controller_api', 'credentials',
                  host=_aap_host,
                  username=_aap_user,
                  password=_aap_pass,
                  verify_ssl=false,
                  query_params={'name': credential_name, 'organization': _org_id},
                  return_all=true) | flatten }}"
          when: "_org_found"
          tags: [execute]

        - name: "Req step-06 - Set credential exists flag"
          ansible.builtin.set_fact:
            _credential_exists: "{{ _credential_result | length > 0 }}"
          when: "_org_found"
          tags: [execute]

        - name: "Req step-07 - Create Machine credential"
          ansible.controller.credential:
            name: "{{ credential_name }}"
            organization: "{{ _org_id }}"
            credential_type: "{{ credential_type }}"
            inputs:
              username: "{{ user_name }}"
              password: "{{ user_password | default(omit) }}"
              ssh_key_data: "{{ ssh_private_key | default(omit) }}"
              become_password: "{{ sudo_password | default(omit) }}"
            state: present
            controller_host: "https://{{ _aap_host }}"
            controller_username: "{{ _aap_user }}"
            controller_password: "{{ _aap_pass }}"
            validate_certs: false
          register: _credential_creation_result_raw
          when:
            - "_org_found"
            - "not _credential_exists"
          tags: [execute]

        - name: "Reshape credential creation result for downstream formulas"
          ansible.builtin.set_fact:
            _credential_creation_result:
              credential:
                id: "{{ _credential_creation_result_raw.id | default('') }}"
          when: "_credential_creation_result_raw.id is defined"
          tags: [execute]

        # Verification — uses lookup with errors='warn' to avoid template crash
        - name: "Req step-07 verify - Query credential after creation"
          ansible.builtin.set_fact:
            _verified_cred_list: "{{ lookup('ansible.controller.controller_api', 'credentials',
                  host=_aap_host,
                  username=_aap_user,
                  password=_aap_pass,
                  verify_ssl=false,
                  query_params={'name': credential_name, 'organization': _org_id},
                  return_all=true,
                  errors='warn',
                  wantlist=true) | default([]) }}"
          when:
            - "_org_found"
            - "not _credential_exists"
          tags: [execute]

        - name: "Req step-07 verify - Assert credential exists with correct ID"
          ansible.builtin.assert:
            that:
              - "_verified_cred_list | length > 0"
              - "( _verified_cred_list[0].id | string ) == ( _credential_creation_result.credential.id | string )"
            fail_msg: "Verification failed: credential '{{ credential_name }}' not found with expected ID"
          when:
            - "_org_found"
            - "not _credential_exists"
          tags: [execute]

        - name: "Initialize output variables (fallback)"
          ansible.builtin.set_fact:
            _credential_name: ""
            _status: "ERROR"
            _message: "Unexpected state"
            _credential_id: ""
          tags: [execute]

        - name: "Req step-08 - Set organization-absent output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "organization_missing"
            _message: "Organization '{{ organization_name }}' does not exist in AAP."
            _credential_id: ""
          when: "not _org_found"
          tags: [execute]

        - name: "Req step-09 - Set credential-exists output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "already_exists"
            _message: "Credential '{{ credential_name }}' already exists."
            _credential_id: ""
          when:
            - "_org_found"
            - "_credential_exists"
          tags: [execute]

        - name: "Req step-10 - Set credential-created output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "created"
            _message: "Credential '{{ credential_name }}' created with ID {{ _credential_creation_result.credential.id }}"
            _credential_id: "{{ _credential_creation_result.credential.id }}"
          when:
            - "_org_found"
            - "not _credential_exists"
          tags: [execute]

        - name: "Req step-11 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              credential_name: {{ _credential_name }}
              status: {{ _status }}
              message: {{ _message }}
              credential_id: {{ _credential_id }}
              </result>
          tags: [execute]

      rescue:
        - name: "Rescue - Emit error result"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: An unexpected error occurred during playbook execution on {{ inventory_hostname }}
              </result>

        - name: "Rescue - Fail the play"
          ansible.builtin.fail:
            msg: "Playbook execution failed"

      always:
        # === RESTORE (tag: restore) ===
        # Restore reads snapshot files from disk — never references pre_tasks or block variables
        - name: "Restore - Read saved org ID"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/org_id"
          register: _restore_org_id
          failed_when: false
          tags: [restore]

        - name: "Restore - Read credential existed flag"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/credential_existed"
          register: _restore_cred_existed
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete credential if created"
          ansible.controller.credential:
            name: "{{ credential_name }}"
            organization: "{{ _restore_org_id.content | b64decode | trim }}"
            credential_type: "{{ credential_type }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when:
            - "_restore_cred_existed.content is defined"
            - "(_restore_cred_existed.content | b64decode | trim) == 'false'"
            - "(_restore_org_id.content | b64decode | trim) != ''"
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]