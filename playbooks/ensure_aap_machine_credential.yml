---
- name: "SOP playbook 'ensure_aap_machine_credential' (ACTION — changes system state): Check if an AAP Machine credential exists; create it if missing. Stop with an informational result if the organization is absent or the credential already exists. [target host: localhost (localhost)]"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    playbook_name: "ensure_aap_machine_credential"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    aap_gateway_ip: ""
    aap_username: ""
    aap_password: ""
    organization_name: ""
    credential_name: ""
    user_name: ""
    user_password: ""
    ssh_private_key: ""
    sudo_password: ""
    credential_type: "Machine"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Check if credential exists before change"
      ansible.builtin.uri:
        url: "https://{{ aap_gateway_ip }}/api/v2/credentials/?name={{ credential_name | urlencode }}&organization__name={{ organization_name | urlencode }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: false
      register: _snap_cred_check
      ignore_errors: true
      tags: [snapshot]

    - name: "Snapshot - Write pre-existing state to file"
      ansible.builtin.copy:
        content: |
          credential_existed: {{ (_snap_cred_check.json.count | default(0) > 0) if _snap_cred_check is not failed else false }}
        dest: "{{ backup_dir }}/snapshot_state.yml"
      tags: [snapshot]

  tasks:
    - name: "Execute block"
      block:
        - name: "Req 1 - Validate required input variables"
          ansible.builtin.assert:
            that:
              - aap_gateway_ip | length > 0
              - aap_username | length > 0
              - aap_password | length > 0
              - organization_name | length > 0
              - credential_name | length > 0
              - user_name | length > 0
            fail_msg: "All required variables must be provided and non-empty"
          tags: [execute]

        - name: "Step-01 - Prepare API auth variables"
          ansible.builtin.set_fact:
            _aap_host: "{{ aap_gateway_ip }}"
            _aap_user: "{{ aap_username }}"
            _aap_pass: "{{ aap_password }}"
          tags: [execute]

        - name: "Step-02 - Look up organization"
          ansible.builtin.uri:
            url: "https://{{ _aap_host }}/api/v2/organizations/?name={{ organization_name | urlencode }}"
            method: GET
            user: "{{ _aap_user }}"
            password: "{{ _aap_pass }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200, 404]
          register: _org_result
          tags: [execute]

        - name: "Step-03 - Decide if organization exists"
          ansible.builtin.set_fact:
            _org_exists: "{{ _org_result.status == 200 and (_org_result.json.count | default(0) | int > 0) }}"
          tags: [execute]

        - name: "Step-04 - Extract organization ID"
          ansible.builtin.set_fact:
            _org_id: "{{ _org_result.json.results[0].id }}"
          when: _org_exists
          tags: [execute]

        - name: "Step-05 - Look up credential"
          ansible.builtin.uri:
            url: "https://{{ _aap_host }}/api/v2/credentials/?name={{ credential_name | urlencode }}&organization={{ _org_id }}"
            method: GET
            user: "{{ _aap_user }}"
            password: "{{ _aap_pass }}"
            force_basic_auth: true
            validate_certs: false
          register: _credential_result
          when: _org_exists
          tags: [execute]

        - name: "Step-06 - Decide if credential already exists"
          ansible.builtin.set_fact:
            _credential_exists: "{{ _credential_result.json.count | default(0) | int > 0 }}"
          when: _org_exists
          tags: [execute]

        - name: "Step-07 - Create Machine credential (if needed)"
          ansible.controller.credential:
            name: "{{ credential_name }}"
            organization: "{{ organization_name }}"
            credential_type: "{{ credential_type }}"
            inputs:
              username: "{{ user_name }}"
              password: "{{ user_password }}"
              ssh_key_data: "{{ ssh_private_key }}"
              become_password: "{{ sudo_password }}"
            state: present
            controller_host: "https://{{ _aap_host }}"
            controller_username: "{{ _aap_user }}"
            controller_password: "{{ _aap_pass }}"
            validate_certs: false
          register: _credential_creation_result
          when:
            - _org_exists
            - not _credential_exists
          tags: [execute]

        - name: "Verify credential creation"
          ansible.builtin.uri:
            url: "https://{{ _aap_host }}/api/v2/credentials/?name={{ credential_name | urlencode }}&organization={{ _org_id }}"
            method: GET
            user: "{{ _aap_user }}"
            password: "{{ _aap_pass }}"
            force_basic_auth: true
            validate_certs: false
          register: _verify_cred
          when:
            - _org_exists
            - not _credential_exists
            - _credential_creation_result is changed
          tags: [execute]

        - name: "Step-08 - Set organization-absent output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "organization_missing"
            _message: "Organization '{{ organization_name }}' does not exist in AAP."
            _credential_id: ""
          when: not _org_exists
          tags: [execute]

        - name: "Step-09 - Set credential-exists output vars"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "already_exists"
            _message: "Credential '{{ credential_name }}' already exists."
            _credential_id: ""
          when:
            - _org_exists
            - _credential_exists
          tags: [execute]

        - name: "Step-10 - Set credential-created output vars (verified)"
          ansible.builtin.set_fact:
            _credential_name: "{{ credential_name }}"
            _status: "created"
            _message: "Credential '{{ credential_name }}' created and verified with ID {{ _verify_cred.json.results[0].id }}."
            _credential_id: "{{ _verify_cred.json.results[0].id }}"
          when:
            - _org_exists
            - not _credential_exists
            - _credential_creation_result is changed
            - _verify_cred is not failed
          tags: [execute]

        - name: "Step-11 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              credential_name: {{ _credential_name | default('') }}
              status: {{ _status | default('ERROR') }}
              message: {{ _message | default('Unknown error') }}
              credential_id: {{ _credential_id | default('') }}
              </result>
          tags: [execute]

      rescue:
        - name: "Step-12 - Emit generic error result block"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: {{ ansible_failed_task.name | default('Unknown task') }} - An unexpected error occurred during playbook execution.
              </result>
          tags: [always]

      always:
        - name: "Restore - Read snapshot state"
          ansible.builtin.include_vars:
            file: "{{ backup_dir }}/snapshot_state.yml"
            name: _snapshot
          ignore_errors: true
          tags: [restore]

        - name: "Restore - Determine if credential should be removed"
          ansible.builtin.set_fact:
            _should_restore: "{{ _snapshot.credential_existed | default(true) == false }}"
          when: _snapshot is defined
          tags: [restore]

        - name: "Restore - Delete credential if it was created by this run"
          ansible.controller.credential:
            name: "{{ credential_name }}"
            organization: "{{ organization_name }}"
            credential_type: "{{ credential_type }}"
            state: absent
            controller_host: "https://{{ aap_gateway_ip }}"
            controller_username: "{{ aap_username }}"
            controller_password: "{{ aap_password }}"
            validate_certs: false
          when: _should_restore | default(false)
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          tags: [restore]