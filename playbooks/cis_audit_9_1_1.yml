---
- name: "Audit CIS checkpoint 9.1.1: Ensure 'Windows Firewall: Domain: Firewall state' is set to 'On (recommended)'"
  hosts: all
  gather_facts: false
  vars:
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: "If Domain Controller: Read 'Firewall state'. Use read-only PowerShell to query the current value; changed_when: false; failed_when: rc not in [0, 1]."
    req_03: "If Member Server: Read 'Firewall state'. Use read-only PowerShell to query the current value; changed_when: false; failed_when: rc not in [0, 1]."
    req_04: "If Domain Controller: Evaluate whether 'Firewall state' is equals 'On (recommended)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_05: "If Member Server: Evaluate whether 'Firewall state' is equals 'On (recommended)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_07: "Generate audit report"

  tasks:
    - name: "Req step-01 - Detect Windows server role using Win32_ComputerSystem DomainRole"
      ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
      register: _step01_output
      changed_when: false
      failed_when: false

    - name: "Req step-01 - Set is_dc and is_member from DomainRole"
      ansible.builtin.set_fact:
        is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
        is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
        status_01: "{{ ('PASS' if (_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5'] else 'ERROR') | trim }}"
        details_01: "{{ ('DomainRole ' ~ (_step01_output.stdout | default('') | trim) ~ ' recognized' if (_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5'] else 'Unrecognized DomainRole or detection failure') | trim }}"

    - name: "Req step-02 - Read firewall state on Domain Controller"
      ansible.windows.win_shell: |
        $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
        $value = (Get-ItemProperty -Path $path -Name EnableFirewall -ErrorAction SilentlyContinue).EnableFirewall
        if ($null -eq $value) {
          Write-Output 'NotConfigured'
        } elseif ($value -eq 1) {
          Write-Output 'On (recommended)'
        } else {
          Write-Output 'Off'
        }
      register: _step02_output
      changed_when: false
      failed_when: false
      when: is_dc | bool

    - name: "Req step-03 - Read firewall state on Member Server"
      ansible.windows.win_shell: |
        $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
        $value = (Get-ItemProperty -Path $path -Name EnableFirewall -ErrorAction SilentlyContinue).EnableFirewall
        if ($null -eq $value) {
          Write-Output 'NotConfigured'
        } elseif ($value -eq 1) {
          Write-Output 'On (recommended)'
        } else {
          Write-Output 'Off'
        }
      register: _step03_output
      changed_when: false
      failed_when: false
      when: is_member | bool

    - name: "Req step-04 - Evaluate firewall state on Domain Controller"
      ansible.builtin.set_fact:
        data_04: "{{ _step02_output.stdout | default('') | trim }}"
        status_04: "{{ ('PASS' if (_step02_output.stdout | default('') | trim) == 'On (recommended)' else ('ERROR' if (_step02_output.rc | default(-1)) not in [0, 1] else 'FAIL')) | trim }}"
        details_04: "{{ ('Compliant' if (_step02_output.stdout | default('') | trim) == 'On (recommended)' else 'Non-compliant or check failed') | trim }}"
        _cis_status: "{{ ('PASS' if (_step02_output.stdout | default('') | trim) == 'On (recommended)' else ('ERROR' if (_step02_output.rc | default(-1)) not in [0, 1] else 'FAIL')) | trim }}"
      when: is_dc | bool

    - name: "Req step-05 - Evaluate firewall state on Member Server"
      ansible.builtin.set_fact:
        data_05: "{{ _step03_output.stdout | default('') | trim }}"
        status_05: "{{ ('PASS' if (_step03_output.stdout | default('') | trim) == 'On (recommended)' else ('ERROR' if (_step03_output.rc | default(-1)) not in [0, 1] else 'FAIL')) | trim }}"
        details_05: "{{ ('Compliant' if (_step03_output.stdout | default('') | trim) == 'On (recommended)' else 'Non-compliant or check failed') | trim }}"
        _cis_status: "{{ ('PASS' if (_step03_output.stdout | default('') | trim) == 'On (recommended)' else ('ERROR' if (_step03_output.rc | default(-1)) not in [0, 1] else 'FAIL')) | trim }}"
      when: is_member | bool

    - name: "Req step-06 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        cis_result: "{{ _cis_status | default('ERROR') | trim }}"
        status_06: "PASS"
        data_06: "Final audit result stored"
        details_06: "Overall compliance stored in cis_result"

    - name: "Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 9.1.1"
          - "Reference: CIS Benchmark checkpoint 9.1.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: Detect Windows server role via Win32_ComputerSystem.DomainRole"
          - "  Command: (Get-WmiObject Win32_ComputerSystem).DomainRole"
          - "  Exit code: {{ _step01_output.rc | default(-1) }}"
          - "  Data: {{ _step01_output.stdout | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('Not evaluated') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: Read firewall state on Domain Controller"
          - "  Command: Get-ItemProperty -Path HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile -Name EnableFirewall"
          - "  Exit code: {{ _step02_output.rc | default('N/A') }}"
          - "  Data: {{ _step02_output.stdout | default('') | trim }}"
          - "  Status: {{ 'SKIP' if not (is_dc | bool) else 'ERROR' if (_step02_output.rc | default(-1)) not in [0, 1] else 'PASS' }}"
          - "  Details: {{ 'Read completed' if is_dc | bool and (_step02_output.rc | default(-1)) in [0, 1] else 'Not applicable or read failed' }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: Read firewall state on Member Server"
          - "  Command: Get-ItemProperty -Path HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile -Name EnableFirewall"
          - "  Exit code: {{ _step03_output.rc | default('N/A') }}"
          - "  Data: {{ _step03_output.stdout | default('') | trim }}"
          - "  Status: {{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_step03_output.rc | default(-1)) not in [0, 1] else 'PASS' }}"
          - "  Details: {{ 'Read completed' if is_member | bool and (_step03_output.rc | default(-1)) in [0, 1] else 'Not applicable or read failed' }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: Evaluate firewall state on Domain Controller"
          - "  Command: Compare PowerShell output to On (recommended)"
          - "  Exit code: N/A"
          - "  Data: {{ _step02_output.stdout | default('') | trim }}"
          - "  Status: {{ status_04 | default('SKIP') | trim }}"
          - "  Details: {{ details_04 | default('Not evaluated') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: Evaluate firewall state on Member Server"
          - "  Command: Compare PowerShell output to On (recommended)"
          - "  Exit code: N/A"
          - "  Data: {{ _step03_output.stdout | default('') | trim }}"
          - "  Status: {{ status_05 | default('SKIP') | trim }}"
          - "  Details: {{ details_05 | default('Not evaluated') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: Store final audit result in cis_result"
          - "  Command: set_fact cis_result"
          - "  Exit code: N/A"
          - "  Data: {{ cis_result | default('') | trim }}"
          - "  Status: {{ status_06 | default('ERROR') | trim }}"
          - "  Details: {{ details_06 | default('Not evaluated') | trim }}"
          - ""
          - "REQUIREMENT 07 - {{ req_07 }}:"
          - "  Task: Generate audit report"
          - "  Command: debug msg audit report"
          - "  Exit code: N/A"
          - "  Data: Report generated"
          - "  Status: PASS"
          - "  Details: Audit report generated"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "========================================================"