---
- name: "SOP playbook 'audit_kernel_module' (DATA COLLECTOR — read-only): Audit a kernel module on a Linux host: if the module exists, verify it is not loaded, has an install disable with /bin/true or /bin/false, and is denylisted in modprobe config; otherwise pass."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  become_user: root
  gather_facts: false
  vars:
    target_server: ""
    kernel_module_name: "cramfs"

  tasks:
    - block:
        - name: "Validate required variable target_server is not empty"
          ansible.builtin.assert:
            that:
              - target_server != ''
            fail_msg: "target_server must be provided and must not be empty"

        - name: "Req 02 - Find kernel module files"
          ansible.builtin.find:
            paths: /lib/modules
            patterns: "{{ kernel_module_name }}.ko*"
            file_type: file
            recurse: true
          register: _module_exists
          changed_when: false

        - name: "Req 03 - Check install disable line"
          ansible.builtin.shell: "set -o pipefail && modprobe --showconfig | grep -qE '^install {{ kernel_module_name }} (/bin/true|/bin/false)( |$)'"
          args:
            executable: /bin/bash
          register: _install_check
          failed_when: false
          changed_when: false
          when: _module_exists.files | length > 0

        - name: "Req 04 - Check blacklist line"
          ansible.builtin.shell: "set -o pipefail && modprobe --showconfig | grep -q 'blacklist {{ kernel_module_name }}'"
          args:
            executable: /bin/bash
          register: _blacklist_check
          failed_when: false
          changed_when: false
          when: _module_exists.files | length > 0

        - name: "Req 05 - Check if module is loaded"
          ansible.builtin.shell: "set -o pipefail && lsmod | grep -qw '{{ kernel_module_name }}'"
          args:
            executable: /bin/bash
          register: _loaded_check
          failed_when: false
          changed_when: false
          when: _module_exists.files | length > 0

        - name: "Req 06 - Determine overall audit result"
          ansible.builtin.set_fact:
            _final_result: "{{ 'PASS' if (_install_check.rc == 0 and _blacklist_check.rc == 0 and _loaded_check.rc != 0) else 'FAIL' }}"
          when: _module_exists.files | length > 0

        - name: "Req 08 - Set result to PASS (module not present)"
          ansible.builtin.set_fact:
            _final_result: "PASS"
          when: _module_exists.files | length == 0

        - name: "Req 09 - Emit final audit result"
          ansible.builtin.debug:
            msg: "<result>\nresult: {{ _final_result }}\n</result>"

      rescue:
        - name: "Req 10 - Emit error block on failure"
          ansible.builtin.debug:
            msg: "<result>\nERROR: Audit failed due to an unexpected error. Please check the Ansible output for details.\n</result>"

        - name: "Fail the playbook"
          ansible.builtin.fail:
            msg: "Audit failed due to an unexpected error."