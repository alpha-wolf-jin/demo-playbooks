---
- name: "Audit CIS checkpoint 2.3.1.1 - Ensure 'Accounts: Guest account status' is set to 'Disabled'"
  hosts: all
  gather_facts: true

  vars:
    req_01: "Read 'Accounts: Guest account status' using community.windows.win_security_policy with section=Registry Values. changed_when: false."
    req_02: "Evaluate whether 'Accounts: Guest account status' is equals 'Disabled'. PASS if compliant, FAIL if not, SKIP if not applicable, ERROR if failed."
    req_03: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_04: "Create a task named 'Generate audit report' using debug msg with exactly this format."

  tasks:
    - name: "Req step-01 - Read Accounts Guest account status via win_security_policy"
      community.windows.win_security_policy:
        section: Registry Values
        key: EnableGuestAccount
        value: "0"
      check_mode: true
      changed_when: false
      failed_when: false
      register: _step01_output
      when: "ansible_os_family | default('') == 'Windows'"

    - name: "Req step-01 - Read actual Guest account status via Get-LocalUser"
      ansible.windows.win_shell: |
        {% raw %}
        $u = Get-LocalUser -Name 'Guest' -ErrorAction SilentlyContinue
        if (-not $u) { Write-Output 'NOT_FOUND'; exit 1 }
        if ($u.Enabled) { Write-Output 'Enabled' } else { Write-Output 'Disabled' }
        {% endraw %}
      register: guest_actual_check
      changed_when: false
      failed_when: false
      when: "ansible_os_family | default('') == 'Windows'"

    - name: "Req step-02 - Evaluate whether Accounts Guest account status equals Disabled"
      ansible.builtin.set_fact:
        task_01_name: "Read Accounts Guest account status via win_security_policy"
        task_01_cmd: "community.windows.win_security_policy: section=Registry Values key=EnableGuestAccount value=0 (check_mode)"
        task_01_rc: "{{ _step01_output.rc | default(0) | int }}"
        data_01: "{{ guest_actual_check.stdout | default('') | trim }}"
        status_01: "{{ ('SKIP' if (ansible_os_family | default('') != 'Windows') else 'ERROR' if (_step01_output.failed | default(false) | bool) else 'PASS') | trim }}"
        details_01: "{{ ('Not applicable to non-Windows target' if (ansible_os_family | default('') != 'Windows') else 'Policy read failed' if (_step01_output.failed | default(false) | bool) else 'Policy read completed successfully') | trim }}"
        task_02_name: "Evaluate Accounts Guest account status equals Disabled"
        task_02_cmd: "Compare Get-LocalUser Guest Enabled state to expected Disabled"
        task_02_rc: 0
        data_02: "{{ guest_actual_check.stdout | default('') | trim }}"
        _cis_status: "{{ ('SKIP' if (ansible_os_family | default('') != 'Windows') else 'ERROR' if (_step01_output.failed | default(false) | bool) or (guest_actual_check.stdout | default('') | trim) not in ['Disabled','Enabled'] else 'PASS' if (guest_actual_check.stdout | default('') | trim) == 'Disabled' else 'FAIL') | trim }}"
        status_02: "{{ ('SKIP' if (ansible_os_family | default('') != 'Windows') else 'ERROR' if (_step01_output.failed | default(false) | bool) or (guest_actual_check.stdout | default('') | trim) not in ['Disabled','Enabled'] else 'PASS' if (guest_actual_check.stdout | default('') | trim) == 'Disabled' else 'FAIL') | trim }}"
        details_02: "{{ ('Not applicable to non-Windows target' if (ansible_os_family | default('') != 'Windows') else 'Policy check failed or unexpected output' if (_step01_output.failed | default(false) | bool) or (guest_actual_check.stdout | default('') | trim) not in ['Disabled','Enabled'] else 'Accounts Guest account status is Disabled' if (guest_actual_check.stdout | default('') | trim) == 'Disabled' else 'Accounts Guest account status is not Disabled') | trim }}"

    - name: "Req step-03 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        cis_result: "{{ _cis_status | default('ERROR') | trim }}"
        task_03_name: "Store final audit result in cis_result"
        task_03_cmd: "ansible.builtin.set_fact: cis_result = _cis_status"
        task_03_rc: 0
        data_03: "{{ _cis_status | default('ERROR') | trim }}"
        status_03: "{{ _cis_status | default('ERROR') | trim }}"
        details_03: "Final audit result stored from Req step-02 status"

    - name: "Req step-04 - Prepare audit report fields"
      ansible.builtin.set_fact:
        task_04_name: "Generate audit report"
        task_04_cmd: "ansible.builtin.debug"
        task_04_rc: 0
        data_04: "AUDIT REPORT — CIS 2.3.1.1"
        status_04: "{{ ('PASS' if cis_result in ['PASS','FAIL','SKIP','ERROR'] else 'ERROR') | trim }}"
        details_04: "Audit report generated by Req step-04"

    - name: "Req step-04 - Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 2.3.1.1"
          - "Reference: CIS Benchmark checkpoint 2.3.1.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: {{ task_04_name | default('Not recorded') }}"
          - "  Command: {{ task_04_cmd | default('N/A') }}"
          - "  Exit code: {{ task_04_rc | default(-1) }}"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('Not evaluated') | trim }}"