---
- name: "SOP playbook 'rhel_patch' (ACTION — changes system state): Updates all packages on a RHEL server, reboots, and validates memory, disk space, and running services before and after the patch."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    target_server: ""
    min_free_memory_gb: 2
    min_free_disk_gb: 5
    fs_exclude_list: "/boot,/iso"
    fs_type_exclude_list: "devtmpfs,tmpfs,iso9660,cgroup2"
    msg: "Ansible Reboot After Patching"
    reboot_timeout: 120
    package_name: "*"
    package_state: "latest"

  tasks:
    - block:
        - name: "Req 1 - Validate required variable target_server"
          ansible.builtin.assert:
            that:
              - target_server | length > 0
              - target_server != 'localhost'
            fail_msg: "target_server must be provided and not be the placeholder 'localhost'"

        - name: "Req 2 - Gather pre-patch system facts"
          ansible.builtin.setup:
          register: _pre_facts_raw

        - name: "Req 3 - Extract pre-patch memory and filter mounts"
          ansible.builtin.set_fact:
            _pre_memory_free_gb: "{{ ((_pre_facts_raw.ansible_facts.ansible_memory_mb.real.free | float) / 1024) | round(2) }}"
            _pre_mounts_filtered: >-
              {{ _pre_facts_raw.ansible_facts.ansible_mounts
                | rejectattr('mount', 'in', (fs_exclude_list | split(',') | map('trim') | select | list))
                | rejectattr('fstype', 'in', (fs_type_exclude_list | split(',') | map('trim') | select | list))
                | json_query('[].{mount: mount, size_available: size_available, fstype: fstype}') }}

        - name: "Req 4 - Check pre-patch free memory"
          ansible.builtin.fail:
            msg: "Pre-patch free memory ({{ _pre_memory_free_gb }} GB) below threshold ({{ min_free_memory_gb }} GB)"
          when: _pre_memory_free_gb | float < min_free_memory_gb | int

        - name: "Req 5 - Check pre-patch disk space"
          ansible.builtin.fail:
            msg: >-
              Pre-patch disk space LOW on mounts: {{ _pre_mounts_filtered | selectattr('size_available', 'lt', (min_free_disk_gb | int) * 1024 * 1024 * 1024) | map(attribute='mount') | join(', ') }}
          when: (_pre_mounts_filtered | selectattr('size_available', 'lt', (min_free_disk_gb | int) * 1024 * 1024 * 1024) | length) > 0

        - name: "Req 6 - Gather pre-patch service facts"
          ansible.builtin.service_facts:
          register: _pre_service_facts_raw

        - name: "Req 7 - Extract pre-patch running services"
          ansible.builtin.set_fact:
            _pre_running_services: >-
              {{ ansible_facts.services
                | dict2items
                | selectattr('value.state', 'equalto', 'running')
                | map(attribute='key')
                | sort
                | list }}
            _pre_running_services_count: "{{ ansible_facts.services | dict2items | selectattr('value.state', 'equalto', 'running') | list | length }}"

        - name: "Req 8 - Update all packages"
          ansible.builtin.package:
            name: "{{ package_name }}"
            state: "{{ package_state }}"
          register: _update_result

        - name: "Req 9 - Reboot the server"
          ansible.builtin.reboot:
            msg: "{{ msg }}"
            reboot_timeout: "{{ reboot_timeout }}"
          register: _reboot_result

        - name: "Req 10 - Gather post-patch system facts"
          ansible.builtin.setup:
          register: _post_facts_raw

        - name: "Req 11 - Extract post-patch memory and filter mounts"
          ansible.builtin.set_fact:
            _post_memory_free_gb: "{{ ((_post_facts_raw.ansible_facts.ansible_memory_mb.real.free | float) / 1024) | round(2) }}"
            _post_mounts_filtered: >-
              {{ _post_facts_raw.ansible_facts.ansible_mounts
                | rejectattr('mount', 'in', (fs_exclude_list | split(',') | map('trim') | select | list))
                | rejectattr('fstype', 'in', (fs_type_exclude_list | split(',') | map('trim') | select | list))
                | json_query('[].{mount: mount, size_available: size_available, fstype: fstype}') }}

        - name: "Req 12 - Check post-patch free memory"
          ansible.builtin.fail:
            msg: "Post-patch free memory ({{ _post_memory_free_gb }} GB) below threshold ({{ min_free_memory_gb }} GB)"
          when: _post_memory_free_gb | float < min_free_memory_gb | int

        - name: "Req 13 - Check post-patch disk space"
          ansible.builtin.fail:
            msg: >-
              Post-patch disk space LOW on mounts: {{ _post_mounts_filtered | selectattr('size_available', 'lt', (min_free_disk_gb | int) * 1024 * 1024 * 1024) | map(attribute='mount') | join(', ') }}
          when: (_post_mounts_filtered | selectattr('size_available', 'lt', (min_free_disk_gb | int) * 1024 * 1024 * 1024) | length) > 0

        - name: "Req 14 - Gather post-patch service facts"
          ansible.builtin.service_facts:
          register: _post_service_facts_raw

        - name: "Req 15 - Extract post-patch running services"
          ansible.builtin.set_fact:
            _post_running_services: >-
              {{ ansible_facts.services
                | dict2items
                | selectattr('value.state', 'equalto', 'running')
                | map(attribute='key')
                | sort
                | list }}
            _post_running_services_count: "{{ ansible_facts.services | dict2items | selectattr('value.state', 'equalto', 'running') | list | length }}"

        - name: "Req 16 - Compare pre-post services (symmetric difference)"
          ansible.builtin.set_fact:
            _service_mismatches: >-
              {{
                (_pre_running_services | difference(_post_running_services) | map('regex_replace', '^', 'only in pre: ') | list)
                +
                (_post_running_services | difference(_pre_running_services) | map('regex_replace', '^', 'only in post: ') | list)
              }}

        - name: "Req 17 - Emit success result block"
          ansible.builtin.debug:
            msg: |
              <result>
              overall_status: SUCCESS
              pre_memory_free_gb: {{ _pre_memory_free_gb }}
              pre_disk_status: ok
              update_status: ok
              reboot_status: ok
              post_memory_free_gb: {{ _post_memory_free_gb }}
              post_disk_status: ok
              pre_running_services_count: {{ _pre_running_services_count }}
              post_running_services_count: {{ _post_running_services_count }}
              service_mismatches: {{ _service_mismatches }}
              </result>

      rescue:
        - name: "Req 18 - Emit error result block"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: rhel_patch failed on {{ inventory_hostname }}
              </result>

        - name: "Req 18 - Force host failure"
          ansible.builtin.fail:
            msg: "rhel_patch failed"