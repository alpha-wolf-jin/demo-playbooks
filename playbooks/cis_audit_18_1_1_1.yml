---
- name: "Audit CIS checkpoint 18.1.1.1 Ensure Prevent enabling lock screen camera is set to Enabled"
  hosts: all
  gather_facts: false
  vars:
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: |-
      If Domain Controller: Use ansible.windows.win_reg_stat to read the GP registry key: path='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization' name='NoLockScreenCamera'. The module returns structured data — result.exists (bool) and result.value (integer for REG_DWORD). Do NOT use win_shell or Get-ItemProperty — win_reg_stat is the correct read-only module for registry keys. changed_when: false; failed_when: false.
    req_03: |-
      If Member Server: Use ansible.windows.win_reg_stat to read the GP registry key: path='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization' name='NoLockScreenCamera'. The module returns structured data — result.exists (bool) and result.value (integer for REG_DWORD). Do NOT use win_shell or Get-ItemProperty — win_reg_stat is the correct read-only module for registry keys. changed_when: false; failed_when: false.
    req_04: "If Domain Controller: Evaluate whether 'Ensure 'Prevent enabling lock screen camera' is set to 'Enabled'' is set correctly. Check the registry data collected by the previous step — the result has structured fields, NOT stdout text: PASS if .exists == true AND .value == 1 (REG_DWORD integer). FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 1. ERROR if the registry read step failed unexpectedly. Do NOT check .stdout or .rc — the result is a structured dict."
    req_05: "If Member Server: Evaluate whether 'Ensure 'Prevent enabling lock screen camera' is set to 'Enabled'' is set correctly. Check the registry data collected by the previous step — the result has structured fields, NOT stdout text: PASS if .exists == true AND .value == 1 (REG_DWORD integer). FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 1. ERROR if the registry read step failed unexpectedly. Do NOT check .stdout or .rc — the result is a structured dict."
    req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_07: "Generate the audit report in the required format."

  tasks:
    - name: "Req step-01 - Detect Windows server role using DomainRole property"
      ansible.windows.win_shell: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
      register: _step01_output
      changed_when: false
      failed_when: false

    - name: "Req step-01 - Set role facts and initialize audit statuses"
      ansible.builtin.set_fact:
        is_dc: "{{ _step01_output.stdout | default('') | trim in ['4','5'] }}"
        is_member: "{{ _step01_output.stdout | default('') | trim in ['1','2','3'] }}"
        role: "{{ _step01_output.stdout | default('') | trim }}"
        status_01: "{{ 'PASS' if (_step01_output.stdout | default('') | trim in ['1','2','3','4','5']) else 'ERROR' }}"
        data_01: "{{ _step01_output.stdout | default('') | trim }}"
        details_01: "{{ 'DomainRole=' ~ (_step01_output.stdout | default('') | trim) }}"
        status_02: "SKIP"
        data_02: "Not collected yet"
        details_02: "Not applicable for this host role"
        status_03: "SKIP"
        data_03: "Not collected yet"
        details_03: "Not applicable for this host role"
        status_04: "SKIP"
        data_04: "Not evaluated yet"
        details_04: "Not applicable for this host role"
        status_05: "SKIP"
        data_05: "Not evaluated yet"
        details_05: "Not applicable for this host role"
        status_06: "ERROR"
        data_06: "Not computed yet"
        details_06: "Not computed yet"
        status_07: "PASS"
        data_07: "Report generated"
        details_07: "Debug task emits the formatted audit report"

    - name: "Req step-02 - Read NoLockScreenCamera registry value for Domain Controller"
      ansible.windows.win_reg_stat:
        path: |-
          HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
        name: 'NoLockScreenCamera'
      register: _step02_output
      changed_when: false
      failed_when: false
      when: is_dc | bool

    - name: "Req step-02 - Set DC registry read status and data"
      ansible.builtin.set_fact:
        status_02: "{{ 'ERROR' if (_step02_output is not defined or not (_step02_output.exists is defined) or (_step02_output.failed | default(false) | bool)) else 'PASS' }}"
        data_02: "{{ 'exists=' ~ (_step02_output.exists | default(false) | string) ~ ', value=' ~ (_step02_output.value | default('') | string) }}"
        details_02: "{{ 'Registry read error' if (_step02_output is not defined or not (_step02_output.exists is defined) or (_step02_output.failed | default(false) | bool)) else 'Registry key read completed' }}"
      when: is_dc | bool

    - name: "Req step-03 - Read NoLockScreenCamera registry value for Member Server"
      ansible.windows.win_reg_stat:
        path: |-
          HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization
        name: 'NoLockScreenCamera'
      register: _step03_output
      changed_when: false
      failed_when: false
      when: is_member | bool

    - name: "Req step-03 - Set Member registry read status and data"
      ansible.builtin.set_fact:
        status_03: "{{ 'ERROR' if (_step03_output is not defined or not (_step03_output.exists is defined) or (_step03_output.failed | default(false) | bool)) else 'PASS' }}"
        data_03: "{{ 'exists=' ~ (_step03_output.exists | default(false) | string) ~ ', value=' ~ (_step03_output.value | default('') | string) }}"
        details_03: "{{ 'Registry read error' if (_step03_output is not defined or not (_step03_output.exists is defined) or (_step03_output.failed | default(false) | bool)) else 'Registry key read completed' }}"
      when: is_member | bool

    - name: "Req step-04 - Evaluate DC compliance"
      ansible.builtin.set_fact:
        _cis_status: "{{ 'ERROR' if (_step02_output is not defined or not (_step02_output.exists is defined) or (_step02_output.failed | default(false) | bool)) else 'PASS' if ((_step02_output.exists | bool) and ((_step02_output.value | default(0) | int) == 1)) else 'FAIL' }}"
        status_04: "{{ 'ERROR' if (_step02_output is not defined or not (_step02_output.exists is defined) or (_step02_output.failed | default(false) | bool)) else 'PASS' if ((_step02_output.exists | bool) and ((_step02_output.value | default(0) | int) == 1)) else 'FAIL' }}"
        data_04: "{{ 'exists=' ~ (_step02_output.exists | default(false) | string) ~ ', value=' ~ (_step02_output.value | default('') | string) }}"
        details_04: "{{ 'Registry read error' if (_step02_output is not defined or not (_step02_output.exists is defined) or (_step02_output.failed | default(false) | bool)) else 'Pass: key exists with value 1' if ((_step02_output.exists | bool) and ((_step02_output.value | default(0) | int) == 1)) else 'Fail: key absent or value not 1' }}"
      when: is_dc | bool

    - name: "Req step-05 - Evaluate Member Server compliance"
      ansible.builtin.set_fact:
        _cis_status: "{{ 'ERROR' if (_step03_output is not defined or not (_step03_output.exists is defined) or (_step03_output.failed | default(false) | bool)) else 'PASS' if ((_step03_output.exists | bool) and ((_step03_output.value | default(0) | int) == 1)) else 'FAIL' }}"
        status_05: "{{ 'ERROR' if (_step03_output is not defined or not (_step03_output.exists is defined) or (_step03_output.failed | default(false) | bool)) else 'PASS' if ((_step03_output.exists | bool) and ((_step03_output.value | default(0) | int) == 1)) else 'FAIL' }}"
        data_05: "{{ 'exists=' ~ (_step03_output.exists | default(false) | string) ~ ', value=' ~ (_step03_output.value | default('') | string) }}"
        details_05: "{{ 'Registry read error' if (_step03_output is not defined or not (_step03_output.exists is defined) or (_step03_output.failed | default(false) | bool)) else 'Pass: key exists with value 1' if ((_step03_output.exists | bool) and ((_step03_output.value | default(0) | int) == 1)) else 'Fail: key absent or value not 1' }}"
      when: is_member | bool

    - name: "Req step-06 - Store final audit result cis_result"
      ansible.builtin.set_fact:
        cis_result: "{{ _cis_status | default('ERROR') | trim }}"
        status_06: "{{ _cis_status | default('ERROR') | trim }}"
        data_06: "{{ _cis_status | default('ERROR') | trim }}"
        details_06: "{{ 'Overall result derived from active branch verify status' }}"

    - name: "Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 18.1.1.1"
          - "Reference: CIS Benchmark checkpoint 18.1.1.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: Req step-01 - Detect Windows server role using DomainRole property"
          - "  Command: (Get-CimInstance Win32_ComputerSystem).DomainRole"
          - "  Exit code: {{ _step01_output.rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: Req step-02 - Read NoLockScreenCamera registry value for Domain Controller"
          - "  Command: ansible.windows.win_reg_stat path HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization name NoLockScreenCamera"
          - "  Exit code: {{ '-1' if _step02_output is not defined else 0 if not (_step02_output.failed | default(false) | bool) else 1 }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: Req step-03 - Read NoLockScreenCamera registry value for Member Server"
          - "  Command: ansible.windows.win_reg_stat path HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization name NoLockScreenCamera"
          - "  Exit code: {{ '-1' if _step03_output is not defined else 0 if not (_step03_output.failed | default(false) | bool) else 1 }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: Req step-04 - Evaluate DC compliance"
          - "  Command: Jinja2 evaluation of _step02_output.exists and _step02_output.value"
          - "  Exit code: 0"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: Req step-05 - Evaluate Member Server compliance"
          - "  Command: Jinja2 evaluation of _step03_output.exists and _step03_output.value"
          - "  Exit code: 0"
          - "  Data: {{ data_05 | default('') | trim }}"
          - "  Status: {{ status_05 | default('ERROR') | trim }}"
          - "  Details: {{ details_05 | default('') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: Req step-06 - Store final audit result cis_result"
          - "  Command: ansible.builtin.set_fact cis_result"
          - "  Exit code: 0"
          - "  Data: {{ data_06 | default('') | trim }}"
          - "  Status: {{ status_06 | default('ERROR') | trim }}"
          - "  Details: {{ details_06 | default('') | trim }}"
          - ""
          - "REQUIREMENT 07 - {{ req_07 }}:"
          - "  Task: Generate audit report"
          - "  Command: ansible.builtin.debug"
          - "  Exit code: 0"
          - "  Data: {{ data_07 | default('') | trim }}"
          - "  Status: {{ status_07 | default('ERROR') | trim }}"
          - "  Details: {{ details_07 | default('') | trim }}"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: {{ details_06 | default('Not evaluated') | trim }}"
          - "========================================================"