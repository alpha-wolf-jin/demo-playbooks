---
- name: "Audit CIS checkpoint 1.1.2: Ensure 'Maximum password age' is set to '365 or fewer days, but not 0'"
  hosts: all
  gather_facts: false
  vars:
    max_password_age_days: "180"
    req_01: "Check if the Windows server role is Domain Controller or Member Server using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 4 or 5 for DC, 0-3 for Member Server."
    req_02: "Check if Active Directory module is available for DC path using command: `Get-Module -ListAvailable -Name ActiveDirectory`. Expected result: module present."
    req_03: "Check DC default domain password policy MaxPasswordAge using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: days ≤ {{ max_password_age_days }} and > 0."
    req_04: |-
      Check DC GPO setting for Maximum password age using command: `Get-GPO -Name \"Default Domain Policy\" | Get-GPOReport -ReportType XML`. Expected result: MaxPwdAge value ≤ {{ max_password_age_days }} and not 0.
    req_05: |-
      Check member server effective local policy Maximum password age using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: value ≤ {{ max_password_age_days }} and not 0.
    req_06: "Check if the policy value is not 0 for DC path using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: value > 0."
    req_07: |-
      Check if the policy value is not 0 for member server path using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: value > 0.
    req_08: "Check if the policy value is ≤ {{ max_password_age_days }} days for DC path using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: value ≤ {{ max_password_age_days }} days."
    req_09: |-
      Check if the policy value is ≤ {{ max_password_age_days }} days for member server path using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: value ≤ {{ max_password_age_days }} days.
    req_10: "Check if the DC path is compliant using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: PASS if ≤{{ max_password_age_days }} and >0, FAIL otherwise."
    req_11: |-
      Check if the member server path is compliant using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: PASS if ≤{{ max_password_age_days }} and >0, FAIL otherwise.
    req_12: "Check if the OS is Windows using command: `$env:OS`. Expected result: Windows_NT."
    req_13: "Check if the domain controller role is detected using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 4 or 5."
    req_14: "Check if the member server role is detected using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 0, 1, 2, or 3."
    req_15: "Check if the DC path uses Group Policy cmdlets using command: `Get-Command Get-ADDefaultDomainPasswordPolicy`. Expected result: command exists."
    req_16: "Check if the member server path uses secedit using command: `Get-Command secedit`. Expected result: command exists."
    req_17: "Check if the DC path returns PASS using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: PASS if ≤{{ max_password_age_days }} and >0."
    req_18: |-
      Check if the member server path returns PASS using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: PASS if ≤{{ max_password_age_days }} and >0.
    req_19: "Check if the DC path returns FAIL using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: FAIL if >{{ max_password_age_days }} or 0."
    req_20: |-
      Check if the member server path returns FAIL using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: FAIL if >{{ max_password_age_days }} or 0.
    req_21: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable. Also store the actual password age value in 'password_age_days' from the active branch output."
    req_22: "Create a task named 'Generate audit report' using debug msg with the specified audit report format."

  tasks:
    - name: "Initialize default result variables"
      ansible.builtin.set_fact:
        cis_result: "ERROR"
        password_age_days: "-1"
        status_01: "ERROR"
        status_02: "ERROR"
        status_03: "ERROR"
        status_04: "ERROR"
        status_05: "ERROR"
        status_06: "ERROR"
        status_07: "ERROR"
        status_08: "ERROR"
        status_09: "ERROR"
        status_10: "ERROR"
        status_11: "ERROR"
        status_12: "ERROR"
        status_13: "ERROR"
        status_14: "ERROR"
        status_15: "ERROR"
        status_16: "ERROR"
        status_17: "ERROR"
        status_18: "ERROR"
        status_19: "ERROR"
        status_20: "ERROR"
        status_21: "ERROR"
        status_22: "ERROR"

    - name: "Req step-12 - Check if the OS is Windows"
      ansible.windows.win_shell: "$env:OS"
      register: _step12_output
      failed_when: false
      changed_when: false

    - name: "Req step-01 - Detect Windows server role"
      ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
      register: _step01_output
      failed_when: false
      changed_when: false

    - name: "Req step-01 - Set is_dc and is_member from detected role"
      ansible.builtin.set_fact:
        role_value: "{{ _step01_output.stdout | default('') | trim }}"
        is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
        is_member: "{{ (_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3'] }}"
        role_valid: "{{ (_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3', '4', '5'] }}"
        status_01: "{{ 'PASS' if (_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3', '4', '5'] else 'ERROR' }}"

    - name: "Req step-02 - Check Active Directory module and cmdlet availability"
      ansible.windows.win_shell: |
        $mod = Get-Module -ListAvailable -Name ActiveDirectory | Select-Object -First 1
        if ($mod) { Write-Output 'AD_MODULE=1' } else { Write-Output 'AD_MODULE=0' }
        $cmd = Get-Command Get-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue
        if ($cmd) { Write-Output 'AD_CMDLET=1' } else { Write-Output 'AD_CMDLET=0' }
      register: _step02_output
      failed_when: false
      changed_when: false
      when: is_dc | bool

    - name: "Req step-03 - Check DC default domain password policy MaxPasswordAge"
      ansible.windows.win_shell: |
        $maxDays = [int]{{ max_password_age_days }}
        try {
          $v = (Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge
          if ($v -is [TimeSpan]) { $d = $v.Days } elseif ($v -match '^\d+$') { $d = [int]$v } else { $d = -1 }
          Write-Output "RAW_MAXPASSWORDAGE=$v"
          Write-Output "PASSWORD_AGE_DAYS=$d"
          if ($d -gt 0 -and $d -le $maxDays) { Write-Output 'DC_COMPLIANCE=PASS' } else { Write-Output 'DC_COMPLIANCE=FAIL' }
        } catch {
          Write-Output 'PASSWORD_AGE_DAYS=-1'
          Write-Output 'DC_COMPLIANCE=ERROR'
          Write-Output "ERROR=$($_.Exception.Message)"
        }
      register: _step03_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - "'AD_MODULE=1' in (_step02_output.stdout | default(''))"
        - "'AD_CMDLET=1' in (_step02_output.stdout | default(''))"

    - name: "Req step-04 - Check DC GPO setting for Maximum password age"
      ansible.windows.win_shell: |
        $maxDays = [int]{{ max_password_age_days }}
        try {
          $xml = Get-GPO -Name "Default Domain Policy" | Get-GPOReport -ReportType XML
          $raw = [string]$xml
          Write-Output $raw.Substring(0, [Math]::Min(2000, $raw.Length))
          $m = [regex]::Match($raw, '(?i)MaxPwdAge[^>]*>\s*([0-9]+)\s*<')
          if (-not $m.Success) {
            $m = [regex]::Match($raw, '(?i)<SecurityOption>\s*<Name>MaximumPasswordAge</Name>\s*<Value>\s*([0-9]+)\s*</Value>')
          }
          if (-not $m.Success) {
            $m = [regex]::Match($raw, '(?i)MaximumPasswordAge[^\d]{0,50}?\b([0-9]{1,4})\b')
          }
          if ($m.Success) {
            $gpoDays = [int]$m.Groups[1].Value
          } else {
            $gpoDays = -1
          }
          Write-Output "GPO_MAXPWDAGE=$gpoDays"
          if ($gpoDays -gt 0 -and $gpoDays -le $maxDays) { Write-Output 'GPO_COMPLIANCE=PASS' } else { Write-Output 'GPO_COMPLIANCE=FAIL' }
        } catch {
          Write-Output 'GPO_MAXPWDAGE=-1'
          Write-Output 'GPO_COMPLIANCE=ERROR'
          Write-Output "ERROR=$($_.Exception.Message)"
        }
      register: _step04_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - "'AD_MODULE=1' in (_step02_output.stdout | default(''))"
        - "'AD_CMDLET=1' in (_step02_output.stdout | default(''))"

    - name: "Req step-16 - Check if member server path uses secedit"
      ansible.windows.win_shell: |
        $c = Get-Command secedit -ErrorAction SilentlyContinue
        if ($c) { Write-Output 'SECEDIT_CMD=1' } else { Write-Output 'SECEDIT_CMD=0' }
      register: _step16_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-05 - Check member server effective local policy Maximum password age"
      ansible.windows.win_shell: |
        $maxDays = [int]{{ max_password_age_days }}
        $tmp = "$env:TEMP\secpol.cfg"
        try {
          secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet | Out-Null
          $line = Get-Content $tmp | Select-String 'MaximumPasswordAge'
          if ($line) {
            Write-Output $line.Line
            $v = ($line.Line -split '=',2)[1].Trim()
            Write-Output "PASSWORD_AGE_DAYS=$v"
            $d = [int]$v
            if ($d -gt 0 -and $d -le $maxDays) { Write-Output 'MEMBER_COMPLIANCE=PASS' } else { Write-Output 'MEMBER_COMPLIANCE=FAIL' }
          } else {
            Write-Output 'PASSWORD_AGE_DAYS=-1'
            Write-Output 'MEMBER_COMPLIANCE=FAIL'
          }
        } catch {
          Write-Output 'PASSWORD_AGE_DAYS=-1'
          Write-Output 'MEMBER_COMPLIANCE=ERROR'
          Write-Output "ERROR=$($_.Exception.Message)"
        } finally {
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue
        }
      register: _step05_output
      failed_when: false
      changed_when: false
      when:
        - is_member | bool
        - "'SECEDIT_CMD=1' in (_step16_output.stdout | default(''))"

    - name: "Compute raw flags and extracted values"
      ansible.builtin.set_fact:
        os_windows: "{{ (_step12_output.stdout | default('') | trim == 'Windows_NT') }}"
        dc_compliant: "{{ 'DC_COMPLIANCE=PASS' in (_step03_output.stdout | default('')) }}"
        member_compliant: "{{ 'MEMBER_COMPLIANCE=PASS' in (_step05_output.stdout | default('')) }}"
        dc_gpo_compliant: "{{ 'GPO_COMPLIANCE=PASS' in (_step04_output.stdout | default('')) }}"
        dc_ad_module_ok: "{{ 'AD_MODULE=1' in (_step02_output.stdout | default('')) }}"
        dc_ad_cmdlet_ok: "{{ 'AD_CMDLET=1' in (_step02_output.stdout | default('')) }}"
        member_secedit_ok: "{{ 'SECEDIT_CMD=1' in (_step16_output.stdout | default('')) }}"
        dc_tools_ok: "{{ ('AD_MODULE=1' in (_step02_output.stdout | default(''))) and ('AD_CMDLET=1' in (_step02_output.stdout | default(''))) }}"
        member_tools_ok: "{{ 'SECEDIT_CMD=1' in (_step16_output.stdout | default('')) }}"
        dc_policy_error: "{{ 'DC_COMPLIANCE=ERROR' in (_step03_output.stdout | default('')) }}"
        dc_gpo_error: "{{ 'GPO_COMPLIANCE=ERROR' in (_step04_output.stdout | default('')) }}"
        member_policy_error: "{{ 'MEMBER_COMPLIANCE=ERROR' in (_step05_output.stdout | default('')) }}"
        dc_age_days: >-
          {{ (_step03_output.stdout | default('') |
              regex_replace('(?s)^.*PASSWORD_AGE_DAYS=(-?\d+).*$', '\1') | int)
             if ('PASSWORD_AGE_DAYS=' in (_step03_output.stdout | default(''))) else -1 }}
        member_age_days: >-
          {{ (_step05_output.stdout | default('') |
              regex_replace('(?s)^.*PASSWORD_AGE_DAYS=(-?\d+).*$', '\1') | int)
             if ('PASSWORD_AGE_DAYS=' in (_step05_output.stdout | default(''))) else -1 }}
        gpo_maxpwdage: >-
          {{ (_step04_output.stdout | default('') |
              regex_replace('(?s)^.*GPO_MAXPWDAGE=(-?\d+).*$', '\1') | int)
             if ('GPO_MAXPWDAGE=' in (_step04_output.stdout | default(''))) else -1 }}

    - name: "Req step-02 - Store AD module availability status"
      ansible.builtin.set_fact:
        status_02: "{{ 'PASS' if (is_dc | bool) and (dc_ad_module_ok | bool) else 'FAIL' if (is_dc | bool) else 'SKIP' }}"

    - name: "Req step-03 - Store DC MaxPasswordAge policy status"
      ansible.builtin.set_fact:
        status_03: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (dc_tools_ok | bool) else 'ERROR' if (dc_age_days | int == -1) else 'PASS' if (dc_age_days | int > 0) and (dc_age_days | int <= (max_password_age_days | int)) else 'FAIL' }}"

    - name: "Req step-04 - Store DC GPO setting status"
      ansible.builtin.set_fact:
        status_04: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (dc_tools_ok | bool) else 'ERROR' if (dc_gpo_error | bool) else 'PASS' if (dc_gpo_compliant | bool) else 'FAIL' }}"

    - name: "Req step-05 - Store member server policy status"
      ansible.builtin.set_fact:
        status_05: "{{ 'SKIP' if not (is_member | bool) else 'SKIP' if not (member_tools_ok | bool) else 'ERROR' if (member_policy_error | bool) else 'PASS' if (member_compliant | bool) else 'FAIL' }}"

    - name: "Req step-06 - Check if the policy value is not 0 for DC path"
      ansible.builtin.set_fact:
        status_06: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if (dc_age_days | int == -1) else 'PASS' if (dc_age_days | int > 0) else 'FAIL' }}"
      register: _step06_output

    - name: "Req step-07 - Check if the policy value is not 0 for member server path"
      ansible.builtin.set_fact:
        status_07: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (member_age_days | int == -1) else 'PASS' if (member_age_days | int > 0) else 'FAIL' }}"
      register: _step07_output

    - name: "Req step-08 - Check if the policy value is <= threshold days for DC path"
      ansible.builtin.set_fact:
        status_08: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if (dc_age_days | int == -1) else 'PASS' if (dc_age_days | int <= (max_password_age_days | int)) else 'FAIL' }}"
      register: _step08_output

    - name: "Req step-09 - Check if the policy value is <= threshold days for member server path"
      ansible.builtin.set_fact:
        status_09: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (member_age_days | int == -1) else 'PASS' if (member_age_days | int <= (max_password_age_days | int)) else 'FAIL' }}"
      register: _step09_output

    - name: "Req step-10 - Check if the DC path is compliant"
      ansible.builtin.set_fact:
        status_10: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if (dc_policy_error | bool) else 'PASS' if (dc_compliant | bool) else 'FAIL' }}"
      register: _step10_output

    - name: "Req step-11 - Check if the member server path is compliant"
      ansible.builtin.set_fact:
        status_11: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (member_policy_error | bool) else 'PASS' if (member_compliant | bool) else 'FAIL' }}"
      register: _step11_output

    - name: "Req step-12 - Store OS Windows check status"
      ansible.builtin.set_fact:
        status_12: "{{ 'PASS' if (_step12_output.stdout | default('') | trim == 'Windows_NT') else 'FAIL' }}"

    - name: "Req step-13 - Check if the domain controller role is detected"
      ansible.builtin.set_fact:
        status_13: "{{ 'PASS' if (is_dc | bool) else 'SKIP' }}"
      register: _step13_output

    - name: "Req step-14 - Check if the member server role is detected"
      ansible.builtin.set_fact:
        status_14: "{{ 'PASS' if (is_member | bool) else 'SKIP' }}"
      register: _step14_output

    - name: "Req step-15 - Check if the DC path uses Group Policy cmdlets"
      ansible.builtin.set_fact:
        status_15: "{{ 'PASS' if (is_dc | bool) and (dc_ad_cmdlet_ok | bool) else 'FAIL' if (is_dc | bool) else 'SKIP' }}"
      register: _step15_output

    - name: "Req step-16 - Store secedit availability status"
      ansible.builtin.set_fact:
        status_16: "{{ 'PASS' if (is_member | bool) and (member_secedit_ok | bool) else 'FAIL' if (is_member | bool) else 'SKIP' }}"

    - name: "Req step-17 - Check if the DC path returns PASS"
      ansible.builtin.set_fact:
        status_17: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if (dc_policy_error | bool) else 'PASS' if (dc_compliant | bool) else 'FAIL' }}"
      register: _step17_output

    - name: "Req step-18 - Check if the member server path returns PASS"
      ansible.builtin.set_fact:
        status_18: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (member_policy_error | bool) else 'PASS' if (member_compliant | bool) else 'FAIL' }}"
      register: _step18_output

    - name: "Req step-19 - Check if the DC path returns FAIL"
      ansible.builtin.set_fact:
        status_19: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if (dc_policy_error | bool) else 'FAIL' if not (dc_compliant | bool) else 'PASS' }}"
      register: _step19_output

    - name: "Req step-20 - Check if the member server path returns FAIL"
      ansible.builtin.set_fact:
        status_20: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (member_policy_error | bool) else 'FAIL' if not (member_compliant | bool) else 'PASS' }}"
      register: _step20_output

    - name: "Req step-21 - Store final audit result and password age"
      ansible.builtin.set_fact:
        cis_result: >-
          {%- if not (role_valid | bool) -%}ERROR
          {%- elif is_dc | bool -%}
            {%- if status_03 | trim == 'PASS' and status_04 | trim == 'PASS' -%}PASS
            {%- elif 'ERROR' in [status_03 | trim, status_04 | trim] -%}ERROR
            {%- elif 'FAIL' in [status_03 | trim, status_04 | trim] -%}FAIL
            {%- else -%}SKIP
            {%- endif -%}
          {%- elif is_member | bool -%}
            {%- if status_05 | trim == 'PASS' -%}PASS
            {%- elif status_05 | trim == 'ERROR' -%}ERROR
            {%- elif status_05 | trim == 'FAIL' -%}FAIL
            {%- else -%}SKIP
            {%- endif -%}
          {%- else -%}SKIP
          {%- endif -%}
        password_age_days: "{{ (dc_age_days | int) if (is_dc | bool) else (member_age_days | int) if (is_member | bool) else -1 }}"
        status_21: "{{ 'PASS' if (role_valid | bool) else 'ERROR' }}"
      register: _step21_output

    - name: "Prepare report generation status"
      ansible.builtin.set_fact:
        status_22: "{{ 'PASS' if cis_result in ['PASS', 'FAIL', 'SKIP', 'ERROR'] else 'ERROR' }}"

    - name: "Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.2"
          - "Reference: CIS Benchmark checkpoint 1.1.2"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: Req step-01 - Detect Windows server role"
          - "  Command: (Get-WmiObject Win32_ComputerSystem).DomainRole"
          - "  Exit code: {{ _step01_output.rc | default(-1) }}"
          - "  Data: {{ _step01_output.stdout | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: Detected role value: {{ role_value | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: Req step-02 - Check Active Directory module and cmdlet availability"
          - "  Command: Get-Module -ListAvailable -Name ActiveDirectory; Get-Command Get-ADDefaultDomainPasswordPolicy"
          - "  Exit code: {{ _step02_output.rc | default(-1) }}"
          - "  Data: {{ _step02_output.stdout | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: AD module available: {{ dc_ad_module_ok | default(false) }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: Req step-03 - Check DC default domain password policy MaxPasswordAge"
          - "  Command: (Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
          - "  Exit code: {{ _step03_output.rc | default(-1) }}"
          - "  Data: {{ _step03_output.stdout | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: DC password age days: {{ dc_age_days | default(-1) }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: Req step-04 - Check DC GPO setting for Maximum password age"
          - "  Command: Get-GPO -Name \"Default Domain Policy\" | Get-GPOReport -ReportType XML"
          - "  Exit code: {{ _step04_output.rc | default(-1) }}"
          - "  Data: {{ _step04_output.stdout | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: GPO MaxPwdAge days: {{ gpo_maxpwdage | default(-1) }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: Req step-05 - Check member server effective local policy Maximum password age"
          - "  Command: $tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'"
          - "  Exit code: {{ _step05_output.rc | default(-1) }}"
          - "  Data: {{ _step05_output.stdout | default('') | trim }}"
          - "  Status: {{ status_05 | default('ERROR') | trim }}"
          - "  Details: Member password age days: {{ member_age_days | default(-1) }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: Req step-06 - Check if the policy value is not 0 for DC path"
          - "  Command: (Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
          - "  Exit code: {{ _step03_output.rc | default(-1) }}"
          - "  Data: {{ _step03_output.stdout | default('') | trim }}"
          - "  Status: {{ status_06 | default('ERROR') | trim }}"
          - "  Details: DC password age is non-zero: {{ dc_age_days | default(-1) }}"
          - ""
          - "REQUIREMENT 07 - {{ req_07 }}:"
          - "  Task: Req step-07 - Check if the policy value is not 0 for member server path"
          - "  Command: $tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'"
          - "  Exit code: {{ _step05_output.rc | default(-1) }}"
          - "  Data: {{ _step05_output.stdout | default('') | trim }}"
          - "  Status: {{ status_07 | default('ERROR') | trim }}"
          - "  Details: Member password age is non-zero: {{ member_age_days | default(-1) }}"
          - ""
          - "REQUIREMENT 08 - {{ req_08 }}:"
          - "  Task: Req step-08 - Check if the policy value is <= threshold days for DC path"
          - "  Command: (Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
          - "  Exit code: {{ _step03_output.rc | default(-1) }}"
          - "  Data: {{ _step03_output.stdout | default('') | trim }}"
