---
- name: "Audit CIS checkpoint 1.1.2: Ensure 'Maximum password age' is set to '365 or fewer days, but not 0'"
  hosts: all
  gather_facts: false
  vars:
    max_password_age_days: 365
    req_01: "Check if the Windows server role is Domain Controller or Member Server using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: DomainRole 4 or 5 for DC, 0-3 for Member Server."
    req_02: "Check if Active Directory module is available for DC path using command: `Get-Module -ListAvailable -Name ActiveDirectory`. Expected result: Module present."
    req_03: "Check DC default domain password policy maximum password age using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: Days ≤ 365 and > 0."
    req_04: |-
      Check DC GPO setting for maximum password age using command: `Get-GPO -Name \"Default Domain Policy\" | Get-GPOReport -ReportType Xml`. Expected result: MaxPasswordAge ≤ 365 and > 0.
    req_05: |-
      Check member server effective local policy maximum password age using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: Value ≤ 365 and > 0.
    req_06: "Check if the policy setting is not set to 0 (never expires) using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: Value > 0."
    req_07: |-
      Check if the policy setting is not set to 0 on member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: Value > 0.
    req_08: "Check if the policy setting is set to 365 or fewer days on DC using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: Days ≤ 365."
    req_09: |-
      Check if the policy setting is set to 365 or fewer days on member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: Value ≤ 365.
    req_10: |-
      Check if the policy is applied via Default Domain Policy GPO on DC using command: `Get-GPO -Name \"Default Domain Policy\" | Get-GPOReport -ReportType Xml`. Expected result: Setting present and configured.
    req_11: |-
      Check if the policy is applied via local security policy on member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: Setting present and configured.
    req_12: "Check if the policy value is within range 1-365 on DC using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: Days between 1 and 365."
    req_13: |-
      Check if the policy value is within range 1-365 on member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: Value between 1 and 365.
    req_14: "Check if the policy is not set to 0 on DC using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: Value > 0."
    req_15: |-
      Check if the policy is not set to 0 on member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: Value > 0.
    req_16: "Check if the policy is set to 365 or fewer days on DC using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: Days ≤ 365."
    req_17: |-
      Check if the policy is set to 365 or fewer days on member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: Value ≤ 365.
    req_18: "Check if the policy is configured via PSO for specific users on DC using command: `Get-ADFineGrainedPasswordPolicy`. Expected result: PSOs if any, with MaxPasswordAge ≤ 365 and > 0."
    req_19: "Check if the policy is configured via PSO for specific users on DC using command: `Get-ADFineGrainedPasswordPolicy | Select-Object Name, MaxPasswordAge`. Expected result: All PSOs have MaxPasswordAge ≤ 365 and > 0."
    req_20: "Check overall compliance: For DC, PASS if all DC checks pass; for Member Server, PASS if all member server checks pass; FAIL if any check fails; SKIP only if OS is not Windows. Expected result: PASS or FAIL based on checks."
    req_21: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  tasks:
    - name: "Req step-01 - Check Windows server role using Get-WmiObject Win32_ComputerSystem DomainRole"
      ansible.windows.win_shell: |
        {% raw %}
        (Get-WmiObject Win32_ComputerSystem).DomainRole
        {% endraw %}
      register: _step01_output
      failed_when: false
      changed_when: false

    - name: "Req step-01 - Set role flags from DomainRole detection"
      ansible.builtin.set_fact:
        is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
        is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"

    - name: "Req step-02 - Check Active Directory module availability using Get-Module"
      ansible.windows.win_shell: |
        {% raw %}
        if (Get-Module -ListAvailable -Name ActiveDirectory) {
          Write-Output 'ActiveDirectory'
        }
        {% endraw %}
      register: _step02_output
      failed_when: false
      changed_when: false
      when: is_dc | bool

    - name: "Req step-02 - Set Active Directory module availability flag"
      ansible.builtin.set_fact:
        ad_module_ok: "{{ 'ActiveDirectory' in (((_step02_output | default({})).stdout) | default('') | trim) }}"

    - name: "Req step-03 - Check DC default domain password policy maximum password age"
      ansible.windows.win_shell: &dc_policy_cmd |
        {% raw %}
        try {
          $v = (Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge
          if ($v -is [TimeSpan]) { Write-Output $v.Days } else { Write-Output $v }
        } catch {
          Write-Output 'ERROR'
          exit 1
        }
        {% endraw %}
      register: _step03_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-04 - Check DC GPO setting for maximum password age using Get-GPOReport"
      ansible.windows.win_shell: &gpo_cmd |
        {% raw %}
        try {
          $xml = Get-GPO -Name "Default Domain Policy" | Get-GPOReport -ReportType Xml
          $m = [regex]::Match($xml, 'MaximumPasswordAge\D+(\d+)')
          if ($m.Success) { Write-Output $m.Groups[1].Value } else { Write-Output 'NOT_FOUND' }
        } catch {
          Write-Output 'GPO_ERROR'
          exit 1
        }
        {% endraw %}
      register: _step04_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-05 - Check member server effective local policy maximum password age using secedit"
      ansible.windows.win_shell: &member_policy_cmd |
        {% raw %}
        $tmp = "$env:TEMP\secpol.cfg"
        secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet | Out-Null
        if ($LASTEXITCODE -ne 0) {
          Write-Output 'SEEDIT_ERROR'
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue
          exit 1
        }
        $line = Get-Content $tmp | Select-String 'MaximumPasswordAge' | Select-Object -First 1
        if ($line) {
          $m = [regex]::Match($line.Line, 'MaximumPasswordAge\s*=\s*(\d+)')
          if ($m.Success) { Write-Output $m.Groups[1].Value } else { Write-Output 'NO_MATCH' }
        } else {
          Write-Output 'NO_SETTING'
        }
        Remove-Item $tmp -Force -ErrorAction SilentlyContinue
        {% endraw %}
      register: _step05_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-06 - Check DC policy setting is not set to 0 using Get-ADDefaultDomainPasswordPolicy"
      ansible.windows.win_shell: *dc_policy_cmd
      register: _step06_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-07 - Check member server policy setting is not set to 0 using secedit"
      ansible.windows.win_shell: *member_policy_cmd
      register: _step07_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-08 - Check DC policy setting is 365 or fewer days using Get-ADDefaultDomainPasswordPolicy"
      ansible.windows.win_shell: *dc_policy_cmd
      register: _step08_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-09 - Check member server policy setting is 365 or fewer days using secedit"
      ansible.windows.win_shell: *member_policy_cmd
      register: _step09_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-10 - Check DC policy is applied via Default Domain Policy GPO using Get-GPOReport"
      ansible.windows.win_shell: *gpo_cmd
      register: _step10_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-11 - Check member server policy is applied via local security policy using secedit"
      ansible.windows.win_shell: *member_policy_cmd
      register: _step11_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-12 - Check DC policy value is within range 1-365 using Get-ADDefaultDomainPasswordPolicy"
      ansible.windows.win_shell: *dc_policy_cmd
      register: _step12_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-13 - Check member server policy value is within range 1-365 using secedit"
      ansible.windows.win_shell: *member_policy_cmd
      register: _step13_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-14 - Check DC policy is not set to 0 using Get-ADDefaultDomainPasswordPolicy"
      ansible.windows.win_shell: *dc_policy_cmd
      register: _step14_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-15 - Check member server policy is not set to 0 using secedit"
      ansible.windows.win_shell: *member_policy_cmd
      register: _step15_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-16 - Check DC policy is set to 365 or fewer days using Get-ADDefaultDomainPasswordPolicy"
      ansible.windows.win_shell: *dc_policy_cmd
      register: _step16_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-17 - Check member server policy is set to 365 or fewer days using secedit"
      ansible.windows.win_shell: *member_policy_cmd
      register: _step17_output
      failed_when: false
      changed_when: false
      when: is_member | bool

    - name: "Req step-18 - Check DC fine-grained password policies using Get-ADFineGrainedPasswordPolicy"
      ansible.windows.win_shell: &pso_cmd |
        {% raw %}
        $psos = Get-ADFineGrainedPasswordPolicy -ErrorAction SilentlyContinue
        if (-not $psos) {
          Write-Output 'NO_PSO'
          Write-Output 'COMPLIANCE=PASS'
        } else {
          $bad = @()
          foreach ($p in $psos) {
            $d = 0
            if ($p.MaxPasswordAge -is [TimeSpan]) { $d = $p.MaxPasswordAge.Days } else { $d = [int]$p.MaxPasswordAge }
            if ($d -le 0 -or $d -gt 365) { $bad += "$($p.Name)=$d" }
          }
          if ($bad.Count -eq 0) { Write-Output 'COMPLIANCE=PASS' } else { Write-Output 'COMPLIANCE=FAIL'; Write-Output ($bad -join ',') }
        }
        {% endraw %}
      register: _step18_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Req step-19 - Check DC fine-grained password policies MaxPasswordAge using Get-ADFineGrainedPasswordPolicy"
      ansible.windows.win_shell: *pso_cmd
      register: _step19_output
      failed_when: false
      changed_when: false
      when:
        - is_dc | bool
        - ad_module_ok | bool

    - name: "Ensure step output variables are defined"
      ansible.builtin.set_fact:
        _step01_output: "{{ _step01_output | default({}) }}"
        _step02_output: "{{ _step02_output | default({}) }}"
        _step03_output: "{{ _step03_output | default({}) }}"
        _step04_output: "{{ _step04_output | default({}) }}"
        _step05_output: "{{ _step05_output | default({}) }}"
        _step06_output: "{{ _step06_output | default({}) }}"
        _step07_output: "{{ _step07_output | default({}) }}"
        _step08_output: "{{ _step08_output | default({}) }}"
        _step09_output: "{{ _step09_output | default({}) }}"
        _step10_output: "{{ _step10_output | default({}) }}"
        _step11_output: "{{ _step11_output | default({}) }}"
        _step12_output: "{{ _step12_output | default({}) }}"
        _step13_output: "{{ _step13_output | default({}) }}"
        _step14_output: "{{ _step14_output | default({}) }}"
        _step15_output: "{{ _step15_output | default({}) }}"
        _step16_output: "{{ _step16_output | default({}) }}"
        _step17_output: "{{ _step17_output | default({}) }}"
        _step18_output: "{{ _step18_output | default({}) }}"
        _step19_output: "{{ _step19_output | default({}) }}"

    - name: "Req step-20 - Compute per-requirement compliance statuses"
      ansible.builtin.set_fact:
        status_01: "{{ 'ERROR' if (_step01_output.rc | default(-1)) != 0 or (_step01_output.stdout | default('') | trim) == '' else 'PASS' if (_step01_output.stdout | default('') | trim) in ['0','1','2','3','4','5'] else 'ERROR' }}"
        status_02: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if (_step02_output.rc | default(-1)) != 0 else 'SKIP' if ((_step02_output.stdout | default('') | trim) == '') else 'PASS' if 'ActiveDirectory' in (_step02_output.stdout | default('') | trim) else 'SKIP' }}"
        status_03: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step03_output.rc | default(-1)) != 0 or ((_step03_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step03_output.stdout | default('') | trim | int) > 0 and (_step03_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_04: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step04_output.rc | default(-1)) != 0 else 'FAIL' if (_step04_output.stdout | default('') | trim) in ['NOT_FOUND', 'GPO_ERROR'] else 'ERROR' if ((_step04_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step04_output.stdout | default('') | trim | int) > 0 and (_step04_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_05: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_step05_output.rc | default(-1)) != 0 or ((_step05_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step05_output.stdout | default('') | trim | int) > 0 and (_step05_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_06: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step06_output.rc | default(-1)) != 0 or ((_step06_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step06_output.stdout | default('') | trim | int) > 0 and (_step06_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_07: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_step07_output.rc | default(-1)) != 0 or ((_step07_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step07_output.stdout | default('') | trim | int) > 0 and (_step07_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_08: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step08_output.rc | default(-1)) != 0 or ((_step08_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step08_output.stdout | default('') | trim | int) > 0 and (_step08_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_09: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_step09_output.rc | default(-1)) != 0 or ((_step09_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step09_output.stdout | default('') | trim | int) > 0 and (_step09_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_10: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step10_output.rc | default(-1)) != 0 else 'FAIL' if (_step10_output.stdout | default('') | trim) in ['NOT_FOUND', 'GPO_ERROR'] else 'ERROR' if ((_step10_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step10_output.stdout | default('') | trim | int) > 0 and (_step10_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_11: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_step11_output.rc | default(-1)) != 0 or ((_step11_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step11_output.stdout | default('') | trim | int) > 0 and (_step11_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_12: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step12_output.rc | default(-1)) != 0 or ((_step12_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step12_output.stdout | default('') | trim | int) > 0 and (_step12_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_13: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_step13_output.rc | default(-1)) != 0 or ((_step13_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step13_output.stdout | default('') | trim | int) > 0 and (_step13_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_14: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step14_output.rc | default(-1)) != 0 or ((_step14_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step14_output.stdout | default('') | trim | int) > 0 and (_step14_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_15: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_step15_output.rc | default(-1)) != 0 or ((_step15_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step15_output.stdout | default('') | trim | int) > 0 and (_step15_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_16: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step16_output.rc | default(-1)) != 0 or ((_step16_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step16_output.stdout | default('') | trim | int) > 0 and (_step16_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_17: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if (_step17_output.rc | default(-1)) != 0 or ((_step17_output.stdout | default('') | trim | int(-1)) == -1) else 'PASS' if (_step17_output.stdout | default('') | trim | int) > 0 and (_step17_output.stdout | default('') | trim | int) <= (max_password_age_days | int) else 'FAIL' }}"
        status_18: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step18_output.rc | default(-1)) != 0 else 'PASS' if 'COMPLIANCE=PASS' in (_step18_output.stdout | default('') | trim) else 'FAIL' }}"
        status_19: "{{ 'SKIP' if not (is_dc | bool) else 'SKIP' if not (ad_module_ok | bool) else 'ERROR' if (_step19_output.rc | default(-1)) != 0 else 'PASS' if 'COMPLIANCE=PASS' in (_step19_output.stdout | default('') | trim) else 'FAIL' }}"
      register: _step20_output

    - name: "Req step-20 - Compute overall compliance status"
      ansible.builtin.set_fact:
        status_20: >-
          {{ 'ERROR' if not (is_dc | bool) and not (is_member | bool) else
             'SKIP' if (is_dc | bool) and not (ad_module_ok | bool) else
             'ERROR' if 'ERROR' in (
               [status_01]
               + ([status_02, status_03, status_04, status_06, status_08, status_10, status_12, status_14, status_16, status_18, status_19] if (is_dc | bool) else [])
               + ([status_05, status_07, status_09, status_11, status_13, status_15, status_17] if (is_member | bool) else [])
             ) else
             'FAIL' if 'FAIL' in (
               [status_01]
               + ([status_02, status_03, status_04, status_06, status_08, status_10, status_12, status_14, status_16, status_18, status_19] if (is_dc | bool) else [])
               + ([status_05, status_07, status_09, status_11, status_13, status_15, status_17] if (is_member | bool) else [])
             ) else
             'PASS' }}

    - name: "Req step-21 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        cis_result: "{{ status_20 | default('ERROR') | trim }}"
        status_21: "{{ status_20 | default('ERROR') | trim }}"

    - name: "Req step-22 - Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.2"
          - "Reference: CIS Benchmark checkpoint 1.1.2"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: Check Windows server role using WMI"
          - "  Command: (Get-WmiObject Win32_ComputerSystem).DomainRole"
          - "  Exit code: {{ _step01_output.rc | default(-1) }}"
          - "  Data: {{ _step01_output.stdout | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ status_01 | default('ERROR') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: Check Active Directory module availability"
          - "  Command: Get-Module -ListAvailable -Name ActiveDirectory"
          - "  Exit code: {{ _step02_output.rc | default(-1) }}"
          - "  Data: {{ _step02_output.stdout | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ status_02 | default('ERROR') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: Check DC default domain password policy maximum password age"
          - "  Command: (Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
          - "  Exit code: {{ _step03_output.rc | default(-1) }}"
          - "  Data: {{ _step03_output.stdout | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ status_03 | default('ERROR') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: Check DC GPO setting for maximum password age"
          - "  Command: Get-GPO -Name \"Default Domain Policy\" | Get-GPOReport -ReportType Xml"
          - "  Exit code: {{ _step04_output.rc | default(-1) }}"
          - "  Data: {{ _step04_output.stdout | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ status_04 | default('ERROR') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
