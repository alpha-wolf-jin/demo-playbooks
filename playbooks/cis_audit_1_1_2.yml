---
- name: "Audit CIS checkpoint 1.1.2: Ensure 'Maximum password age' is set to '365 or fewer days, but not 0'"
  hosts: 192.168.122.21
  gather_facts: false
  vars:
    max_password_age_days: "365"
    req_01: "Confirm the target is a domain controller and that Group Policy tooling is available. Run: (Get-WmiObject Win32_ComputerSystem).DomainRole and Get-Module -ListAvailable GroupPolicy. Expected result: DomainRole is 4 or 5 (domain controller), and the GroupPolicy module is listed. Both facts confirm the AD/GPO audit path is valid; if the host is not a domain controller or the module is absent, use the local policy fallback in step-03 through step-06."
    req_02: "Check the 'Maximum password age' setting in the Default Domain Policy GPO using command: Get-ADDefaultDomainPasswordPolicy | Select-Object MaxPasswordAge. Expected result: MaxPasswordAge is greater than 0 days and less than or equal to 365 days (e.g., 365.00:00:00 or less, but not 00:00:00 or unlimited)."
    req_03: "Check the 'Maximum password age' setting via the local security policy using command: net accounts. Expected result: 'Maximum password age (days)' is a value between 1 and 365, not 'Unlimited' or 0."
    req_04: |
      Check the 'Maximum password age' setting via secedit export using command: secedit /export /cfg $env:TEMP\\secpol.cfg; Get-Content $env:TEMP\\secpol.cfg | Select-String 'MaximumPasswordAge'. Expected result: MaximumPasswordAge is set to a value between 1 and 365.
    req_05: |
      Check the 'Maximum password age' setting via registry using command: Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters' -Name 'MaximumPasswordAge' -ErrorAction SilentlyContinue. Expected result: MaximumPasswordAge is a value between 1 and 365, or the property is absent (indicating default domain policy applies).
    req_06: |
      Check the 'Maximum password age' setting via auditpol or LGPO using command: LGPO.exe /parse /m $env:TEMP\\secpol.cfg | Select-String 'MaximumPasswordAge'. Expected result: MaximumPasswordAge is configured to a value between 1 and 365 days.
    req_07: "Summarize overall compliance status: PASS if all checks confirm Maximum password age is set to 365 or fewer days but not 0; SKIP if the Group Policy module or Active Directory environment is not present; FAIL if the setting exists but is configured to 0 (never expires) or greater than 365 days."
    req_08: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_09: "Create a task named 'Generate audit report' using debug msg with the CIS 1.1.2 format."

  tasks:
    - name: "Initialize data variables"
      set_fact:
        data_01: "Not collected yet"
        status_01: "ERROR"
        details_01: "Not evaluated"
        task_01_name: "Not executed"
        task_01_cmd: "N/A"
        task_01_rc: -1
        data_02: "Not collected yet"
        status_02: "ERROR"
        details_02: "Not evaluated"
        task_02_name: "Not executed"
        task_02_cmd: "N/A"
        task_02_rc: -1
        data_03: "Not collected yet"
        status_03: "ERROR"
        details_03: "Not evaluated"
        task_03_name: "Not executed"
        task_03_cmd: "N/A"
        task_03_rc: -1
        data_04: "Not collected yet"
        status_04: "ERROR"
        details_04: "Not evaluated"
        task_04_name: "Not executed"
        task_04_cmd: "N/A"
        task_04_rc: -1
        data_05: "Not collected yet"
        status_05: "ERROR"
        details_05: "Not evaluated"
        task_05_name: "Not executed"
        task_05_cmd: "N/A"
        task_05_rc: -1
        data_06: "Not collected yet"
        status_06: "ERROR"
        details_06: "Not evaluated"
        task_06_name: "Not executed"
        task_06_cmd: "N/A"
        task_06_rc: -1
        data_07: "Not collected yet"
        status_07: "ERROR"
        details_07: "Not evaluated"
        task_07_name: "Not executed"
        task_07_cmd: "N/A"
        task_07_rc: -1
        data_08: "Not collected yet"
        status_08: "ERROR"
        details_08: "Not evaluated"
        task_08_name: "Not executed"
        task_08_cmd: "N/A"
        task_08_rc: -1
        data_09: "Not collected yet"
        status_09: "PASS"
        details_09: "Report generated"
        task_09_name: "Generate audit report"
        task_09_cmd: "debug msg with CIS 1.1.2 audit results"
        task_09_rc: 0
        cis_result: "ERROR"

    - name: "Req 01 - Confirm domain controller and Group Policy tooling"
      ansible.windows.win_shell: |
        {% raw %}
        try {
          $role = (Get-WmiObject Win32_ComputerSystem).DomainRole
          Write-Output "DomainRole=$role"
        } catch {
          Write-Output "DomainRole=ERROR"
        }
        $mod = Get-Module -ListAvailable GroupPolicy -ErrorAction SilentlyContinue
        if ($mod) {
          Write-Output "GroupPolicyModule=AVAILABLE"
        } else {
          Write-Output "GroupPolicyModule=MISSING"
        }
        {% endraw %}
      register: result_01
      failed_when: false
      changed_when: false

    - name: "Store requirement 01 details"
      set_fact:
        task_01_name: "Confirm domain controller and Group Policy tooling"
        task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole; Get-Module -ListAvailable GroupPolicy"
        task_01_rc: "{{ result_01.rc | default(-1) }}"
        data_01: "{{ result_01.stdout | default('') | trim }}"
        status_01: >-
          {%- set is_dc = ('DomainRole=4' in result_01.stdout) or ('DomainRole=5' in result_01.stdout) -%}
          {%- set has_gpo = 'GroupPolicyModule=AVAILABLE' in result_01.stdout -%}
          {%- if is_dc and has_gpo -%}PASS{%- else -%}SKIP{%- endif -%}
        details_01: >-
          {%- set is_dc = ('DomainRole=4' in result_01.stdout) or ('DomainRole=5' in result_01.stdout) -%}
          {%- set has_gpo = 'GroupPolicyModule=AVAILABLE' in result_01.stdout -%}
          {%- if is_dc and has_gpo -%}Domain controller with Group Policy module available
          {%- else -%}Host is not a domain controller or Group Policy module is missing - fallback to local policy checks{%- endif -%}

    - name: "Req 02 - Check Maximum password age via Get-ADDefaultDomainPasswordPolicy"
      ansible.windows.win_shell: |
        {% raw %}
        try {
          $v = (Get-ADDefaultDomainPasswordPolicy -ErrorAction Stop).MaxPasswordAge
          $d = [int][math]::Floor($v.TotalDays)
          Write-Output "RAW=$v"
          Write-Output "DAYS=$d"
          if ($d -gt 0 -and $d -le 365) {
            Write-Output "POLICY=PASS"
          } else {
            Write-Output "POLICY=FAIL"
          }
        } catch {
          Write-Output "POLICY=ERROR"
          Write-Output "ERRORMSG=$($_.Exception.Message)"
        }
        {% endraw %}
      register: result_02
      failed_when: false
      changed_when: false

    - name: "Store requirement 02 details"
      set_fact:
        task_02_name: "Check Maximum password age via Get-ADDefaultDomainPasswordPolicy"
        task_02_cmd: "Get-ADDefaultDomainPasswordPolicy | Select-Object MaxPasswordAge"
        task_02_rc: "{{ result_02.rc | default(-1) }}"
        data_02: "{{ result_02.stdout | default('') | trim }}"
        status_02: "{{ ('PASS' if 'POLICY=PASS' in result_02.stdout else ('FAIL' if 'POLICY=FAIL' in result_02.stdout else 'ERROR')) | trim }}"
        details_02: "{{ ('MaxPasswordAge is between 1 and 365 days' if 'POLICY=PASS' in result_02.stdout else ('MaxPasswordAge is 0 (never expires) or exceeds 365 days' if 'POLICY=FAIL' in result_02.stdout else 'Get-ADDefaultDomainPasswordPolicy unavailable or failed')) | trim }}"

    - name: "Req 03 - Check Maximum password age via net accounts"
      ansible.windows.win_shell: |
        {% raw %}
        try {
          $out = net accounts 2>&1 | Out-String
          Write-Output $out
          $m = [regex]::Match($out, 'Maximum password age \(days\):\s*(\S+)')
          if ($m.Success) {
            $val = $m.Groups[1].Value
            Write-Output "MAXAGE=$val"
            if ($val -eq 'Unlimited' -or $val -eq 'Never') {
              Write-Output "POLICY=FAIL"
            } else {
              $n = [int]$val
              if ($n -gt 0 -and $n -le 365) {
                Write-Output "POLICY=PASS"
              } else {
                Write-Output "POLICY=FAIL"
              }
            }
          } else {
            Write-Output "POLICY=ERROR"
          }
        } catch {
          Write-Output "POLICY=ERROR"
        }
        {% endraw %}
      register: result_03
      failed_when: false
      changed_when: false

    - name: "Store requirement 03 details"
      set_fact:
        task_03_name: "Check Maximum password age via net accounts"
        task_03_cmd: "net accounts"
        task_03_rc: "{{ result_03.rc | default(-1) }}"
        data_03: "{{ result_03.stdout | default('') | trim }}"
        status_03: "{{ ('PASS' if 'POLICY=PASS' in result_03.stdout else ('FAIL' if 'POLICY=FAIL' in result_03.stdout else 'ERROR')) | trim }}"
        details_03: "{{ ('Maximum password age (days) is between 1 and 365' if 'POLICY=PASS' in result_03.stdout else ('Maximum password age is Unlimited or 0 or greater than 365' if 'POLICY=FAIL' in result_03.stdout else 'Unable to parse net accounts output')) | trim }}"

    - name: "Req 04 - Check Maximum password age via secedit export"
      ansible.windows.win_shell: |
        {% raw %}
        $secpol = Join-Path $env:TEMP 'secpol.cfg'
        secedit /export /cfg $secpol | Out-Null
        $content = Get-Content $secpol -ErrorAction SilentlyContinue
        if (-not $content) {
          Write-Output "POLICY=ERROR"
        } else {
          $content | Select-String 'MaximumPasswordAge' | ForEach-Object { Write-Output $_.Line }
          $m = [regex]::Match(($content -join "`n"), 'MaximumPasswordAge\s*=\s*(-?\d+)')
          if ($m.Success) {
            $n = [int]$m.Groups[1].Value
            if ($n -gt 0 -and $n -le 365) {
              Write-Output "POLICY=PASS"
            } else {
              Write-Output "POLICY=FAIL"
            }
          } else {
            Write-Output "POLICY=ERROR"
          }
        }
        {% endraw %}
      register: result_04
      failed_when: false
      changed_when: false

    - name: "Store requirement 04 details"
      set_fact:
        task_04_name: "Check Maximum password age via secedit export"
        task_04_cmd: |
          secedit /export /cfg $env:TEMP\\secpol.cfg; Get-Content $env:TEMP\\secpol.cfg | Select-String 'MaximumPasswordAge'
        task_04_rc: "{{ result_04.rc | default(-1) }}"
        data_04: "{{ result_04.stdout | default('') | trim }}"
        status_04: "{{ ('PASS' if 'POLICY=PASS' in result_04.stdout else ('FAIL' if 'POLICY=FAIL' in result_04.stdout else 'ERROR')) | trim }}"
        details_04: "{{ ('MaximumPasswordAge in secedit export is between 1 and 365' if 'POLICY=PASS' in result_04.stdout else ('MaximumPasswordAge is 0, -1 (unlimited) or exceeds 365' if 'POLICY=FAIL' in result_04.stdout else 'Unable to parse secedit output')) | trim }}"

    - name: "Req 05 - Check Maximum password age via registry Netlogon Parameters"
      ansible.windows.win_shell: |
        {% raw %}
        try {
          $p = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters' -ErrorAction SilentlyContinue
          if ($p -and $null -ne $p.MaximumPasswordAge) {
            $n = [int]$p.MaximumPasswordAge
            Write-Output "MAXAGE=$n"
            if ($n -gt 0 -and $n -le 365) {
              Write-Output "POLICY=PASS"
            } else {
              Write-Output "POLICY=FAIL"
            }
          } else {
            Write-Output "MAXAGE=ABSENT"
            Write-Output "POLICY=PASS"
          }
        } catch {
          Write-Output "POLICY=ERROR"
        }
        {% endraw %}
      register: result_05
      failed_when: false
      changed_when: false

    - name: "Store requirement 05 details"
      set_fact:
        task_05_name: "Check Maximum password age via registry Netlogon Parameters"
        task_05_cmd: |
          Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Netlogon\\Parameters' -Name 'MaximumPasswordAge'
        task_05_rc: "{{ result_05.rc | default(-1) }}"
        data_05: "{{ result_05.stdout | default('') | trim }}"
        status_05: "{{ ('PASS' if 'POLICY=PASS' in result_05.stdout else ('FAIL' if 'POLICY=FAIL' in result_05.stdout else 'ERROR')) | trim }}"
        details_05: "{{ ('MaximumPasswordAge is between 1 and 365 or absent (default domain policy applies)' if 'POLICY=PASS' in result_05.stdout else ('MaximumPasswordAge is 0 or exceeds 365' if 'POLICY=FAIL' in result_05.stdout else 'Unable to read registry value')) | trim }}"

    - name: "Req 06 - Check Maximum password age via LGPO parse"
      ansible.windows.win_shell: |
        {% raw %}
        $lgpo = Get-Command LGPO.exe -ErrorAction SilentlyContinue
        if (-not $lgpo) {
          Write-Output "LGPO=NOT_AVAILABLE"
          Write-Output "POLICY=SKIP"
        } else {
          $secpol = Join-Path $env:TEMP 'secpol.cfg'
          if (-not (Test-Path $secpol)) {
            Write-Output "SECPOL=NOT_EXPORTED"
            Write-Output "POLICY=SKIP"
          } else {
            $out = & LGPO.exe /parse /m $secpol 2>&1 | Out-String
            Write-Output $out
            $m = [regex]::Match($out, 'MaximumPasswordAge\D+(-?\d+)')
            if ($m.Success) {
              $n = [int]$m.Groups[1].Value
              if ($n -gt 0 -and $n -le 365) {
                Write-Output "POLICY=PASS"
              } else {
                Write-Output "POLICY=FAIL"
              }
            } else {
              Write-Output "POLICY=ERROR"
            }
          }
        }
        {% endraw %}
      register: result_06
      failed_when: false
      changed_when: false

    - name: "Store requirement 06 details"
      set_fact:
        task_06_name: "Check Maximum password age via LGPO parse"
        task_06_cmd: |
          LGPO.exe /parse /m $env:TEMP\\secpol.cfg | Select-String 'MaximumPasswordAge'
        task_06_rc: "{{ result_06.rc | default(-1) }}"
        data_06: "{{ result_06.stdout | default('') | trim }}"
        status_06: "{{ ('PASS' if 'POLICY=PASS' in result_06.stdout else ('FAIL' if 'POLICY=FAIL' in result_06.stdout else ('SKIP' if 'POLICY=SKIP' in result_06.stdout else 'ERROR'))) | trim }}"
        details_06: "{{ ('MaximumPasswordAge via LGPO parse is between 1 and 365' if 'POLICY=PASS' in result_06.stdout else ('MaximumPasswordAge is 0 or exceeds 365' if 'POLICY=FAIL' in result_06.stdout else ('LGPO.exe or secpol.cfg unavailable' if 'POLICY=SKIP' in result_06.stdout else 'Unable to parse LGPO output'))) | trim }}"

    - name: "Req 07 - Summarize overall compliance status"
      set_fact:
        task_07_name: "Summarize overall compliance status for Maximum password age"
        task_07_cmd: "N/A - computed from prior requirement checks"
        task_07_rc: 0
        data_07: "status_01={{ status_01 | trim }} status_02={{ status_02 | trim }} status_03={{ status_03 | trim }} status_04={{ status_04 | trim }} status_05={{ status_05 | trim }} status_06={{ status_06 | trim }}"
        status_07: >-
          {%- if status_01 | trim == 'SKIP' -%}SKIP
          {%- elif status_02 | trim == 'PASS' -%}PASS
          {%- elif status_02 | trim == 'FAIL' -%}FAIL
          {%- elif status_03 | trim == 'PASS' or status_04 | trim == 'PASS' or status_05 | trim == 'PASS' -%}PASS
          {%- elif status_03 | trim == 'FAIL' or status_04 | trim == 'FAIL' or status_05 | trim == 'FAIL' -%}FAIL
          {%- else -%}ERROR
          {%- endif -%}
        details_07: >-
          {%- if status_01 | trim == 'SKIP' -%}Host has no domain context - skipped
          {%- elif status_02 | trim == 'PASS' -%}AD Default Domain Policy MaxPasswordAge within 1-365 days
          {%- elif status_02 | trim == 'FAIL' -%}AD Default Domain Policy MaxPasswordAge is 0 (never expires) or exceeds 365 days
          {%- elif status_03 | trim == 'PASS' or status_04 | trim == 'PASS' or status_05 | trim == 'PASS' -%}Local policy corroborates MaxPasswordAge within 1-365 days
          {%- elif status_03 | trim == 'FAIL' or status_04 | trim == 'FAIL' or status_05 | trim == 'FAIL' -%}Local policy indicates MaxPasswordAge is 0 or exceeds 365 days
          {%- else -%}Could not determine compliance status
          {%- endif -%}

    - name: "Req 08 - Store final audit result in cis_result"
      set_fact:
        cis_result: "{{ status_07 | default('ERROR') | trim }}"
        task_08_name: "Store final audit result in cis_result"
        task_08_cmd: "set_fact - cis_result derived from status_07"
        task_08_rc: 0
        data_08: "cis_result={{ status_07 | default('ERROR') | trim }}"
        status_08: "PASS"
        details_08: "cis_result variable successfully set from summarized compliance status"

    - name: "Generate audit report"
      debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.2"
          - "Reference: CIS Benchmark checkpoint 1.1.2"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: {{ task_04_name | default('Not recorded') }}"
          - "  Command: {{ task_04_cmd | default('N/A') }}"
          - "  Exit code: {{ task_04_rc | default(-1) }}"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: {{ task_05_name | default('Not recorded') }}"
          - "  Command: {{ task_05_cmd | default('N/A') }}"
          - "  Exit code: {{ task_05_rc | default(-1) }}"
          - "  Data: {{ data_05 | default('') | trim }}"
          - "  Status: {{ status_05 | default('ERROR') | trim }}"
          - "  Details: {{ details_05 | default('') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: {{ task_06_name | default('Not recorded') }}"
          - "  Command: {{ task_06_cmd | default('N/A') }}"
          - "  Exit code: {{ task_06_rc | default(-1) }}"
          - "  Data: {{ data_06 | default('') | trim }}"
          - "  Status: {{ status_06 | default('ERROR') | trim }}"
          - "  Details: {{ details_06 | default('') | trim }}"
          - ""
          - "REQUIREMENT 07 - {{ req_07 }}:"
          - "  Task: {{ task_07_name | default('Not recorded') }}"
          - "  Command: {{ task_07_cmd | default('N/A') }}"
          - "  Exit code: {{ task_07_rc | default(-1) }}"
          - "  Data: {{ data_07 | default('') | trim }}"
          - "  Status: {{ status_07 | default('ERROR') | trim }}"
          - "  Details: {{ details_07 | default('') | trim }}"
          - ""
          - "REQUIREMENT 08 - {{ req_08 }}:"
          - "  Task: {{ task_08_name | default('Not recorded') }}"
          - "  Command: {{ task_08_cmd | default('N/A') }}"
          - "  Exit code: {{ task_08_rc | default(-1) }}"
          - "  Data: {{ data_08 | default('') | trim }}"
          - "  Status: {{ status_08 | default('ERROR') | trim }}"
          - "  Details: {{ details_08 | default('') | trim }}"
          - ""
          - "REQUIREMENT 09 - {{ req_09 }}:"
          - "  Task: {{ task_09_name | default('Not recorded') }}"
          - "  Command: {{ task_09_cmd | default('N/A') }}"
          - "  Exit code: {{ task_09_rc | default(-1) }}"
          - "  Data: {{ data_09 | default('') | trim }}"
          - "  Status: {{ status_09 | default('PASS') | trim }}"
          - "  Details: {{ details_09 | default('Report generated') | trim }}"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: {{ details_07 | default('Not evaluated') | trim }}"
          - "========================================================"