---
- name: "Remediate CIS checkpoint 1.1.2 - Ensure Maximum password age is set to 365 or fewer days, but not 0"
  hosts: 192.168.122.20
  # Windows: privilege is handled at the WinRM connection level.
  # Do NOT add become: yes.
  gather_facts: false
  vars:
    playbook_name: "cis_1_1_2_max_password_age"
    # Use forward slashes to avoid YAML/JSON backslash escaping issues when
    # the path is serialized to the Windows PowerShell wrapper.
    backup_dir: "C:/Windows/Temp/ai-playbooks-backup/{{ playbook_name }}"
    max_password_age_days: "365"
    req_01: |
      Apply the Maximum password age policy setting to 365 or fewer days, but not 0, via Group Policy at Computer Configuration\\Policies\\Windows Settings\\Security Settings\\Account Policies\\Password Policy\\Maximum password age. Expected result: Maximum password age is configured to a value between 1 and 365 days.
    req_02: "Verify the Maximum password age setting is configured to 365 or fewer days, but not 0, by reviewing the effective password policy via Group Policy or running `net accounts` on a domain-joined machine. Expected result: Maximum password age shows a value of 365 or fewer days and is not 0 or Unlimited."
    req_03: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir }}"
        state: directory
      tags: [snapshot]

    - name: "Snapshot - Save current Maximum password age value"
      ansible.windows.win_shell: |
        $output = net accounts 2>&1 | Out-String
        $maxLine = ($output -split "`r?`n" | Where-Object { $_ -match 'Maximum password age' } | Select-Object -First 1)
        $val = 'Unlimited'
        if ($maxLine -match ':\s*(\d+)') { $val = $matches[1] }
        Set-Content -Path '{{ backup_dir }}/max_password_age_before.txt' -Value $val -Force
        Write-Output "SNAPSHOT_VALUE=$val"
      register: _snapshot_value
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Export current security policy"
      ansible.windows.win_shell: |
        secedit /export /cfg "{{ backup_dir }}/secpol_before.cfg" /quiet
        if (Test-Path "{{ backup_dir }}/secpol_before.cfg") { Write-Output "SNAPSHOT_OK" } else { Write-Output "SNAPSHOT_FAIL" }
      register: _snapshot_secpol
      failed_when: false
      changed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Initialize data variables"
          set_fact:
            data_01: "Not collected yet"
            status_01: "ERROR"
            details_01: "Not evaluated"
            data_02: "Not collected yet"
            status_02: "ERROR"
            details_02: "Not evaluated"
            data_03: "Not collected yet"
            status_03: "ERROR"
            details_03: "Not evaluated"
            task_01_name: "Not executed"
            task_01_cmd: "N/A"
            task_01_rc: -1
            task_02_name: "Not executed"
            task_02_cmd: "N/A"
            task_02_rc: -1
            task_03_name: "Store final remediation result in cis_result"
            task_03_cmd: "set_fact cis_result"
            task_03_rc: 0
          tags: [execute]

        - name: "Detect Windows server role"
          ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
          register: _role_detection
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Set server role facts"
          set_fact:
            is_dc: "{{ (_role_detection.stdout | default('0') | trim) in ['4', '5'] }}"
            is_member: "{{ (_role_detection.stdout | default('0') | trim) in ['1', '2', '3'] }}"
          failed_when: false
          tags: [execute]

        - name: "Req 01 - Apply Maximum password age on Domain Controller"
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            try {
              Import-Module ActiveDirectory -ErrorAction Stop
              $domainDN = (Get-ADDomain).DistinguishedName
              $current = [int](Get-ADDefaultDomainPasswordPolicy -Identity $domainDN).MaxPasswordAge.Days
              Write-Output "CURRENT=$current"
              if ($current -gt {{ max_password_age_days }} -or $current -eq 0) {
                Set-ADDefaultDomainPasswordPolicy -Identity $domainDN -MaxPasswordAge (New-TimeSpan -Days {{ max_password_age_days }})
                Write-Output "DC_APPLY_OK"
              } else {
                Write-Output "DC_ALREADY_OK"
              }
              exit 0
            } catch {
              Write-Output "DC_APPLY_FAIL: $($_.Exception.Message)"
              exit 1
            }
          register: _dc_apply
          when: is_dc | bool
          failed_when: false
          changed_when: "'DC_APPLY_OK' in (_dc_apply.stdout | default(''))"
          tags: [execute]

        - name: "Req 01 - Apply Maximum password age on Member Server"
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $cfg = 'C:\Windows\Temp\cis_1_1_2_member.cfg'
            $db  = 'C:\Windows\Temp\cis_1_1_2_member.sdb'
            secedit /export /cfg $cfg /quiet | Out-Null
            Start-Sleep -Seconds 1
            $content = Get-Content -LiteralPath $cfg -Raw
            Write-Output "BEFORE:" + (($content -split "`r?`n" | Where-Object { $_ -match 'MaximumPasswordAge' }) -join ';')
            if ($content -match '(?im)^\s*MaximumPasswordAge\s*=') {
              $content = $content -replace '(?im)^\s*MaximumPasswordAge\s*=.*$', "MaximumPasswordAge = {{ max_password_age_days }}"
            } else {
              $content = $content -replace '(?im)^(\[System Access\]\s*\r?\n)', ('$1' + "MaximumPasswordAge = {{ max_password_age_days }}" + "`r`n")
            }
            Set-Content -LiteralPath $cfg -Value $content -Force
            Write-Output "AFTER:" + (($content -split "`r?`n" | Where-Object { $_ -match 'MaximumPasswordAge' }) -join ';')
            secedit /configure /db $db /cfg $cfg /areas SECURITYPOLICY /quiet
            Remove-Item -LiteralPath $cfg -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $db -Force -ErrorAction SilentlyContinue
            Write-Output "MEMBER_APPLY_OK"
            exit 0
          register: _member_apply
          when: is_member | bool
          failed_when: false
          changed_when: "'MEMBER_APPLY_OK' in (_member_apply.stdout | default(''))"
          tags: [execute]

        - name: "Store requirement 01 details"
          set_fact:
            task_01_name: "Apply Maximum password age policy (DC via Set-ADDefaultDomainPasswordPolicy, Member via secedit)"
            task_01_cmd: "Set-ADDefaultDomainPasswordPolicy -MaxPasswordAge OR secedit /configure /areas SECURITYPOLICY"
            task_01_rc: >-
              {% if is_dc | bool %}{{ _dc_apply.rc | default(-1) }}
              {% elif is_member | bool %}{{ _member_apply.rc | default(-1) }}
              {% else %}-1{% endif %}
            data_01: >-
              {% if is_dc | bool %}{{ _dc_apply.stdout | default('') | trim }}
              {% elif is_member | bool %}{{ _member_apply.stdout | default('') | trim }}
              {% else %}Server role not applicable{% endif %}
            status_01: >-
              {% if is_dc | bool %}{{ 'PASS' if (_dc_apply.rc | default(1)) == 0 else 'FAIL' }}
              {% elif is_member | bool %}{{ 'PASS' if (_member_apply.rc | default(1)) == 0 else 'FAIL' }}
              {% else %}SKIP{% endif %}
            details_01: >-
              {% if is_dc | bool %}{{ 'Domain Controller policy applied' if (_dc_apply.rc | default(1)) == 0 else ('Domain Controller apply failed: ' + (_dc_apply.stdout | default(''))) }}
              {% elif is_member | bool %}{{ 'Member Server security policy applied via secedit' if (_member_apply.rc | default(1)) == 0 else ('Member Server apply failed: ' + (_member_apply.stdout | default(''))) }}
              {% else %}Server role not applicable (DomainRole not 1-5){% endif %}
          failed_when: false
          tags: [execute]

        - name: "Req 02 - Verify Maximum password age via net accounts"
          ansible.windows.win_shell: |
            $output = (net accounts 2>&1 | Out-String)
            Write-Output $output
            $maxLine = ($output -split "`r?`n" | Where-Object { $_ -match 'Maximum password age' } | Select-Object -First 1)
            $val = 'Unlimited'
            if ($maxLine -match ':\s*(\d+)') { $val = [int]$matches[1] }
            if ($val -is [int] -and $val -ge 1 -and $val -le {{ max_password_age_days }}) {
              Write-Output "VERIFY_PASS"
            } else {
              Write-Output "VERIFY_FAIL=$val"
            }
          register: _verify_result
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Store requirement 02 details"
          set_fact:
            task_02_name: "Verify Maximum password age via net accounts"
            task_02_cmd: "net accounts"
            task_02_rc: "{{ _verify_result.rc | default(-1) }}"
            data_02: "{{ _verify_result.stdout | default('') | trim }}"
            status_02: "{{ ('PASS' if 'VERIFY_PASS' in (_verify_result.stdout | default('')) else 'FAIL') | trim }}"
            details_02: "{{ ('Maximum password age is 1-365 days and not 0 or Unlimited' if 'VERIFY_PASS' in (_verify_result.stdout | default('')) else 'Maximum password age is not compliant (must be 1-365 days, not 0 or Unlimited)') | trim }}"
          failed_when: false
          tags: [execute]

        - name: "Req 03 - Store final remediation result in cis_result"
          set_fact:
            cis_result: "{{ status_02 | default('ERROR') | trim }}"
            data_03: "cis_result={{ status_02 | default('ERROR') | trim }}"
            status_03: "{{ status_02 | default('ERROR') | trim }}"
            details_03: "cis_result derived from requirement 02 status"
          failed_when: false
          tags: [execute]

        - name: "Generate remediation report"
          debug:
            msg:
              - "REMEDIATION REPORT — CIS 1.1.2"
              - "Reference: CIS Benchmark checkpoint 1.1.2"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('') | trim }}"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('Not evaluated') | trim }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Check if backup directory exists"
          ansible.windows.win_stat:
            path: "{{ backup_dir }}"
          register: _restore_backup_stat
          failed_when: false
          tags: [restore]

        - name: "Restore - Check if security policy backup exists"
          ansible.windows.win_stat:
            path: "{{ backup_dir }}/secpol_before.cfg"
          register: _restore_secpol_stat
          failed_when: false
          when: _restore_backup_stat.stat.exists | default(false)
          tags: [restore]

        - name: "Restore - Reapply security policy from backup on Member Servers"
          ansible.windows.win_shell: |
            $role = (Get-WmiObject Win32_ComputerSystem).DomainRole
            if ($role -in 1,2,3) {
              secedit /configure /db C:\Windows\Temp\cis_1_1_2_restore.sdb /cfg "{{ backup_dir }}/secpol_before.cfg" /areas SECURITYPOLICY /quiet
              Remove-Item -LiteralPath C:\Windows\Temp\cis_1_1_2_restore.sdb -Force -ErrorAction SilentlyContinue
              Write-Output "MEMBER_RESTORE_OK"
            } else {
              Write-Output "MEMBER_RESTORE_SKIP"
            }
          when:
            - _restore_backup_stat.stat.exists | default(false)
            - _restore_secpol_stat.stat.exists | default(false)
          failed_when: false
          changed_when: false
          tags: [restore]

        - name: "Restore - Reapply original MaxPasswordAge on Domain Controllers"
          ansible.windows.win_shell: |
            $role = (Get-WmiObject Win32_ComputerSystem).DomainRole
            if ($role -in 4,5) {
              $file = '{{ backup_dir }}/max_password_age_before.txt'
              if (Test-Path $file) {
                $val = (Get-Content -LiteralPath $file -Raw).Trim()
                if ($val -match '^\d+$') {
                  Import-Module ActiveDirectory -ErrorAction SilentlyContinue
                  Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DistinguishedName -MaxPasswordAge (New-TimeSpan -Days ([int]$val))
                  Write-Output "DC_RESTORE_OK=$val"
                } else {
                  Write-Output "DC_RESTORE_SKIP=$val"
                }
              } else {
                Write-Output "DC_RESTORE_NO_FILE"
              }
            } else {
              Write-Output "DC_RESTORE_SKIP_NOT_DC"
            }
          when: _restore_backup_stat.stat.exists | default(false)
          failed_when: false
          changed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.windows.win_file:
            path: "{{ backup_dir }}"
            state: absent
          when: _restore_backup_stat.stat.exists | default(false)
          failed_when: false
          tags: [restore]