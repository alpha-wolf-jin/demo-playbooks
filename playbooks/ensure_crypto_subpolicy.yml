---
- name: "SOP playbook 'ensure_crypto_subpolicy' - Ensures a crypto subpolicy module exists and is applied"
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    playbook_name: "ensure_crypto_subpolicy"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    # Required input variables
    target_server: ""               # MUST be provided via extra_vars
    crypto_policy: "DEFAULT"
    subpolicy_name: "NO-SHA1"
    subpolicy_lines: "hash = -SHA1,sign = -*-SHA1,sha1_in_certs = 0"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Check if subpolicy file exists"
      ansible.builtin.stat:
        path: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
      register: _snap_stat
      tags: [snapshot]

    - name: "Snapshot - Backup subpolicy file if it exists"
      ansible.builtin.copy:
        src: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
        dest: "{{ backup_dir }}/{{ subpolicy_name }}.pmod"
        remote_src: true
        force: false
      when: _snap_stat.stat.exists
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Record whether subpolicy file existed"
      ansible.builtin.copy:
        content: "{{ _snap_stat.stat.exists }}"
        dest: "{{ backup_dir }}/file_existed"
        force: false
      tags: [snapshot]

    - name: "Snapshot - Get current crypto policy"
      ansible.builtin.command: update-crypto-policies --show
      register: _snap_policy
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save current crypto policy"
      ansible.builtin.copy:
        content: "{{ _snap_policy.stdout | trim }}"
        dest: "{{ backup_dir }}/policy.orig"
        force: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Validate inputs - assert target_server is provided"
          ansible.builtin.assert:
            that:
              - target_server != ''
            fail_msg: "target_server must be provided and must not be empty"
          tags: [execute]

        - name: "Step 01 - Gather subpolicy file stat"
          ansible.builtin.stat:
            path: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
          register: _file_stat
          tags: [execute]

        - name: "Compute expected lines from subpolicy_lines"
          ansible.builtin.set_fact:
            _expected_lines: "{{ subpolicy_lines.split(',') | map('trim') | select() | list | sort }}"
          tags: [execute]

        - name: "Step 02 - Initialize file-needs-create flag to false"
          ansible.builtin.set_fact:
            _file_needs_create: false
          tags: [execute]

        - name: "Step 03 - Does the subpolicy file exist? (branch to step 04 if TRUE, step 05 if FALSE)"
          ansible.builtin.meta: noop
          when: _file_stat.stat.exists
          tags: [execute]

        - name: "Step 04 - Read existing subpolicy file (if exists)"
          ansible.builtin.slurp:
            src: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
          register: _file_content_raw
          when: _file_stat.stat.exists
          tags: [execute]

        - name: "Step 05 - Set file-needs-create to true (file does not exist)"
          ansible.builtin.set_fact:
            _file_needs_create: true
          when: not _file_stat.stat.exists
          tags: [execute]

        - name: "Step 06 - Compare file content with expected lines (if file exists)"
          ansible.builtin.set_fact:
            _file_content_lines: >-
              {{ (_file_content_raw.content | b64decode).splitlines()
                 | map('trim') | select() | list | sort }}
            _file_content_match: >-
              {{ ( (_file_content_raw.content | b64decode).splitlines()
                   | map('trim') | select() | list | sort ) == _expected_lines }}
            _file_needs_create: >-
              {{ _file_needs_create or
                 ( (_file_content_raw.content | b64decode).splitlines()
                   | map('trim') | select() | list | sort ) != _expected_lines }}
          when:
            - _file_content_raw.content is defined
          tags: [execute]

        - name: "Step 07 - Get current system-wide crypto policy"
          ansible.builtin.command: update-crypto-policies --show
          register: _current_policy_raw
          changed_when: false
          tags: [execute]

        - name: "Step 08 - Check if subpolicy is already applied"
          ansible.builtin.set_fact:
            _policy_already_applied: "{{ subpolicy_name in _current_policy_raw.stdout.split(':') }}"
          tags: [execute]

        - name: "Step 09 - Aggregate pre-checks"
          ansible.builtin.set_fact:
            _file_needs_create: "{{ _file_needs_create }}"
            _policy_already_applied: "{{ _policy_already_applied }}"
          tags: [execute]

        - name: "Step 10 - Are both file and policy already correct? (set skip flag)"
          ansible.builtin.set_fact:
            _skip_actions: "{{ not _file_needs_create and _policy_already_applied }}"
          tags: [execute]

        - name: "Steps 11-15 - Action block when changes are needed"
          when: not _skip_actions
          block:
            - name: "Step 11 - Ensure subpolicy directory exists"
              ansible.builtin.file:
                path: "/etc/crypto-policies/policies/modules"
                state: directory
                mode: '0755'
              tags: [execute]

            - name: "Step 11 - Write subpolicy .pmod file"
              ansible.builtin.copy:
                content: "{{ subpolicy_lines.split(',') | map('trim') | join('\n') }}\n"
                dest: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
                owner: root
                group: root
                mode: '0644'
              tags: [execute]

            - name: "Step 12 - Mark file creation performed"
              ansible.builtin.set_fact:
                _file_created: true
              tags: [execute]

            - name: "Step 13 - Apply system-wide crypto policy"
              ansible.builtin.command: "update-crypto-policies --set {{ crypto_policy }}:{{ subpolicy_name }}"
              tags: [execute]

            - name: "Step 14 - Mark policy application performed"
              ansible.builtin.set_fact:
                _policy_applied: true
              tags: [execute]

            - name: "Step 15 - Reboot the server"
              ansible.builtin.reboot:
                reboot_timeout: 180
              tags: [execute]

        - name: "Verify subpolicy file exists after execution"
          ansible.builtin.stat:
            path: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
          register: _verify_file_stat
          tags: [execute]

        - name: "Verify subpolicy file content"
          ansible.builtin.slurp:
            src: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
          register: _verify_slurp
          when: _verify_file_stat.stat.exists
          tags: [execute]

        - name: "Verify subpolicy is applied in crypto policy"
          ansible.builtin.command: update-crypto-policies --show
          register: _verify_policy_raw
          changed_when: false
          tags: [execute]

        - name: "Set verification facts"
          ansible.builtin.set_fact:
            _file_correct: >-
              {{ _verify_file_stat.stat.exists
                 and ( (_verify_slurp.content | b64decode).splitlines()
                       | map('trim') | select() | list | sort ) == _expected_lines }}
            _policy_correct: "{{ subpolicy_name in _verify_policy_raw.stdout.split(':') }}"
          tags: [execute]

        - name: "Assert that subpolicy and policy are correct"
          ansible.builtin.assert:
            that:
              - _file_correct | bool
              - _policy_correct | bool
            fail_msg: "Subpolicy or crypto policy verification failed"
            success_msg: "Verification succeeded - subpolicy and policy are correct"
          tags: [execute]

        - name: "Step 16 - Emit success result block"
          ansible.builtin.debug:
            msg:
              - "<result>"
              - "file_status: {{ 'created' if _file_created | default(false) else 'already present' }}"
              - "policy_status: {{ 'applied' if _policy_applied | default(false) else 'already in effect' }}"
              - "</result>"
          tags: [execute]

      rescue:
        - name: "Step 17 - Emit error and fail"
          ansible.builtin.debug:
            msg:
              - "<result>"
              - "ERROR: ensure_crypto_subpolicy failed"
              - "</result>"

      always:
        - name: "Restore - Check if subpolicy backup exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/{{ subpolicy_name }}.pmod"
          register: _restore_file_check
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore subpolicy file from backup"
          ansible.builtin.copy:
            src: "{{ backup_dir }}/{{ subpolicy_name }}.pmod"
            dest: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
            remote_src: true
          when: _restore_file_check.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Read existence marker"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/file_existed"
          register: _restore_existed
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove subpolicy file if it was created by this playbook"
          ansible.builtin.file:
            path: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
            state: absent
          when:
            - _restore_existed.content is defined
            - (_restore_existed.content | b64decode | trim) == 'False'
          failed_when: false
          tags: [restore]

        - name: "Restore - Read original crypto policy"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/policy.orig"
          register: _restore_policy_content
          failed_when: false
          tags: [restore]

        - name: "Restore - Apply original crypto policy"
          ansible.builtin.shell: "update-crypto-policies --set {{ _restore_policy_content.content | b64decode | trim }}"
          when:
            - _restore_policy_content.content is defined
            - (_restore_policy_content.content | b64decode | trim) | length > 0
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]