---
- name: "SOP playbook 'ensure_crypto_subpolicy' (ACTION — changes system state): Ensures a specified crypto subpolicy module (.pmod) exists with required lines and the system-wide crypto policy includes it. Creates/modifies the file and applies the policy if necessary, then reboots."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    playbook_name: "ensure_crypto_subpolicy"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    target_server: ""
    crypto_policy: "DEFAULT"
    subpolicy_name: "NO-SHA1"
    subpolicy_lines: "hash = -SHA1,sign = -*-SHA1,sha1_in_certs = 0"
    _expected_lines: "{{ subpolicy_lines.split(',') | map('trim') | list }}"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Check subpolicy file existence"
      ansible.builtin.stat:
        path: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
      register: _snap_subpolicy_stat
      tags: [snapshot]

    - name: "Snapshot - Backup subpolicy file if exists"
      ansible.builtin.copy:
        src: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
        dest: "{{ backup_dir }}/{{ subpolicy_name }}.pmod.bak"
        remote_src: true
        force: false
      when: _snap_subpolicy_stat.stat.exists
      tags: [snapshot]

    - name: "Snapshot - Record existence marker"
      ansible.builtin.copy:
        content: "{{ _snap_subpolicy_stat.stat.exists | default(false) | string }}"
        dest: "{{ backup_dir }}/subpolicy_existed"
        force: false
      tags: [snapshot]

    - name: "Snapshot - Save current crypto policy"
      ansible.builtin.command: update-crypto-policies --show
      register: _snap_policy
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Persist policy to file"
      ansible.builtin.copy:
        content: "{{ _snap_policy.stdout | trim }}"
        dest: "{{ backup_dir }}/policy_original.txt"
        force: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Validate required variable target_server is not empty"
          ansible.builtin.assert:
            that:
              - target_server != ''
            fail_msg: "target_server must be provided and must not be empty"
          tags: [execute]

        - name: "Req 02 - Gather subpolicy file stat"
          ansible.builtin.stat:
            path: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
          register: _file_stat
          tags: [execute]

        - name: "Req 03 - Initialize file-needs-create flag"
          ansible.builtin.set_fact:
            _file_needs_create: false
          tags: [execute]

        - name: "Req 05 - Read existing subpolicy file"
          ansible.builtin.slurp:
            src: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
          register: _file_content_raw
          when: _file_stat.stat.exists
          tags: [execute]

        - name: "Req 06 - Set file-needs-create to true (file does not exist)"
          ansible.builtin.set_fact:
            _file_needs_create: true
          when: not _file_stat.stat.exists
          tags: [execute]

        - name: "Req 07 - Compare file content with expected lines"
          ansible.builtin.set_fact:
            _file_content_match: "{{ ((_file_content_raw.content | b64decode).splitlines() | map('trim') | reject('eq','') | list | sort) == (_expected_lines | sort) }}"
            _file_needs_create: "{{ not ((_file_content_raw.content | b64decode).splitlines() | map('trim') | reject('eq','') | list | sort) == (_expected_lines | sort) }}"
          when: _file_stat.stat.exists
          tags: [execute]

        - name: "Req 08 - Get current system-wide crypto policy"
          ansible.builtin.command: update-crypto-policies --show
          register: _current_policy_raw
          changed_when: false
          tags: [execute]

        - name: "Req 09 - Check if subpolicy is already applied"
          ansible.builtin.set_fact:
            _policy_already_applied: "{{ subpolicy_name in _current_policy_raw.stdout.split(':') }}"
          tags: [execute]

        - name: "Req 10 - Aggregate pre-checks"
          ansible.builtin.set_fact:
            _file_needs_create: "{{ _file_needs_create }}"
            _policy_already_applied: "{{ _policy_already_applied }}"
          tags: [execute]

        - name: "Req 11 - Decide if both file and policy already correct"
          ansible.builtin.set_fact:
            _skip_actions: "{{ not _file_needs_create and _policy_already_applied }}"
          tags: [execute]

        - name: "Initialize action flags"
          ansible.builtin.set_fact:
            _file_created: false
            _policy_applied: false
          tags: [execute]

        - name: "Req 12 - Write subpolicy .pmod file"
          ansible.builtin.copy:
            content: "{{ subpolicy_lines.split(',') | map('trim') | join('\n') }}"
            dest: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
            owner: root
            group: root
            mode: '0644'
          when: _file_needs_create
          tags: [execute]

        - name: "Req 13 - Mark file creation performed"
          ansible.builtin.set_fact:
            _file_created: true
          when: _file_needs_create
          tags: [execute]

        - name: "Req 14 - Apply system-wide crypto policy"
          ansible.builtin.command: "update-crypto-policies --set {{ crypto_policy }}:{{ subpolicy_name }}"
          when: not _skip_actions
          tags: [execute]

        - name: "Req 15 - Mark policy application performed"
          ansible.builtin.set_fact:
            _policy_applied: true
          when: not _skip_actions
          tags: [execute]

        - name: "Req 16 - Reboot the server"
          ansible.builtin.reboot:
            reboot_timeout: 180
          when: not _skip_actions
          tags: [execute]

        - name: "Verify subpolicy file correctness"
          ansible.builtin.stat:
            path: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
          register: _verify_file_stat
          tags: [execute]

        - name: "Verify crypto policy includes subpolicy"
          ansible.builtin.command: update-crypto-policies --show
          register: _verify_policy_raw
          changed_when: false
          tags: [execute]

        - name: "Check verification results"
          ansible.builtin.assert:
            that:
              - _verify_file_stat.stat.exists
              - subpolicy_name in _verify_policy_raw.stdout.split(':')
            fail_msg: "Verification failed - subpolicy not correctly applied"
          tags: [execute]

        - name: "Req 17 - Emit result block"
          ansible.builtin.debug:
            msg: |
              <result>
              file_status: {{ 'created' if _file_created else 'already present' }}
              policy_status: {{ 'applied' if _policy_applied else 'already in effect' }}
              </result>
          tags: [execute]

      rescue:
        - name: "Req 18 - Emit error and fail"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: ensure_crypto_subpolicy failed
              </result>
          tags: [execute]

        - name: "Fail the playbook"
          ansible.builtin.fail:
            msg: "ensure_crypto_subpolicy failed"

      always:
        - name: "Restore - Read existence marker"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/subpolicy_existed"
          register: _restore_existed
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove created subpolicy file if it did not exist originally"
          ansible.builtin.file:
            path: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
            state: absent
          when:
            - _restore_existed.content is defined
            - (_restore_existed.content | b64decode | trim) == 'False'
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore subpolicy file from backup if existed"
          ansible.builtin.copy:
            src: "{{ backup_dir }}/{{ subpolicy_name }}.pmod.bak"
            dest: "/etc/crypto-policies/policies/modules/{{ subpolicy_name }}.pmod"
            remote_src: true
          when:
            - _restore_existed.content is defined
            - (_restore_existed.content | b64decode | trim) == 'True'
          failed_when: false
          tags: [restore]

        - name: "Restore - Read saved original crypto policy"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/policy_original.txt"
          register: _restore_policy_slurp
          failed_when: false
          tags: [restore]

        - name: "Restore - Apply original crypto policy"
          ansible.builtin.command: "update-crypto-policies --set {{ _restore_policy_slurp.content | b64decode | trim }}"
          when:
            - _restore_policy_slurp.content is defined
            - _restore_policy_slurp.content | b64decode | trim | length > 0
          failed_when: false
          tags: [restore]

        - name: "Restore - Cleanup backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]