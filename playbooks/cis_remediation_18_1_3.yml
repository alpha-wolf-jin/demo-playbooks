---
- name: "Remediate CIS checkpoint 18.1.3: Ensure 'Allow Online Tips' is set to 'Disabled'"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_18_1_3_allow_online_tips"
    backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: |-
      If Domain Controller: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer', name='AllowOnlineTips', data=0, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
    req_03: |-
      If Member Server: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer', name='AllowOnlineTips', data=0, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
    req_04: |-
      If Domain Controller: Verify the GP registry key: use ansible.windows.win_reg_stat path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' name='AllowOnlineTips'. The module returns structured data — .exists (bool) and .value (integer for REG_DWORD). PASS if .exists == true AND .value == 0. FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 0. Do NOT check .stdout or .rc — win_reg_stat returns structured data. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
    req_05: |-
      If Member Server: Verify the GP registry key: use ansible.windows.win_reg_stat path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' name='AllowOnlineTips'. The module returns structured data — .exists (bool) and .value (integer for REG_DWORD). PASS if .exists == true AND .value == 0. FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 0. Do NOT check .stdout or .rc — win_reg_stat returns structured data. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
    req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_07: |
      {% raw %}Create a task named 'Generate remediation report' using debug msg with EXACTLY this format:
      REMEDIATION REPORT — CIS 18.1.3
      Reference: CIS Benchmark checkpoint 18.1.3
      Then for each requirement: REQUIREMENT NN - {{ req_NN }}:
        With fields: Task, Command, Exit code, Data, Status (PASS/FAIL/SKIP/ERROR), Details.
      End with OVERALL REMEDIATION: section containing Result: {{{ cis_result }}}{% endraw %}

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir }}"
        state: directory
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req step-01 - Detect Windows server role using DomainRole property"
          ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
          register: _step01_output
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req step-01 - Set role flags based on DomainRole detection result"
          ansible.builtin.set_fact:
            is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
            is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
            role_detection_error: "{{ (_step01_output.rc | default(-1) != 0) or ((_step01_output.stdout | default('') | trim) not in ['0', '1', '2', '3', '4', '5']) }}"
            status_01: >-
              {{ 'ERROR' if (_step01_output.rc | default(-1) != 0) else
                 'PASS' if ((_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5']) else
                 'ERROR' }}
            data_01: "{{ _step01_output.stdout | default('') | trim }}"
            details_01: >-
              {{ 'DomainRole detection failed' if (_step01_output.rc | default(-1) != 0) else
                 'Detected DomainRole ' ~ (_step01_output.stdout | default('') | trim) }}
            task_01_name: "Detect Windows server role using DomainRole property"
            task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
            task_01_rc: "{{ _step01_output.rc | default(-1) }}"
          tags: [execute]

        - name: "Req step-02 - Set AllowOnlineTips registry value to 0 on Domain Controller"
          ansible.windows.win_regedit:
            path: |-
              HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
            name: 'AllowOnlineTips'
            data: 0
            type: dword
          register: _step02_output
          when: is_dc | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-03 - Set AllowOnlineTips registry value to 0 on Member Server"
          ansible.windows.win_regedit:
            path: |-
              HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
            name: 'AllowOnlineTips'
            data: 0
            type: dword
          register: _step03_output
          when: is_member | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-04 - Verify AllowOnlineTips registry value on Domain Controller"
          ansible.windows.win_reg_stat:
            path: |-
              HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
            name: 'AllowOnlineTips'
          register: _step04_output
          when: is_dc | bool
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-05 - Verify AllowOnlineTips registry value on Member Server"
          ansible.windows.win_reg_stat:
            path: |-
              HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
            name: 'AllowOnlineTips'
          register: _step05_output
          when: is_member | bool
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-04 - Evaluate DC apply and verification status"
          ansible.builtin.set_fact:
            status_02: "{{ 'PASS' if (_step02_output is defined and not (_step02_output.failed | default(false))) else 'FAIL' }}"
            data_02: "{{ 'Registry value set' if (_step02_output is defined and not (_step02_output.failed | default(false))) else 'Registry write failed' }}"
            details_02: "{{ 'win_regedit applied AllowOnlineTips=0' if (_step02_output is defined and not (_step02_output.failed | default(false))) else 'win_regedit failed' }}"
            status_04: >-
              {{ 'ERROR' if ('exists' not in (_step04_output | default({}))) else
                 'PASS' if ((_step04_output.exists | default(false) | bool) and ((_step04_output.value | default(-1) | int) == 0)) else
                 'FAIL' }}
            data_04: "{{ _step04_output.value | default('ABSENT') }}"
            details_04: >-
              {{ 'Registry read returned no structured data' if ('exists' not in (_step04_output | default({}))) else
                 'Compliant: AllowOnlineTips exists and equals 0' if ((_step04_output.exists | default(false) | bool) and ((_step04_output.value | default(-1) | int) == 0)) else
                 'Non-compliant: AllowOnlineTips absent or not equal to 0' }}
          when: is_dc | bool
          tags: [execute]

        - name: "Req step-05 - Evaluate Member apply and verification status"
          ansible.builtin.set_fact:
            status_03: "{{ 'PASS' if (_step03_output is defined and not (_step03_output.failed | default(false))) else 'FAIL' }}"
            data_03: "{{ 'Registry value set' if (_step03_output is defined and not (_step03_output.failed | default(false))) else 'Registry write failed' }}"
            details_03: "{{ 'win_regedit applied AllowOnlineTips=0' if (_step03_output is defined and not (_step03_output.failed | default(false))) else 'win_regedit failed' }}"
            status_05: >-
              {{ 'ERROR' if ('exists' not in (_step05_output | default({}))) else
                 'PASS' if ((_step05_output.exists | default(false) | bool) and ((_step05_output.value | default(-1) | int) == 0)) else
                 'FAIL' }}
            data_05: "{{ _step05_output.value | default('ABSENT') }}"
            details_05: >-
              {{ 'Registry read returned no structured data' if ('exists' not in (_step05_output | default({}))) else
                 'Compliant: AllowOnlineTips exists and equals 0' if ((_step05_output.exists | default(false) | bool) and ((_step05_output.value | default(-1) | int) == 0)) else
                 'Non-compliant: AllowOnlineTips absent or not equal to 0' }}
          when: is_member | bool
          tags: [execute]

        - name: "Req step-06 - Set cis_result based on active branch verification status"
          ansible.builtin.set_fact:
            cis_result: >-
              {{ 'ERROR' if ((role_detection_error | default(false) | bool) or (not (is_dc | bool) and not (is_member | bool))) else
                 'ERROR' if (is_dc | bool) and ('ERROR' in [status_02 | default('ERROR'), status_04 | default('ERROR')]) else
                 'FAIL' if (is_dc | bool) and ('FAIL' in [status_02 | default('ERROR'), status_04 | default('ERROR')]) else
                 'PASS' if (is_dc | bool) and (status_04 | default('ERROR') == 'PASS') else
                 'ERROR' if (is_member | bool) and ('ERROR' in [status_03 | default('ERROR'), status_05 | default('ERROR')]) else
                 'FAIL' if (is_member | bool) and ('FAIL' in [status_03 | default('ERROR'), status_05 | default('ERROR')]) else
                 'PASS' if (is_member | bool) and (status_05 | default('ERROR') == 'PASS') else
                 'SKIP' }}
          tags: [execute]

        - name: "Req step-07 - Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 18.1.3"
              - "Reference: CIS Benchmark checkpoint 18.1.3"
              - ""
              - "Then for each requirement:"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Detect Windows server role using DomainRole property') }}"
              - "  Command: {{ task_01_cmd | default('(Get-WmiObject Win32_ComputerSystem).DomainRole') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Set AllowOnlineTips registry value to 0 on Domain Controller using win_regedit') }}"
              - "  Command: {{ task_02_cmd | default('win_regedit path=HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer name=AllowOnlineTips data=0 type=dword') }}"
              - "  Exit code: {{ task_02_rc | default('N/A') }}"
              - "  Data: {{ data_02 | default('N/A') | trim }}"
              - "  Status: {{ status_02 | default('SKIP') | trim }}"
              - "  Details: {{ details_02 | default('Not evaluated') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Set AllowOnlineTips registry value to 0 on Member Server using win_regedit') }}"
              - "  Command: {{ task_03_cmd | default('win_regedit path=HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer name=AllowOnlineTips data=0 type=dword') }}"
              - "  Exit code: {{ task_03_rc | default('N/A') }}"
              - "  Data: {{ data_03 | default('N/A') | trim }}"
              - "  Status: {{ status_03 | default('SKIP') | trim }}"
              - "  Details: {{ details_03 | default('Not evaluated') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: {{ task_04_name | default('Verify AllowOnlineTips registry value on Domain Controller using win_reg_stat') }}"
              - "  Command: {{ task_04_cmd | default('win_reg_stat path=HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer name=AllowOnlineTips') }}"
              - "  Exit code: {{ task_04_rc | default('N/A') }}"
              - "  Data: {{ data_04 | default('N/A') | trim }}"
              - "  Status: {{ status_04 | default('SKIP') | trim }}"
              - "  Details: {{ details_04 | default('Not evaluated') | trim }}"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: {{ task_05_name | default('Verify AllowOnlineTips registry value on Member Server using win_reg_stat') }}"
              - "  Command: {{ task_05_cmd | default('win_reg_stat path=HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer name=AllowOnlineTips') }}"
              - "  Exit code: {{ task_05_rc | default('N/A') }}"
              - "  Data: {{ data_05 | default('N/A') | trim }}"
              - "  Status: {{ status_05 | default('SKIP') | trim }}"
              - "  Details: {{ details_05 | default('Not evaluated') | trim }}"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: {{ task_06_name | default('Set cis_result based on active branch verification status') }}"
              - "  Command: {{ task_06_cmd | default('set_fact cis_result') }}"
              - "  Exit code: {{ task_06_rc | default('N/A') }}"
              - "  Data: cis_result={{ cis_result | default('ERROR') }}"
              - "  Status: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: Overall status computed from active branch"
              - ""
              - "REQUIREMENT 07 - {{ req_07 }}:"
              - "  Task: Generate remediation report"
              - "  Command: debug msg"
              - "  Exit code: N/A"
              - "  Data: Report generated"
              - "  Status: PASS"
              - "  Details: Final report emitted"
              - ""
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
          tags: [execute]

      always:
        - name: "Restore - Check if backup exists"
          ansible.windows.win_stat:
            path: "{{ backup_dir }}"
          register: _backup_check
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.windows.win_file:
            path: "{{ backup_dir }}"
            state: absent
          when: _backup_check.stat.exists | default(false)
          failed_when: false
          tags: [restore]