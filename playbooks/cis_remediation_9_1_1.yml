---
- name: "Remediate CIS checkpoint 9.1.1: Ensure 'Windows Firewall: Domain: Firewall state' is set to 'On (recommended)'"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_9_1_1_firewall_domain_state_remediation"
    backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: |-
      If Domain Controller: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile', name='EnableFirewall', data=1, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
    req_03: |-
      If Member Server: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile', name='EnableFirewall', data=1, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
    req_04: |-
      If Domain Controller: Verify the GP registry key: use PowerShell Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile' -Name EnableFirewall. PASS if value equals 1. FAIL if 0 or NOT_CONFIGURED. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
    req_05: |-
      If Member Server: Verify the GP registry key: use PowerShell Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile' -Name EnableFirewall. PASS if value equals 1. FAIL if 0 or NOT_CONFIGURED. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
    req_06: "Store the final remediation result in a variable named cis_result using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  pre_tasks:
    - name: "Snapshot - Remove stale backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir | trim }}"
        state: absent
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir | trim }}"
        state: directory
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save current EnableFirewall registry state"
      ansible.windows.win_shell: |
        $p = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
        $v = (Get-ItemProperty -Path $p -Name EnableFirewall -ErrorAction SilentlyContinue).EnableFirewall
        $backup_dir = "{{ backup_dir | trim }}"
        if ($null -eq $v) {
          Set-Content -Path (Join-Path $backup_dir 'EnableFirewall.absent') -Value 'absent' -Encoding ascii
          Write-Output 'ABSENT_OR_NOT_CONFIGURED'
        } else {
          Set-Content -Path (Join-Path $backup_dir 'EnableFirewall.present') -Value $v -Encoding ascii
          Write-Output $v
        }
      register: _snap_reg
      changed_when: false
      failed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req step-01 - Detect Windows server role using Win32_ComputerSystem DomainRole"
          ansible.windows.win_shell: |
            try {
              $role = (Get-CimInstance Win32_ComputerSystem).DomainRole
              Write-Output $role
              exit 0
            } catch {
              Write-Output "DETECTION_ERROR: $($_.Exception.Message)"
              exit 2
            }
          register: _step01_output
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-01 - Set is_dc and is_member facts"
          ansible.builtin.set_fact:
            is_dc: "{{ (_step01_output.rc | default(-1)) == 0 and (_step01_output.stdout | default('') | trim) in ['4','5'] }}"
            is_member: "{{ (_step01_output.rc | default(-1)) == 0 and (_step01_output.stdout | default('') | trim) in ['1','2','3'] }}"
          tags: [execute]

        - name: "Req step-02 - Set Domain Profile EnableFirewall GP registry key for Domain Controller"
          ansible.windows.win_regedit:
            path: |-
              HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
            name: EnableFirewall
            data: 1
            type: dword
          register: _step02_output
          when: is_dc | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-03 - Set Domain Profile EnableFirewall GP registry key for Member Server"
          ansible.windows.win_regedit:
            path: |-
              HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
            name: EnableFirewall
            data: 1
            type: dword
          register: _step03_output
          when: is_member | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-04 - Verify Domain Profile EnableFirewall registry key for Domain Controller"
          ansible.windows.win_shell: |
            $v = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile' -Name EnableFirewall -ErrorAction SilentlyContinue).EnableFirewall
            if ($null -eq $v) {
              Write-Output 'NOT_CONFIGURED'
              exit 1
            } else {
              Write-Output $v
              exit 0
            }
          register: _step04_output
          changed_when: false
          failed_when: false
          when: is_dc | bool
          tags: [execute]

        - name: "Req step-05 - Verify Domain Profile EnableFirewall registry key for Member Server"
          ansible.windows.win_shell: |
            $v = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile' -Name EnableFirewall -ErrorAction SilentlyContinue).EnableFirewall
            if ($null -eq $v) {
              Write-Output 'NOT_CONFIGURED'
              exit 1
            } else {
              Write-Output $v
              exit 0
            }
          register: _step05_output
          changed_when: false
          failed_when: false
          when: is_member | bool
          tags: [execute]

        - name: "Req step-06 - Set statuses and cis_result"
          ansible.builtin.set_fact:
            status_01: "{{ ('PASS' if (_step01_output.rc | default(-1) == 0 and (_step01_output.stdout | default('') | trim) in ['1','2','3','4','5']) else 'ERROR') | trim }}"
            data_01: "{{ _step01_output.stdout | default('') | trim }}"
            task_01_name: "Detect Windows server role"
            task_01_cmd: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
            task_01_rc: "{{ _step01_output.rc | default(-1) }}"
            details_01: "{{ ('Detected DomainRole=' ~ (_step01_output.stdout | default('') | trim)) if (_step01_output.rc | default(-1) == 0 and (_step01_output.stdout | default('') | trim) in ['1','2','3','4','5']) else 'DomainRole detection failed' }}"

            status_02: "{{ ('SKIP' if not (is_dc | bool) else 'PASS') | trim }}"
            data_02: "{{ '1' if (is_dc | bool) else 'N/A' }}"
            task_02_name: "Set DC GP registry key EnableFirewall=1"
            task_02_cmd: |-
              win_regedit path HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile
            task_02_rc: "{{ 0 if (is_dc | bool) else -1 }}"
            details_02: "{{ ('Registry key set for Domain Controller' if (is_dc | bool) else 'Not applicable for this host') }}"

            status_03: "{{ ('SKIP' if not (is_member | bool) else 'PASS') | trim }}"
            data_03: "{{ '1' if (is_member | bool) else 'N/A' }}"
            task_03_name: "Set Member GP registry key EnableFirewall=1"
            task_03_cmd: |-
              win_regedit path HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile
            task_03_rc: "{{ 0 if (is_member | bool) else -1 }}"
            details_03: "{{ ('Registry key set for Member Server' if (is_member | bool) else 'Not applicable for this host') }}"

            status_04: "{{ ('SKIP' if not (is_dc | bool) else 'PASS' if ((_step04_output.stdout | default('') | trim) == '1') else 'ERROR' if (_step04_output.rc | default(-1) not in [0,1]) else 'FAIL') | trim }}"
            data_04: "{{ (_step04_output.stdout | default('') | trim) if (is_dc | bool) else 'N/A' }}"
            task_04_name: "Verify DC GP registry key"
            task_04_cmd: |-
              Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile' -Name EnableFirewall
            task_04_rc: "{{ _step04_output.rc | default(-1) if (is_dc | bool) else -1 }}"
            details_04: "{{ ('PASS: EnableFirewall=1' if (is_dc | bool and (_step04_output.stdout | default('') | trim) == '1') else 'SKIP: not DC' if not (is_dc | bool) else 'FAIL: value not 1' if (_step04_output.rc | default(-1) == 0) else 'ERROR: verification failed') }}"

            status_05: "{{ ('SKIP' if not (is_member | bool) else 'PASS' if ((_step05_output.stdout | default('') | trim) == '1') else 'ERROR' if (_step05_output.rc | default(-1) not in [0,1]) else 'FAIL') | trim }}"
            data_05: "{{ (_step05_output.stdout | default('') | trim) if (is_member | bool) else 'N/A' }}"
            task_05_name: "Verify Member GP registry key"
            task_05_cmd: |-
              Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\DomainProfile' -Name EnableFirewall
            task_05_rc: "{{ _step05_output.rc | default(-1) if (is_member | bool) else -1 }}"
            details_05: "{{ ('PASS: EnableFirewall=1' if (is_member | bool and (_step05_output.stdout | default('') | trim) == '1') else 'SKIP: not Member' if not (is_member | bool) else 'FAIL: value not 1' if (_step05_output.rc | default(-1) == 0) else 'ERROR: verification failed') }}"

            cis_result: >-
              {{ 'ERROR' if (_step01_output.rc | default(-1) != 0 or ((_step01_output.stdout | default('') | trim) not in ['1','2','3','4','5']))
                 else 'ERROR' if (is_dc | bool) and (_step04_output.rc | default(-1) not in [0,1])
                 else 'FAIL' if (is_dc | bool) and ((_step04_output.stdout | default('') | trim) != '1')
                 else 'PASS' if (is_dc | bool)
                 else 'ERROR' if (is_member | bool) and (_step05_output.rc | default(-1) not in [0,1])
                 else 'FAIL' if (is_member | bool) and ((_step05_output.stdout | default('') | trim) != '1')
                 else 'PASS' if (is_member | bool)
                 else 'ERROR' }}
          tags: [execute]

        - name: "Req step-06 - Set status_06"
          ansible.builtin.set_fact:
            status_06: "{{ 'PASS' if cis_result in ['PASS','FAIL','SKIP','ERROR'] else 'ERROR' }}"
            data_06: "{{ cis_result }}"
            task_06_name: "Set cis_result"
            task_06_cmd: "set_fact cis_result"
            task_06_rc: "{{ 0 if cis_result in ['PASS','FAIL','SKIP','ERROR'] else -1 }}"
            details_06: "{{ 'cis_result set to ' ~ cis_result }}"
          tags: [execute]

        - name: "Req step-07 - Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 9.1.1"
              - "Reference: CIS Benchmark checkpoint 9.1.1"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: {{ task_04_name | default('Not recorded') }}"
              - "  Command: {{ task_04_cmd | default('N/A') }}"
              - "  Exit code: {{ task_04_rc | default(-1) }}"
              - "  Data: {{ data_04 | default('') | trim }}"
              - "  Status: {{ status_04 | default('ERROR') | trim }}"
              - "  Details: {{ details_04 | default('') | trim }}"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: {{ task_05_name | default('Not recorded') }}"
              - "  Command: {{ task_05_cmd | default('N/A') }}"
              - "  Exit code: {{ task_05_rc | default(-1) }}"
              - "  Data: {{ data_05 | default('') | trim }}"
              - "  Status: {{ status_05 | default('ERROR') | trim }}"
              - "  Details: {{ details_05 | default('') | trim }}"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: {{ task_06_name | default('Not recorded') }}"
              - "  Command: {{ task_06_cmd | default('N/A') }}"
              - "  Exit code: {{ task_06_rc | default(-1) }}"
              - "  Data: {{ data_06 | default('') | trim }}"
              - "  Status: {{ status_06 | default('ERROR') | trim }}"
              - "  Details: {{ details_06 | default('') | trim }}"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Restore EnableFirewall registry state from backup"
          ansible.windows.win_shell: |
            $backup_dir = "{{ backup_dir | trim }}"
            if (-not (Test-Path -LiteralPath $backup_dir)) {
              Write-Output "NO_BACKUP"
              exit 0
            }
            $p = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile'
            $present = Join-Path $backup_dir 'EnableFirewall.present'
            $absent = Join-Path $backup_dir 'EnableFirewall.absent'
            if (Test-Path -LiteralPath $present) {
              $v = (Get-Content -LiteralPath $present -Raw).Trim()
              Set-ItemProperty -Path $p -Name EnableFirewall -Value ([int]$v)
              Write-Output "RESTORED:$v"
            } elseif (Test-Path -LiteralPath $absent) {
              Remove-ItemProperty -Path $p -Name EnableFirewall -ErrorAction SilentlyContinue
              Write-Output "REMOVED:absent"
            }
          register: _restore_result
          changed_when: false
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.windows.win_file:
            path: "{{ backup_dir | trim }}"
            state: absent
          failed_when: false
          tags: [restore]