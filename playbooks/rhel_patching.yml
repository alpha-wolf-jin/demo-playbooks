- name: "SOP playbook 'rhel_patching' (ACTION — changes system state): Apply all available updates to a RHEL server after verifying sufficient memory and disk space, reboot, then re-validate health and service continuity."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    target_server: ""
    min_free_mem_gb: 2
    min_free_disk_gb: 5
    fs_exclude_list: "/boot,/iso"
    fs_type_exclude_list: "devtmpfs,tmpfs,cgroup2,iso9660"
    reboot_timeout: 120

  tasks:
    - block:
        - name: "Req 1 - Validate required target_server"
          ansible.builtin.assert:
            that:
              - target_server is defined
              - target_server | length > 0
              - target_server != ''
            fail_msg: "target_server must be provided and must not be empty"

        # Pre-patch memory
        - name: "Req step-01 - Gather pre-patch memory facts"
          ansible.builtin.setup:
            gather_subset:
              - hardware
          register: _pre_mem_free_mb

        - name: "Req step-01 - Store pre-patch free memory MB"
          ansible.builtin.set_fact:
            _pre_mem_free_mb: "{{ _pre_mem_free_mb.ansible_facts.ansible_memfree_mb }}"

        - name: "Req step-02 - Set pre-patch memory below threshold boolean"
          ansible.builtin.set_fact:
            _pre_mem_below_threshold: "{{ _pre_mem_free_mb | int < (min_free_mem_gb | int * 1024) }}"

        - name: "Req step-02 - Assert pre-patch memory sufficient"
          ansible.builtin.assert:
            that:
              - not _pre_mem_below_threshold | bool
            fail_msg: "Pre-patch free memory {{ _pre_mem_free_mb }} MB below threshold {{ min_free_mem_gb }} GB"

        - name: "Req step-03 - Set pre-patch memory status PASS"
          ansible.builtin.set_fact:
            _pre_mem_status: "PASS: {{ _pre_mem_free_mb }} MB free, threshold {{ min_free_mem_gb }} GB"
          when: not _pre_mem_below_threshold | bool

        # Pre-patch disk
        - name: "Req step-04 - Collect pre-patch disk space (df)"
          ansible.builtin.shell: set -o pipefail && df --output=target,avail,fstype -B1 | tail -n +2
          args:
            executable: /bin/bash
          register: _df_raw_pre
          changed_when: false

        - name: "Req step-05 - Identify pre-patch filesystems with insufficient space"
          ansible.builtin.set_fact:
            _disk_issues_pre: >-
              {%- set filtered = _df_raw_pre.stdout_lines
                 | map('regex_replace', '^(\S+)\s+(\d+)\s+(\S+)$', '{"mount":"\g<1>","avail_bytes":\g<2>,"fstype":"\g<3>"}')
                 | map('from_json')
                 | rejectattr('mount', 'in', fs_exclude_list.split(',') | map('trim') | list)
                 | rejectattr('fstype', 'in', fs_type_exclude_list.split(',') | map('trim') | list)
                 | selectattr('avail_bytes', 'lt', min_free_disk_gb | int * 1024 * 1024 * 1024)
                 | list -%}
              {%- set result = [] -%}
              {%- for fs in filtered -%}
                {%- set _ = result.append({'mount': fs.mount, 'avail_gb': (fs.avail_bytes | int / 1073741824) | round(2, 'common')}) -%}
              {%- endfor -%}
              {{ result }}

        - name: "Req step-06 - Set pre-patch disk issue boolean"
          ansible.builtin.set_fact:
            _pre_disk_issues_exist: "{{ _disk_issues_pre | length > 0 }}"

        - name: "Req step-06 - Assert pre-patch disk space sufficient"
          ansible.builtin.assert:
            that:
              - not _pre_disk_issues_exist | bool
            fail_msg: "Pre-patch disk space issue on mounts: {{ _disk_issues_pre | map(attribute='mount') | join(', ') }}"

        - name: "Req step-07 - Set pre-patch disk status PASS"
          ansible.builtin.set_fact:
            _pre_disk_status: "PASS: all monitored filesystems have >= {{ min_free_disk_gb }} GB free"
          when: not _pre_disk_issues_exist | bool

        # Pre-patch services
        - name: "Req step-08 - Gather pre-patch service facts"
          ansible.builtin.service_facts:
          register: _pre_services_facts

        - name: "Req step-09 - Extract pre-patch running services"
          ansible.builtin.set_fact:
            _pre_running_services: >-
              {{ _pre_services_facts.ansible_facts.services | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | map(attribute='key') | list }}

        - name: "Req step-09 - Set pre-patch services status count"
          ansible.builtin.set_fact:
            _pre_services_status: "Collected {{ _pre_running_services | length }} running services."

        # Apply updates
        - name: "Req step-10 - Apply all system updates"
          ansible.builtin.dnf:
            name: "*"
            state: latest

        - name: "Req step-11 - Set update status PASS"
          ansible.builtin.set_fact:
            _update_status: "PASS: System updated successfully."

        # Reboot
        - name: "Req step-12 - Reboot server"
          ansible.builtin.reboot:
            reboot_timeout: "{{ reboot_timeout }}"

        - name: "Req step-13 - Set reboot status PASS"
          ansible.builtin.set_fact:
            _reboot_status: "PASS: Server rebooted and is back online."

        # Post-patch memory
        - name: "Req step-14 - Gather post-patch memory facts"
          ansible.builtin.setup:
            gather_subset:
              - hardware
          register: _post_mem_free_mb

        - name: "Req step-14 - Store post-patch free memory MB"
          ansible.builtin.set_fact:
            _post_mem_free_mb: "{{ _post_mem_free_mb.ansible_facts.ansible_memfree_mb }}"

        - name: "Req step-15 - Set post-patch memory below threshold boolean"
          ansible.builtin.set_fact:
            _post_mem_below_threshold: "{{ _post_mem_free_mb | int < (min_free_mem_gb | int * 1024) }}"

        - name: "Req step-16 - Set post-patch memory status"
          ansible.builtin.set_fact:
            _post_mem_status: "{{ 'WARN: ' ~ _post_mem_free_mb ~ ' MB free is below threshold ' ~ min_free_mem_gb ~ ' GB' if _post_mem_below_threshold | bool else 'PASS: ' ~ _post_mem_free_mb ~ ' MB free, threshold ' ~ min_free_mem_gb ~ ' GB' }}"

        # Post-patch disk
        - name: "Req step-17 - Collect post-patch disk space (df)"
          ansible.builtin.shell: set -o pipefail && df --output=target,avail,fstype -B1 | tail -n +2
          args:
            executable: /bin/bash
          register: _df_raw_post
          changed_when: false

        - name: "Req step-18 - Identify post-patch filesystems with insufficient space"
          ansible.builtin.set_fact:
            _disk_issues_post: >-
              {%- set filtered = _df_raw_post.stdout_lines
                 | map('regex_replace', '^(\S+)\s+(\d+)\s+(\S+)$', '{"mount":"\g<1>","avail_bytes":\g<2>,"fstype":"\g<3>"}')
                 | map('from_json')
                 | rejectattr('mount', 'in', fs_exclude_list.split(',') | map('trim') | list)
                 | rejectattr('fstype', 'in', fs_type_exclude_list.split(',') | map('trim') | list)
                 | selectattr('avail_bytes', 'lt', min_free_disk_gb | int * 1024 * 1024 * 1024)
                 | list -%}
              {%- set result = [] -%}
              {%- for fs in filtered -%}
                {%- set _ = result.append({'mount': fs.mount, 'avail_gb': (fs.avail_bytes | int / 1073741824) | round(2, 'common')}) -%}
              {%- endfor -%}
              {{ result }}

        - name: "Req step-19 - Set post-patch disk issue boolean"
          ansible.builtin.set_fact:
            _post_disk_issues_exist: "{{ _disk_issues_post | length > 0 }}"

        - name: "Req step-20 - Set post-patch disk status"
          ansible.builtin.set_fact:
            _post_disk_status: >-
              {{ 'WARN: insufficient disk on ' ~ _disk_issues_post | map(attribute='mount') | join(', ') if _post_disk_issues_exist | bool else 'PASS: all monitored filesystems have >= ' ~ min_free_disk_gb ~ ' GB free' }}

        # Post-patch services
        - name: "Req step-21 - Gather post-patch service facts"
          ansible.builtin.service_facts:
          register: _post_services_facts

        - name: "Req step-22 - Extract post-patch running services"
          ansible.builtin.set_fact:
            _post_running_services: >-
              {{ _post_services_facts.ansible_facts.services | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | map(attribute='key') | list }}

        - name: "Req step-22 - Compute missing and added services"
          ansible.builtin.set_fact:
            _services_missing: "{{ _pre_running_services | difference(_post_running_services) }}"
            _services_added: "{{ _post_running_services | difference(_pre_running_services) }}"

        - name: "Req step-22 - Set post-patch services status"
          ansible.builtin.set_fact:
            _post_services_status: >-
              {{ 'NO MISMATCH: all pre-patch services are still running.' if (_services_missing | length == 0 and _services_added | length == 0) else 'MISMATCH: missing ' ~ (_services_missing | length) ~ ' service(s), added ' ~ (_services_added | length) ~ ' service(s).' }}

        - name: "Req step-23 - Emit final report"
          ansible.builtin.debug:
            msg: |-
              <result>
              pre_memory_status: {{ _pre_mem_status | default('') }}
              pre_disk_status: {{ _pre_disk_status | default('') }}
              pre_services_status: {{ _pre_services_status | default('') }}
              update_status: {{ _update_status | default('') }}
              reboot_status: {{ _reboot_status | default('') }}
              post_memory_status: {{ _post_mem_status | default('') }}
              post_disk_status: {{ _post_disk_status | default('') }}
              post_services_status: {{ _post_services_status | default('') }}
              services_missing: {{ _services_missing | default([]) }}
              services_added: {{ _services_added | default([]) }}
              </result>

      rescue:
        - name: "Req step-24 - Emit error result"
          ansible.builtin.debug:
            msg: |-
              <result>
              ERROR: rhel_patching failed on {{ inventory_hostname }}
              </result>
          when: true