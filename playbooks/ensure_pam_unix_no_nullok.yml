---
- name: "SOP playbook 'ensure_pam_unix_no_nullok' (DATA COLLECTOR — read-only): Verifies that the pam_unix.so module in the active PAM configuration's system-auth and password-auth files does not contain the nullok argument without the without-nullok placeholder."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    target_server: ""   # Required; override via extra_vars

  tasks:
    - block:
        - name: "Validate required variable target_server is provided"
          ansible.builtin.assert:
            that: "{{ target_server != '' }}"
            fail_msg: "target_server must be provided and not empty"

        - name: "Req 2 - Read authselect configuration file"
          ansible.builtin.slurp:
            src: /etc/authselect/authselect.conf
          register: _authselect_conf_b64

        - name: "Req 3 - Extract authselect profile name"
          ansible.builtin.set_fact:
            _profile: "{{ (_authselect_conf_b64.content | default('') | b64decode).splitlines() | first | trim }}"

        - name: "Req 3 - Compute PAM directory"
          ansible.builtin.set_fact:
            _pam_dir: "{{ '/etc/authselect/' ~ _profile ~ '/' if _profile.startswith('custom/') else '/etc/pam.d/' }}"

        - name: "Req 4 - Read system-auth PAM file"
          ansible.builtin.slurp:
            src: "{{ _pam_dir }}system-auth"
          register: _system_auth_b64

        - name: "Req 5 - Read password-auth PAM file"
          ansible.builtin.slurp:
            src: "{{ _pam_dir }}password-auth"
          register: _password_auth_b64

        - name: "Req 6 - Find nullok violations in system-auth"
          ansible.builtin.set_fact:
            _system_auth_str: "{{ _system_auth_b64.content | default('') | b64decode }}"
            _sys_violations: >-
              {{ (_system_auth_b64.content | default('') | b64decode).splitlines()
                 | reject('eq', '')
                 | select('search', 'pam_unix\\.so')
                 | select('search', 'nullok')
                 | reject('search', '\\{if not "without-nullok":nullok\\}')
                 | map('regex_replace', '^.*$', '{"file": "system-auth", "line": "\g<0>"}')
                 | map('from_json')
                 | list }}

        - name: "Req 6 - Find nullok violations in password-auth"
          ansible.builtin.set_fact:
            _password_auth_str: "{{ _password_auth_b64.content | default('') | b64decode }}"
            _pw_violations: >-
              {{ (_password_auth_b64.content | default('') | b64decode).splitlines()
                 | reject('eq', '')
                 | select('search', 'pam_unix\\.so')
                 | select('search', 'nullok')
                 | reject('search', '\\{if not "without-nullok":nullok\\}')
                 | map('regex_replace', '^.*$', '{"file": "password-auth", "line": "\g<0>"}')
                 | map('from_json')
                 | list }}

        - name: "Req 6 - Combine violations and compute compliance"
          ansible.builtin.set_fact:
            _violations: "{{ _sys_violations + _pw_violations }}"
            _compliant: "{{ (_sys_violations + _pw_violations) | length == 0 }}"

        - name: "Req 7 - Emit compliance result"
          ansible.builtin.debug:
            msg: |
              <result>
              compliant: {{ _compliant }}
              violations: {{ _violations }}
              </result>

      rescue:
        - name: "Req 8 - Emit error result"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: ensure_pam_unix_no_nullok failed on {{ inventory_hostname }} - {{ ansible_failed_task.name | default('unknown task') }}: {{ ansible_failed_result.msg | default('No error message') }}
              </result>

        - name: "Req 8 - Force failure"
          ansible.builtin.fail:
            msg: "Playbook terminated due to failure"