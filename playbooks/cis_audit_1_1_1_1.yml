---
- name: "Audit CIS checkpoint 1.1.1.1: Ensure cramfs kernel module is not available"
  hosts: all
  become: yes
  gather_facts: false
  vars:
    kernel_module_name: "cramfs"
    req_01: "1. Run the provided audit script to verify Ensure cramfs kernel module is not available."
    req_02: "2. VERIFY: Summarise compliance status for Ensure cramfs kernel module is not available. Expected result: PASS if compliant, SKIP if prerequisite not met (e.g., partition/package does not exist), FAIL if misconfigured"
    req_03: "3. Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_04: "4. Generate audit report with compliance status"

  tasks:
    - name: "Initialize data variables"
      ansible.builtin.set_fact:
        task_01_name: "Not executed"
        task_01_cmd: "N/A"
        task_01_rc: -1
        data_01: "Not collected"
        status_01: "ERROR"
        details_01: "Not evaluated"
        task_02_name: "Not executed"
        task_02_cmd: "N/A"
        task_02_rc: -1
        data_02: "Not collected"
        status_02: "ERROR"
        details_02: "Not evaluated"
        task_03_name: "Not executed"
        task_03_cmd: "N/A"
        task_03_rc: -1
        data_03: "Not collected"
        status_03: "ERROR"
        details_03: "Not evaluated"
        task_04_name: "Not executed"
        task_04_cmd: "N/A"
        task_04_rc: -1
        data_04: "Not collected"
        status_04: "ERROR"
        details_04: "Not evaluated"

    - name: "Req step-01 - Copy audit script to remote"
      ansible.builtin.copy:
        dest: "/tmp/cis_audit_cramfs.sh"
        mode: "0700"
        content: |
          #!/usr/bin/env bash
          {
             l_output3="" l_dl=""
             unset a_output; unset a_output2
             l_mod_name="{{ kernel_module_name }}"
             l_mod_type="fs"
             l_mod_path="$(readlink -f /lib/modules/**/kernel/$l_mod_type | sort -u)"
             {% raw %}
             f_module_chk()
             {
                l_dl="y"
                a_showconfig=()
                while IFS= read -r l_showconfig; do
                   a_showconfig+=("$l_showconfig")
                done < <(modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+'"${l_mod_name//-/_}"'\b')
                if ! lsmod | grep "$l_mod_name" &> /dev/null; then
                   a_output+=("  - kernel module: \"$l_mod_name\" is not loaded")
                else
                   a_output2+=("  - kernel module: \"$l_mod_name\" is loaded")
                fi
                if grep -Pq -- '\binstall\h+'"${l_mod_name//-/_}"'\h+\/bin\/(true|false)\b' <<< "${a_showconfig[*]}"; then
                   a_output+=("  - kernel module: \"$l_mod_name\" is not loadable")
                else
                   a_output2+=("  - kernel module: \"$l_mod_name\" is loadable")
                fi
                if grep -Pq -- '\bblacklist\h+'"${l_mod_name//-/_}"'\b' <<< "${a_showconfig[*]}"; then
                   a_output+=("  - kernel module: \"$l_mod_name\" is deny listed")
                else
                   a_output2+=("  - kernel module: \"$l_mod_name\" is not deny listed")
                fi
             }
             for l_mod_base_directory in $l_mod_path; do
                if [ -d "$l_mod_base_directory/${l_mod_name/-/\/}" ] && [ -n "$(ls -A $l_mod_base_directory/${l_mod_name/-/\/})" ]; then
                   l_output3="$l_output3\n  - \"$l_mod_base_directory\""
                   [[ "$l_mod_name" =~ overlay ]] && l_mod_name="${l_mod_name::-2}"
                   [ "$l_dl" != "y" ] && f_module_chk
                else
                   a_output+=(" - kernel module: \"$l_mod_name\" doesn't exist in \"$l_mod_base_directory\"")
                fi
             done
             [ -n "$l_output3" ] && echo -e "\n\n -- INFO --\n - module: \"$l_mod_name\" exists in:$l_output3"
             if [ "${#a_output2[@]}" -le 0 ]; then
                printf '%s\n' "" "- Audit Result:" "  ** PASS **" "${a_output[@]}"
             else
                printf '%s\n' "" "- Audit Result:" "  ** FAIL **" " - Reason(s) for audit failure:" "${a_output2[@]}"
                [ "${#a_output[@]}" -gt 0 ] && printf '%s\n' "- Correctly set:" "${a_output[@]}"
             fi
             {% endraw %}
          }
      changed_when: false

    - name: "Req step-01 - Run the provided audit script to verify Ensure cramfs kernel module is not available"
      ansible.builtin.shell: "/bin/bash /tmp/cis_audit_cramfs.sh"
      args:
        executable: /bin/bash
      register: _audit_output
      failed_when: false
      changed_when: false

    - name: "Req step-01 - Store requirement 01 details"
      ansible.builtin.set_fact:
        task_01_name: "Execute audit script for cramfs"
        task_01_cmd: "/bin/bash /tmp/cis_audit_cramfs.sh"
        task_01_rc: "{{ _audit_output.rc | default(-1) }}"
        data_01: "{{ _audit_output.stdout | default('') | trim }}"
        status_01: "{{ ('PASS' if (_audit_output.rc | default(-1)) == 0 else 'ERROR') | trim }}"
        details_01: "{{ 'Script executed successfully' if (_audit_output.rc | default(-1)) == 0 else 'Script execution failed' | trim }}"

    - name: "Req step-02 - Determine compliance status from audit output"
      ansible.builtin.set_fact:
        status_02: >-
          {%- if '** PASS **' in (_audit_output.stdout | default('')) %}
          PASS
          {%- elif '** FAIL **' in (_audit_output.stdout | default('')) %}
          FAIL
          {%- else %}
          ERROR
          {%- endif %}
        _cis_status: >-
          {%- if '** PASS **' in (_audit_output.stdout | default('')) %}
          PASS
          {%- elif '** FAIL **' in (_audit_output.stdout | default('')) %}
          FAIL
          {%- else %}
          ERROR
          {%- endif %}

    - name: "Req step-02 - Store requirement 02 details"
      ansible.builtin.set_fact:
        task_02_name: "Parse audit output for compliance"
        task_02_cmd: "N/A"
        task_02_rc: "N/A"
        data_02: "{{ _audit_output.stdout | default('') | trim }}"
        details_02: "Compliance status derived from audit output"

    - name: "Req step-03 - Store final audit result in cis_result"
      ansible.builtin.set_fact:
        cis_result: "{{ _cis_status | default('ERROR') | trim }}"

    - name: "Req step-03 - Store requirement 03 details"
      ansible.builtin.set_fact:
        task_03_name: "Set cis_result"
        task_03_cmd: "N/A"
        task_03_rc: "N/A"
        data_03: "cis_result={{ cis_result }}"
        status_03: "{{ cis_result | trim }}"
        details_03: "Overall compliance status stored as cis_result"

    - name: "Req step-04 - Set report task details"
      ansible.builtin.set_fact:
        task_04_name: "Generate audit report"
        task_04_cmd: "N/A"
        task_04_rc: "N/A"
        data_04: "Report generated"
        status_04: "PASS"
        details_04: "Audit report displayed successfully"

    - name: "Req step-04 - Generate audit report"
      ansible.builtin.debug:
        msg:
          - "AUDIT REPORT — CIS 1.1.1.1"
          - "Reference: CIS Benchmark checkpoint 1.1.1.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: {{ task_01_name | default('Not recorded') }}"
          - "  Command: {{ task_01_cmd | default('N/A') }}"
          - "  Exit code: {{ task_01_rc | default(-1) }}"
          - "  Data: {{ data_01 | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: {{ details_01 | default('') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: {{ task_02_name | default('Not recorded') }}"
          - "  Command: {{ task_02_cmd | default('N/A') }}"
          - "  Exit code: {{ task_02_rc | default(-1) }}"
          - "  Data: {{ data_02 | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: {{ details_02 | default('') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: {{ task_03_name | default('Not recorded') }}"
          - "  Command: {{ task_03_cmd | default('N/A') }}"
          - "  Exit code: {{ task_03_rc | default(-1) }}"
          - "  Data: {{ data_03 | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: {{ details_03 | default('') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: {{ task_04_name | default('Not recorded') }}"
          - "  Command: {{ task_04_cmd | default('N/A') }}"
          - "  Exit code: {{ task_04_rc | default(-1) }}"
          - "  Data: {{ data_04 | default('') | trim }}"
          - "  Status: {{ status_04 | default('ERROR') | trim }}"
          - "  Details: {{ details_04 | default('') | trim }}"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "========================================================"