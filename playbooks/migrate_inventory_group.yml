          ansible.builtin.set_fact:
            _source_child_groups: >-
              {{ query(
                   'ansible.controller.controller_api',
                   'groups/' ~ _source_group_id ~ '/children/',
                   host=aap_gateway_ip,
                   username=aap_username,
                   password=aap_password,
                   verify_ssl=aap_validate_certs,
                   return_all=true
                 ) | flatten }}
          when: _source_group_exists | bool
          tags: [execute]

        - name: "Req step-05 - Normalize source group variables to a dict"
          ansible.builtin.set_fact:
            _group_variables: >-
              {{ (((_source_group | first).variables | default('', true) | trim | from_yaml) | default({}, true))
