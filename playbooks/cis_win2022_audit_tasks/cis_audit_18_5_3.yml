---
- name: Initialize meta data variables
  include_vars: cis_audit_var_18_5_3.yml

- name: "Req step-01 - Detect Windows server role using Win32_ComputerSystem DomainRole"
  ansible.windows.win_shell: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
  register: _step01_output
  changed_when: false
  failed_when: false

- name: "Req step-01 - Set role flags and store role detection details"
  ansible.builtin.set_fact:
    is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
    is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
    role_detection_error: "{{ (_step01_output.rc | default(-1) != 0) or ((_step01_output.stdout | default('') | trim) not in ['1', '2', '3', '4', '5']) }}"
    task_01_name: "Detect Windows server role using Win32_ComputerSystem DomainRole"
    task_01_cmd: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
    task_01_rc: "{{ _step01_output.rc | default(-1) }}"
    data_01: "{{ _step01_output.stdout | default('') | trim }}"
    status_01: "{{ 'ERROR' if ((_step01_output.rc | default(-1) != 0) or ((_step01_output.stdout | default('') | trim) not in ['1', '2', '3', '4', '5'])) else 'PASS' }}"
    details_01: "{{ 'Successfully detected role: ' ~ (_step01_output.stdout | default('') | trim) if ((_step01_output.rc | default(-1) == 0) and ((_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5'])) else 'Detection failed or unrecognized DomainRole: ' ~ (_step01_output.stdout | default('') | trim) }}"

- name: "Req step-02 - Read DisableIPSourceRouting registry value on Domain Controller"
  ansible.windows.win_reg_stat:
    path: |-
      HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    name: 'DisableIPSourceRouting'
  register: _step02_output
  changed_when: false
  failed_when: false
  when: is_dc | bool

- name: "Req step-02 - Store Domain Controller registry read details"
  ansible.builtin.set_fact:
    task_02_name: "Read DisableIPSourceRouting registry value on Domain Controller"
    task_02_cmd: |-
      ansible.windows.win_reg_stat path='HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters' name='DisableIPSourceRouting'
    task_02_rc: "{{ 0 if ('exists' in (_step02_output | default({}))) else -1 }}"
    data_02: "{{ ('exists=' ~ (_step02_output.exists | default(false) | string) ~ ', value=' ~ (_step02_output.value | default('N/A') | string)) if ('exists' in (_step02_output | default({}))) else 'No structured registry data' }}"
    status_02: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if ('exists' not in (_step02_output | default({}))) else 'PASS' }}"
    details_02: "{{ 'Registry read completed; structured result available' if ('exists' in (_step02_output | default({}))) else 'Registry read did not return structured data' }}"
  when: is_dc | bool

- name: "Req step-03 - Read DisableIPSourceRouting registry value on Member Server"
  ansible.windows.win_reg_stat:
    path: |-
      HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    name: 'DisableIPSourceRouting'
  register: _step03_output
  changed_when: false
  failed_when: false
  when: is_member | bool

- name: "Req step-03 - Store Member Server registry read details"
  ansible.builtin.set_fact:
    task_03_name: "Read DisableIPSourceRouting registry value on Member Server"
    task_03_cmd: |-
      ansible.windows.win_reg_stat path='HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters' name='DisableIPSourceRouting'
    task_03_rc: "{{ 0 if ('exists' in (_step03_output | default({}))) else -1 }}"
    data_03: "{{ ('exists=' ~ (_step03_output.exists | default(false) | string) ~ ', value=' ~ (_step03_output.value | default('N/A') | string)) if ('exists' in (_step03_output | default({}))) else 'No structured registry data' }}"
    status_03: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if ('exists' not in (_step03_output | default({}))) else 'PASS' }}"
    details_03: "{{ 'Registry read completed; structured result available' if ('exists' in (_step03_output | default({}))) else 'Registry read did not return structured data' }}"
  when: is_member | bool

- name: "Req step-04 - Evaluate DisableIPSourceRouting compliance on Domain Controller"
  ansible.builtin.set_fact:
    task_04_name: "Evaluate DisableIPSourceRouting compliance on Domain Controller"
    task_04_cmd: "set_fact evaluation of _step02_output"
    task_04_rc: "{{ 0 if ('exists' in (_step02_output | default({}))) else -1 }}"
    data_04: "{{ (_step02_output.value | default('N/A') | string) if ('exists' in (_step02_output | default({}))) else 'N/A' }}"
    status_04: >-
      {{ 'SKIP' if not (is_dc | bool) else
         'ERROR' if ('exists' not in (_step02_output | default({}))) else
         'PASS' if ((_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 2)) else
         'FAIL' }}
    details_04: >-
      {{ 'Skipped: not a Domain Controller' if not (is_dc | bool) else
         'Registry read returned no structured data' if ('exists' not in (_step02_output | default({}))) else
         'Compliant: DisableIPSourceRouting exists and equals 2' if ((_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 2)) else
         'Non-compliant: DisableIPSourceRouting missing or not equal to 2' }}
    _cis_status: >-
      {{ 'SKIP' if not (is_dc | bool) else
         'ERROR' if ('exists' not in (_step02_output | default({}))) else
         'PASS' if ((_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 2)) else
         'FAIL' }}
  when: is_dc | bool

- name: "Req step-05 - Evaluate DisableIPSourceRouting compliance on Member Server"
  ansible.builtin.set_fact:
    task_05_name: "Evaluate DisableIPSourceRouting compliance on Member Server"
    task_05_cmd: "set_fact evaluation of _step03_output"
    task_05_rc: "{{ 0 if ('exists' in (_step03_output | default({}))) else -1 }}"
    data_05: "{{ (_step03_output.value | default('N/A') | string) if ('exists' in (_step03_output | default({}))) else 'N/A' }}"
    status_05: >-
      {{ 'SKIP' if not (is_member | bool) else
         'ERROR' if ('exists' not in (_step03_output | default({}))) else
         'PASS' if ((_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 2)) else
         'FAIL' }}
    details_05: >-
      {{ 'Skipped: not a Member Server' if not (is_member | bool) else
         'Registry read returned no structured data' if ('exists' not in (_step03_output | default({}))) else
         'Compliant: DisableIPSourceRouting exists and equals 2' if ((_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 2)) else
         'Non-compliant: DisableIPSourceRouting missing or not equal to 2' }}
    _cis_status: >-
      {{ 'SKIP' if not (is_member | bool) else
         'ERROR' if ('exists' not in (_step03_output | default({}))) else
         'PASS' if ((_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 2)) else
         'FAIL' }}
  when: is_member | bool

- name: "Req step-06 - Store final audit result in cis_result"
  ansible.builtin.set_fact:
    cis_result: >-
      {{ 'ERROR' if (role_detection_error | bool) else
         'ERROR' if (is_dc | bool) and ((status_04 | default('ERROR') | trim) == 'ERROR') else
         'FAIL' if (is_dc | bool) and ((status_04 | default('ERROR') | trim) == 'FAIL') else
         'PASS' if (is_dc | bool) else
         'ERROR' if (is_member | bool) and ((status_05 | default('ERROR') | trim) == 'ERROR') else
         'FAIL' if (is_member | bool) and ((status_05 | default('ERROR') | trim) == 'FAIL') else
         'PASS' if (is_member | bool) else
         'SKIP' }}

- name: "Req step-06 - Store requirement 06 details"
  ansible.builtin.set_fact:
    task_06_name: "Store final audit result in cis_result"
    task_06_cmd: "set_fact cis_result"
    task_06_rc: 0
    data_06: "{{ cis_result | trim }}"
    status_06: "{{ cis_result | trim }}"
    details_06: "Overall compliance derived from active role verification status: {{ cis_result | trim }}"

- name: "Req step-07 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 18.5.3"
    - "Reference: CIS Benchmark checkpoint 18.5.3"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('SKIP') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('SKIP') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not recorded') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('SKIP') | trim }}"
    - "  Details: {{ details_04 | default('') | trim }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: {{ task_05_name | default('Not recorded') }}"
    - "  Command: {{ task_05_cmd | default('N/A') }}"
    - "  Exit code: {{ task_05_rc | default(-1) }}"
    - "  Data: {{ data_05 | default('') | trim }}"
    - "  Status: {{ status_05 | default('SKIP') | trim }}"
    - "  Details: {{ details_05 | default('') | trim }}"
    - ""
    - "REQUIREMENT 06 - {{ req_06 }}:"
    - "  Task: {{ task_06_name | default('Not recorded') }}"
    - "  Command: {{ task_06_cmd | default('N/A') }}"
    - "  Exit code: {{ task_06_rc | default(-1) }}"
    - "  Data: {{ data_06 | default('') | trim }}"
    - "  Status: {{ status_06 | default('ERROR') | trim }}"
    - "  Details: {{ details_06 | default('') | trim }}"
    - ""
    - "REQUIREMENT 07 - {{ req_07 }}:"
    - "  Task: {{ task_07_name | default('Generate audit report') }}"
    - "  Command: {{ task_07_cmd | default('ansible.builtin.debug msg') }}"
    - "  Exit code: {{ task_07_rc | default(0) }}"
    - "  Data: {{ data_07 | default('Audit report generated') | trim }}"
    - "  Status: {{ status_07 | default('PASS') | trim }}"
    - "  Details: {{ details_07 | default('Report generation completed') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ details_06 | default('Not evaluated') | trim }}"
    - "========================================================"
