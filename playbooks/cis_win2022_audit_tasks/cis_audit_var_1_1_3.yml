minimum_password_age: "1"
req_01: "1. Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: "2. If Domain Controller: Read 'Minimum password age' via Get-ADDefaultDomainPasswordPolicy. changed_when: false."
req_03: "3. If Member Server: Read 'Minimum password age' using community.windows.win_security_policy with section=System Access. changed_when: false."
req_04: "4. If Domain Controller: Evaluate whether 'Minimum password age' is equals '1 or more day(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
req_05: "5. If Member Server: Evaluate whether 'Minimum password age' is equals '1 or more day(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
req_06: "6. Store cis_result: PASS, FAIL, SKIP, or ERROR based on the evaluation."
req_07: "7. Generate the audit report using ansible.builtin.debug."
req_08: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
