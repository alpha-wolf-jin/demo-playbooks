---
- name: Initialize meta data variables
  include_vars: cis_audit_var_18_6_9_1.yml

- name: "Req step-01 - Detect Windows server role using Win32_ComputerSystem DomainRole property"
  ansible.windows.win_shell: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
  register: _step01_output
  failed_when: false
  changed_when: false

- name: "Req step-01 - Set role flags"
  ansible.builtin.set_fact:
    is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
    is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
    role_detection_error: "{{ (_step01_output.rc | default(-1) != 0) or ((_step01_output.stdout | default('') | trim) not in ['1','2','3','4','5']) }}"

- name: "Req step-02 - Read LLTDIO registry values for Domain Controller"
  ansible.windows.win_reg_stat:
    path: "{{ lltd_reg_path }}"
    name: "{{ item }}"
  register: _step02_output
  loop: "{{ lltd_value_names }}"
  when: is_dc | bool
  failed_when: false
  changed_when: false

- name: "Req step-03 - Read LLTDIO registry values for Member Server"
  ansible.windows.win_reg_stat:
    path: "{{ lltd_reg_path }}"
    name: "{{ item }}"
  register: _step03_output
  loop: "{{ lltd_value_names }}"
  when: is_member | bool
  failed_when: false
  changed_when: false

- name: "Req step-04 - Verify LLTDIO registry values for Domain Controller"
  ansible.builtin.set_fact:
    dc_verify_status: >-
      {%- set results = _step02_output.results | default([]) -%}
      {%- set existing_values = results | selectattr('exists') | map(attribute='value') | map('int') | list -%}
      {{- 'ERROR' if results | length != 4 else
          'PASS' if existing_values | length == 4 and (existing_values | reject('equalto', 0) | list | length == 0) else
          'FAIL' -}}
    _cis_status: >-
      {%- set results = _step02_output.results | default([]) -%}
      {%- set existing_values = results | selectattr('exists') | map(attribute='value') | map('int') | list -%}
      {{- 'ERROR' if results | length != 4 else
          'PASS' if existing_values | length == 4 and (existing_values | reject('equalto', 0) | list | length == 0) else
          'FAIL' -}}
  when: is_dc | bool

- name: "Req step-05 - Verify LLTDIO registry values for Member Server"
  ansible.builtin.set_fact:
    member_verify_status: >-
      {%- set results = _step03_output.results | default([]) -%}
      {%- set existing_values = results | selectattr('exists') | map(attribute='value') | map('int') | list -%}
      {{- 'ERROR' if results | length != 4 else
          'PASS' if existing_values | length == 4 and (existing_values | reject('equalto', 0) | list | length == 0) else
          'FAIL' -}}
    _cis_status: >-
      {%- set results = _step03_output.results | default([]) -%}
      {%- set existing_values = results | selectattr('exists') | map(attribute='value') | map('int') | list -%}
      {{- 'ERROR' if results | length != 4 else
          'PASS' if existing_values | length == 4 and (existing_values | reject('equalto', 0) | list | length == 0) else
          'FAIL' -}}
  when: is_member | bool

- name: "Req step-06 - Set cis_result"
  ansible.builtin.set_fact:
    cis_result: >-
      {{- 'ERROR' if (role_detection_error | bool) else
          'PASS' if (is_dc | bool) and (dc_verify_status | default('ERROR') | trim == 'PASS') else
          'FAIL' if (is_dc | bool) and (dc_verify_status | default('ERROR') | trim == 'FAIL') else
          'ERROR' if (is_dc | bool) else
          'PASS' if (is_member | bool) and (member_verify_status | default('ERROR') | trim == 'PASS') else
          'FAIL' if (is_member | bool) and (member_verify_status | default('ERROR') | trim == 'FAIL') else
          'ERROR' if (is_member | bool) else
          'SKIP' -}}

- name: "Req step-07 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 18.6.9.1"
    - "Reference: CIS Benchmark checkpoint 18.6.9.1"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: Detect Windows server role using Win32_ComputerSystem DomainRole property"
    - "  Command: (Get-CimInstance Win32_ComputerSystem).DomainRole"
    - "  Exit code: {{ _step01_output.rc | default(-1) }}"
    - "  Data: {{ _step01_output.stdout | default('') | trim }}"
    - "  Status: {{ 'PASS' if ((_step01_output.stdout | default('') | trim) in ['1','2','3','4','5']) else 'ERROR' }}"
    - "  Details: {{ 'Detected DomainRole=' ~ (_step01_output.stdout | default('') | trim) if ((_step01_output.stdout | default('') | trim) in ['1','2','3','4','5']) else 'Detection failed or unrecognized value' }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: Read LLTDIO registry values for Domain Controller"
    - "  Command: ansible.windows.win_reg_stat loop over ['AllowLLTDIOOnDomain','AllowLLTDIOOnPublicNet','EnableLLTDIO','ProhibitLLTDIOOnPrivateNet']"
    - "  Exit code: {{ -1 if not (is_dc | bool) else 0 if ((_step02_output.results | default([]) | length) == 4) else 1 }}"
    - "  Data: {{ _step02_output.results | default([]) | to_json }}"
    - "  Status: {{ 'SKIP' if not (is_dc | bool) else 'ERROR' if ((_step02_output.results | default([]) | length) != 4) else 'PASS' }}"
    - "  Details: {{ 'Not applicable on this server role' if not (is_dc | bool) else 'Read 4 registry values' if ((_step02_output.results | default([]) | length) == 4) else 'Registry read did not return 4 values' }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: Read LLTDIO registry values for Member Server"
    - "  Command: ansible.windows.win_reg_stat loop over ['AllowLLTDIOOnDomain','AllowLLTDIOOnPublicNet','EnableLLTDIO','ProhibitLLTDIOOnPrivateNet']"
    - "  Exit code: {{ -1 if not (is_member | bool) else 0 if ((_step03_output.results | default([]) | length) == 4) else 1 }}"
    - "  Data: {{ _step03_output.results | default([]) | to_json }}"
    - "  Status: {{ 'SKIP' if not (is_member | bool) else 'ERROR' if ((_step03_output.results | default([]) | length) != 4) else 'PASS' }}"
    - "  Details: {{ 'Not applicable on this server role' if not (is_member | bool) else 'Read 4 registry values' if ((_step03_output.results | default([]) | length) == 4) else 'Registry read did not return 4 values' }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: Verify LLTDIO registry values for Domain Controller"
    - "  Command: set_fact dc_verify_status from win_reg_stat loop results"
    - "  Exit code: {{ -1 if not (is_dc | bool) else 0 if (dc_verify_status | default('ERROR') | trim) in ['PASS','FAIL'] else 1 }}"
    - "  Data: {{ dc_verify_status | default('ERROR') | trim }}"
    - "  Status: {{ 'SKIP' if not (is_dc | bool) else (dc_verify_status | default('ERROR') | trim) }}"
    - "  Details: {{ 'Not applicable on this server role' if not (is_dc | bool) else 'Compliant: all four LLTDIO values exist and equal 0' if ((dc_verify_status | default('ERROR') | trim) == 'PASS') else 'Non-compliant or unable to verify: ' ~ (dc_verify_status | default('ERROR') | trim) }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: Verify LLTDIO registry values for Member Server"
    - "  Command: set_fact member_verify_status from win_reg_stat loop results"
    - "  Exit code: {{ -1 if not (is_member | bool) else 0 if (member_verify_status | default('ERROR') | trim) in ['PASS','FAIL'] else 1 }}"
    - "  Data: {{ member_verify_status | default('ERROR') | trim }}"
    - "  Status: {{ 'SKIP' if not (is_member | bool) else (member_verify_status | default('ERROR') | trim) }}"
    - "  Details: {{ 'Not applicable on this server role' if not (is_member | bool) else 'Compliant: all four LLTDIO values exist and equal 0' if ((member_verify_status | default('ERROR') | trim) == 'PASS') else 'Non-compliant or unable to verify: ' ~ (member_verify_status | default('ERROR') | trim) }}"
    - ""
    - "REQUIREMENT 06 - {{ req_06 }}:"
    - "  Task: Store final audit result in cis_result"
    - "  Command: set_fact cis_result from active branch verify status"
    - "  Exit code: {{ 0 if (cis_result | default('ERROR') | trim) in ['PASS','FAIL','SKIP','ERROR'] else 1 }}"
    - "  Data: {{ cis_result | default('ERROR') | trim }}"
    - "  Status: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ 'Overall compliance is ' ~ (cis_result | default('ERROR') | trim) }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ 'Overall compliance is ' ~ (cis_result | default('ERROR') | trim) }}"
    - "========================================================"
