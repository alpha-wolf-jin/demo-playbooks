---
- name: Initialize meta data variables
  include_vars: cis_audit_var_2_3_1_1.yml

- name: "Req step-01 - Read Accounts Guest account status using win_security_policy"
  community.windows.win_security_policy:
    section: System Access
    key: EnableGuestAccount
    value: 0
  check_mode: true
  register: _step01_output
  failed_when: false
  changed_when: false

- name: "Gather local Guest account state"
  ansible.windows.win_shell: |
    {% raw %}
    $u = Get-LocalUser -Name 'Guest' -ErrorAction SilentlyContinue
    if (-not $u) { Write-Output 'NOT_FOUND'; exit 2 }
    if ($u.Enabled) { Write-Output 'Enabled' } else { Write-Output 'Disabled' }
    {% endraw %}
  register: _guest_check
  failed_when: false
  changed_when: false

- name: "Store requirement 01 details"
  ansible.builtin.set_fact:
    task_01_name: "Read Guest account status via win_security_policy"
    task_01_cmd: "community.windows.win_security_policy section=System Access key=EnableGuestAccount value=0 check_mode=true"
    task_01_rc: "{{ _step01_output.rc | default(0) }}"
    data_01: "policy_changed={{ _step01_output.changed | default('unknown') }}"
    status_01: "{{ 'PASS' if _step01_output is defined else 'ERROR' }}"
    details_01: "Read-only compliance check via win_security_policy"
    _policy_changed: "{{ _step01_output.changed | default(true) | bool }}"
    _guest_state: "{{ _guest_check.stdout | default('') | trim }}"

- name: "Req step-02 - Evaluate whether Guest account status is Disabled"
  ansible.builtin.set_fact:
    task_02_name: "Evaluate Guest account status"
    task_02_cmd: "N/A"
    task_02_rc: 0
    data_02: "guest_state={{ _guest_state | default('ERROR') | trim }}; policy_changed={{ _policy_changed | default(true) | bool }}"
    status_02: "{{ 'SKIP' if _guest_state | default('') | trim == 'NOT_FOUND' else 'PASS' if (_guest_state | default('') | trim in ['Disabled', 'False']) and not (_policy_changed | default(true) | bool) else 'FAIL' if (_guest_state | default('') | trim in ['Enabled', 'True']) or (_policy_changed | default(true) | bool) else 'ERROR' }}"
    _cis_status: "{{ 'SKIP' if _guest_state | default('') | trim == 'NOT_FOUND' else 'PASS' if (_guest_state | default('') | trim in ['Disabled', 'False']) and not (_policy_changed | default(true) | bool) else 'FAIL' if (_guest_state | default('') | trim in ['Enabled', 'True']) or (_policy_changed | default(true) | bool) else 'ERROR' }}"
    details_02: "Compliance derived from Guest local state and policy check"

- name: "Req step-03 - Store final audit result in cis_result"
  ansible.builtin.set_fact:
    task_03_name: "Store final audit result"
    task_03_cmd: "N/A"
    task_03_rc: 0
    data_03: "{{ _cis_status | default('ERROR') | trim }}"
    status_03: "{{ _cis_status | default('ERROR') | trim }}"
    details_03: "Final compliance result"
    cis_result: "{{ _cis_status | default('ERROR') | trim }}"

- name: "Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 2.3.1.1"
    - "Reference: CIS Benchmark checkpoint 2.3.1.1"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not recorded') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not recorded') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('ERROR') | trim }}"
    - "  Details: {{ details_02 | default('') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not recorded') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: {{ details_03 | default('Not evaluated') | trim }}"
    - "========================================================"
