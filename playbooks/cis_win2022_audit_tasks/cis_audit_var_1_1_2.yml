max_password_age_days: '180'
req_01: "Check if the Windows server role is Domain Controller or Member Server using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 4 or 5 for DC, 0-3 for Member Server."
req_02: "Check if Active Directory module is available for DC path using command: `Get-Module -ListAvailable -Name ActiveDirectory`. Expected result: module present."
req_03: "Check DC default domain password policy MaxPasswordAge using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: days ≤ {{ max_password_age_days }} and > 0."
req_04: |-
  Check DC GPO setting for Maximum password age using command: `Get-GPO -Name \"Default Domain Policy\" | Get-GPOReport -ReportType Xml | Select-String 'MaxPasswordAge'`. Expected result: value ≤ {{ max_password_age_days }} and > 0.
req_05: |-
  Check member server effective local policy Maximum password age using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: value ≤ {{ max_password_age_days }} and > 0.
req_06: "Check if the policy value is not 0 for DC path using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: value > 0."
req_07: |-
  Check if the policy value is not 0 for member server path using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: value > 0.
req_08: "Check if the policy value is {{ max_password_age_days }} or fewer days for DC path using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: value ≤ {{ max_password_age_days }}."
req_09: |-
  Check if the policy value is {{ max_password_age_days }} or fewer days for member server path using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: value ≤ {{ max_password_age_days }}.
req_10: |-
  Check if the policy is applied via Default Domain Policy GPO for DC using command: `Get-GPO -Name \"Default Domain Policy\" | Get-GPOReport -ReportType Xml | Select-String 'MaxPasswordAge'`. Expected result: setting present.
req_11: |-
  Check if the policy is applied via local security policy for member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: setting present.
req_12: "Check if the OS is Windows for applicability using command: `$env:OS`. Expected result: Windows_NT."
req_13: "Check if the domain controller role is valid for DC path using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 4 or 5."
req_14: "Check if the member server role is valid for member server path using command: `(Get-WmiObject Win32_ComputerSystem).DomainRole`. Expected result: 0, 1, 2, or 3."
req_15: "Check if the password policy is globally effective for DC using command: `Get-ADDefaultDomainPasswordPolicy`. Expected result: policy object exists."
req_16: |-
  Check if the password policy is locally effective for member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: policy value present.
req_17: "Check if the policy value is within range 1-{{ max_password_age_days }} for DC using command: `(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge`. Expected result: value between 1 and {{ max_password_age_days }}."
req_18: |-
  Check if the policy value is within range 1-{{ max_password_age_days }} for member server using command: `$tmp = \"$env:TEMP\\secpol.cfg\"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String 'MaximumPasswordAge'`. Expected result: value between 1 and {{ max_password_age_days }}.
req_19: |-
  Check if the policy is configured in Default Domain Policy GPO for DC using command: `Get-GPO -Name \"Default Domain Policy\" | Get-GPOReport -ReportType Xml | Select-String 'MaxPasswordAge'`. Expected result: setting exists.
req_20: "Check overall compliance: PASS if all checks pass for the applicable role, FAIL if any check fails, SKIP only if OS is not Windows. Expected result: PASS or FAIL."
req_21: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
