req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: |-
  If Domain Controller: Use ansible.windows.win_reg_stat to read the GP registry key: path='HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters' name='DisableIPSourceRouting'. The module returns structured data — result.exists (bool) and result.value (integer for REG_DWORD). Do NOT use win_shell or Get-ItemProperty — win_reg_stat is the correct read-only module for registry keys. changed_when: false; failed_when: false.
req_03: |-
  If Member Server: Use ansible.windows.win_reg_stat to read the GP registry key: path='HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters' name='DisableIPSourceRouting'. The module returns structured data — result.exists (bool) and result.value (integer for REG_DWORD). Do NOT use win_shell or Get-ItemProperty — win_reg_stat is the correct read-only module for registry keys. changed_when: false; failed_when: false.
req_04: "If Domain Controller: Evaluate whether 'Ensure 'MSS: (DisableIPSourceRouting) IP source routing protection level' is set to 'Enabled: Highest protection, source routing is completely disabled'' is set correctly. Check the registry data collected by the previous step — the result has structured fields, NOT stdout text: PASS if .exists == true AND .value == 2 (REG_DWORD integer). FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 2. ERROR if the registry read step failed unexpectedly. Do NOT check .stdout or .rc — the result is a structured dict."
req_05: "If Member Server: Evaluate whether 'Ensure 'MSS: (DisableIPSourceRouting) IP source routing protection level' is set to 'Enabled: Highest protection, source routing is completely disabled'' is set correctly. Check the registry data collected by the previous step — the result has structured fields, NOT stdout text: PASS if .exists == true AND .value == 2 (REG_DWORD integer). FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 2. ERROR if the registry read step failed unexpectedly. Do NOT check .stdout or .rc — the result is a structured dict."
req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_07: "Create a task named 'Generate audit report' using debug msg with EXACTLY this format: AUDIT REPORT — CIS 18.5.3, Reference: CIS Benchmark checkpoint 18.5.3, then REQUIREMENT NN entries with Task, Command, Exit code, Data, Status, Details, and OVERALL COMPLIANCE Result cis_result."
