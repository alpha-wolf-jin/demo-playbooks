req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: |-
  If Domain Controller: Read the CIS benchmark GP registry key using PowerShell Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\PublicProfile\\Logging' -Name LogSuccessfulConnections -ErrorAction SilentlyContinue. If the key is absent output 'NOT_CONFIGURED' and exit 1. If present output the numeric value. changed_when: false; failed_when: false.
req_03: |-
  If Member Server: Read the CIS benchmark GP registry key using PowerShell Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\PublicProfile\\Logging' -Name LogSuccessfulConnections -ErrorAction SilentlyContinue. If the key is absent output 'NOT_CONFIGURED' and exit 1. If present output the numeric value. changed_when: false; failed_when: false.
req_04: "If Domain Controller: Evaluate whether 'Ensure 'Windows Firewall: Public: Logging: Log successful connections' is set to 'Yes'' is set correctly: PASS if the registry value equals 1. FAIL if the value is 0 or absent (NOT_CONFIGURED). ERROR if the registry read step failed unexpectedly."
req_05: "If Member Server: Evaluate whether 'Ensure 'Windows Firewall: Public: Logging: Log successful connections' is set to 'Yes'' is set correctly: PASS if the registry value equals 1. FAIL if the value is 0 or absent (NOT_CONFIGURED). ERROR if the registry read step failed unexpectedly."
req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
