---
- name: Initialize meta data variables
  include_vars: cis_audit_var_9_2_7.yml

- name: "Req step-01 - Detect Windows server role using DomainRole property"
  ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
  register: _step01_output
  changed_when: false
  failed_when: false

- name: "Req step-01 - Set role flags and store detection details"
  ansible.builtin.set_fact:
    is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
    is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
    role_detection_error: "{{ (_step01_output.rc | default(-1) != 0) or ((_step01_output.stdout | default('') | trim) not in ['0', '1', '2', '3', '4', '5']) }}"
    data_01: "{{ _step01_output.stdout | default('') | trim }}"
    status_01: "{{ 'ERROR' if (_step01_output.rc | default(-1) != 0) or ((_step01_output.stdout | default('') | trim) not in ['0', '1', '2', '3', '4', '5']) else 'PASS' }}"
    task_01_name: "Detect Windows server role using DomainRole property"
    task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
    task_01_rc: "{{ _step01_output.rc | default(-1) }}"
    details_01: "{{ 'DomainRole ' ~ (_step01_output.stdout | default('') | trim) ~ ' detected successfully' if ((_step01_output.rc | default(-1) == 0) and ((_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3', '4', '5'])) else 'Role detection failed or unrecognized DomainRole' }}"

- name: "Req step-02 - Read Windows Firewall Private Profile Logging registry for Domain Controller"
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging' -Name LogSuccessfulConnections -ErrorAction SilentlyContinue).LogSuccessfulConnections
    if ($null -eq $v) { Write-Output 'NOT_CONFIGURED'; exit 1 }
    Write-Output $v
  register: _step02_output
  changed_when: false
  failed_when: false
  when: is_dc | bool

- name: "Req step-02 - Store Domain Controller registry read details"
  ansible.builtin.set_fact:
    data_02: "{{ _step02_output.stdout | default('') | trim }}"
    status_02: "{{ 'PASS' if ((_step02_output.rc | default(-1)) == 0) or ((_step02_output.stdout | default('') | trim) == 'NOT_CONFIGURED') else 'ERROR' }}"
    task_02_name: "Read Windows Firewall Private Profile Logging registry for Domain Controller"
    task_02_cmd: |-
      Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\PrivateProfile\\Logging' -Name LogSuccessfulConnections -ErrorAction SilentlyContinue; output value or NOT_CONFIGURED and exit 1
    task_02_rc: "{{ _step02_output.rc | default(-1) }}"
    details_02: "{{ 'Domain Controller registry read completed' if ((_step02_output.rc | default(-1)) == 0) or ((_step02_output.stdout | default('') | trim) == 'NOT_CONFIGURED') else 'Registry read failed unexpectedly' }}"
  when: is_dc | bool

- name: "Req step-03 - Read Windows Firewall Private Profile Logging registry for Member Server"
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile\Logging' -Name LogSuccessfulConnections -ErrorAction SilentlyContinue).LogSuccessfulConnections
    if ($null -eq $v) { Write-Output 'NOT_CONFIGURED'; exit 1 }
    Write-Output $v
  register: _step03_output
  changed_when: false
  failed_when: false
  when: is_member | bool

- name: "Req step-03 - Store Member Server registry read details"
  ansible.builtin.set_fact:
    data_03: "{{ _step03_output.stdout | default('') | trim }}"
    status_03: "{{ 'PASS' if ((_step03_output.rc | default(-1)) == 0) or ((_step03_output.stdout | default('') | trim) == 'NOT_CONFIGURED') else 'ERROR' }}"
    task_03_name: "Read Windows Firewall Private Profile Logging registry for Member Server"
    task_03_cmd: |-
      Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\PrivateProfile\\Logging' -Name LogSuccessfulConnections -ErrorAction SilentlyContinue; output value or NOT_CONFIGURED and exit 1
    task_03_rc: "{{ _step03_output.rc | default(-1) }}"
    details_03: "{{ 'Member Server registry read completed' if ((_step03_output.rc | default(-1)) == 0) or ((_step03_output.stdout | default('') | trim) == 'NOT_CONFIGURED') else 'Registry read failed unexpectedly' }}"
  when: is_member | bool

- name: "Req step-04 - Evaluate Domain Controller firewall logging compliance"
  ansible.builtin.set_fact:
    _cis_status: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if ((_step02_output.rc | default(-1) != 0) and ((_step02_output.stdout | default('') | trim) != 'NOT_CONFIGURED')) else 'PASS' if ((_step02_output.stdout | default('') | trim) == '1') else 'FAIL' }}"
    status_04: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if ((_step02_output.rc | default(-1) != 0) and ((_step02_output.stdout | default('') | trim) != 'NOT_CONFIGURED')) else 'PASS' if ((_step02_output.stdout | default('') | trim) == '1') else 'FAIL' }}"
    data_04: "{{ _step02_output.stdout | default('') | trim }}"
    task_04_name: "Evaluate Domain Controller firewall logging compliance"
    task_04_cmd: "Compare Domain Controller registry value to expected value 1"
    task_04_rc: "{{ _step02_output.rc | default(-1) }}"
    details_04: "{{ 'Registry value equals 1: compliant' if (_step02_output.stdout | default('') | trim) == '1' else 'Registry value is 0 or absent (NOT_CONFIGURED): non-compliant' if (_step02_output.stdout | default('') | trim) in ['0', 'NOT_CONFIGURED'] else 'Unexpected registry read error' }}"
  when: is_dc | bool

- name: "Req step-05 - Evaluate Member Server firewall logging compliance"
  ansible.builtin.set_fact:
    _cis_status: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if ((_step03_output.rc | default(-1) != 0) and ((_step03_output.stdout | default('') | trim) != 'NOT_CONFIGURED')) else 'PASS' if ((_step03_output.stdout | default('') | trim) == '1') else 'FAIL' }}"
    status_05: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if ((_step03_output.rc | default(-1) != 0) and ((_step03_output.stdout | default('') | trim) != 'NOT_CONFIGURED')) else 'PASS' if ((_step03_output.stdout | default('') | trim) == '1') else 'FAIL' }}"
    data_05: "{{ _step03_output.stdout | default('') | trim }}"
    task_05_name: "Evaluate Member Server firewall logging compliance"
    task_05_cmd: "Compare Member Server registry value to expected value 1"
    task_05_rc: "{{ _step03_output.rc | default(-1) }}"
    details_05: "{{ 'Registry value equals 1: compliant' if (_step03_output.stdout | default('') | trim) == '1' else 'Registry value is 0 or absent (NOT_CONFIGURED): non-compliant' if (_step03_output.stdout | default('') | trim) in ['0', 'NOT_CONFIGURED'] else 'Unexpected registry read error' }}"
  when: is_member | bool

- name: "Req step-06 - Set cis_result from active branch verification status"
  ansible.builtin.set_fact:
    cis_result: "{{ 'ERROR' if (role_detection_error | bool) else 'SKIP' if not (is_dc | bool) and not (is_member | bool) else (status_04 | default('SKIP') | trim) if (is_dc | bool) else (status_05 | default('SKIP') | trim) }}"
    status_06: "{{ 'ERROR' if (role_detection_error | bool) else 'SKIP' if not (is_dc | bool) and not (is_member | bool) else (status_04 | default('SKIP') | trim) if (is_dc | bool) else (status_05 | default('SKIP') | trim) }}"
    data_06: "Derived from active branch verification status"
    task_06_name: "Set cis_result from active branch verification status"
    task_06_cmd: "set_fact: cis_result = overall compliance status"
    task_06_rc: 0
    details_06: "Overall compliance status stored in cis_result"

- name: "Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 9.2.7"
    - "Reference: CIS Benchmark checkpoint 9.2.7"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: {{ task_01_name | default('Not executed') }}"
    - "  Command: {{ task_01_cmd | default('N/A') }}"
    - "  Exit code: {{ task_01_rc | default(-1) }}"
    - "  Data: {{ data_01 | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: {{ task_02_name | default('Not executed') }}"
    - "  Command: {{ task_02_cmd | default('N/A') }}"
    - "  Exit code: {{ task_02_rc | default(-1) }}"
    - "  Data: {{ data_02 | default('') | trim }}"
    - "  Status: {{ status_02 | default('SKIP') | trim }}"
    - "  Details: {{ details_02 | default('Not applicable') | trim }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: {{ task_03_name | default('Not executed') }}"
    - "  Command: {{ task_03_cmd | default('N/A') }}"
    - "  Exit code: {{ task_03_rc | default(-1) }}"
    - "  Data: {{ data_03 | default('') | trim }}"
    - "  Status: {{ status_03 | default('SKIP') | trim }}"
    - "  Details: {{ details_03 | default('Not applicable') | trim }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: {{ task_04_name | default('Not executed') }}"
    - "  Command: {{ task_04_cmd | default('N/A') }}"
    - "  Exit code: {{ task_04_rc | default(-1) }}"
    - "  Data: {{ data_04 | default('') | trim }}"
    - "  Status: {{ status_04 | default('SKIP') | trim }}"
    - "  Details: {{ details_04 | default('Not applicable') | trim }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: {{ task_05_name | default('Not executed') }}"
    - "  Command: {{ task_05_cmd | default('N/A') }}"
    - "  Exit code: {{ task_05_rc | default(-1) }}"
    - "  Data: {{ data_05 | default('') | trim }}"
    - "  Status: {{ status_05 | default('SKIP') | trim }}"
    - "  Details: {{ details_05 | default('Not applicable') | trim }}"
    - ""
    - "REQUIREMENT 06 - {{ req_06 }}:"
    - "  Task: {{ task_06_name | default('Not executed') }}"
    - "  Command: {{ task_06_cmd | default('N/A') }}"
    - "  Exit code: {{ task_06_rc | default(-1) }}"
    - "  Data: {{ data_06 | default('') | trim }}"
    - "  Status: {{ status_06 | default('ERROR') | trim }}"
    - "  Details: {{ details_06 | default('') | trim }}"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "========================================================"
