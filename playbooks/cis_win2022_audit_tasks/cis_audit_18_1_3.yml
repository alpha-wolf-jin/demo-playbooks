---
- name: Initialize meta data variables
  include_vars: cis_audit_var_18_1_3.yml

- name: "Req step-01 - Detect Windows server role using DomainRole property"
  ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
  register: _step01_output
  changed_when: false
  failed_when: false

- name: "Req step-01 - Set is_dc and is_member facts based on DomainRole"
  ansible.builtin.set_fact:
    is_dc: "{{ _step01_output.stdout | trim in ['4', '5'] }}"
    is_member: "{{ _step01_output.stdout | trim in ['1', '2', '3'] }}"
    status_01: "{{ 'PASS' if (_step01_output.stdout | trim in ['1','2','3','4','5']) else 'ERROR' }}"
    data_01: "{{ _step01_output.stdout | trim }}"
    details_01: "{{ 'DomainRole ' ~ (_step01_output.stdout | trim) ~ ' detected' if (_step01_output.stdout | trim in ['1','2','3','4','5']) else 'Unable to detect a valid DomainRole' }}"

- name: "Req step-02 - Read AllowOnlineTips registry value on Domain Controller"
  ansible.windows.win_reg_stat:
    path: |-
      HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: AllowOnlineTips
  register: _step02_output
  when: is_dc | bool
  changed_when: false
  failed_when: false

- name: "Req step-03 - Read AllowOnlineTips registry value on Member Server"
  ansible.windows.win_reg_stat:
    path: |-
      HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: AllowOnlineTips
  register: _step03_output
  when: is_member | bool
  changed_when: false
  failed_when: false

- name: "Req step-04 - Evaluate Allow Online Tips compliance status on Domain Controller"
  ansible.builtin.set_fact:
    status_04: >-
      {{ 'ERROR' if (_step02_output.failed | default(false) | bool) else
         'PASS' if ((_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 0)) else
         'FAIL' }}
    _cis_status: >-
      {{ 'ERROR' if (_step02_output.failed | default(false) | bool) else
         'PASS' if ((_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 0)) else
         'FAIL' }}
    data_04: "{{ 'exists=' ~ (_step02_output.exists | default(false) | string) ~ ', value=' ~ (_step02_output.value | default('missing') | string) }}"
    details_04: >-
      {{ 'Compliant: AllowOnlineTips exists and equals 0' if ((_step02_output.exists | default(false) | bool) and ((_step02_output.value | default(-1) | int) == 0)) else
         'Non-compliant: registry value missing or not equal to 0' if not (_step02_output.failed | default(false) | bool) else
         'Registry read failed unexpectedly' }}
  when: is_dc | bool

- name: "Req step-05 - Evaluate Allow Online Tips compliance status on Member Server"
  ansible.builtin.set_fact:
    status_05: >-
      {{ 'ERROR' if (_step03_output.failed | default(false) | bool) else
         'PASS' if ((_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 0)) else
         'FAIL' }}
    _cis_status: >-
      {{ 'ERROR' if (_step03_output.failed | default(false) | bool) else
         'PASS' if ((_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 0)) else
         'FAIL' }}
    data_05: "{{ 'exists=' ~ (_step03_output.exists | default(false) | string) ~ ', value=' ~ (_step03_output.value | default('missing') | string) }}"
    details_05: >-
      {{ 'Compliant: AllowOnlineTips exists and equals 0' if ((_step03_output.exists | default(false) | bool) and ((_step03_output.value | default(-1) | int) == 0)) else
         'Non-compliant: registry value missing or not equal to 0' if not (_step03_output.failed | default(false) | bool) else
         'Registry read failed unexpectedly' }}
  when: is_member | bool

- name: "Req step-06 - Store final audit result in cis_result variable"
  ansible.builtin.set_fact:
    cis_result: >-
      {{ 'ERROR' if not (is_dc | bool) and not (is_member | bool) else
         (status_04 | default('ERROR') | trim) if (is_dc | bool) else
         (status_05 | default('ERROR') | trim) }}

- name: "Req step-07 - Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 18.1.3"
    - "Reference: CIS Benchmark checkpoint 18.1.3"
    - ""
    - "REQUIREMENT 01 - {{ req_01 }}:"
    - "  Task: Detect Windows server role using DomainRole property"
    - "  Command: (Get-WmiObject Win32_ComputerSystem).DomainRole"
    - "  Exit code: {{ _step01_output.rc | default(-1) }}"
    - "  Data: {{ _step01_output.stdout | default('') | trim }}"
    - "  Status: {{ status_01 | default('ERROR') | trim }}"
    - "  Details: {{ details_01 | default('Not evaluated') | trim }}"
    - ""
    - "REQUIREMENT 02 - {{ req_02 }}:"
    - "  Task: Read AllowOnlineTips registry value on Domain Controller using win_reg_stat"
    - "  Command: ansible.windows.win_reg_stat path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' name='AllowOnlineTips'"
    - "  Exit code: N/A"
    - "  Data: {{ ('N/A' if not (is_dc | bool) else ('exists=' ~ (_step02_output.exists | default(false) | string) ~ ', value=' ~ (_step02_output.value | default('missing') | string))) }}"
    - "  Status: {{ ('SKIP' if not (is_dc | bool) else ('ERROR' if (_step02_output.failed | default(false) | bool) else 'PASS')) }}"
    - "  Details: {{ ('Skipped: member server branch not applicable' if not (is_dc | bool) else ('Registry read failed' if (_step02_output.failed | default(false) | bool) else 'Registry read completed')) }}"
    - ""
    - "REQUIREMENT 03 - {{ req_03 }}:"
    - "  Task: Read AllowOnlineTips registry value on Member Server using win_reg_stat"
    - "  Command: ansible.windows.win_reg_stat path='HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' name='AllowOnlineTips'"
    - "  Exit code: N/A"
    - "  Data: {{ ('N/A' if not (is_member | bool) else ('exists=' ~ (_step03_output.exists | default(false) | string) ~ ', value=' ~ (_step03_output.value | default('missing') | string))) }}"
    - "  Status: {{ ('SKIP' if not (is_member | bool) else ('ERROR' if (_step03_output.failed | default(false) | bool) else 'PASS')) }}"
    - "  Details: {{ ('Skipped: domain controller branch not applicable' if not (is_member | bool) else ('Registry read failed' if (_step03_output.failed | default(false) | bool) else 'Registry read completed')) }}"
    - ""
    - "REQUIREMENT 04 - {{ req_04 }}:"
    - "  Task: Evaluate Allow Online Tips compliance status on Domain Controller"
    - "  Command: ansible.builtin.set_fact status_04"
    - "  Exit code: 0"
    - "  Data: {{ data_04 | default('Not applicable') | trim }}"
    - "  Status: {{ status_04 | default('SKIP') | trim }}"
    - "  Details: {{ details_04 | default('Not applicable') | trim }}"
    - ""
    - "REQUIREMENT 05 - {{ req_05 }}:"
    - "  Task: Evaluate Allow Online Tips compliance status on Member Server"
    - "  Command: ansible.builtin.set_fact status_05"
    - "  Exit code: 0"
    - "  Data: {{ data_05 | default('Not applicable') | trim }}"
    - "  Status: {{ status_05 | default('SKIP') | trim }}"
    - "  Details: {{ details_05 | default('Not applicable') | trim }}"
    - ""
    - "REQUIREMENT 06 - {{ req_06 }}:"
    - "  Task: Store final audit result in cis_result variable"
    - "  Command: ansible.builtin.set_fact cis_result"
    - "  Exit code: 0"
    - "  Data: {{ cis_result | default('ERROR') | trim }}"
    - "  Status: PASS"
    - "  Details: Final audit result computed and stored in cis_result"
    - ""
    - "REQUIREMENT 07 - {{ req_07 }}:"
    - "  Task: Generate audit report"
    - "  Command: ansible.builtin.debug"
    - "  Exit code: 0"
    - "  Data: Audit report generated"
    - "  Status: PASS"
    - "  Details: Audit report generated successfully"
    - ""
    - "========================================================"
    - "OVERALL COMPLIANCE:"
    - "  Result: {{ cis_result | default('ERROR') | trim }}"
    - "  Details: See per-requirement statuses."
    - "========================================================"
