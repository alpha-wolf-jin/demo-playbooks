      {%- elif (result_04.stdout | default('0') | trim | int) > 0 and (result_04.stdout | default('0') | trim | int) <= 365 -%}PASS
      {%- else -%}FAIL
      {%- endif -%}
    details_04: "GPO MaxPasswordAge value: {{ result_04.stdout | default('N/A') | trim }}"

    # ---- Req 5 ----
    # FIX: build path entirely inside PowerShell ($env:TEMP) so no templated
# newline can leak into the path. Trim templated values defensively too.
- name: "Req 5 - Check member server local policy maximum age via secedit"
  ansible.windows.win_shell: |
    $cfg = Join-Path $env:TEMP 'cis_1_1_2_secpol.cfg'
    & secedit.exe /export /cfg "$cfg" /areas SECURITYPOLICY /quiet | Out-Null
    if (Test-Path -LiteralPath $cfg) {
      $m = Select-String -Path $cfg -Pattern 'MaximumPasswordAge\s*=\s*(\d+)' | Select-Object -First 1
      if ($m) {
        Write-Output ([regex]::Match($m.Line, '\d+').Value)
      } else {
        Write-Output 'NOT_FOUND'
      }
      Remove-Item -LiteralPath $cfg -ErrorAction SilentlyContinue
    } else {
      Write-Output 'EXPORT_FAILED'
    }
  register: result_05
  failed_when: false
  changed_when: false
  when: "is_member | bool"

