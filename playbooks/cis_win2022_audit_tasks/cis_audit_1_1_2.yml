# ---- Req 18 ----
- name: "Req 18 - Check DC fine-grained password policies exist"
  ansible.windows.win_shell: |
    try {
      $psos = Get-ADFineGrainedPasswordPolicy -ErrorAction Stop
      if (-not $psos) {
        Write-Output 'NO_POLICIES|none configured'
      } else {
        $out = @()
        $compliant = $true
        foreach ($p in $psos) {
          $days = -1
          if ($p.MaxPasswordAge -ne $null) {
            $days = [int][math]::Floor($p.MaxPasswordAge.TotalDays)
          }
          $out += "$($p.Name)=$days"
          if ($days -le 0 -or $days -gt 365) { $compliant = $false }
        }
        if ($compliant) { Write-Output ('PASS|' + ($out -join '; ')) }
        else { Write-Output ('FAIL|' + ($out -join '; ')) }
      }
    } catch {
      Write-Output 'ERROR|Get-ADFineGrainedPasswordPolicy failed'
    }
  register: result_18
  failed_when: false
  changed_when: false
  when:
  - "is_dc | bool"
  - "(result_02.stdout | default('') | trim) == 'PRESENT'"

- name: "Store requirement 18 details"
  ansible.builtin.set_fact:
    task_18_name: "Check DC fine-grained password policies (PSOs)"
    task_18_cmd: "Get-ADFineGrainedPasswordPolicy"
    task_18_rc: "{{ result_18.rc | default(-1) }}"
    data_18: "{{ result_18.stdout | default('SKIPPED') | trim }}"
    status_18: >-
      {%- if not (is_dc | bool) -%}SKIP
      {%- elif (result_02.stdout | default('') | trim) != 'PRESENT' -%}SKIP
      {%- elif (result_18.stdout | default('') | trim).startswith('PASS') -%}PASS
      {%- elif (result_18.stdout | default('') | trim).startswith('FAIL') -%}FAIL
      {%- elif (result_18.stdout | default('') | trim).startswith('NO_POLICIES') -%}PASS
      {%- else -%}ERROR
      {%- endif -%}
    details_18: "PSO MaxPasswordAge evaluation: {{ result_18.stdout | default('N/A') | trim }}"

# ---- Req 19 ----
- name: "Req 19 - Verify all PSOs have MaxPasswordAge between 1 and 365"
  ansible.windows.win_shell: |
    try {
      $psos = Get-ADFineGrainedPasswordPolicy -ErrorAction Stop
      if (-not $psos) {
        Write-Output 'NO_POLICIES|none configured'
      } else {
        $out = @()
        $compliant = $true
        foreach ($p in $psos) {
          $days = -1
          if ($p.MaxPasswordAge -ne $null) {
            $days = [int][math]::Floor($p.MaxPasswordAge.TotalDays)
          }
          $out += "$($p.Name)=$days"
          if ($days -lt 1 -or $days -gt 365) { $compliant = $false }
        }
        if ($compliant) { Write-Output ('PASS|' + ($out -join '; ')) }
        else { Write-Output ('FAIL|' + ($out -join '; ')) }
      }
    } catch {
      Write-Output 'ERROR|Get-ADFineGrainedPasswordPolicy failed'
    }
  register: result_19
  failed_when: false
  changed_when: false
  when:
  - "is_dc | bool"
  - "(result_02.stdout | default('') | trim) == 'PRESENT'"

- name: "Store requirement 19 details"
  ansible.builtin.set_fact:
    task_19_name: "Verify all PSOs have MaxPasswordAge between 1 and 365"
    task_19_cmd: "Get-ADFineGrainedPasswordPolicy | Select-Object Name, MaxPasswordAge"
    task_19_rc: "{{ result_19.rc | default(-1) }}"
    data_19: "{{ result_19.stdout | default('SKIPPED') | trim }}"
    status_19: >-
      {%- if not (is_dc | bool) -%}SKIP
      {%- elif (result_02.stdout | default('') | trim) != 'PRESENT' -%}SKIP
      {%- elif (result_19.stdout | default('') | trim).startswith('PASS') -%}PASS
      {%- elif (result_19.stdout | default('') | trim).startswith('FAIL') -%}FAIL
      {%- elif (result_19.stdout | default('') | trim).startswith('NO_POLICIES') -%}PASS
      {%- else -%}ERROR
      {%- endif -%}
    details_19: "PSO MaxPasswordAge evaluation: {{ result_19.stdout | default('N/A') | trim }}"

# ---- Req 20 ----
- name: "Store requirement 20 details - overall compliance"
  ansible.builtin.set_fact:
