    data_20: "DC={{ is_dc }} MEMBER={{ is_member }} applicable_checks={{ [status_03, status_04, status_05, status_06, status_07, status_08, status_09, status_10, status_11, status_12, status_13, status_14, status_15, status_16, status_17, status_18, status_19] | reject('equalto', 'SKIP') | list }}"
    details_20: "Overall compliance computed from all applicable check statuses"

