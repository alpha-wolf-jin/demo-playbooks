---
- name: Initialize meta data variables
  include_vars: cis_audit_var_1_1_2.yml

- name: "Req step-12 - Check if OS is Windows"
  ansible.windows.win_shell: |
    {% raw %}$env:OS{% endraw %}
  register: _step12_output
  failed_when: false
  changed_when: false

- name: "Req step-01 - Detect server role using WMI"
  ansible.windows.win_shell: |
    {% raw %}(Get-WmiObject Win32_ComputerSystem).DomainRole{% endraw %}
  register: _step01_output
  failed_when: false
  changed_when: false

- name: "Req step-13 - Set is_dc flag from detected role"
  ansible.builtin.set_fact:
    is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
    role_error: "{{ not ((_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3', '4', '5']) }}"

  register: _step13_output
- name: "Req step-14 - Set is_member flag from detected role"
  ansible.builtin.set_fact:
    is_member: "{{ (_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3'] }}"

  register: _step14_output
- name: "Req step-15 - Check if Active Directory cmdlet is available"
  ansible.windows.win_shell: |
    {% raw %}
    if (Get-Command Get-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue) { Write-Output 'AVAILABLE' } else { Write-Output 'UNAVAILABLE' }
    {% endraw %}
  register: _step15_output
  failed_when: false
  changed_when: false
  when: is_dc | bool

- name: "Req step-02 - Check if Active Directory module is available"
  ansible.windows.win_shell: |
    {% raw %}Get-Module -ListAvailable -Name ActiveDirectory | Select-Object -ExpandProperty Name{% endraw %}
  register: _step02_output
  failed_when: false
  changed_when: false
  when: is_dc | bool

- name: "Req step-16 - Check if secedit command is available"
  ansible.windows.win_shell: |
    {% raw %}Get-Command secedit | Select-Object -ExpandProperty Name{% endraw %}
  register: _step16_output
  failed_when: false
  changed_when: false
  when: is_member | bool

- name: "Req step-15 - Set DC readiness fact"
  ansible.builtin.set_fact:
    dc_ready: "{{ (is_dc | bool) and (_step15_output.stdout | default('') | trim == 'AVAILABLE') and (_step02_output.stdout | default('') | trim | length > 0) }}"

- name: "Req step-16 - Set member readiness fact"
  ansible.builtin.set_fact:
    member_ready: "{{ (is_member | bool) and (_step16_output.stdout | default('') | trim | length > 0) }}"

- name: "Req step-03 - Check DC default domain password policy MaxPasswordAge"
  ansible.windows.win_shell: |
    {% raw %}
    $p = (Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge
    if ($p -is [TimeSpan]) { Write-Output $p.Days } else { Write-Output $p }
    {% endraw %}
  register: _step03_output
  failed_when: false
  changed_when: false
  when:
  - is_dc | bool
  - dc_ready | bool

- name: "Req step-04 - Check DC GPO setting for Maximum password age"
  ansible.windows.win_shell: |
    {% raw %}
    if (Get-Command Get-GPO -ErrorAction SilentlyContinue) {
      $xml = Get-GPO -Name "Default Domain Policy" | Get-GPOReport -ReportType XML
      $m = [regex]::Match($xml, '<MaxPwdAge>([0-9]+)</MaxPwdAge>')
      if ($m.Success) { Write-Output $m.Groups[1].Value } else { Write-Output 'NOT_FOUND' }
    } else {
      Write-Output 'CMD_NOT_FOUND'
    }
    {% endraw %}
  register: _step04_output
  failed_when: false
  changed_when: false
  when:
  - is_dc | bool
  - dc_ready | bool

- name: "Req step-05 - Check member server effective local policy MaximumPasswordAge"
  ansible.windows.win_shell: |
    {% raw %}
    $tmp = "$env:TEMP\secpol.cfg"
    secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet
    $line = Get-Content $tmp | Select-String 'MaximumPasswordAge' | Select-Object -First 1
    if ($line) {
      $m = [regex]::Match($line.Line, 'MaximumPasswordAge\s*=\s*([0-9]+)')
      if ($m.Success) { Write-Output $m.Groups[1].Value } else { Write-Output $line.Line }
    } else {
      Write-Output 'NOT_FOUND'
    }
    {% endraw %}
  register: _step05_output
  failed_when: false
  changed_when: false
  when:
  - is_member | bool
  - member_ready | bool

- name: "Req step-21 - Set derived password age values"
  ansible.builtin.set_fact:
    dc_age_days: "{{ _step03_output.stdout | default('') | trim | int }}"
    member_age_days: "{{ _step05_output.stdout | default('') | trim | int }}"

- name: "Req step-12 - Set OS check status"
  ansible.builtin.set_fact:
    status_12: "{{ 'PASS' if (_step12_output.stdout | default('') | trim == 'Windows_NT') else 'FAIL' }}"

- name: "Req step-01 - Set server role status"
  ansible.builtin.set_fact:
    status_01: "{{ 'PASS' if (_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3', '4', '5'] else 'FAIL' }}"

- name: "Req step-13 - Set DC role detection status"
  ansible.builtin.set_fact:
    status_13: "{{ 'PASS' if is_dc | bool else ('SKIP' if is_member | bool else 'ERROR') }}"

- name: "Req step-14 - Set member role detection status"
  ansible.builtin.set_fact:
    status_14: "{{ 'PASS' if is_member | bool else ('SKIP' if is_dc | bool else 'ERROR') }}"

- name: "Req step-15 - Set Group Policy cmdlet status"
  ansible.builtin.set_fact:
    status_15: "{{ 'SKIP' if not (is_dc | bool) else ('PASS' if (_step15_output.stdout | default('') | trim == 'AVAILABLE') else 'FAIL') }}"

- name: "Req step-16 - Set secedit command status"
  ansible.builtin.set_fact:
    status_16: "{{ 'SKIP' if not (is_member | bool) else ('PASS' if (_step16_output.stdout | default('') | trim | length > 0) else 'FAIL') }}"

- name: "Req step-02 - Set Active Directory module status"
  ansible.builtin.set_fact:
    status_02: "{{ 'SKIP' if not (is_dc | bool) else ('PASS' if (_step02_output.stdout | default('') | trim | length > 0) else 'FAIL') }}"

- name: "Req step-03 - Set DC MaxPasswordAge compliance status"
  ansible.builtin.set_fact:
    status_03: "{{ 'SKIP' if not (dc_ready | bool) else 'ERROR' if (_step03_output.rc | default(-1) != 0) else 'PASS' if ((dc_age_days | int) > 0 and (dc_age_days | int) <= (max_password_age_days | int)) else 'FAIL' }}"

- name: "Req step-04 - Set DC GPO MaxPwdAge status"
  ansible.builtin.set_fact:
    status_04: "{{ 'SKIP' if not (dc_ready | bool) else 'SKIP' if (_step04_output.stdout | default('') | trim == 'CMD_NOT_FOUND') else 'ERROR' if (_step04_output.rc | default(-1) != 0) else 'FAIL' if (_step04_output.stdout | default('') | trim == 'NOT_FOUND') else 'PASS' if ((_step04_output.stdout | default('') | trim | int) > 0 and (_step04_output.stdout | default('') | trim | int) <= (max_password_age_days | int)) else 'FAIL' }}"

- name: "Req step-05 - Set member MaxPasswordAge compliance status"
  ansible.builtin.set_fact:
    status_05: "{{ 'SKIP' if not (member_ready | bool) else 'ERROR' if (_step05_output.rc | default(-1) != 0) else 'PASS' if ((member_age_days | int) > 0 and (member_age_days | int) <= (max_password_age_days | int)) else 'FAIL' }}"

- name: "Req step-06 - Set DC policy not-zero status"
  ansible.builtin.set_fact:
    status_06: "{{ 'SKIP' if not (dc_ready | bool) else 'ERROR' if (_step03_output.rc | default(-1) != 0) else 'PASS' if (dc_age_days | int) > 0 else 'FAIL' }}"

  register: _step06_output
- name: "Req step-07 - Set member policy not-zero status"
  ansible.builtin.set_fact:
    status_07: "{{ 'SKIP' if not (member_ready | bool) else 'ERROR' if (_step05_output.rc | default(-1) != 0) else 'PASS' if (member_age_days | int) > 0 else 'FAIL' }}"

  register: _step07_output
- name: "Req step-08 - Set DC policy threshold status"
  ansible.builtin.set_fact:
    status_08: "{{ 'SKIP' if not (dc_ready | bool) else 'ERROR' if (_step03_output.rc | default(-1) != 0) else 'PASS' if (dc_age_days | int) <= (max_password_age_days | int) else 'FAIL' }}"

  register: _step08_output
- name: "Req step-09 - Set member policy threshold status"
  ansible.builtin.set_fact:
    status_09: "{{ 'SKIP' if not (member_ready | bool) else 'ERROR' if (_step05_output.rc | default(-1) != 0) else 'PASS' if (member_age_days | int) <= (max_password_age_days | int) else 'FAIL' }}"

  register: _step09_output
- name: "Req step-10 - Set DC compliance status"
  ansible.builtin.set_fact:
    status_10: "{{ 'SKIP' if not (dc_ready | bool) else 'ERROR' if (_step03_output.rc | default(-1) != 0) else 'PASS' if ((dc_age_days | int) > 0 and (dc_age_days | int) <= (max_password_age_days | int)) else 'FAIL' }}"

  register: _step10_output
- name: "Req step-11 - Set member compliance status"
  ansible.builtin.set_fact:
    status_11: "{{ 'SKIP' if not (member_ready | bool) else 'ERROR' if (_step05_output.rc | default(-1) != 0) else 'PASS' if ((member_age_days | int) > 0 and (member_age_days | int) <= (max_password_age_days | int)) else 'FAIL' }}"

  register: _step11_output
- name: "Req step-17 - Set DC path PASS status"
  ansible.builtin.set_fact:
    status_17: "{{ status_10 | default('SKIP') | trim }}"

  register: _step17_output
- name: "Req step-18 - Set member path PASS status"
  ansible.builtin.set_fact:
    status_18: "{{ status_11 | default('SKIP') | trim }}"

  register: _step18_output
- name: "Req step-19 - Set DC path FAIL status"
  ansible.builtin.set_fact:
    status_19: "{{ 'SKIP' if not (dc_ready | bool) else 'ERROR' if (_step03_output.rc | default(-1) != 0) else 'FAIL' if ((dc_age_days | int) > (max_password_age_days | int) or (dc_age_days | int) == 0) else 'PASS' }}"

  register: _step19_output
- name: "Req step-20 - Set member path FAIL status"
  ansible.builtin.set_fact:
    status_20: "{{ 'SKIP' if not (member_ready | bool) else 'ERROR' if (_step05_output.rc | default(-1) != 0) else 'FAIL' if ((member_age_days | int) > (max_password_age_days | int) or (member_age_days | int) == 0) else 'PASS' }}"

  register: _step20_output
- name: "Req step-21 - Store final audit result in cis_result"
  ansible.builtin.set_fact:
    cis_result: "{{ 'ERROR' if not (is_dc | bool) and not (is_member | bool) else (status_10 if is_dc | bool else status_11) }}"
    status_21: "{{ 'ERROR' if not (is_dc | bool) and not (is_member | bool) else (status_10 if is_dc | bool else status_11) }}"
    password_age_days: "{{ (dc_age_days | string) if (is_dc | bool and dc_ready | bool) else ((member_age_days | string) if (is_member | bool and member_ready | bool) else 'N/A') }}"

- name: "Store audit task details for report"
  ansible.builtin.set_fact:
    task_12_name: "Check if OS is Windows"
    task_12_cmd: "$env:OS"
    task_12_rc: "{{ _step12_output.rc | default(-1) }}"
    data_12: "{{ _step12_output.stdout | default('') | trim }}"
    details_12: "{{ status_12 }}"

    task_01_name: "Detect server role using WMI"
    task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
    task_01_rc: "{{ _step01_output.rc | default(-1) }}"
    data_01: "{{ _step01_output.stdout | default('') | trim }}"
    details_01: "{{ status_01 }}"

    task_13_name: "Set is_dc fact"
    task_13_cmd: "set_fact is_dc from DomainRole"
    task_13_rc: "0"
    data_13: "{{ is_dc | string }}"
    details_13: "{{ status_13 }}"

    task_14_name: "Set is_member fact"
    task_14_cmd: "set_fact is_member from DomainRole"
    task_14_rc: "0"
    data_14: "{{ is_member | string }}"
    details_14: "{{ status_14 }}"

    task_15_name: "Check Active Directory cmdlet availability"
    task_15_cmd: "Get-Command Get-ADDefaultDomainPasswordPolicy"
    task_15_rc: "{{ _step15_output.rc | default(-1) }}"
    data_15: "{{ _step15_output.stdout | default('N/A') | trim }}"
    details_15: "{{ status_15 }}"

    task_16_name: "Check secedit command availability"
    task_16_cmd: "Get-Command secedit"
    task_16_rc: "{{ _step16_output.rc | default(-1) }}"
    data_16: "{{ _step16_output.stdout | default('N/A') | trim }}"
    details_16: "{{ status_16 }}"

    task_02_name: "Check Active Directory module availability"
    task_02_cmd: "Get-Module -ListAvailable -Name ActiveDirectory"
    task_02_rc: "{{ _step02_output.rc | default(-1) }}"
    data_02: "{{ _step02_output.stdout | default('N/A') | trim }}"
    details_02: "{{ status_02 }}"

    task_03_name: "Check DC default domain password policy MaxPasswordAge"
    task_03_cmd: "(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
    task_03_rc: "{{ _step03_output.rc | default(-1) }}"
    data_03: "{{ (dc_age_days | string) if (dc_ready | bool) else 'N/A' }}"
    details_03: "{{ status_03 }}"

    task_04_name: "Check DC GPO setting for Maximum password age"
    task_04_cmd: 'Get-GPO -Name "Default Domain Policy" | Get-GPOReport -ReportType XML'
    task_04_rc: "{{ _step04_output.rc | default(-1) }}"
    data_04: "{{ (_step04_output.stdout | default('N/A') | trim) if (dc_ready | bool) else 'N/A' }}"
    details_04: "{{ status_04 }}"

    task_05_name: "Check member server effective local policy MaximumPasswordAge"
    task_05_cmd: '$tmp = "$env:TEMP\secpol.cfg"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String ''MaximumPasswordAge'''
    task_05_rc: "{{ _step05_output.rc | default(-1) }}"
    data_05: "{{ (member_age_days | string) if (member_ready | bool) else 'N/A' }}"
    details_05: "{{ status_05 }}"

    task_06_name: "Check DC policy value is not 0"
    task_06_cmd: "(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
    task_06_rc: "{{ _step03_output.rc | default(-1) }}"
    data_06: "{{ (dc_age_days | string) if (dc_ready | bool) else 'N/A' }}"
    details_06: "{{ status_06 }}"

    task_07_name: "Check member policy value is not 0"
    task_07_cmd: '$tmp = "$env:TEMP\secpol.cfg"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String ''MaximumPasswordAge'''
    task_07_rc: "{{ _step05_output.rc | default(-1) }}"
    data_07: "{{ (member_age_days | string) if (member_ready | bool) else 'N/A' }}"
    details_07: "{{ status_07 }}"

    task_08_name: "Check DC policy value is within threshold"
    task_08_cmd: "(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
    task_08_rc: "{{ _step03_output.rc | default(-1) }}"
    data_08: "{{ (dc_age_days | string) if (dc_ready | bool) else 'N/A' }}"
    details_08: "{{ status_08 }}"

    task_09_name: "Check member policy value is within threshold"
    task_09_cmd: '$tmp = "$env:TEMP\secpol.cfg"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String ''MaximumPasswordAge'''
    task_09_rc: "{{ _step05_output.rc | default(-1) }}"
    data_09: "{{ (member_age_days | string) if (member_ready | bool) else 'N/A' }}"
    details_09: "{{ status_09 }}"

    task_10_name: "Check DC path compliance"
    task_10_cmd: "(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
    task_10_rc: "{{ _step03_output.rc | default(-1) }}"
    data_10: "{{ (dc_age_days | string) if (dc_ready | bool) else 'N/A' }}"
    details_10: "{{ status_10 }}"

    task_11_name: "Check member path compliance"
    task_11_cmd: '$tmp = "$env:TEMP\secpol.cfg"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String ''MaximumPasswordAge'''
    task_11_rc: "{{ _step05_output.rc | default(-1) }}"
    data_11: "{{ (member_age_days | string) if (member_ready | bool) else 'N/A' }}"
    details_11: "{{ status_11 }}"

    task_17_name: "Verify DC path returns PASS"
    task_17_cmd: "(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
    task_17_rc: "{{ _step03_output.rc | default(-1) }}"
    data_17: "{{ (dc_age_days | string) if (dc_ready | bool) else 'N/A' }}"
    details_17: "{{ status_17 }}"

    task_18_name: "Verify member path returns PASS"
    task_18_cmd: '$tmp = "$env:TEMP\secpol.cfg"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String ''MaximumPasswordAge'''
    task_18_rc: "{{ _step05_output.rc | default(-1) }}"
    data_18: "{{ (member_age_days | string) if (member_ready | bool) else 'N/A' }}"
    details_18: "{{ status_18 }}"

    task_19_name: "Verify DC path returns FAIL"
    task_19_cmd: "(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
    task_19_rc: "{{ _step03_output.rc | default(-1) }}"
    data_19: "{{ (dc_age_days | string) if (dc_ready | bool) else 'N/A' }}"
    details_19: "{{ status_19 }}"

    task_20_name: "Verify member path returns FAIL"
    task_20_cmd: '$tmp = "$env:TEMP\secpol.cfg"; secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet; Get-Content $tmp | Select-String ''MaximumPasswordAge'''
    task_20_rc: "{{ _step05_output.rc | default(-1) }}"
    data_20: "{{ (member_age_days | string) if (member_ready | bool) else 'N/A' }}"
    details_20: "{{ status_20 }}"

    task_21_name: "Store final audit result in cis_result"
    task_21_cmd: "set_fact cis_result and password_age_days"
    task_21_rc: "0"
    data_21: "{{ cis_result }}"
    details_21: "{{ status_21 }}"

- name: "Generate audit report"
  ansible.builtin.debug:
    msg:
    - "AUDIT REPORT — CIS 1.1.2"
    - "Reference: CIS Benchmark checkpoint 1.1.2"
    - ""
