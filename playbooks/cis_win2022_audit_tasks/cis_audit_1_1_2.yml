---
- name: Initialize meta data variables
  include_vars: cis_audit_var_1_1_2.yml

- name: "Req step-01 - Detect Windows server role"
  ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
  register: _step01_output
  failed_when: false
  changed_when: false

- name: "Req step-01 - Set role flags"
  ansible.builtin.set_fact:
    is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
    is_member: "{{ (_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3'] }}"

- name: "Req step-12 - Check if OS is Windows"
  ansible.windows.win_shell: "$env:OS"
  register: _step12_output
  failed_when: false
  changed_when: false

- name: "Req step-02 - Check Active Directory module availability"
  ansible.windows.win_shell: |
    if (Get-Module -ListAvailable -Name ActiveDirectory) {
      Write-Output "ActiveDirectory"
    }
  register: _step02_output
  failed_when: false
  changed_when: false
  when: is_dc | bool

- name: "Req step-03 - Check DC default domain password policy MaxPasswordAge"
  ansible.windows.win_shell: |
    $p = (Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge
    if ($p -is [TimeSpan]) {
      Write-Output "NumericValue=$($p.Days)"
    } else {
      Write-Output "NumericValue=$($p)"
    }
  register: _step03_output
  failed_when: false
  changed_when: false
  when:
  - is_dc | bool
  - (_step02_output.stdout | default('') | trim | length) > 0

- name: "Req step-04 - Check DC GPO setting for Maximum password age"
  ansible.windows.win_shell: |
    $r = Get-GPO -Name "Default Domain Policy" | Get-GPOReport -ReportType Xml
    $line = ($r | Select-String 'MaxPasswordAge' | Select-Object -First 1).Line
    if ($line) {
      $m = [regex]::Match($line, '>(\d+)<')
      if ($m.Success) {
        Write-Output "NumericValue=$($m.Groups[1].Value)"
      } else {
        Write-Output "NO_MATCH"
      }
    } else {
      Write-Output "NO_MATCH"
    }
  register: _step04_output
  failed_when: false
  changed_when: false
  when:
  - is_dc | bool
  - (_step02_output.stdout | default('') | trim | length) > 0

- name: "Req step-05 - Check member server local policy Maximum password age"
  ansible.windows.win_shell: |
    $tmp = "$env:TEMP\secpol.cfg"
    secedit /export /cfg $tmp /areas SECURITYPOLICY /quiet
    $line = (Get-Content $tmp | Select-String 'MaximumPasswordAge' | Select-Object -First 1)
    if ($line) {
      $m = [regex]::Match($line.Line, 'MaximumPasswordAge\s*=\s*(\d+)')
      if ($m.Success) {
        Write-Output "NumericValue=$($m.Groups[1].Value)"
      } else {
        Write-Output "NO_MATCH"
      }
    } else {
      Write-Output "NO_SETTING"
    }
  register: _step05_output
  failed_when: false
  changed_when: false
  when: is_member | bool

- name: "Req step-03 - Extract numeric policy values"
  ansible.builtin.set_fact:
    _dc_val: "{{ (((_step03_output.stdout | default('') | trim) | split('NumericValue=')) | last | trim) if 'NumericValue=' in (_step03_output.stdout | default('')) else '' }}"
    _gpo_val: "{{ (((_step04_output.stdout | default('') | trim) | split('NumericValue=')) | last | trim) if 'NumericValue=' in (_step04_output.stdout | default('')) else '' }}"
    _member_val: "{{ (((_step05_output.stdout | default('') | trim) | split('NumericValue=')) | last | trim) if 'NumericValue=' in (_step05_output.stdout | default('')) else '' }}"
    _ad_ok: "{{ ((_step02_output.rc | default(-1)) == 0) and ((_step02_output.stdout | default('') | trim | length) > 0) }}"
    _os_win: "{{ (_step12_output.stdout | default('') | trim) == 'Windows_NT' }}"

- name: "Req step-03 - Store DC and member audit statuses"
  ansible.builtin.set_fact:
    status_01: "{{ 'PASS' if ((_step01_output.rc | default(-1)) == 0 and ((_step01_output.stdout | default('') | trim) in ['0', '1', '2', '3', '4', '5'])) else 'ERROR' }}"
    status_02: "{{ 'SKIP' if not (is_dc | bool) else ('PASS' if (_ad_ok | bool) else 'SKIP') }}"
    status_03: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if not (_ad_ok | bool) else ('ERROR' if ((_step03_output.rc | default(-1)) != 0 or (_dc_val | trim) == '') else ('PASS' if ((_dc_val | int) > 0 and (_dc_val | int) <= (max_password_age_days | int)) else 'FAIL'))) }}"
    status_04: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if not (_ad_ok | bool) else ('ERROR' if ((_step04_output.rc | default(-1)) != 0 or (_gpo_val | trim) == '') else ('PASS' if ((_gpo_val | int) > 0 and (_gpo_val | int) <= (max_password_age_days | int)) else 'FAIL'))) }}"
    status_05: "{{ 'SKIP' if not (is_member | bool) else ('ERROR' if ((_step05_output.rc | default(-1)) != 0 or (_member_val | trim) == '') else ('PASS' if ((_member_val | int) > 0 and (_member_val | int) <= (max_password_age_days | int)) else 'FAIL')) }}"
    status_12: "{{ 'PASS' if (_os_win | bool) else 'SKIP' }}"

- name: "Req step-06 - Check if the policy value is not 0 for DC path"
  ansible.builtin.set_fact:
    status_06: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if not (_ad_ok | bool) else ('ERROR' if ((_step03_output.rc | default(-1)) != 0 or (_dc_val | trim) == '') else ('PASS' if ((_dc_val | int) > 0) else 'FAIL'))) }}"
  register: _step06_output

- name: "Req step-07 - Check if the policy value is not 0 for member server path"
  ansible.builtin.set_fact:
    status_07: "{{ 'SKIP' if not (is_member | bool) else ('ERROR' if ((_step05_output.rc | default(-1)) != 0 or (_member_val | trim) == '') else ('PASS' if ((_member_val | int) > 0) else 'FAIL')) }}"
  register: _step07_output

- name: "Req step-08 - Check if the policy value is {{ max_password_age_days }} or fewer days for DC path"
  ansible.builtin.set_fact:
    status_08: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if not (_ad_ok | bool) else ('ERROR' if ((_step03_output.rc | default(-1)) != 0 or (_dc_val | trim) == '') else ('PASS' if ((_dc_val | int) <= (max_password_age_days | int)) else 'FAIL'))) }}"
  register: _step08_output

- name: "Req step-09 - Check if the policy value is {{ max_password_age_days }} or fewer days for member server path"
  ansible.builtin.set_fact:
    status_09: "{{ 'SKIP' if not (is_member | bool) else ('ERROR' if ((_step05_output.rc | default(-1)) != 0 or (_member_val | trim) == '') else ('PASS' if ((_member_val | int) <= (max_password_age_days | int)) else 'FAIL')) }}"
  register: _step09_output

- name: "Req step-10 - Check if the policy is applied via Default Domain Policy GPO for DC"
  ansible.builtin.set_fact:
    status_10: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if not (_ad_ok | bool) else ('ERROR' if ((_step04_output.rc | default(-1)) != 0) else ('PASS' if (_gpo_val | trim) != '' else 'FAIL'))) }}"
  register: _step10_output

- name: "Req step-11 - Check if the policy is applied via local security policy for member server"
  ansible.builtin.set_fact:
    status_11: "{{ 'SKIP' if not (is_member | bool) else ('ERROR' if ((_step05_output.rc | default(-1)) != 0) else ('PASS' if (_member_val | trim) != '' else 'FAIL')) }}"
  register: _step11_output

- name: "Req step-13 - Check if the domain controller role is valid for DC path"
  ansible.builtin.set_fact:
    status_13: "{{ 'SKIP' if not (is_dc | bool) else 'PASS' }}"
  register: _step13_output

- name: "Req step-14 - Check if the member server role is valid for member server path"
  ansible.builtin.set_fact:
    status_14: "{{ 'SKIP' if not (is_member | bool) else 'PASS' }}"
  register: _step14_output

- name: "Req step-15 - Check if the password policy is globally effective for DC"
  ansible.builtin.set_fact:
    status_15: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if not (_ad_ok | bool) else ('ERROR' if ((_step03_output.rc | default(-1)) != 0 or (_dc_val | trim) == '') else 'PASS')) }}"
  register: _step15_output

- name: "Req step-16 - Check if the password policy is locally effective for member server"
  ansible.builtin.set_fact:
    status_16: "{{ 'SKIP' if not (is_member | bool) else ('ERROR' if ((_step05_output.rc | default(-1)) != 0 or (_member_val | trim) == '') else ('PASS' if (_member_val | trim) != '' else 'FAIL')) }}"
  register: _step16_output

- name: "Req step-17 - Check if the policy value is within range 1-{{ max_password_age_days }} for DC"
  ansible.builtin.set_fact:
    status_17: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if not (_ad_ok | bool) else ('ERROR' if ((_step03_output.rc | default(-1)) != 0 or (_dc_val | trim) == '') else ('PASS' if ((_dc_val | int) >= 1 and (_dc_val | int) <= (max_password_age_days | int)) else 'FAIL'))) }}"
  register: _step17_output

- name: "Req step-18 - Check if the policy value is within range 1-{{ max_password_age_days }} for member server"
  ansible.builtin.set_fact:
    status_18: "{{ 'SKIP' if not (is_member | bool) else ('ERROR' if ((_step05_output.rc | default(-1)) != 0 or (_member_val | trim) == '') else ('PASS' if ((_member_val | int) >= 1 and (_member_val | int) <= (max_password_age_days | int)) else 'FAIL')) }}"
  register: _step18_output

- name: "Req step-19 - Check if the policy is configured in Default Domain Policy GPO for DC"
  ansible.builtin.set_fact:
    status_19: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if not (_ad_ok | bool) else ('ERROR' if ((_step04_output.rc | default(-1)) != 0) else ('PASS' if (_gpo_val | trim) != '' else 'FAIL'))) }}"
  register: _step19_output

- name: "Req step-20 - Build active branch status list"
  ansible.builtin.set_fact:
    _active_statuses: "{{ [status_01, status_12] + ([status_13, status_02, status_03, status_04, status_06, status_08, status_10, status_15, status_17, status_19] if (is_dc | bool) else []) + ([status_14, status_05, status_07, status_09, status_11, status_16, status_18] if (is_member | bool) else []) }}"
  register: _step20_output

- name: "Req step-20 - Compute overall compliance"
  ansible.builtin.set_fact:
    status_20: "{{ 'SKIP' if not (_os_win | bool) else 'ERROR' if not ((is_dc | bool) or (is_member | bool)) else 'SKIP' if (is_dc | bool) and not (_ad_ok | bool) else 'ERROR' if 'ERROR' in _active_statuses else 'FAIL' if 'FAIL' in _active_statuses else 'PASS' if 'PASS' in _active_statuses else 'SKIP' }}"

- name: "Req step-21 - Store final audit result in cis_result"
  ansible.builtin.set_fact:
    status_21: "{{ status_20 | default('ERROR') | trim }}"
    cis_result: "{{ status_20 | default('ERROR') | trim }}"

