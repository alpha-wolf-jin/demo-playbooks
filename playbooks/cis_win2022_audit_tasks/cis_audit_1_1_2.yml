# ---- Req 1 ----
- name: "Req 1 - Detect Windows server domain role"
  ansible.windows.win_shell: |
    (Get-WmiObject Win32_ComputerSystem).DomainRole
  register: result_01
  failed_when: false
  changed_when: false

- name: "Store requirement 01 details"
  ansible.builtin.set_fact:
    is_dc: "{{ (result_01.stdout | default('') | trim) in ['4', '5'] }}"
    is_member: "{{ (result_01.stdout | default('') | trim) in ['0', '1', '2', '3'] }}"
    task_01_name: "Detect Windows server domain role"
    task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
    task_01_rc: "{{ result_01.rc | default(-1) }}"
    data_01: "DomainRole={{ result_01.stdout | default('') | trim }}"
    status_01: >-
      {%- if (result_01.stdout | default('') | trim) in ['0','1','2','3','4','5'] -%}PASS
      {%- else -%}FAIL
      {%- endif -%}
    details_01: >-
      {%- if (result_01.stdout | default('') | trim) in ['4','5'] -%}Domain Controller
      {%- elif (result_01.stdout | default('') | trim) in ['0','1','2','3'] -%}Member Server
      {%- else -%}Unknown role
      {%- endif -%}

# ---- Req 2 ----
- name: "Req 2 - Check Active Directory module availability"
  ansible.windows.win_shell: |
    if (Get-Module -ListAvailable -Name ActiveDirectory) { Write-Output 'PRESENT' } else { Write-Output 'ABSENT' }
  register: result_02
  failed_when: false
  changed_when: false

- name: "Store requirement 02 details"
  ansible.builtin.set_fact:
    task_02_name: "Check Active Directory PowerShell module availability"
    task_02_cmd: "Get-Module -ListAvailable -Name ActiveDirectory"
    task_02_rc: "{{ result_02.rc | default(-1) }}"
    data_02: "{{ result_02.stdout | default('') | trim }}"
    status_02: >-
      {%- if not (is_dc | bool) -%}SKIP
      {%- elif (result_02.stdout | default('') | trim) == 'PRESENT' -%}PASS
      {%- else -%}FAIL
      {%- endif -%}
    details_02: >-
      {%- if not (is_dc | bool) -%}Not applicable - member server
      {%- elif (result_02.stdout | default('') | trim) == 'PRESENT' -%}ActiveDirectory module present on DC
      {%- else -%}ActiveDirectory module not available on DC
      {%- endif -%}

# ---- Req 3 ----
- name: "Req 3 - Check DC default domain password policy maximum age"
  ansible.windows.win_shell: |
    try {
      $p = Get-ADDefaultDomainPasswordPolicy -ErrorAction Stop
      [int][math]::Floor($p.MaxPasswordAge.TotalDays)
    } catch {
      Write-Output 'ERROR'
    }
  register: result_03
  failed_when: false
  changed_when: false
  when:
  - "is_dc | bool"
  - "(result_02.stdout | default('') | trim) == 'PRESENT'"

- name: "Store requirement 03 details"
  ansible.builtin.set_fact:
    task_03_name: "Check DC default domain password policy maximum age"
    task_03_cmd: "(Get-ADDefaultDomainPasswordPolicy).MaxPasswordAge"
    task_03_rc: "{{ result_03.rc | default(-1) }}"
    data_03: "{{ result_03.stdout | default('SKIPPED') | trim }}"
    status_03: >-
      {%- if not (is_dc | bool) -%}SKIP
      {%- elif (result_02.stdout | default('') | trim) != 'PRESENT' -%}SKIP
      {%- elif (result_03.stdout | default('') | trim) in ['', 'ERROR'] -%}ERROR
      {%- elif (result_03.stdout | default('0') | trim | int) > 0 and (result_03.stdout | default('0') | trim | int) <= 365 -%}PASS
      {%- else -%}FAIL
      {%- endif -%}
    details_03: "MaxPasswordAge days value: {{ result_03.stdout | default('N/A') | trim }}"

# ---- Req 4 ----
- name: "Req 4 - Check DC Default Domain Policy GPO MaxPasswordAge"
  ansible.windows.win_shell: |
    try {
      $xml = Get-GPO -Name "Default Domain Policy" -ErrorAction Stop | Get-GPOReport -ReportType Xml
      $m = [regex]::Match($xml, 'Maximum\s+password\s+age.{0,400}?<SettingNumber>(\d+)</SettingNumber>')
      if ($m.Success) { Write-Output $m.Groups[1].Value } else { Write-Output 'NOT_FOUND' }
    } catch {
      Write-Output 'ERROR'
    }
  register: result_04
  failed_when: false
  changed_when: false
  when:
  - "is_dc | bool"
  - "(result_02.stdout | default('') | trim) == 'PRESENT'"

- name: "Store requirement 04 details"
