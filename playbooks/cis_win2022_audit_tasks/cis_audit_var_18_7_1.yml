req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: |-
  If Domain Controller: Use ansible.windows.win_reg_stat to read the GP registry key for 'Spooler to accept client connections' (path is under HKLM:\\SOFTWARE\\Policies\\... — consult the CIS benchmark reference or ADMX template for the exact path and value name). The module returns structured data: result.exists (bool) and result.value (integer for REG_DWORD). Do NOT use win_shell or Get-ItemProperty. changed_when: false; failed_when: false.
req_03: |-
  If Member Server: Use ansible.windows.win_reg_stat to read the GP registry key for 'Spooler to accept client connections' (path is under HKLM:\\SOFTWARE\\Policies\\... — consult the CIS benchmark reference or ADMX template for the exact path and value name). The module returns structured data: result.exists (bool) and result.value (integer for REG_DWORD). Do NOT use win_shell or Get-ItemProperty. changed_when: false; failed_when: false.
req_04: "If Domain Controller: Evaluate whether 'Spooler to accept client connections' equals Disabled. Check the structured result from win_reg_stat — NOT stdout or rc: PASS if result.exists==true AND result.value==Disabled. FAIL if result.exists==false (key absent) OR result.value is wrong. SKIP if the registry path does not exist. ERROR if the read step failed."
req_05: "If Member Server: Evaluate whether 'Spooler to accept client connections' equals Disabled. Check the structured result from win_reg_stat — NOT stdout or rc: PASS if result.exists==true AND result.value==Disabled. FAIL if result.exists==false (key absent) OR result.value is wrong. SKIP if the registry path does not exist. ERROR if the read step failed."
req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_10: "Check whether Print Spooler service is installed; if absent, report SKIP for all checks."
reg_path: |-
  HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers
reg_name: RegisterSpoolerRemoteRpcEndPoint
disabled_value: 2
