req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
req_02: "If Domain Controller: Read 'Firewall state'. Use read-only PowerShell to query the current value; changed_when: false; failed_when: rc not in [0, 1]."
req_03: "If Member Server: Read 'Firewall state'. Use read-only PowerShell to query the current value; changed_when: false; failed_when: rc not in [0, 1]."
req_04: "If Domain Controller: Evaluate whether 'Firewall state' is equals 'On (recommended)'. PASS if compliant, FAIL if not, ERROR if the check failed."
req_05: "If Member Server: Evaluate whether 'Firewall state' is equals 'On (recommended)'. PASS if compliant, FAIL if not, ERROR if the check failed."
req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
