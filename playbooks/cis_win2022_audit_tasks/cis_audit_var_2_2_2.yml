req_01: "Use read-only PowerShell to check if the host is a Domain Controller and query the current value of 'Access this computer from the network'. Emits ** PASS **, ** FAIL **, ** SKIP **, or ** ERROR **. changed_when: false; failed_when: rc not in [0, 1]."
req_02: "Evaluate the output of step-01 to determine compliance. PASS if the script reported compliant value; FAIL if non-compliant; SKIP if not a domain controller; ERROR on any failure."
req_03: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
req_04: |-
  Create a task named 'Generate audit report' using debug msg with EXACTLY this format:\nAUDIT REPORT — CIS 2.2.2\nReference: CIS Benchmark checkpoint 2.2.2\nThen for each requirement: REQUIREMENT NN - {{ '{{' }} req_NN {{ '}}' }}:\nWith fields: Task, Command, Exit code, Data, Status (PASS/FAIL/SKIP/ERROR), Details.\nEnd with OVERALL COMPLIANCE: section containing Result: {{ '{{{' }} cis_result {{ '}}}' }}
