---
- name: "Remediate CIS checkpoint 18.5.3: Ensure 'MSS: (DisableIPSourceRouting) IP source routing protection level' is set to 'Enabled: Highest protection, source routing is completely disabled'"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_18_5_3_remediation"
    backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
    reg_path: |-
      HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters
    reg_name: "DisableIPSourceRouting"
    reg_data: 2
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: |-
      If Domain Controller: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters', name='DisableIPSourceRouting', data=2, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
    req_03: |-
      If Member Server: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters', name='DisableIPSourceRouting', data=2, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
    req_04: |-
      If Domain Controller: Verify the GP registry key: use PowerShell Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters' -Name DisableIPSourceRouting. PASS if value equals 2. FAIL if 0 or NOT_CONFIGURED. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
    req_05: |-
      If Member Server: Verify the GP registry key: use PowerShell Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters' -Name DisableIPSourceRouting. PASS if value equals 2. FAIL if 0 or NOT_CONFIGURED. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
    req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir | trim }}"
        state: directory
      tags: [snapshot]

    - name: "Snapshot - Save current DisableIPSourceRouting registry value"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        $key = '{{ reg_path }}'
        $name = '{{ reg_name }}'
        $file = Join-Path '{{ backup_dir | trim }}' 'DisableIPSourceRouting.regbak'
        $val = Get-ItemProperty -Path $key -Name $name -ErrorAction SilentlyContinue | Select-Object -ExpandProperty $name
        if ($null -eq $val) {
          Set-Content -Path $file -Value 'ABSENT' -Encoding utf8
        } else {
          Set-Content -Path $file -Value ([string]$val) -Encoding utf8
        }
        Write-Output 'SNAPSHOT_OK'
      register: _snap_reg
      failed_when: false
      changed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req step-01 - Detect Windows server role"
          ansible.windows.win_shell: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
          register: _step01_output
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req step-01 - Set role classification flags"
          ansible.builtin.set_fact:
            role_detection_error: "{{ _step01_output.rc | default(-1) != 0 or (_step01_output.stdout | default('') | trim) not in ['1','2','3','4','5'] }}"
            is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4','5'] }}"
            is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1','2','3'] }}"
            data_01: "{{ _step01_output.stdout | default('') | trim }}"
            status_01: "{{ 'ERROR' if _step01_output.rc | default(-1) != 0 or (_step01_output.stdout | default('') | trim) not in ['1','2','3','4','5'] else 'PASS' }}"
            task_01_name: "Detect Windows server role using Win32_ComputerSystem DomainRole"
            task_01_cmd: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
            task_01_rc: "{{ _step01_output.rc | default(-1) }}"
            details_01: "{{ 'Role detection succeeded' if _step01_output.rc | default(-1) == 0 and (_step01_output.stdout | default('') | trim) in ['1','2','3','4','5'] else 'Role detection failed or unexpected DomainRole' }}"
          tags: [execute]

        - name: "Req step-02 - Set DisableIPSourceRouting registry DWORD to 2 for Domain Controller"
          ansible.windows.win_regedit:
            path: "{{ reg_path }}"
            name: "{{ reg_name }}"
            data: "{{ reg_data }}"
            type: dword
          register: _step02_output
          when: is_dc | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-02 - Set DC apply status"
          ansible.builtin.set_fact:
            data_02: "{{ 'APPLIED' if _step02_output is defined and not (_step02_output.failed | default(false) | bool) else 'ERROR' }}"
            status_02: "{{ 'PASS' if _step02_output is defined and not (_step02_output.failed | default(false) | bool) else 'ERROR' }}"
            task_02_name: "Set DisableIPSourceRouting registry DWORD to 2 for Domain Controller"
            task_02_cmd: |-
              ansible.windows.win_regedit path=HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters name=DisableIPSourceRouting data=2 type=dword
            task_02_rc: "{{ 0 if _step02_output is defined and not (_step02_output.failed | default(false) | bool) else -1 }}"
            details_02: "{{ 'Registry value written or already set' if _step02_output is defined and not (_step02_output.failed | default(false) | bool) else 'Registry write failed' }}"
          when: is_dc | bool
          tags: [execute]

        - name: "Req step-03 - Set DisableIPSourceRouting registry DWORD to 2 for Member Server"
          ansible.windows.win_regedit:
            path: "{{ reg_path }}"
            name: "{{ reg_name }}"
            data: "{{ reg_data }}"
            type: dword
          register: _step03_output
          when: is_member | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-03 - Set Member Server apply status"
          ansible.builtin.set_fact:
            data_03: "{{ 'APPLIED' if _step03_output is defined and not (_step03_output.failed | default(false) | bool) else 'ERROR' }}"
            status_03: "{{ 'PASS' if _step03_output is defined and not (_step03_output.failed | default(false) | bool) else 'ERROR' }}"
            task_03_name: "Set DisableIPSourceRouting registry DWORD to 2 for Member Server"
            task_03_cmd: |-
              ansible.windows.win_regedit path=HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters name=DisableIPSourceRouting data=2 type=dword
            task_03_rc: "{{ 0 if _step03_output is defined and not (_step03_output.failed | default(false) | bool) else -1 }}"
            details_03: "{{ 'Registry value written or already set' if _step03_output is defined and not (_step03_output.failed | default(false) | bool) else 'Registry write failed' }}"
          when: is_member | bool
          tags: [execute]

        - name: "Req step-04 - Verify DisableIPSourceRouting registry value equals 2 for Domain Controller"
          ansible.windows.win_reg_stat:
            path: "{{ reg_path }}"
            name: "{{ reg_name }}"
          register: _step04_output
          when: is_dc | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-04 - Set DC verify status"
          ansible.builtin.set_fact:
            data_04: "{{ ((_step04_output.value | default('NOT_CONFIGURED')) | string | trim) if (_step04_output.exists | default(false) | bool) else 'NOT_CONFIGURED' }}"
            status_04: "{{ 'PASS' if (_step04_output.exists | default(false) | bool and ((_step04_output.value | default(-1) | int) == 2)) else 'FAIL' }}"
            task_04_name: "Verify DisableIPSourceRouting registry value equals 2 for Domain Controller"
            task_04_cmd: |-
              ansible.windows.win_reg_stat path=HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters name=DisableIPSourceRouting
            task_04_rc: "{{ 0 if _step04_output is defined else -1 }}"
            details_04: "{{ 'Registry value exists and equals 2' if (_step04_output.exists | default(false) | bool and ((_step04_output.value | default(-1) | int) == 2)) else 'Registry value missing or not equal to 2' }}"
          when: is_dc | bool
          tags: [execute]

        - name: "Req step-05 - Verify DisableIPSourceRouting registry value equals 2 for Member Server"
          ansible.windows.win_reg_stat:
            path: "{{ reg_path }}"
            name: "{{ reg_name }}"
          register: _step05_output
          when: is_member | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-05 - Set Member Server verify status"
          ansible.builtin.set_fact:
            data_05: "{{ ((_step05_output.value | default('NOT_CONFIGURED')) | string | trim) if (_step05_output.exists | default(false) | bool) else 'NOT_CONFIGURED' }}"
            status_05: "{{ 'PASS' if (_step05_output.exists | default(false) | bool and ((_step05_output.value | default(-1) | int) == 2)) else 'FAIL' }}"
            task_05_name: "Verify DisableIPSourceRouting registry value equals 2 for Member Server"
            task_05_cmd: |-
              ansible.windows.win_reg_stat path=HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters name=DisableIPSourceRouting
            task_05_rc: "{{ 0 if _step05_output is defined else -1 }}"
            details_05: "{{ 'Registry value exists and equals 2' if (_step05_output.exists | default(false) | bool and ((_step05_output.value | default(-1) | int) == 2)) else 'Registry value missing or not equal to 2' }}"
          when: is_member | bool
          tags: [execute]

        - name: "Req step-06 - Set final remediation result"
          ansible.builtin.set_fact:
            cis_result: >-
              {{ 'ERROR' if role_detection_error | bool else
                 'PASS' if (is_dc | bool and status_04 | default('SKIP') == 'PASS') or (is_member | bool and status_05 | default('SKIP') == 'PASS') else
                 'FAIL' if (is_dc | bool and status_04 | default('SKIP') == 'FAIL') or (is_member | bool and status_05 | default('SKIP') == 'FAIL') else
                 'SKIP' }}
          tags: [execute]

        - name: "Req step-07 - Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 18.5.3"
              - "Reference: CIS Benchmark checkpoint 18.5.3"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('SKIP') | trim }}"
              - "  Details: {{ details_02 | default('Not applicable') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('SKIP') | trim }}"
              - "  Details: {{ details_03 | default('Not applicable') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: {{ task_04_name | default('Not recorded') }}"
              - "  Command: {{ task_04_cmd | default('N/A') }}"
              - "  Exit code: {{ task_04_rc | default(-1) }}"
              - "  Data: {{ data_04 | default('') | trim }}"
              - "  Status: {{ status_04 | default('SKIP') | trim }}"
              - "  Details: {{ details_04 | default('Not applicable') | trim }}"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: {{ task_05_name | default('Not recorded') }}"
              - "  Command: {{ task_05_cmd | default('N/A') }}"
              - "  Exit code: {{ task_05_rc | default(-1) }}"
              - "  Data: {{ data_05 | default('') | trim }}"
              - "  Status: {{ status_05 | default('SKIP') | trim }}"
              - "  Details: {{ details_05 | default('Not applicable') | trim }}"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: Set final remediation result in cis_result"
              - "  Command: set_fact cis_result={{ cis_result | default('ERROR') | trim }}"
              - "  Exit code: 0"
              - "  Data: {{ cis_result | default('ERROR') | trim }}"
              - "  Status: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: Overall remediation result derived from active branch verification"
              - ""
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
          tags: [execute]

      always:
        - name: "Restore - Check if backup exists"
          ansible.windows.win_stat:
            path: "{{ backup_dir | trim }}/DisableIPSourceRouting.regbak"
          register: _restore_backup
          failed_when: false
          tags: [restore]

        - name: "Restore - Restore original DisableIPSourceRouting value"
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'SilentlyContinue'
            $key = '{{ reg_path }}'
            $name = '{{ reg_name }}'
            $file = Join-Path '{{ backup_dir | trim }}' 'DisableIPSourceRouting.regbak'
            if (Test-Path -LiteralPath $file) {
              $old = (Get-Content -LiteralPath $file -Raw).Trim()
              if ($old -eq 'ABSENT') {
                Remove-ItemProperty -Path $key -Name $name -ErrorAction SilentlyContinue
                Write-Output 'RESTORE_REMOVED'
              } else {
                Set-ItemProperty -Path $key -Name $name -Value ([int]$old) -Type DWord -ErrorAction SilentlyContinue
                Write-Output 'RESTORE_SET'
              }
            } else {
              Write-Output 'RESTORE_SKIP_NO_BACKUP'
            }
          when: _restore_backup.stat.exists | default(false) | bool
          failed_when: false
          changed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.windows.win_file:
            path: "{{ backup_dir | trim }}"
            state: absent
          failed_when: false
          tags: [restore]