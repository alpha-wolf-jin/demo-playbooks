---
- name: "SOP playbook 'disable_kernel_module' (ACTION — changes system state): Disable a loadable Linux kernel module by blacklisting it, preventing it from loading, and unloading it if currently active."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    playbook_name: "disable_kernel_module"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    kernel_module_name: "cramfs"
    conf_path: "/etc/modprobe.d/{{ kernel_module_name }}.conf"
    target_server: ""

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Check if config file exists"
      ansible.builtin.stat:
        path: "{{ conf_path }}"
      register: _snap_conf_stat
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Backup config file if exists"
      ansible.builtin.copy:
        src: "{{ conf_path }}"
        dest: "{{ backup_dir }}/conf.orig"
        remote_src: true
        force: false
      when: _snap_conf_stat.stat.exists | default(false)
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Record whether config file existed"
      ansible.builtin.copy:
        content: "{{ _snap_conf_stat.stat.exists | default(false) }}"
        dest: "{{ backup_dir }}/conf_existed"
        force: false
      failed_when: false
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Record whether module is loaded"
      ansible.builtin.shell: "set -o pipefail && lsmod | grep -q '^{{ kernel_module_name }} ' && echo loaded || echo not_loaded"
      args:
        executable: /bin/bash
      register: _snap_mod_state
      changed_when: false
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save module load state to file"
      ansible.builtin.copy:
        content: "{{ _snap_mod_state.stdout | trim }}"
        dest: "{{ backup_dir }}/module_loaded_state"
        force: false
      failed_when: false
      changed_when: false
      tags: [snapshot]

  tasks:
    - block:
        - name: "Validate required variable target_server"
          ansible.builtin.assert:
            that:
              - target_server != ''
            fail_msg: "target_server must be provided and must not be empty"
          tags: [execute]

        - name: "Req 2 - Initialize default output variables"
          ansible.builtin.set_fact:
            _module_found: false
            _config_updated: false
            _module_unloaded: false
            _loaded_before: false
            _status_message: "Module not available or built-in, no remediation necessary."
            _conf_path: "{{ conf_path }}"
          tags: [execute]

        - name: "Req 3 - Find kernel module files"
          ansible.builtin.find:
            paths: /lib/modules
            patterns: "{{ kernel_module_name }}.ko*"
            file_type: file
            recurse: yes
          register: _module_files
          changed_when: false
          failed_when: false
          tags: [execute]

        - block:
            - name: "Req 5 - Ensure install /bin/false line"
              ansible.builtin.lineinfile:
                path: "{{ _conf_path }}"
                regexp: "^install {{ kernel_module_name }} "
                line: "install {{ kernel_module_name }} /bin/false"
                create: true
                mode: '0644'
              register: _install_result
              tags: [execute]

            - name: "Req 6 - Ensure blacklist line"
              ansible.builtin.lineinfile:
                path: "{{ _conf_path }}"
                regexp: "^blacklist {{ kernel_module_name }}$"
                line: "blacklist {{ kernel_module_name }}"
                create: true
                mode: '0644'
              register: _blacklist_result
              tags: [execute]

            - name: "Req 7 - Check if module is currently loaded"
              ansible.builtin.shell: "set -o pipefail && lsmod | grep -q '^{{ kernel_module_name }} '"
              args:
                executable: /bin/bash
              register: _lsmod_result
              failed_when: false
              changed_when: false
              tags: [execute]

            - name: "Req 8 - Derive loaded flag"
              ansible.builtin.set_fact:
                _loaded_before: "{{ _lsmod_result.rc == 0 }}"
              tags: [execute]

            - name: "Req 10 - Unload the module"
              ansible.builtin.shell: "set -o pipefail && modprobe -r {{ kernel_module_name }} 2>/dev/null || rmmod {{ kernel_module_name }} 2>/dev/null || true"
              args:
                executable: /bin/bash
              register: _unload_result
              when: _loaded_before
              failed_when: false
              changed_when: false
              tags: [execute]

            - name: "Req Verify - Verify module is not loaded"
              ansible.builtin.shell: "set -o pipefail && lsmod | grep -q '^{{ kernel_module_name }} '"
              args:
                executable: /bin/bash
              register: _verify_result
              failed_when: false
              changed_when: false
              tags: [execute]

            - name: "Req 11 - Assemble final output variables"
              ansible.builtin.set_fact:
                _config_updated: "{{ _install_result.changed or _blacklist_result.changed }}"
                _module_unloaded: "{{ _unload_result.rc | default(-1) == 0 }}"
                _module_found: true
                _status_message: "{{ 'Module disabled successfully.' if _verify_result.rc != 0 else 'Module still loaded after remediation.' }}"
              tags: [execute]

          when: _module_files.matched > 0
          tags: [execute]

        - name: "Req 12 - Emit final result"
          ansible.builtin.debug:
            msg: |
              <result>
              module_found: {{ _module_found }}
              loaded_before: {{ _loaded_before }}
              module_unloaded: {{ _module_unloaded }}
              config_updated: {{ _config_updated }}
              status_message: {{ _status_message }}
              </result>
          tags: [execute]

      rescue:
        - name: "Req 13 - Emit error result"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: disable_kernel_module failed
              </result>
          tags: [execute]

      always:
        - name: "Restore - Check if config backup exists"
          ansible.builtin.stat:
            path: "{{ backup_dir }}/conf.orig"
          register: _restore_conf_check
          failed_when: false
          tags: [restore]

        - name: "Restore - Overwrite config with original"
          ansible.builtin.copy:
            src: "{{ backup_dir }}/conf.orig"
            dest: "{{ conf_path }}"
            remote_src: true
          when: _restore_conf_check.stat.exists | default(false)
          failed_when: false
          tags: [restore]

        - name: "Restore - Read existence marker"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/conf_existed"
          register: _restore_existed
          failed_when: false
          tags: [restore]

        - name: "Restore - Delete config if it was absent before"
          ansible.builtin.file:
            path: "{{ conf_path }}"
            state: absent
          when:
            - _restore_existed.content is defined
            - (_restore_existed.content | b64decode | trim) == 'False'
          failed_when: false
          tags: [restore]

        - name: "Restore - Read saved module load state"
          ansible.builtin.slurp:
            src: "{{ backup_dir }}/module_loaded_state"
          register: _restore_mod_state
          failed_when: false
          tags: [restore]

        - name: "Restore - Reload module if previously loaded"
          ansible.builtin.shell: "set -o pipefail && modprobe {{ kernel_module_name }} 2>/dev/null || true"
          args:
            executable: /bin/bash
          when:
            - _restore_mod_state.content is defined
            - (_restore_mod_state.content | b64decode | trim) == 'loaded'
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.builtin.file:
            path: "{{ backup_dir }}"
            state: absent
          failed_when: false
          tags: [restore]