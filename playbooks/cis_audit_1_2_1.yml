---
- name: "Audit CIS checkpoint 1.2.1: Ensure 'Account lockout duration' is set to '15 or more minute(s)'"
  hosts: all
  gather_facts: false
  vars:
    lockout_duration_minutes: "15"
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: "If Domain Controller: Read 'Account lockout duration' via Get-ADDefaultDomainPasswordPolicy. changed_when: false."
    req_03: "If Member Server: Read 'Account lockout duration' from local security policy. Use ansible.windows.win_shell to export the local security policy: 'secedit /export /cfg <temp_path> /areas SECURITYPOLICY /quiet', then parse the numeric value for 'Account lockout duration' from the exported INI file and compare it against the required threshold. changed_when: false."
    req_04: "If Domain Controller: Evaluate whether 'Account lockout duration' is equals '15 or more minute(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_05: "If Member Server: Evaluate whether 'Account lockout duration' is equals '15 or more minute(s)'. PASS if compliant, FAIL if not, ERROR if the check failed."
    req_06: "Store the final audit result in a variable named 'cis_result' using set_fact. Set cis_result to the overall compliance status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  tasks:
    - name: "Req step-01 - Detect Windows server role"
      ansible.windows.win_shell: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
      register: _step01_output
      changed_when: false
      failed_when: false

    - name: "Req step-01 - Set role flags"
      ansible.builtin.set_fact:
        is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4','5'] }}"
        is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1','2','3'] }}"
        role_detection_error: "{{ (_step01_output.rc | default(-1)) != 0 or (_step01_output.stdout | default('') | trim) not in ['1','2','3','4','5'] }}"
        status_01: "{{ 'ERROR' if ((_step01_output.rc | default(-1)) != 0 or (_step01_output.stdout | default('') | trim) not in ['1','2','3','4','5']) else 'PASS' }}"

    - name: "Req step-02 - Read AD default domain password policy lockout duration"
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory -ErrorAction SilentlyContinue
        if (-not (Get-Command Get-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue)) {
          Write-Output 'AD_MODULE_NOT_AVAILABLE'
          exit 3
        }
        $policy = Get-ADDefaultDomainPasswordPolicy
        if ($null -eq $policy) {
          Write-Output 'AD_POLICY_NOT_FOUND'
          exit 4
        }
        $dur = $policy.LockoutDuration
        if ($dur -is [TimeSpan]) { Write-Output ([math]::Floor($dur.TotalMinutes)) } else { Write-Output ([int]$dur) }
      register: _step02_output
      when: is_dc | bool
      changed_when: false
      failed_when: false

    - name: "Req step-03 - Export local security policy to temporary file"
      ansible.windows.win_shell: |
        $tmp = Join-Path $env:TEMP 'cis_audit_secpol.cfg'
        Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue
        secedit /export /cfg "$tmp" /areas SECURITYPOLICY /quiet | Out-Null
        if (Test-Path -LiteralPath $tmp) {
          Write-Output $tmp
          exit 0
        }
        Write-Output 'EXPORT_FAILED'
        exit 2
      register: _secedit_export
      when: is_member | bool
      changed_when: false
      failed_when: false

    - name: "Req step-03 - Parse account lockout duration from local security policy"
      ansible.windows.win_shell: |
        $tmp = Join-Path $env:TEMP 'cis_audit_secpol.cfg'
        $exitCode = 0
        try {
          if (-not (Test-Path -LiteralPath $tmp)) {
            Write-Output 'FILE_NOT_FOUND'
            $exitCode = 2
          } else {
            try {
              $lines = [System.IO.File]::ReadAllLines($tmp, [System.Text.Encoding]::Unicode)
            } catch {
              $lines = [System.IO.File]::ReadAllLines($tmp)
            }
            $line = $lines | Where-Object { $_ -match '^\s*LockoutDuration\s*=\s*\d+' } | Select-Object -First 1
            if ($null -eq $line) {
              Write-Output 'KEY_NOT_FOUND'
              $exitCode = 1
            } else {
              $val = [regex]::Match($line, '\d+').Value
              Write-Output $val
            }
          }
        } finally {
          Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue
        }
        exit $exitCode
      register: _member_policy_output
      when: is_member | bool
      changed_when: false
      failed_when: false

    - name: "Req step-03 - Set member policy read status"
      ansible.builtin.set_fact:
        _cis_status: "{{ 'ERROR' if (_member_policy_output.rc | default(-1)) != 0 or (_member_policy_output.stdout | default('') | trim) in ['', 'FILE_NOT_FOUND', 'KEY_NOT_FOUND'] else 'PASS' }}"
      when: is_member | bool

    - name: "Req step-04 - Evaluate Domain Controller account lockout duration"
      ansible.builtin.set_fact:
        status_04: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if (_step02_output.stdout | default('') | trim) == 'AD_MODULE_NOT_AVAILABLE' else ('ERROR' if (_step02_output.rc | default(-1)) != 0 or (_step02_output.stdout | default('') | trim) == '' else ('PASS' if ((_step02_output.stdout | default('') | trim) | int) >= (lockout_duration_minutes | int) else 'FAIL'))) }}"
        _cis_status: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if (_step02_output.stdout | default('') | trim) == 'AD_MODULE_NOT_AVAILABLE' else ('ERROR' if (_step02_output.rc | default(-1)) != 0 or (_step02_output.stdout | default('') | trim) == '' else ('PASS' if ((_step02_output.stdout | default('') | trim) | int) >= (lockout_duration_minutes | int) else 'FAIL'))) }}"
      when: is_dc | bool

    - name: "Req step-05 - Evaluate Member Server account lockout duration"
      ansible.builtin.set_fact:
        status_05: >-
          {{ 'SKIP' if not (is_member | bool) else
             ('ERROR' if (_member_policy_output.rc | default(-1)) != 0
               or (_member_policy_output.stdout | default('') | trim) in ['', 'FILE_NOT_FOUND', 'KEY_NOT_FOUND']
               else ('PASS' if ((((_member_policy_output.stdout | default('0') | trim | int) / 60) | int) >= (lockout_duration_minutes | int)) else 'FAIL')) }}
        _cis_status: >-
          {{ 'SKIP' if not (is_member | bool) else
             ('ERROR' if (_member_policy_output.rc | default(-1)) != 0
               or (_member_policy_output.stdout | default('') | trim) in ['', 'FILE_NOT_FOUND', 'KEY_NOT_FOUND']
               else ('PASS' if ((((_member_policy_output.stdout | default('0') | trim | int) / 60) | int) >= (lockout_duration_minutes | int)) else 'FAIL')) }}
      when: is_member | bool

    - name: "Req step-06 - Set cis_result and inactive branch statuses"
      ansible.builtin.set_fact:
        status_02: "{{ 'SKIP' if not (is_dc | bool) else ('SKIP' if (_step02_output.stdout | default('') | trim) == 'AD_MODULE_NOT_AVAILABLE' else ('ERROR' if (_step02_output.rc | default(-1)) != 0 or (_step02_output.stdout | default('') | trim) == '' else 'PASS')) }}"
        status_03: "{{ 'SKIP' if not (is_member | bool) else ('ERROR' if (_member_policy_output.rc | default(-1)) != 0 or (_member_policy_output.stdout | default('') | trim) in ['', 'FILE_NOT_FOUND', 'KEY_NOT_FOUND'] else 'PASS') }}"
        cis_result: "{{ 'ERROR' if (role_detection_error | default(false) | bool) else (status_04 if (is_dc | bool) else (status_05 if (is_member | bool) else 'SKIP')) }}"
        _cis_status: "{{ 'ERROR' if (role_detection_error | default(false) | bool) else (status_04 if (is_dc | bool) else (status_05 if (is_member | bool) else 'SKIP')) }}"

    - name: "Req step-07 - Generate audit report"
      debug:
        msg:
          - "AUDIT REPORT — CIS 1.2.1"
          - "Reference: CIS Benchmark checkpoint 1.2.1"
          - ""
          - "REQUIREMENT 01 - {{ req_01 }}:"
          - "  Task: Detect Windows server role"
          - "  Command: (Get-CimInstance Win32_ComputerSystem).DomainRole"
          - "  Exit code: {{ _step01_output.rc | default(-1) }}"
          - "  Data: {{ _step01_output.stdout | default('') | trim }}"
          - "  Status: {{ status_01 | default('ERROR') | trim }}"
          - "  Details: DomainRole detection completed with result {{ status_01 | default('ERROR') | trim }}"
          - ""
          - "REQUIREMENT 02 - {{ req_02 }}:"
          - "  Task: Read AD default domain password policy lockout duration"
          - "  Command: Get-ADDefaultDomainPasswordPolicy / LockoutDuration"
          - "  Exit code: {{ _step02_output.rc | default(-1) }}"
          - "  Data: {{ _step02_output.stdout | default('') | trim }}"
          - "  Status: {{ status_02 | default('ERROR') | trim }}"
          - "  Details: AD module unavailable or policy read status: {{ status_02 | default('ERROR') | trim }}"
          - ""
          - "REQUIREMENT 03 - {{ req_03 }}:"
          - "  Task: Export and parse local security policy lockout duration"
          - "  Command: secedit /export /cfg <temp_path> /areas SECURITYPOLICY /quiet"
          - "  Exit code: {{ _member_policy_output.rc | default(-1) }}"
          - "  Data: {{ _member_policy_output.stdout | default('') | trim }}"
          - "  Status: {{ status_03 | default('ERROR') | trim }}"
          - "  Details: Member local policy read status: {{ status_03 | default('ERROR') | trim }}"
          - ""
          - "REQUIREMENT 04 - {{ req_04 }}:"
          - "  Task: Evaluate Domain Controller account lockout duration"
          - "  Command: Compare LockoutDuration to {{ lockout_duration_minutes }} minutes"
          - "  Exit code: {{ _step02_output.rc | default(-1) }}"
          - "  Data: {{ _step02_output.stdout | default('') | trim }}"
          - "  Status: {{ status_04 | default('SKIP') | trim }}"
          - "  Details: DC compliance evaluation status: {{ status_04 | default('SKIP') | trim }}"
          - ""
          - "REQUIREMENT 05 - {{ req_05 }}:"
          - "  Task: Evaluate Member Server account lockout duration"
          - "  Command: Compare parsed LockoutDuration to {{ lockout_duration_minutes }} minutes"
          - "  Exit code: {{ _member_policy_output.rc | default(-1) }}"
          - "  Data: {{ _member_policy_output.stdout | default('') | trim }}"
          - "  Status: {{ status_05 | default('SKIP') | trim }}"
          - "  Details: Member compliance evaluation status: {{ status_05 | default('SKIP') | trim }}"
          - ""
          - "REQUIREMENT 06 - {{ req_06 }}:"
          - "  Task: Store final audit result in cis_result"
          - "  Command: set_fact cis_result"
          - "  Exit code: 0"
          - "  Data: {{ cis_result | default('ERROR') | trim }}"
          - "  Status: {{ cis_result | default('ERROR') | trim }}"
          - "  Details: Overall audit result derived from active branch verify status"
          - ""
          - "========================================================"
          - "OVERALL COMPLIANCE:"
          - "  Result: {{ cis_result | default('ERROR') | trim }}"
          - "========================================================"