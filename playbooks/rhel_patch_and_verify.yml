        - name: "Req step-13 - Compute post‑update memory pass flag"
          ansible.builtin.set_fact:
            _post_mem_pass: "{{ (_free_mb_post | int) >= (min_free_memory_gb | int * 1024) }}"
          tags: [execute]

        # step-14: Gather mount facts after update
        - name: "Req step-14 - Gather mount facts after update"
          ansible.builtin.setup:
            gather_subset:
              - hardware
          register: _mounts_post
          tags: [execute]

        # step-15: Identify post‑update mounts with insufficient disk space
        - name: "Req step-15 - Compute post‑update disk issues list"
          ansible.builtin.set_fact:
            _disk_issues_post: >-
              {{ ansible_facts.mounts
                 | rejectattr('mount', 'in', (fs_exclude_list | split(',') | map('trim') | list))
                 | rejectattr('fstype', 'in', (fs_type_exclude_list | split(',') | map('trim') | list))
                 | selectattr('size_available', 'lt', (_disk_threshold_bytes | int))
                 | map(attribute='mount') | list }}
          tags: [execute]

        - name: "Req step-15 - Compute post‑update disk pass flag"
          ansible.builtin.set_fact:
            _post_disk_pass: "{{ _disk_issues_post | length == 0 }}"
          tags: [execute]

        # step-16: Gather running service facts after update
        - name: "Req step-16 - Gather running service facts after update"
          ansible.builtin.service_facts:
          register: _services_dict_post
          tags: [execute]

        # step-17: Extract running service names post‑update
        - name: "Req step-17 - Extract running service names post‑update"
          ansible.builtin.set_fact:
            _post_services: >-
              {{ ansible_facts.services
                 | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | map(attribute='key') | list }}
          tags: [execute]

        # step-18: Compare pre‑ and post‑update service lists
        - name: "Req step-18 - Compute service mismatch list and pass flag"
          ansible.builtin.set_fact:
            _services_mismatch_list: "{{ (_pre_services | difference(_post_services)) + (_post_services | difference(_pre_services)) }}"
            _services_pass: "{{ ( (_pre_services | difference(_post_services)) + (_post_services | difference(_pre_services)) ) | length == 0 }}"
          tags: [execute]

        # step-19: Build final human‑readable report
        - name: "Req step-19 - Build human‑readable report"
          ansible.builtin.set_fact:
            _report: |
              Pre‑update free memory check: {{ "PASS" if _pre_mem_pass else "FAIL" }} ({{ _free_mb_pre }} MB, threshold {{ min_free_memory_gb }} GB)
              Pre‑update disk check: {{ "PASS" if _disk_pre_pass else "FAIL - Insufficient space on: " + _disk_issues_pre | join(', ') }}
              Post‑update free memory check: {{ "PASS" if _post_mem_pass else "FAIL" }} ({{ _free_mb_post }} MB, threshold {{ min_free_memory_gb }} GB)
              Post‑update disk check: {{ "PASS" if _post_disk_pass else "FAIL - Insufficient space on: " + _disk_issues_post | join(', ') }}
              Pre‑update running services count: {{ _pre_services | length }}
              Post‑update running services count: {{ _post_services | length }}
              Service mismatch: {{ "PASS" if _services_pass else "FAIL - Mismatched services: " + _services_mismatch_list | join(', ') }}
