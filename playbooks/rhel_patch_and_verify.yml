          ansible.builtin.service_facts:
          register: _services_dict_pre
          when: not (_mem_below_threshold | default(false) | bool) and not (_disk_pre_issues_exist | default(false) | bool)
          tags: [execute]

        - name: "Req step-08 - Extract running service names pre-update"
          ansible.builtin.set_fact:
            _pre_services: >-
              {{ ansible_facts.services | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | map(attribute='key') | list }}
          when: not (_mem_below_threshold | default(false) | bool) and not (_disk_pre_issues_exist | default(false) | bool)
          tags: [execute]

        - name: "Req step-08 - Save pre-running services list to file"
          ansible.builtin.copy:
            content: "{{ _pre_services | join('\n') }}"
            dest: "{{ backup_dir }}/pre_running_services.txt"
          when: _pre_services is defined
          tags: [execute]

        - name: "Req step-09 - Update all packages"
          ansible.builtin.package:
            name: "{{ package_name | default('*') }}"
            state: latest
          when: not (_mem_below_threshold | default(false) | bool) and not (_disk_pre_issues_exist | default(false) | bool)
          tags: [execute]

        - name: "Initialize update verification flag"
          ansible.builtin.set_fact:
            _update_verified: false
          tags: [execute]

