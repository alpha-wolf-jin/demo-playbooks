            fail_msg: "target_server variable must be provided"
          tags: [execute]

        - name: "Req step-01 - Get available free memory before update"
          ansible.builtin.shell: set -o pipefail && free -m | awk '/^Mem:/{print $7}'
          args:
            executable: /bin/bash
          register: _free_mem_raw_pre
          changed_when: false
          tags: [execute]

        - name: "Req step-02 - Parse free memory to MB integer"
          ansible.builtin.set_fact:
            _free_mb_pre: "{{ _free_mem_raw_pre.stdout | int }}"
          tags: [execute]

        - name: "Req step-03 - Set memory below threshold flag"
          ansible.builtin.set_fact:
            _mem_below_threshold: "{{ (_free_mb_pre | int) < (min_free_memory_gb | int * 1024) }}"
          tags: [execute]

        - name: "Req step-03 - Fail if pre-update memory below threshold"
          ansible.builtin.fail:
            msg: "Pre-update free memory ({{ _free_mb_pre }} MB) is below minimum ({{ min_free_memory_gb }} GB)"
          when: _mem_below_threshold | bool
          tags: [execute]

        - name: "Req step-04 - Gather mount information before update"
          ansible.builtin.setup:
            gather_subset:
              - hardware
          register: _mounts_pre
          when: not (_mem_below_threshold | bool)
          tags: [execute]

        - name: "Req step-05 - Identify mounts with insufficient disk space pre-update"
          ansible.builtin.set_fact:
            _disk_issues_pre: >-
              {{ _mounts_pre.ansible_facts.ansible_mounts
                 | rejectattr('mount', 'in', (fs_exclude_list.split(',') | map('trim') | list))
                 | rejectattr('fstype', 'in', (fs_type_exclude_list.split(',') | map('trim') | list))
                 | selectattr('size_available', 'lt', (min_free_disk_gb | int * 1024 * 1024 * 1024))
                 | map(attribute='mount') | list }}
          when:
            - _mounts_pre is not skipped
            - _mounts_pre.ansible_facts is defined
          tags: [execute]

        - name: "Req step-05 - Compute disk pass flag pre-update"
          ansible.builtin.set_fact:
            _disk_pre_pass: "{{ (_disk_issues_pre | length) == 0 }}"
          when: _disk_issues_pre is defined
          tags: [execute]

        - name: "Req step-06 - Set disk issues exist flag pre-update"
          ansible.builtin.set_fact:
            _disk_pre_issues_exist: "{{ not _disk_pre_pass | bool }}"
          when: _disk_pre_pass is defined
          tags: [execute]

        - name: "Req step-06 - Fail if pre-update disk space insufficient"
          ansible.builtin.fail:
