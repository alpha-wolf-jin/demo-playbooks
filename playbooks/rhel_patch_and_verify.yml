          ansible.builtin.reboot:
            reboot_timeout: 300
          tags: [execute]

        - name: "Req step-11 - Get available free memory after update"
          ansible.builtin.shell: "set -o pipefail && free -m | awk '/^Mem:/{print $7}'"
          args:
            executable: /bin/bash
          register: _free_mem_raw_post
          changed_when: false
          tags: [execute]

        - name: "Req step-12 - Parse post-update free memory to MB"
          ansible.builtin.set_fact:
            _free_mb_post: "{{ _free_mem_raw_post.stdout | int }}"
          tags: [execute]

        - name: "Req step-13 - Determine if post-update memory passes threshold"
          ansible.builtin.set_fact:
            _post_mem_pass: "{{ (_free_mb_post | int) >= (min_free_memory_gb | int * 1024) }}"
          tags: [execute]

        - name: "Req step-14 - Gather mount information after update"
          ansible.builtin.setup:
            gather_subset:
              - hardware
          register: _mounts_post
          tags: [execute]

        - name: "Req step-15 - Identify mounts with insufficient disk space (post-update)"
          ansible.builtin.set_fact:
            _disk_issues_post: >-
              {{ _mounts_post.ansible_facts.ansible_mounts
                 | rejectattr('mount', 'in', (fs_exclude_list.split(',') | map('trim') | list))
                 | rejectattr('fstype', 'in', (fs_type_exclude_list.split(',') | map('trim') | list))
                 | selectattr('size_available', 'lt', (min_free_disk_gb | int * 1024 * 1024 * 1024))
                 | map(attribute='mount')
                 | list }}
          tags: [execute]

        - name: "Req step-15 - Compute disk pass flag (post)"
          ansible.builtin.set_fact:
            _post_disk_pass: "{{ _disk_issues_post | length == 0 }}"
          tags: [execute]

        - name: "Req step-16 - Gather running service facts (post-update)"
          ansible.builtin.service_facts:
          register: _services_dict_post
          tags: [execute]

