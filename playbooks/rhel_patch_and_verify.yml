          ansible.builtin.shell: set -o pipefail && dnf check-update
          register: _update_verify
          changed_when: false
          failed_when: _update_verify.rc not in [0,100]
          when: not (_mem_below_threshold | default(false) | bool) and not (_disk_pre_issues_exist | default(false) | bool)
          tags: [execute]

        - name: "Set update verification flag"
          ansible.builtin.set_fact:
            _update_verified: "{{ _update_verify.rc == 0 }}"
          when: _update_verify is defined
          tags: [execute]

        - name: "Req step-10 - Reboot the server"
          ansible.builtin.reboot:
            reboot_timeout: 600
          when: not (_mem_below_threshold | default(false) | bool) and not (_disk_pre_issues_exist | default(false) | bool)
