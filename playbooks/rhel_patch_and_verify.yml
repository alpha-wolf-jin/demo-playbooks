- name: "SOP playbook 'rhel_patch_and_verify' (ACTION — changes system state): Pre‑check memory and disk, snapshot running services, update all packages, reboot, post‑check memory, disk and service consistency, then emit a human‑readable summary report."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    target_server: ""
    min_free_memory_gb: 2
    min_free_disk_gb: 5
    fs_exclude_list: "/boot,/iso"
