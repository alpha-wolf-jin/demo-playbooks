        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Capture current dnf transaction ID before update"
      ansible.builtin.shell:
        cmd: "set -o pipefail; dnf history list --reverse -1 -C 2>/dev/null | awk 'NR==2 {print $1}'"
        executable: /bin/bash
      register: _pre_update_tid_raw
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save pre-update transaction ID"
      ansible.builtin.copy:
        content: "{{ _pre_update_tid_raw.stdout | trim }}"
        dest: "{{ backup_dir }}/pre_update_tid.txt"
        force: true
      tags: [snapshot]

  tasks:
    - block:
        - name: "Validate target_server is provided"
          ansible.builtin.assert:
            that:
              - target_server is defined
              - target_server | length > 0
              - target_server != ''
            fail_msg: "target_server must be provided and not empty"
          tags: [execute]

        - name: "Pre‑compute disk threshold in bytes (same value for pre and post checks)"
          ansible.builtin.set_fact:
            _disk_threshold_bytes: "{{ min_free_disk_gb | int * 1024 * 1024 * 1024 }}"
          tags: [execute]

        # step-01: Collect available free memory before update
        - name: "Req step-01 - Get available free memory before update"
          ansible.builtin.shell: set -o pipefail && free -m | awk '/^Mem:/{print $7}'
          args:
            executable: /bin/bash
          register: _free_mem_raw_pre
          changed_when: false
          tags: [execute]

        # step-02: Parse free memory to MB integer
        - name: "Req step-02 - Parse pre‑update free memory to MB integer"
          ansible.builtin.set_fact:
            _free_mb_pre: "{{ _free_mem_raw_pre.stdout | int }}"
          tags: [execute]

        # step-03: Decide if pre‑update free memory is below threshold (routing only)
        - name: "Req step-03 - Determine pre‑update memory pass/fail (for report)"
          ansible.builtin.set_fact:
            _pre_mem_pass: "{{ not ((_free_mb_pre | int) < (min_free_memory_gb | int * 1024)) }}"
          tags: [execute]

        - name: "Req step-21 - Pre‑update memory low, abort"
          ansible.builtin.fail:
            msg: |
              <result>
              ERROR: Pre‑update free memory {{ _free_mb_pre }} MB below threshold {{ min_free_memory_gb }} GB. Patching pre‑check failed. Aborting.
              </result>
          when: (_free_mb_pre | int) < (min_free_memory_gb | int * 1024)
          tags: [execute]

        # step-04: Gather mount facts before update (only if memory OK)
        - name: "Req step-04 - Gather mount facts before update"
          ansible.builtin.setup:
            gather_subset:
              - hardware
          register: _mounts_pre
          when: not ((_free_mb_pre | int) < (min_free_memory_gb | int * 1024))
          tags: [execute]

        # step-05: Identify pre‑update mounts with insufficient disk space
        - name: "Req step-05 - Compute pre‑update disk issues list"
          ansible.builtin.set_fact:
            _disk_issues_pre: >-
              {{ ansible_facts.mounts
                 | rejectattr('mount', 'in', (fs_exclude_list | split(',') | map('trim') | list))
                 | rejectattr('fstype', 'in', (fs_type_exclude_list | split(',') | map('trim') | list))
                 | selectattr('size_available', 'lt', (_disk_threshold_bytes | int))
                 | map(attribute='mount') | list }}
          when: not ((_free_mb_pre | int) < (min_free_memory_gb | int * 1024))
          tags: [execute]

        - name: "Req step-05 - Compute pre‑update disk pass flag"
          ansible.builtin.set_fact:
            _disk_pre_pass: "{{ _disk_issues_pre | length == 0 }}"
          when: not ((_free_mb_pre | int) < (min_free_memory_gb | int * 1024))
          tags: [execute]

        # step-06: Decide pre‑update disk space (placeholder for naming, routing via when:)
        - name: "Req step-06 - Determine pre‑update disk space status"
          ansible.builtin.set_fact:
            _step06_done: true
          when: not ((_free_mb_pre | int) < (min_free_memory_gb | int * 1024))
          tags: [execute]

        - name: "Req step-21 - Pre‑update disk space low, abort"
          ansible.builtin.fail:
            msg: |
              <result>
              ERROR: Pre‑update disk space low on mounts {{ _disk_issues_pre | join(', ') }}. Patching pre‑check failed. Aborting.
              </result>
          when:
            - not ((_free_mb_pre | int) < (min_free_memory_gb | int * 1024))
            - _disk_issues_pre | length > 0
          tags: [execute]

        # step-07: Gather running service facts before update (memory OK and disk OK)
        - name: "Req step-07 - Gather running service facts before update"
          ansible.builtin.service_facts:
          register: _services_dict_pre
          when: _disk_issues_pre | length == 0
          tags: [execute]

        # step-08: Extract running service names pre‑update
        - name: "Req step-08 - Extract running service names pre‑update"
          ansible.builtin.set_fact:
            _pre_services: >-
              {{ ansible_facts.services
                 | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | map(attribute='key') | list }}
          when: _disk_issues_pre | length == 0
          tags: [execute]

        # step-09: Update all packages
        - name: "Req step-09 - Update all packages"
          ansible.builtin.package:
            name: "{{ package_name }}"
            state: latest
          register: _update_result
          tags: [execute]

        # Capture new transaction ID only if update actually changed something
        - name: "Capture update transaction ID for restore"
          ansible.builtin.shell: |
            set -o pipefail
            dnf history list --reverse -C 2>/dev/null | awk 'NR==2 {print $1}'
          args:
            executable: /bin/bash
          register: _update_tid
          changed_when: false
          when: _update_result is changed and _update_result.changed
          tags: [execute]

        - name: "Save update transaction ID to file"
          ansible.builtin.copy:
            content: "{{ _update_tid.stdout | trim }}"
            dest: "{{ backup_dir }}/update_transaction_id.txt"
            force: true
          when: _update_result is changed and _update_result.changed
          tags: [execute]

        # step-10: Reboot the server
        - name: "Req step-10 - Reboot the server"
          ansible.builtin.reboot:
            reboot_timeout: 600
            pre_reboot_delay: 0
            post_reboot_delay: 30
          tags: [execute]

        # step-11: Collect available free memory after update
        - name: "Req step-11 - Get available free memory after update"
          ansible.builtin.shell: set -o pipefail && free -m | awk '/^Mem:/{print $7}'
          args:
            executable: /bin/bash
          register: _free_mem_raw_post
          changed_when: false
          tags: [execute]

        # step-12: Parse post‑update free memory to MB
        - name: "Req step-12 - Parse post‑update free memory to MB integer"
          ansible.builtin.set_fact:
            _free_mb_post: "{{ _free_mem_raw_post.stdout | int }}"
