          tags: [execute]

        - name: "Req step-01 - Get available free memory before update"
          ansible.builtin.shell: "set -o pipefail && free -m | awk '/^Mem:/{print $7}'"
          args:
            executable: /bin/bash
          register: _free_mem_raw_pre
          changed_when: false
          tags: [execute]

        - name: "Req step-02 - Parse free memory to MB integer"
          ansible.builtin.set_fact:
            _free_mb_pre: "{{ _free_mem_raw_pre.stdout | int }}"
          tags: [execute]

        - name: "Req step-03 - Check pre-update free memory and fail if below threshold"
          ansible.builtin.fail:
            msg: "Pre-update free memory ({{ _free_mb_pre }} MB) is below minimum threshold ({{ min_free_memory_gb }} GB)"
          when: (_free_mb_pre | int) < (min_free_memory_gb | int * 1024)
          tags: [execute]

        - name: "Req step-04 - Gather mount information before update"
          ansible.builtin.setup:
            gather_subset:
              - hardware
          register: _mounts_pre
          when: (_free_mb_pre | int) >= (min_free_memory_gb | int * 1024)
          tags: [execute]

        - name: "Req step-05 - Identify mounts with insufficient disk space (pre-update)"
          ansible.builtin.set_fact:
            _disk_issues_pre: >-
              {{ _mounts_pre.ansible_facts.ansible_mounts
                 | rejectattr('mount', 'in', (fs_exclude_list.split(',') | map('trim') | list))
                 | rejectattr('fstype', 'in', (fs_type_exclude_list.split(',') | map('trim') | list))
                 | selectattr('size_available', 'lt', (min_free_disk_gb | int * 1024 * 1024 * 1024))
                 | map(attribute='mount')
                 | list }}
          when: (_free_mb_pre | int) >= (min_free_memory_gb | int * 1024)
          tags: [execute]

        - name: "Req step-05 - Compute disk pass flag (pre)"
          ansible.builtin.set_fact:
            _disk_pre_pass: "{{ _disk_issues_pre | length == 0 }}"
          when: (_free_mb_pre | int) >= (min_free_memory_gb | int * 1024)
          tags: [execute]

        - name: "Req step-06 - Check pre-update disk space and fail if insufficient"
          ansible.builtin.fail:
            msg: "Pre-update disk space insufficient on mounts: {{ _disk_issues_pre | join(', ') }}"
          when: _disk_issues_pre | length > 0
