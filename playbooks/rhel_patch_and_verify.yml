        - name: "Restore - Undo yum transaction to revert package updates"
          ansible.builtin.shell: |
            set -o pipefail
            TXN_ID=$(cat "{{ backup_dir }}/yum_txn_id.txt")
            yum history undo "$TXN_ID" -y
          args:
            executable: /bin/bash
          when:
            - "'restore' in ansible_run_tags"
