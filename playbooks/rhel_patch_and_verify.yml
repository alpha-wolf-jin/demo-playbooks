          tags: [execute]

        - name: "Req step-15 - Compute post-disk pass flag"
          ansible.builtin.set_fact:
            _post_disk_pass: "{{ (_disk_issues_post | length) == 0 }}"
          tags: [execute]

        - name: "Req step-16 - Gather running service facts post-update"
          ansible.builtin.service_facts:
          register: _services_dict_post
          tags: [execute]

        - name: "Req step-17 - Extract running service names post-update"
          ansible.builtin.set_fact:
            _post_services: >-
              {{ ansible_facts.services | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | map(attribute='key') | list }}
          tags: [execute]

        - name: "Req step-18 - Compute service mismatch list"
          ansible.builtin.set_fact:
            _services_mismatch_list: "{{ (_pre_services | default([]) | difference(_post_services)) + (_post_services | difference(_pre_services | default([]))) }}"
          tags: [execute]

        - name: "Req step-18 - Compute service pass flag"
          ansible.builtin.set_fact:
            _services_pass: "{{ (_services_mismatch_list | length) == 0 }}"
          tags: [execute]

        - name: "Req step-19 - Build final human-readable report"
          ansible.builtin.set_fact:
            _report: |
              Pre-update free memory check: {{ 'PASS' if not (_mem_below_threshold | default(false) | bool) else 'FAIL' }}
              Pre-update disk check: {{ 'PASS' if (_disk_pre_pass | default(false) | bool) else 'FAIL' }}{% if _disk_issues_pre | default([]) | length > 0 %} (failed mounts: {{ _disk_issues_pre | join(', ') }}){% endif %}
              Post-update free memory check: {{ 'PASS' if _post_mem_pass else 'FAIL' }}
              Post-update disk check: {{ 'PASS' if _post_disk_pass else 'FAIL' }}{% if _disk_issues_post | length > 0 %} (failed mounts: {{ _disk_issues_post | join(', ') }}){% endif %}
              Pre-update running services count: {{ _pre_services | default([]) | length }}
              Post-update running services count: {{ _post_services | length }}
              Service mismatch: {{ 'PASS' if _services_pass else 'FAIL' }}{% if _services_mismatch_list | length > 0 %} (mismatched: {{ _services_mismatch_list | join(', ') }}){% endif %}
              Update verified: {{ 'PASS' if (_update_verified | default(false)) else 'FAIL' }}
              Update status: success
              Reboot status: success
          tags: [execute]

        - name: "Req step-20 - Print report and end"
          ansible.builtin.debug:
            msg: |
              <result>
