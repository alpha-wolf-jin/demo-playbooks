                  "Service mismatch: " ~ ('PASS' if _services_pass else 'FAIL') ~ (', mismatched: ' ~ _services_mismatch_list | join(', ') if _services_mismatch_list else ''),
                  "",
                  "Update status: success",
                  "Reboot status: success"
                ] | join("\n")
