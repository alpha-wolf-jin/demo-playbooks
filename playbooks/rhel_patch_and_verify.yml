        - name: "Req step-18 - Compare pre and post update service lists"
          ansible.builtin.set_fact:
            _services_mismatch_list: "{{ (_pre_services | difference(_post_services)) + (_post_services | difference(_pre_services)) }}"
            _services_pass: "{{ ((_pre_services | difference(_post_services)) + (_post_services | difference(_pre_services))) | length == 0 }}"
          tags: [execute]

        - name: "Req step-19 - Build final human-readable report"
          ansible.builtin.set_fact:
            _report: >-
