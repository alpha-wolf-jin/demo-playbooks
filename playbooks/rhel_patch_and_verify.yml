      ansible.builtin.shell: |
        set -o pipefail
        yum history list | grep -E '^\s+[0-9]+' | head -1 | awk '{print $1}' > "{{ backup_dir }}/yum_txn_id.txt"
      args:
        executable: /bin/bash
