- name: "SOP playbook 'rhel_patch_and_verify' (ACTION — changes system state): Pre‑check memory and disk, snapshot running services, update all packages, reboot, post‑check memory, disk and service consistency, then emit a human‑readable summary report."
  hosts: "{{ target_server if target_server != '' else 'localhost' }}"
  become: yes
  gather_facts: false
  vars:
    playbook_name: "rhel_patch_and_verify"
    backup_dir: "/var/log/ai-playbooks-backup/{{ playbook_name }}"
    target_server: ""                               # required, no default — provide via extra_vars
    min_free_memory_gb: 2
    min_free_disk_gb: 5
    fs_exclude_list: "/boot,/iso"
    fs_type_exclude_list: "devtmpfs,tmpfs,cgroup2,iso9660"
    package_name: "*"

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
      tags: [snapshot]

    - name: "Snapshot - Record current dnf transaction ID"
      ansible.builtin.shell: "set -o pipefail && dnf history list --quiet | awk 'NR>2{print $1; exit}'"
      args:
        executable: /bin/bash
      register: _snap_txid
      changed_when: false
      tags: [snapshot]

    - name: "Snapshot - Save transaction ID"
      ansible.builtin.copy:
        content: "{{ _snap_txid.stdout }}"
        dest: "{{ backup_dir }}/dnf_txid"
      when:
        - _snap_txid.stdout | default('') != ''
        - _snap_txid.rc == 0
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req 1 - Validate target_server is provided"
          ansible.builtin.assert:
            that:
              - target_server != ""
            fail_msg: "target_server must be provided"
          tags: [execute]

        - name: "Req step-01 - Get available free memory before update"
          ansible.builtin.shell: "set -o pipefail && free -m | awk '/^Mem:/{print $7}'"
          args:
            executable: /bin/bash
          register: _free_mem_raw_pre
          changed_when: false
          tags: [execute]
          when: not (_precheck_fail | default(false) | bool)

        - name: "Req step-02 - Parse free memory to MB integer"
          set_fact:
            _free_mb_pre: "{{ _free_mem_raw_pre.stdout | int }}"
          tags: [execute]
          when: not (_precheck_fail | default(false) | bool)

        - name: "Req step-03 - Determine if memory below threshold"
          set_fact:
            _precheck_fail: "{{ ((_free_mb_pre | int) < (min_free_memory_gb | int * 1024)) | bool }}"
          tags: [execute]

        - name: "Req step-03 - Abort if memory below threshold"
          ansible.builtin.fail:
            msg: "Pre-update memory check failed"
          when: _precheck_fail | bool
          tags: [execute]

        - name: "Req step-04 - Gather mount information before update"
          ansible.builtin.setup:
            gather_subset: [hardware]
          register: _mounts_pre
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-05 - Compute pre-update disk issues"
          set_fact:
            _disk_issues_pre: >-
              {{ ansible_facts.mounts
                 | rejectattr('mount', 'in', fs_exclude_list.split(',') | map('trim') | list)
                 | rejectattr('fstype', 'in', fs_type_exclude_list.split(',') | map('trim') | list)
                 | selectattr('size_available', 'lt', min_free_disk_gb | int * 1024 * 1024 * 1024)
                 | map(attribute='mount')
                 | list }}
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-05 - Set pre-disk pass flag"
          set_fact:
            _disk_pre_pass: "{{ (_disk_issues_pre | length == 0) | bool }}"
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-06 - Update precheck fail for disk"
          set_fact:
            _precheck_fail: "{{ ((_precheck_fail | default(false) | bool) or (not (_disk_pre_pass | bool))) | bool }}"
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-06 - Abort if disk space insufficient"
          ansible.builtin.fail:
            msg: "Pre-update disk space insufficient"
          when: _precheck_fail | bool
          tags: [execute]

        - name: "Req step-07 - Gather running service facts (pre-update)"
          ansible.builtin.service_facts:
          register: _services_dict_pre
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-08 - Extract running service names (pre-update)"
          set_fact:
            _pre_services: >-
              {{ ansible_facts.services
                 | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | map(attribute='key')
                 | list }}
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-09 - Update all packages"
          ansible.builtin.package:
            name: "{{ package_name }}"
            state: latest
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-10 - Reboot the server"
          ansible.builtin.reboot:
            reboot_timeout: 300
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-11 - Get available free memory after update"
          ansible.builtin.shell: "set -o pipefail && free -m | awk '/^Mem:/{print $7}'"
          args:
            executable: /bin/bash
          register: _free_mem_raw_post
          changed_when: false
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-12 - Parse post-update free memory to MB"
          set_fact:
            _free_mb_post: "{{ _free_mem_raw_post.stdout | int }}"
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-13 - Determine if post-update memory passes threshold"
          set_fact:
            _post_mem_pass: "{{ ((_free_mb_post | int) >= (min_free_memory_gb | int * 1024)) | bool }}"
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-14 - Gather mount information after update"
          ansible.builtin.setup:
            gather_subset: [hardware]
          register: _mounts_post
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-15 - Compute post-update disk issues"
          set_fact:
            _disk_issues_post: >-
              {{ ansible_facts.mounts
                 | rejectattr('mount', 'in', fs_exclude_list.split(',') | map('trim') | list)
                 | rejectattr('fstype', 'in', fs_type_exclude_list.split(',') | map('trim') | list)
                 | selectattr('size_available', 'lt', min_free_disk_gb | int * 1024 * 1024 * 1024)
                 | map(attribute='mount')
                 | list }}
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-15 - Set post-disk pass flag"
          set_fact:
            _post_disk_pass: "{{ (_disk_issues_post | length == 0) | bool }}"
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-16 - Gather running service facts (post-update)"
          ansible.builtin.service_facts:
          register: _services_dict_post
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-17 - Extract running service names (post-update)"
          set_fact:
            _post_services: >-
              {{ ansible_facts.services
                 | dict2items
                 | selectattr('value.state', 'equalto', 'running')
                 | map(attribute='key')
                 | list }}
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-18 - Compute service mismatch list"
          set_fact:
            _services_mismatch_list: >-
              {{ (_pre_services | difference(_post_services))
                 | union(_post_services | difference(_pre_services)) }}
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-18 - Determine if services match"
          set_fact:
            _services_pass: "{{ (_services_mismatch_list | length == 0) | bool }}"
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-19 - Build final human-readable report"
          set_fact:
            _report: |
              Pre-update free memory check: {{ 'PASS' if not (_precheck_fail | default(false) | bool) else 'FAIL' }}
              Pre-update disk check: {{ 'PASS' if _disk_pre_pass | bool else 'FAIL' }}{% if _disk_issues_pre | default([]) | length > 0 %} (Failed mounts: {{ _disk_issues_pre | join(', ') }}){% endif %}
              Post-update free memory check: {{ 'PASS' if _post_mem_pass | bool else 'FAIL' }}
              Post-update disk check: {{ 'PASS' if _post_disk_pass | bool else 'FAIL' }}{% if _disk_issues_post | default([]) | length > 0 %} (Failed mounts: {{ _disk_issues_post | join(', ') }}){% endif %}
              Pre-update running services count: {{ _pre_services | length }}
              Post-update running services count: {{ _post_services | length }}
              Service mismatch: {{ 'PASS' if _services_pass | bool else 'FAIL' }}{% if _services_mismatch_list | default([]) | length > 0 %} (Mismatched services: {{ _services_mismatch_list | join(', ') }}){% endif %}
              Update status: success
              Reboot status: success
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

        - name: "Req step-20 - Print report and end"
          ansible.builtin.debug:
            msg: |
              <result>
              report: {{ _report }}
              </result>
          when: not (_precheck_fail | default(false) | bool)
          tags: [execute]

      rescue:
        - name: "Req step-21 - Emit error block"
          ansible.builtin.debug:
            msg: |
              <result>
              ERROR: Patching pre‑check failed or runtime error. Host: {{ inventory_hostname }}. Reason: {{ ansible_failed_result.msg | default('Unknown error') }}. Aborting.
              </result>

        - name: "Req step-21 - Abort with failure"
          ansible.builtin.fail:
            msg: "Patching pre‑check failed or runtime error. Aborting."

      always:
        - name: "Restore - Rollback dnf transaction if possible"
          ansible.builtin.shell: |
            set -o pipefail
            if [ -f "{{ backup_dir }}/dnf_txid" ]; then
              tid=$(cat "{{ backup_dir }}/dnf_txid")
              if [ -n "$tid" ]; then
                dnf history rollback "$tid" -y || echo "Rollback failed"
              fi
            fi
          args:
            executable: /bin/bash
          ignore_errors: true
          tags: [restore]