---
- name: "Remediate CIS checkpoint 18.7.1: Ensure 'Allow Print Spooler to accept client connections' is set to 'Disabled'"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_18_7_1_remediation"
    backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
    reg_path: |-
      HKLM:\Software\Policies\Microsoft\Windows NT\Printers
    reg_name: 'RegisterSpoolerRemoteRpcEndPoint'
    reg_expected: 2
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: |-
      If Domain Controller: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers', name='RegisterSpoolerRemoteRpcEndPoint', data=2, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
    req_03: |-
      If Member Server: Set the CIS-required GP registry key using ansible.windows.win_regedit: path='HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers', name='RegisterSpoolerRemoteRpcEndPoint', data=2, type=dword. IMPORTANT: Do NOT use ansible.windows.win_firewall or any Windows API module — they set runtime/effective state but do NOT write the GP registry key that the CIS benchmark audit checks.
    req_04: |-
      If Domain Controller: Verify the GP registry key: use ansible.windows.win_reg_stat path='HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers' name='RegisterSpoolerRemoteRpcEndPoint'. The module returns structured data — .exists (bool) and .value (integer for REG_DWORD). PASS if .exists == true AND .value == 2. FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 2. Do NOT check .stdout or .rc — win_reg_stat returns structured data. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
    req_05: |-
      If Member Server: Verify the GP registry key: use ansible.windows.win_reg_stat path='HKLM:\\Software\\Policies\\Microsoft\\Windows NT\\Printers' name='RegisterSpoolerRemoteRpcEndPoint'. The module returns structured data — .exists (bool) and .value (integer for REG_DWORD). PASS if .exists == true AND .value == 2. FAIL if .exists == false (key absent / NOT_CONFIGURED) OR .value != 2. Do NOT check .stdout or .rc — win_reg_stat returns structured data. changed_when: false; failed_when: false. IMPORTANT: Do NOT verify using Get-NetFirewallProfile or any API — verify ONLY from the same GP registry key the audit reads.
    req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."
    req_07: "Create a task named 'Generate remediation report' using debug msg with the required CIS 18.7.1 report format."

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir | trim }}"
        state: directory
      tags: [snapshot]

    - name: "Snapshot - Check if registry value exists"
      ansible.windows.win_reg_stat:
        path: "{{ reg_path }}"
        name: "{{ reg_name }}"
      register: _snap_reg_stat
      changed_when: false
      failed_when: false
      tags: [snapshot]

    - name: "Snapshot - Backup registry value if exists"
      ansible.windows.win_copy:
        content: "{{ _snap_reg_stat.value | default('') | string }}"
        dest: "{{ backup_dir | trim }}/RegisterSpoolerRemoteRpcEndPoint.present"
      when: _snap_reg_stat.exists | default(false) | bool
      tags: [snapshot]

    - name: "Snapshot - Mark registry value absent if missing"
      ansible.windows.win_copy:
        content: "absent"
        dest: "{{ backup_dir | trim }}/RegisterSpoolerRemoteRpcEndPoint.absent"
      when: not (_snap_reg_stat.exists | default(false) | bool)
      tags: [snapshot]

  tasks:
    - block:
        - name: "Req step-01 - Detect Windows server role"
          ansible.windows.win_shell: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
          register: _step01_output
          failed_when: false
          changed_when: false
          tags: [execute]

        - name: "Req step-01 - Set server role flags and requirement 01 details"
          ansible.builtin.set_fact:
            is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
            is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
            role_detection_error: "{{ ((_step01_output.stdout | default('') | trim) not in ['1', '2', '3', '4', '5']) }}"
            task_01_name: "Detect Windows server role"
            task_01_cmd: "(Get-CimInstance Win32_ComputerSystem).DomainRole"
            task_01_rc: "{{ _step01_output.rc | default(-1) | int }}"
            data_01: "{{ _step01_output.stdout | default('') | trim }}"
            status_01: "{{ 'ERROR' if ((_step01_output.stdout | default('') | trim) not in ['1', '2', '3', '4', '5']) else 'PASS' }}"
            details_01: "{{ 'Role detection succeeded' if ((_step01_output.stdout | default('') | trim) in ['1', '2', '3', '4', '5']) else 'Role detection failed or unexpected DomainRole' }}"
          tags: [execute]

        - name: "Req step-02 - Set RegisterSpoolerRemoteRpcEndPoint DWORD to 2 for Domain Controller"
          ansible.windows.win_regedit:
            path: "{{ reg_path }}"
            name: "{{ reg_name }}"
            data: "{{ reg_expected | int }}"
            type: dword
          when: is_dc | bool
          failed_when: false
          register: _step02_output
          tags: [execute]

        - name: "Req step-02 - Store requirement 02 details"
          ansible.builtin.set_fact:
            task_02_name: "Set RegisterSpoolerRemoteRpcEndPoint DWORD to 2 for Domain Controller"
            task_02_cmd: "ansible.windows.win_regedit path={{ reg_path }}, name={{ reg_name }}, data={{ reg_expected }}, type=dword"
            task_02_rc: "{{ 0 if (is_dc | bool) else -1 }}"
            data_02: "{{ reg_expected }}"
            status_02: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if _step02_output is not defined else 'PASS' }}"
            details_02: "{{ 'Skipped: not a Domain Controller' if not (is_dc | bool) else 'Registry key applied' if _step02_output is defined else 'No output captured' }}"
          tags: [execute]

        - name: "Req step-03 - Set RegisterSpoolerRemoteRpcEndPoint DWORD to 2 for Member Server"
          ansible.windows.win_regedit:
            path: "{{ reg_path }}"
            name: "{{ reg_name }}"
            data: "{{ reg_expected | int }}"
            type: dword
          when: is_member | bool
          failed_when: false
          register: _step03_output
          tags: [execute]

        - name: "Req step-03 - Store requirement 03 details"
          ansible.builtin.set_fact:
            task_03_name: "Set RegisterSpoolerRemoteRpcEndPoint DWORD to 2 for Member Server"
            task_03_cmd: "ansible.windows.win_regedit path={{ reg_path }}, name={{ reg_name }}, data={{ reg_expected }}, type=dword"
            task_03_rc: "{{ 0 if (is_member | bool) else -1 }}"
            data_03: "{{ reg_expected }}"
            status_03: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if _step03_output is not defined else 'PASS' }}"
            details_03: "{{ 'Skipped: not a Member Server' if not (is_member | bool) else 'Registry key applied' if _step03_output is defined else 'No output captured' }}"
          tags: [execute]

        - name: "Req step-04 - Verify RegisterSpoolerRemoteRpcEndPoint registry value exists and equals 2 for Domain Controller"
          ansible.windows.win_reg_stat:
            path: "{{ reg_path }}"
            name: "{{ reg_name }}"
          when: is_dc | bool
          changed_when: false
          failed_when: false
          register: _step04_output
          tags: [execute]

        - name: "Req step-04 - Store requirement 04 details"
          ansible.builtin.set_fact:
            task_04_name: "Verify RegisterSpoolerRemoteRpcEndPoint registry value exists and equals 2 for Domain Controller"
            task_04_cmd: "ansible.windows.win_reg_stat path={{ reg_path }}, name={{ reg_name }}"
            task_04_rc: "{{ 0 if (is_dc | bool) else -1 }}"
            data_04: "{{ '' if not (is_dc | bool) else (_step04_output.value | default('')) }}"
            status_04: "{{ 'SKIP' if not (is_dc | bool) else 'ERROR' if _step04_output is not defined else 'PASS' if ((_step04_output.exists | default(false) | bool) and ((_step04_output.value | default(-1) | int) == (reg_expected | int))) else 'FAIL' }}"
            details_04: "{{ 'Skipped: not a Domain Controller' if not (is_dc | bool) else 'Compliant: registry value exists and equals 2' if ((_step04_output.exists | default(false) | bool) and ((_step04_output.value | default(-1) | int) == 2)) else 'Non-compliant: registry value missing or not equal to 2' }}"
          tags: [execute]

        - name: "Req step-05 - Verify RegisterSpoolerRemoteRpcEndPoint registry value exists and equals 2 for Member Server"
          ansible.windows.win_reg_stat:
            path: "{{ reg_path }}"
            name: "{{ reg_name }}"
          when: is_member | bool
          changed_when: false
          failed_when: false
          register: _step05_output
          tags: [execute]

        - name: "Req step-05 - Store requirement 05 details"
          ansible.builtin.set_fact:
            task_05_name: "Verify RegisterSpoolerRemoteRpcEndPoint registry value exists and equals 2 for Member Server"
            task_05_cmd: "ansible.windows.win_reg_stat path={{ reg_path }}, name={{ reg_name }}"
            task_05_rc: "{{ 0 if (is_member | bool) else -1 }}"
            data_05: "{{ '' if not (is_member | bool) else (_step05_output.value | default('')) }}"
            status_05: "{{ 'SKIP' if not (is_member | bool) else 'ERROR' if _step05_output is not defined else 'PASS' if ((_step05_output.exists | default(false) | bool) and ((_step05_output.value | default(-1) | int) == (reg_expected | int))) else 'FAIL' }}"
            details_05: "{{ 'Skipped: not a Member Server' if not (is_member | bool) else 'Compliant: registry value exists and equals 2' if ((_step05_output.exists | default(false) | bool) and ((_step05_output.value | default(-1) | int) == 2)) else 'Non-compliant: registry value missing or not equal to 2' }}"
          tags: [execute]

        - name: "Req step-06 - Set cis_result fact based on active branch verification status"
          ansible.builtin.set_fact:
            cis_result: >-
              {{ 'ERROR' if (role_detection_error | default(true) | bool) else
                 ('SKIP' if not ((is_dc | bool) or (is_member | bool)) else
                  (status_04 | default('SKIP') if (is_dc | bool) else status_05 | default('SKIP'))) }}
          tags: [execute]

        - name: "Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 18.7.1"
              - "Reference: CIS Benchmark checkpoint 18.7.1"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: {{ task_04_name | default('Not recorded') }}"
              - "  Command: {{ task_04_cmd | default('N/A') }}"
              - "  Exit code: {{ task_04_rc | default(-1) }}"
              - "  Data: {{ data_04 | default('') | trim }}"
              - "  Status: {{ status_04 | default('ERROR') | trim }}"
              - "  Details: {{ details_04 | default('') | trim }}"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: {{ task_05_name | default('Not recorded') }}"
              - "  Command: {{ task_05_cmd | default('N/A') }}"
              - "  Exit code: {{ task_05_rc | default(-1) }}"
              - "  Data: {{ data_05 | default('') | trim }}"
              - "  Status: {{ status_05 | default('ERROR') | trim }}"
              - "  Details: {{ details_05 | default('') | trim }}"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: Set cis_result based on active branch verification status"
              - "  Command: ansible.builtin.set_fact"
              - "  Exit code: 0"
              - "  Data: {{ cis_result | default('ERROR') | trim }}"
              - "  Status: {{ cis_result | default('ERROR') | trim }}"
              - "  Details: Overall remediation result aggregated from active branch"
              - ""
              - "REQUIREMENT 07 - {{ req_07 }}:"
              - "  Task: Generate remediation report"
              - "  Command: ansible.builtin.debug msg"
              - "  Exit code: 0"
              - "  Data: Remediation report generated"
              - "  Status: PASS"
              - "  Details: This report"
              - ""
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
          tags: [execute]

      always:
        - name: "Restore - Restore original registry value and clean up backup"
          ansible.windows.win_shell: |
            $backupDir = "{{ backup_dir | trim }}"
            if (-not (Test-Path -LiteralPath $backupDir)) {
              Write-Output 'No backup directory; nothing to restore'
              exit 0
            }
            $present = Join-Path $backupDir 'RegisterSpoolerRemoteRpcEndPoint.present'
            $absent  = Join-Path $backupDir 'RegisterSpoolerRemoteRpcEndPoint.absent'
            if (Test-Path -LiteralPath $present) {
              $value = (Get-Content -LiteralPath $present -Raw).Trim()
              if ($value -match '^\d+$') {
                $regPath = 'HKLM:\Software\Policies\Microsoft\Windows NT\Printers'
                $regName = 'RegisterSpoolerRemoteRpcEndPoint'
                if (-not (Test-Path -LiteralPath $regPath)) {
                  New-Item -Path $regPath -Force | Out-Null
                }
                Set-ItemProperty -Path $regPath -Name $regName -Value ([int]$value) -Type DWord
                Write-Output "Restored RegisterSpoolerRemoteRpcEndPoint to $value"
              } else {
                Write-Output 'Invalid backup value; skipping restore'
              }
            } elseif (Test-Path -LiteralPath $absent) {
              $regPath = 'HKLM:\Software\Policies\Microsoft\Windows NT\Printers'
              $regName = 'RegisterSpoolerRemoteRpcEndPoint'
              Remove-ItemProperty -Path $regPath -Name $regName -ErrorAction SilentlyContinue
              Write-Output 'Removed RegisterSpoolerRemoteRpcEndPoint because it was absent before remediation'
            }
            Remove-Item -LiteralPath $backupDir -Recurse -Force -ErrorAction SilentlyContinue
            Write-Output 'Restore cleanup completed'
          changed_when: false
          failed_when: false
          tags: [restore]