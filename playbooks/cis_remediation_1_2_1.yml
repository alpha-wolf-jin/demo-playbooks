---
- name: "Remediate CIS checkpoint 1.2.1: Ensure 'Account lockout duration' is set to '15 or more minute(s)'"
  hosts: all
  gather_facts: false
  vars:
    playbook_name: "cis_1_2_1_account_lockout_duration"
    backup_dir: "C:/ai-playbooks-backup/{{ playbook_name }}"
    lockout_duration_minutes: "15"
    req_01: "Detect the Windows server role using the DomainRole property from Win32_ComputerSystem. DomainRole 4 or 5 = Domain Controller; DomainRole 1-3 = Member Server."
    req_02: "If Domain Controller: Set 'Account lockout duration' to '15 or more minute(s)' via Active Directory cmdlets (Set-ADDefaultDomainPasswordPolicy) or Group Policy. Do NOT use community.windows.win_security_policy on DC — use AD/GPO cmdlets."
    req_03: "If Member Server: Set 'Account lockout duration' to '15 or more minute(s)'. Recommended module: community.windows.win_security_policy with section=System Access and the key name. Do NOT use raw secedit CLI — community.windows.win_security_policy handles secedit internally and avoids encoding / path issues."
    req_04: "If Domain Controller: Verify 'Account lockout duration' is correctly set to '15 or more minute(s)'. Use read-only PowerShell to query the value; changed_when: false."
    req_05: "If Member Server: Verify 'Account lockout duration' is correctly set to '15 or more minute(s)'. Use read-only PowerShell to query the value; changed_when: false."
    req_06: "Store the final remediation result in a variable named 'cis_result' using set_fact. Set cis_result to the overall remediation status (PASS/FAIL/SKIP/ERROR) derived from the last requirement's status variable."

  pre_tasks:
    - name: "Snapshot - Create backup directory"
      ansible.windows.win_file:
        path: "{{ backup_dir }}"
        state: directory
      tags: [snapshot]

  tasks:
    - name: "CIS remediation execute block"
      block:
        - name: "Req step-01 - Detect Windows server role from DomainRole"
          ansible.windows.win_shell: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
          register: _step01_output
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-01 - Set role classification flags"
          ansible.builtin.set_fact:
            is_dc: "{{ (_step01_output.stdout | default('') | trim) in ['4', '5'] }}"
            is_member: "{{ (_step01_output.stdout | default('') | trim) in ['1', '2', '3'] }}"
            status_01: "{{ 'ERROR' if ((_step01_output.rc | default(-1)) != 0) or ((_step01_output.stdout | default('') | trim) not in ['1', '2', '3', '4', '5']) else 'PASS' }}"
          tags: [execute]

        - name: "Req step-02 - Set account lockout duration on Domain Controller via AD cmdlets"
          ansible.windows.win_shell: |
            $desired = {{ lockout_duration_minutes | int }}
            {% raw %}
            if (-not (Get-Command Set-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue)) {
                Write-Output 'SKIP: ActiveDirectory module not available'
                exit 0
            }
            try {
                $policy = Get-ADDefaultDomainPasswordPolicy
                if ($null -eq $policy) {
                    Write-Output 'NOT_FOUND'
                    exit 4
                }
                $dur = $policy.LockoutDuration
                if ($dur -is [TimeSpan]) { $current = [math]::Floor($dur.TotalMinutes) } else { $current = [int]$dur }
                if ($current -lt $desired) {
                    Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DistinguishedName -LockoutDuration (New-TimeSpan -Minutes $desired)
                    Write-Output ('APPLIED:' + $current + '->' + $desired)
                } else {
                    Write-Output ('ALREADY_SET:' + $current)
                }
            } catch {
                Write-Output 'ERROR'
                exit 1
            }
            {% endraw %}
          register: _step02_output
          when: is_dc | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-03 - Enable account lockout threshold so LockoutDuration is available"
          community.windows.win_security_policy:
            section: "System Access"
            key: "LockoutBadCount"
            value: "5"
          register: _step03_pre_output
          when: is_member | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-03 - Set account lockout duration on Member Server via win_security_policy"
          community.windows.win_security_policy:
            section: "System Access"
            key: "LockoutDuration"
            value: "{{ (lockout_duration_minutes | int) * 60 }}"
          register: _step03_output
          when: is_member | bool
          failed_when: false
          tags: [execute]

        - name: "Req step-04 - Verify account lockout duration on Domain Controller"
          ansible.windows.win_shell: |
            {% raw %}
            if (-not (Get-Command Get-ADDefaultDomainPasswordPolicy -ErrorAction SilentlyContinue)) {
                Write-Output 'SKIP: ActiveDirectory module not available'
                exit 0
            }
            try {
                $policy = Get-ADDefaultDomainPasswordPolicy
                if ($null -eq $policy) {
                    Write-Output 'NOT_FOUND'
                    exit 4
                }
                $dur = $policy.LockoutDuration
                if ($dur -is [TimeSpan]) {
                    Write-Output ([math]::Floor($dur.TotalMinutes))
                } else {
                    Write-Output ([int]$dur)
                }
            } catch {
                Write-Output 'ERROR'
                exit 1
            }
            {% endraw %}
          register: _step04_output
          when: is_dc | bool
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-05 - Verify account lockout duration on Member Server"
          ansible.windows.win_shell: |
            $cfg = Join-Path $env:TEMP "secpol_cis_1_2_1_$PID.cfg"
            secedit /export /cfg $cfg /areas SECURITYPOLICY | Out-Null
            try {
              $text = [System.IO.File]::ReadAllText($cfg)
              $m = [regex]::Match($text, '(?im)^\s*LockoutDuration\s*=\s*(\d+)\s*$')
              if (-not $m.Success) {
                Write-Output 'NOT_FOUND'
                exit 1
              }
              $lockoutSeconds = [int]$m.Groups[1].Value
              $lockoutMinutes = [math]::Floor($lockoutSeconds / 60)
              Write-Output $lockoutMinutes
            } finally {
              Remove-Item $cfg -Force -ErrorAction SilentlyContinue
            }
          register: _step05_output
          when: is_member | bool
          changed_when: false
          failed_when: false
          tags: [execute]

        - name: "Req step-06 - Set step statuses and report data"
          ansible.builtin.set_fact:
            status_02: >-
              {{ 'SKIP' if not (is_dc | bool) else
                 'ERROR' if (_step02_output is not defined) else
                 'SKIP' if ('SKIP:' in (_step02_output.stdout | default(''))) else
                 'ERROR' if ((_step02_output.rc | default(-1)) != 0) else
                 'PASS' }}
            status_03: >-
              {{ 'SKIP' if not (is_member | bool) else
                 'ERROR' if ((_step03_pre_output is not defined) or (_step03_output is not defined)) else
                 'FAIL' if ('invalid' in (_step03_output.msg | default('') | lower) or
                            'not a valid' in (_step03_output.msg | default('') | lower) or
                            'cannot set' in (_step03_output.msg | default('') | lower) or
                            'failed' in (_step03_output.msg | default('') | lower) or
                            'invalid' in (_step03_pre_output.msg | default('') | lower) or
                            'not a valid' in (_step03_pre_output.msg | default('') | lower) or
                            'cannot set' in (_step03_pre_output.msg | default('') | lower) or
                            'failed' in (_step03_pre_output.msg | default('') | lower)) else
                 'ERROR' if (((_step03_output.failed | default(false) | bool) or
                              (_step03_output.rc is defined and (_step03_output.rc | int) != 0) or
                              ('error' in (_step03_output.msg | default('') | lower))) or
                             ((_step03_pre_output.failed | default(false) | bool) or
                              (_step03_pre_output.rc is defined and (_step03_pre_output.rc | int) != 0) or
                              ('error' in (_step03_pre_output.msg | default('') | lower)))) else
                 'PASS' }}
            status_04: >-
              {{ 'SKIP' if not (is_dc | bool) else
                 'ERROR' if (_step04_output is not defined) else
                 'SKIP' if ('SKIP:' in (_step04_output.stdout | default(''))) else
                 'ERROR' if ((_step04_output.rc | default(-1)) != 0) or ((_step04_output.stdout | default('') | trim) == '') else
                 'PASS' if ((_step04_output.stdout | default('') | trim | int) >= (lockout_duration_minutes | int)) else
                 'FAIL' }}
            status_05: >-
              {{ 'SKIP' if not (is_member | bool) else
                 'ERROR' if (_step05_output is not defined) else
                 'FAIL' if ('NOT_FOUND' in (_step05_output.stdout | default(''))) else
                 'ERROR' if ((_step05_output.rc | default(-1)) != 0) or ((_step05_output.stdout | default('') | trim) == '') else
                 'PASS' if ((_step05_output.stdout | default('') | trim | int) >= (lockout_duration_minutes | int)) else
                 'FAIL' }}
            task_01_name: "Detect Windows server role from DomainRole"
            task_01_cmd: "(Get-WmiObject Win32_ComputerSystem).DomainRole"
            task_01_rc: "{{ _step01_output.rc | default(-1) }}"
            data_01: "{{ _step01_output.stdout | default('') | trim }}"
            details_01: "{{ 'DomainRole ' ~ (_step01_output.stdout | default('') | trim) }}"
            task_02_name: "Set account lockout duration via Set-ADDefaultDomainPasswordPolicy"
            task_02_cmd: "Set-ADDefaultDomainPasswordPolicy -LockoutDuration (New-TimeSpan -Minutes {{ lockout_duration_minutes }})"
            task_02_rc: "{{ ((_step02_output | default({})).rc | default(-1)) }}"
            data_02: "{{ ((_step02_output | default({})).stdout | default('')) | trim }}"
            details_02: "{{ ((_step02_output | default({})).stdout | default('')) | trim }}"
            task_03_name: "Set account lockout duration on Member Server via community.windows.win_security_policy"
            task_03_cmd: "community.windows.win_security_policy section=System Access key=LockoutBadCount value=5; community.windows.win_security_policy section=System Access key=LockoutDuration value={{ (lockout_duration_minutes | int) * 60 }}"
            task_03_rc: "0"
            data_03: >-
              {{ ((_step03_output | default({})).msg | default('')) if
                 ('invalid' in ((_step03_output | default({})).msg | default('') | lower) or
                  'not a valid' in ((_step03_output | default({})).msg | default('') | lower) or
                  'cannot set' in ((_step03_output | default({})).msg | default('') | lower) or
                  'failed' in ((_step03_output | default({})).msg | default('') | lower) or
                  'error' in ((_step03_output | default({})).msg | default('') | lower)) else
                 ('APPLIED' if (((_step03_output | default({})).changed | default(false) | bool) or
                                ((_step03_pre_output | default({})).changed | default(false) | bool)) else 'NO_CHANGE') }}
            details_03: >-
              {{ ((_step03_output | default({})).msg | default('')) if
                 ((_step03_output | default({})).msg | default('') | trim | length > 0) else
                 ((_step03_pre_output | default({})).msg | default('Member server security policy module executed')) }}
            task_04_name: "Verify account lockout duration on Domain Controller"
            task_04_cmd: "Get-ADDefaultDomainPasswordPolicy | ForEach-Object { [math]::Floor($_.LockoutDuration.TotalMinutes) }"
            task_04_rc: "{{ ((_step04_output | default({})).rc | default(-1)) }}"
            data_04: "{{ ((_step04_output | default({})).stdout | default('')) | trim }}"
            details_04: "{{ 'Verified DC lockout duration (minutes): ' ~ (((_step04_output | default({})).stdout | default('')) | trim) }}"
            task_05_name: "Verify account lockout duration on Member Server"
            task_05_cmd: |-
              secedit /export /cfg $env:TEMP\secpol_cis_1_2_1_$PID.cfg /areas SECURITYPOLICY; parse LockoutDuration seconds; convert to minutes
            task_05_rc: "{{ ((_step05_output | default({})).rc | default(-1)) }}"
            data_05: "{{ ((_step05_output | default({})).stdout | default('')) | trim }}"
            details_05: "{{ 'Verified member lockout duration (minutes): ' ~ (((_step05_output | default({})).stdout | default('')) | trim) }}"
            task_06_name: "Store final remediation result in cis_result"
            task_06_cmd: "set_fact cis_result"
            task_06_rc: "0"
            data_06: "Pending"
            details_06: "Final remediation status stored in cis_result"
          tags: [execute]

        - name: "Req step-06 - Store final remediation result in cis_result"
          ansible.builtin.set_fact:
            status_06: "PASS"
            cis_result: >-
              {{ 'ERROR' if ((status_01 | trim) == 'ERROR') or not (is_dc | bool or is_member | bool) else
                 'FAIL' if ('FAIL' in (([(status_02 | trim), (status_04 | trim)] if (is_dc | bool) else []) + ([(status_03 | trim), (status_05 | trim)] if (is_member | bool) else []))) else
                 'ERROR' if ('ERROR' in (([(status_02 | trim), (status_04 | trim)] if (is_dc | bool) else []) + ([(status_03 | trim), (status_05 | trim)] if (is_member | bool) else []))) else
                 'PASS' if ('PASS' in (([(status_02 | trim), (status_04 | trim)] if (is_dc | bool) else []) + ([(status_03 | trim), (status_05 | trim)] if (is_member | bool) else []))) else
                 'SKIP' }}
          tags: [execute]

        - name: "Generate remediation report"
          ansible.builtin.debug:
            msg:
              - "REMEDIATION REPORT — CIS 1.2.1"
              - "Reference: CIS Benchmark checkpoint 1.2.1"
              - ""
              - "REQUIREMENT 01 - {{ req_01 }}:"
              - "  Task: {{ task_01_name | default('Not recorded') }}"
              - "  Command: {{ task_01_cmd | default('N/A') }}"
              - "  Exit code: {{ task_01_rc | default(-1) }}"
              - "  Data: {{ data_01 | default('') | trim }}"
              - "  Status: {{ status_01 | default('ERROR') | trim }}"
              - "  Details: {{ details_01 | default('') | trim }}"
              - ""
              - "REQUIREMENT 02 - {{ req_02 }}:"
              - "  Task: {{ task_02_name | default('Not recorded') }}"
              - "  Command: {{ task_02_cmd | default('N/A') }}"
              - "  Exit code: {{ task_02_rc | default(-1) }}"
              - "  Data: {{ data_02 | default('') | trim }}"
              - "  Status: {{ status_02 | default('ERROR') | trim }}"
              - "  Details: {{ details_02 | default('') | trim }}"
              - ""
              - "REQUIREMENT 03 - {{ req_03 }}:"
              - "  Task: {{ task_03_name | default('Not recorded') }}"
              - "  Command: {{ task_03_cmd | default('N/A') }}"
              - "  Exit code: {{ task_03_rc | default(-1) }}"
              - "  Data: {{ data_03 | default('') | trim }}"
              - "  Status: {{ status_03 | default('ERROR') | trim }}"
              - "  Details: {{ details_03 | default('') | trim }}"
              - ""
              - "REQUIREMENT 04 - {{ req_04 }}:"
              - "  Task: {{ task_04_name | default('Not recorded') }}"
              - "  Command: {{ task_04_cmd | default('N/A') }}"
              - "  Exit code: {{ task_04_rc | default(-1) }}"
              - "  Data: {{ data_04 | default('') | trim }}"
              - "  Status: {{ status_04 | default('ERROR') | trim }}"
              - "  Details: {{ details_04 | default('') | trim }}"
              - ""
              - "REQUIREMENT 05 - {{ req_05 }}:"
              - "  Task: {{ task_05_name | default('Not recorded') }}"
              - "  Command: {{ task_05_cmd | default('N/A') }}"
              - "  Exit code: {{ task_05_rc | default(-1) }}"
              - "  Data: {{ data_05 | default('') | trim }}"
              - "  Status: {{ status_05 | default('ERROR') | trim }}"
              - "  Details: {{ details_05 | default('') | trim }}"
              - ""
              - "REQUIREMENT 06 - {{ req_06 }}:"
              - "  Task: {{ task_06_name | default('Not recorded') }}"
              - "  Command: {{ task_06_cmd | default('N/A') }}"
              - "  Exit code: {{ task_06_rc | default(-1) }}"
              - "  Data: {{ cis_result | default(data_06 | default('')) }}"
              - "  Status: {{ status_06 | default('ERROR') | trim }}"
              - "  Details: {{ details_06 | default('') | trim }}"
              - ""
              - "========================================================"
              - "OVERALL REMEDIATION:"
              - "  Result: {{ cis_result | default('ERROR') | trim }}"
              - "========================================================"
          tags: [execute]

      always:
        - name: "Restore - Check if backup exists"
          ansible.windows.win_stat:
            path: "{{ backup_dir }}"
          register: _restore_backup_dir
          failed_when: false
          tags: [restore]

        - name: "Restore - Remove backup directory"
          ansible.windows.win_file:
            path: "{{ backup_dir }}"
            state: absent
          when: _restore_backup_dir.stat.exists | default(false)
          failed_when: false
          tags: [restore]